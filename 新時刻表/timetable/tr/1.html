<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台鐵即時時刻表</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

  <style> 
  /* ===== 1. 核心變數與 Reset ===== */
  :root {
    --tr-color: #3b82f6;
    --thsr-color: #fb923c;
    --bg-dark: #020617;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --text-light: #64748b;
    --glass-bg: rgba(30, 41, 59, 0.45);
    --glass-border: rgba(255, 255, 255, 0.10);
    --dock-bg: rgba(15, 23, 42, 0.70);
    --modal-bg: rgba(15, 23, 42, 0.98);
    --font-main: 'Inter', 'Noto Sans TC', sans-serif;

    /* keep old var names */
    --bg-body: var(--bg-dark);
    --bg-surface: var(--glass-bg);
    --bg-header: rgba(15, 23, 42, 0.55);
    --border: var(--glass-border);
    --primary: var(--tr-color);
    --primary-bg: rgba(59, 130, 246, 0.18);
    --shadow-sm: 0 20px 50px rgba(0,0,0,0.35);
    --radius: 28px;
  }

  body.light-mode {
    --bg-dark: #f8fafc;
    --text-main: #0f172a;
    --text-muted: #475569;
    --text-light: #64748b;
    --glass-bg: #ffffff;
    --glass-border: rgba(15, 23, 42, 0.08);
    --dock-bg: rgba(255, 255, 255, 0.90);
    --modal-bg: rgba(255, 255, 255, 1);
    --bg-body: var(--bg-dark);
    --bg-surface: var(--glass-bg);
    --bg-header: #ffffff;
    --border: var(--glass-border);
    --primary: var(--tr-color);
    --primary-bg: rgba(59, 130, 246, 0.15);
    --shadow-sm: 0 18px 45px rgba(2, 6, 23, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: var(--font-main);
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 40px;
  }

  /* ===== 2. 導航列 ===== */
  .header{
    position: sticky; top:0; z-index: 120;
    background: var(--bg-header);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .header-content{
    max-width: 1200px; margin: 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
  }
  .logo{
    font-weight: 800; letter-spacing: .5px;
    color: var(--primary);
    display:flex; align-items: baseline; gap: 6px;
  }
  .logo span{ font-weight: 600; color: var(--text-muted); font-size: .85rem; }
  
  .date-picker{ display:flex; align-items:center; gap: 8px; }
  
  .btn-ghost{
    border:1px solid var(--border); background: transparent; color: var(--text-main);
    padding: 6px 12px; border-radius: 999px; cursor:pointer; font-weight:700;
  }
  .btn-ghost:hover{ background: rgba(148,163,184,0.14); }

  .btn-primary {
    background: var(--primary); color: #fff; border: none;
    padding: 8px 16px; border-radius: 8px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }

  .input-field{
    border:1px solid var(--border); background: var(--bg-surface); color: var(--text-main);
    padding: 6px 10px; border-radius: 8px; outline: none; font-family: var(--font-main);
  }

  /* ===== 3. 主要容器與卡片 ===== */
  .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
  .grid { display: grid; gap: 24px; }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }
  .section-title {
    font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

  /* ===== 4. 表單與篩選 ===== */
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; position: relative; }
  
  .input-group { 
    display: flex; align-items: center; gap: 8px; 
    background: var(--bg-body); padding: 4px 8px; 
    border: 1px solid var(--border); border-radius: 8px; 
    flex: 1; min-width: 120px;
  }
  .input-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  
  input, select {
    border: none; background: transparent; color: var(--text-main); 
    font-size: 0.95rem; padding: 6px; outline: none; width: 100%; 
  }

  .swap-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--primary);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: 0.2s; font-size: 1.1rem;
  }
  .swap-btn:hover { background: var(--bg-body); transform: rotate(180deg); }

  /* 歷史紀錄 Chips */
  .history-chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .history-chip {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 12px;
    background: var(--bg-body); color: var(--text-muted);
    border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .history-chip:hover { background: var(--primary-bg); color: var(--primary); border-color: var(--primary); }

  /* 標籤式 Checkbox */
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
    user-select: none; transition: 0.2s;
  }
  .chip-label:hover { background: var(--bg-body); }
  .chip-label input { display: none; }
  .chip-label:has(input:checked) {
    background: var(--primary-bg); color: var(--primary); border-color: var(--primary); font-weight: 500;
  }
  .chip-label input:checked + span { color: var(--primary); }

  /* ===== 5. 表格樣式 ===== */
  .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
  th {
    background: var(--bg-body); color: var(--text-muted); font-weight: 600; text-align: left;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  th.sortable { cursor: pointer; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-main); }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: var(--bg-body); cursor: pointer; }
  td { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  
  .badge-sea { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #0ea5e9; color: #fff; margin-left: 4px; }
  .train-route { font-size: 0.85rem; color: var(--text-muted); margin-left: 6px; }
  .progress-bar { width: 80px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; }

  /* ===== 6. Modal (彈窗) & 時間軸 ===== */
  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); z-index: 2000; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s;
  }
  .modal[style*="display: flex"] { opacity: 1; }
  .modal-content {
    background: var(--bg-surface); width: 95%; max-width: 500px; max-height: 85vh;
    border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden; display: flex; flex-direction: column;
    transform: translateY(20px); transition: transform 0.3s;
  }
  .modal[style*="display: flex"] .modal-content { transform: translateY(0); }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; background: var(--bg-body);
  }
  .modal-title-main { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .modal-title-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
  .close{font-size:26px;color:var(--text-muted);background:transparent;width:auto;height:auto;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;user-select:none;flex:0 0 auto;padding:6px 10px;line-height:1;}
  .close:hover{background:rgba(148,163,184,0.18);color:var(--text-main);}
  .modal-body { padding: 0; overflow-y: auto; background: var(--bg-surface); }

  /* 時間軸 */
  .timeline { padding: 10px 20px; }
  .timeline-item { display: flex; position: relative; padding-bottom: 0; }
  .tl-time { width: 50px; text-align: right; font-size: 0.9rem; font-weight: 600; color: var(--text-main); padding-right: 15px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .tl-marker { display: flex; flex-direction: column; align-items: center; width: 20px; position: relative; }
  .tl-line { width: 2px; background: var(--border); flex-grow: 1; margin-top: 4px; margin-bottom: -4px; }
  .timeline-item:last-child .tl-line { display: none; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); border: 2px solid var(--bg-surface); z-index: 1; flex-shrink: 0; transition: all 0.3s; }
  .tl-content { padding-left: 15px; padding-bottom: 24px; flex-grow: 1; }
  .timeline-item:last-child .tl-content { padding-bottom: 10px; }
  .tl-station { font-size: 1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; }
  .st-arr{ font-size:0.75em; font-weight:600; color:var(--text-muted); margin-left:8px; font-variant-numeric: tabular-nums; }
  .tl-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

  /* 狀態樣式 */
  .timeline-item.passed .tl-time, .timeline-item.passed .tl-station { opacity: 0.4; filter: grayscale(1); }
  .timeline-item.passed .tl-dot { background: var(--border); }
  .timeline-item.next .tl-dot { background: #22c55e; width: 14px; height: 14px; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2); border-color: #fff; }
  .timeline-item.next .tl-station { color: #15803d; font-weight: 700; }
  body.dark-mode .timeline-item.next .tl-station { color: #4ade80; }
  .timeline-item.transfer .tl-dot { background: #d97706; width: 12px; height: 12px; }
  .timeline-item.transfer .tl-station { color: #b45309; }
  .badge-next { display: inline-flex; align-items: center; gap: 4px; background: #22c55e; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; margin-left: 8px; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

  .transfer-banner { background: var(--bg-body); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 10px; margin: 10px -20px 20px -20px; }
  .transfer-summary{ padding: 14px 20px 6px 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .transfer-card{ border: 1px solid var(--border); background: var(--bg-body); border-radius: 14px; padding: 12px 12px; box-shadow: var(--shadow-sm); }
  .transfer-card-title{ font-size: .78rem; color: var(--text-muted); font-weight: 800; letter-spacing: .02em; margin-bottom: 6px; }
  .transfer-card-main{ font-size: .95rem; font-weight: 700; margin-bottom: 8px; }
  .kv-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .kv{ display:flex; flex-direction:column; gap:2px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-surface); }
  .kv span{ font-size:.75rem; color: var(--text-muted); font-weight:700; }
  .kv b{ font-size:.92rem; font-variant-numeric: tabular-nums; }
  .transfer-section{ padding: 0 0 6px 0; }
  .transfer-sec-title{ padding: 10px 20px 0 20px; font-weight: 900; font-size: 1rem; }
  @media (max-width: 760px){ .transfer-summary{ grid-template-columns: 1fr; } .kv-grid{ grid-template-columns: 1fr 1fr; } }
  
  /* Tabs */
  .query-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px 0}
  .query-tab{appearance:none;border:1px solid var(--border);background:var(--card-bg);color:var(--text-main); padding:10px 12px;border-radius:12px;font-weight:700;cursor:pointer;transition:.15s}
  .query-tab:hover{transform:translateY(-1px)}
  .query-tab.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent}
  .query-panel.hidden{display:none}

  .ticket-btn{ border:1px solid var(--border); background:var(--bg-body); color:var(--text-main); border-radius:10px; padding:6px 10px; cursor:pointer; font-size:16px; line-height:1; }
  .ticket-btn:active{ transform:scale(.98); }
  .ticket-btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }

  /* Backgrounds */
  .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(120px); opacity: 0.42; pointer-events:none; }
  .blob { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; animation: float 25s infinite alternate ease-in-out; }
  .blob-1 { background: var(--tr-color); top: -10%; left: -10%; }
  .blob-2 { background: var(--thsr-color); bottom: -10%; right: -10%; }
  @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(10%, 15%); } }

  /* Glassmorphism Overrides */
  .card { background: var(--bg-surface) !important; border: 1px solid var(--border) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  .header, .navbar { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  #loading-overlay { backdrop-filter: none !important; }

  #loading-overlay{ position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35); display:none; align-items:center; justify-content:center; flex-direction:column; z-index: 9999; backdrop-filter: blur(6px); }
  .spinner{ width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.35); border-top-color: rgba(255,255,255,0.95); animation: spin 1s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to{ transform: rotate(360deg);} }

  .toggle-arrow{ color: var(--text-muted); margin-left: 6px; font-size: .85rem; cursor:pointer; }
  .stops-row td{ background: var(--bg-body); color: var(--text-muted); font-size: .85rem; }

  /* ===== 手機閱讀優化：展開功能 ===== */
  .more-btn{ border:1px solid var(--border); background: var(--bg-body); color: var(--text-main); width: 30px; height: 30px; border-radius: 10px; font-weight: 900; cursor: pointer; line-height: 1; display: inline-flex; align-items: center; justify-content: center; user-select: none; }
  .more-btn:active{ transform: scale(.98); }
  .more-row td{ background: var(--bg-body); color: var(--text-main); }
  .more-box{ padding: 10px 12px; display: grid; gap: 10px; }
  .more-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .more-item{ border:1px solid var(--border); background: var(--bg-surface); border-radius: 14px; padding: 10px 10px; }
  .more-item span{ display:block; font-size: .78rem; font-weight: 800; color: var(--text-muted); margin-bottom: 4px; }
  .more-item b{ font-size: .95rem; font-variant-numeric: tabular-nums; }
  .more-actions{ display:flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .more-actions .left{ display:flex; gap: 10px; align-items:center; flex-wrap:wrap; }

  /* Desktop 預設不顯示「＋」欄（手機會打開） */
  #scheduleTableByStation th.col-more, #scheduleTableByStation td.col-more, #scheduleTableByStationName th.col-more, #scheduleTableByStationName td.col-more{ display:none; }

  /* Mobile: header 更緊湊、篩選收納、表格只顯示重點欄位 */
  @media (max-width: 760px){
    .header{ padding: 8px 10px; }
    .header-content{ flex-wrap: wrap; gap: 8px; }
    .logo{ font-size: 1rem; }
    .logo span{ display:none; }
    .date-picker{ width: 100%; display:flex; flex-wrap:wrap; gap: 8px; align-items:center; }
    .date-picker label{ display:none; }
    #mainQueryDate{ flex: 1 1 auto; min-width: 140px; }
    #refreshBtn{ padding: 6px 12px !important; }
    #themeToggle{ padding: 6px 10px; }
    .query-panel .chip-group{ display:none !important; }
    .mobile-type-filter{ display:flex; gap: 10px; align-items:center; margin: 0 0 14px 0; }
    .mobile-type-filter .btn-ghost{ width: 100%; justify-content:center; }
    table{ min-width: 0 !important; white-space: normal; }
    .table-wrapper{ border-radius: 18px; }
    #scheduleTableByStation td:nth-child(2) .train-route{ display:none !important; }
    #scheduleTableByStation td:nth-child(2){ white-space: nowrap !important; }
    #scheduleTableByStation td.col-status, #scheduleTableByStation th:nth-child(7){ white-space: nowrap !important; }
    #scheduleTableByStation th:nth-child(6), #scheduleTableByStation td:nth-child(6), #scheduleTableByStation th:nth-child(8), #scheduleTableByStation td:nth-child(8){ display:none; }
    #scheduleTableByStation th.col-more, #scheduleTableByStation td.col-more{ display: table-cell; text-align:center; width: 52px; }
  }
  @media (min-width: 761px){ .mobile-type-filter{ display:none; } }
  
  /* 常用行程按鈕 */
  .btn-fav {
    background: #3b82f6; color: white; border: none; border-radius: 20px; 
    padding: 6px 14px; font-size: 0.9rem; font-weight: 700;
    display: flex; align-items: center; gap: 4px; cursor: pointer;
    box-shadow: 0 2px 5px rgba(59,130,246,0.3); white-space: nowrap; transition: 0.2s;
  }
  .btn-fav:hover { background: #2563eb; transform: translateY(-1px); }
  .fav-star { color: #facc15; font-size: 1.1em; }
  </style>
</head>

<body class="light-mode">

<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">正在初始化台鐵真實數據...</div>
</div>

<header class="header">
  <div class="header-content">
    <div class="logo">TR <span>Real-time</span></div>
    <div class="date-picker">
      <button class="btn-ghost" id="homeBtn" type="button" title="回到首頁">← 首頁</button>
      <label style="font-size: 0.8em; color: var(--text-muted);">選擇查詢日期：</label>
      <input type="date" id="mainQueryDate" class="input-field" style="width: auto; display: inline-block;">
      <button class="btn-primary" id="refreshBtn" style="padding: 6px 12px;">更新資料</button>
      <button class="btn-ghost" id="themeToggle" type="button" title="切換深夜模式">🌙 深夜模式</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="grid">
    <div class="query-tabs" role="tablist" aria-label="查詢模式">
      <button class="query-tab active" id="tab-startend" type="button" data-target="panel-startend">起訖站 / 轉乘</button>
      <button class="query-tab" id="tab-station" type="button" data-target="panel-station">車站時刻表</button>
      <button class="query-tab" id="tab-trainno" type="button" data-target="panel-trainno">車次查詢</button>
    </div>

    <section id="panel-startend" class="card query-panel">
      <div class="section-title">起訖站 / 轉乘查詢</div>
      <datalist id="stationList"></datalist>
      <div id="searchHistory" class="history-chips"></div>

      <div class="form-row">
        <div style="position: relative; display: inline-block;">
            <button type="button" class="btn-fav" id="favMenuBtn">
                <span class="fav-star">★</span> 常用行程
            </button>
            <div id="favDropdown" style="display: none; position: absolute; top: 100%; left: 0; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; z-index: 105; min-width: 200px; padding: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);"></div>
        </div>

        <div class="input-group">
          <label>出發</label>
          <input list="stationList" id="startStation" placeholder="請輸入站名或站碼">
        </div>
        <button class="swap-btn" id="swapBtn" title="互換">⇄</button>
        <div class="input-group">
          <label>到達</label>
          <input list="stationList" id="endStation" placeholder="請輸入站名或站碼">
        </div>
        <label class="chip-label" style="flex:0 0 auto;">
          <input type="checkbox" id="acceptTransfers">
          <span>接受轉乘</span>
        </label>
        <button class="btn-primary" id="searchBtn">查詢</button>
      </div>

      <div class="chip-group" id="trainTypeChipsStartEnd"></div>
      <div class="mobile-type-filter">
        <button class="btn-ghost" id="openTypeFilterStartEnd" type="button">車種篩選（複選） ▾</button>
      </div>

      <div class="table-wrapper">
        <table id="scheduleTableByStation">
          <thead>
            <tr>
              <th>車次</th><th>車種</th><th>出發 <span id="sortDepIcon">↕</span></th><th>抵達 <span id="sortArrIcon">↕</span></th><th>耗時 <span id="sortDurIcon">↕</span></th><th>停靠</th><th>狀態</th>
              <th style="text-align:center">訂票</th><th class="col-more" style="text-align:center">＋</th>

<script src="./train.real-schedule.js"></script>
<script>
  let nameToId = {};
  let stationListSorted = [];
  let currentQueryDateStr = '';
  let baseSchedule = {};
  let prevSchedule = {};
  let originDateByKey = {};
  let scheduleKeyList = [];
  
  let lastStartEndQuery = null;
  let lastStationQuery  = null;
  let lastTrainQuery    = null;
  let modalCtx = null;

  function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function addDays(dateStr, delta){ const [y,m,d]=dateStr.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+delta); return fmtDate(dt); }

  function initDatePickerWindow(){
    const el = document.getElementById('mainQueryDate');
    if(!el) return;
    const today = new Date();
    const minD = new Date(today); minD.setDate(minD.getDate()-3);
    const maxD = new Date(today); maxD.setDate(maxD.getDate()+120);
    el.min = fmtDate(minD); el.max = fmtDate(maxD);
    el.value = fmtDate(today);
    el.addEventListener('change', ()=>refreshData(el.value));
  }

  function normTW(s){ return String(s||'').trim().replace(/台/g,'臺'); }
  function normLoose(s){ const t=String(s||'').trim(); return { raw:t, asTai:t.replace(/台/g,'臺'), asTai2:t.replace(/臺/g,'台') }; }

  function fillStationDatalist(keyword){
    const dl = document.getElementById('stationList'); if(!dl) return;
    const k = normLoose(keyword||'');
    const limit = 50; let out = ''; let count = 0;
    for(let i=0;i<stationListSorted.length;i++){
      const s=stationListSorted[i]; if(!s) continue;
      if(k.raw){
        const id=String(s.id), name=String(s.name), name2=name.replace(/臺/g,'台');
        const hit=id.includes(k.raw)||id.includes(k.asTai)||id.includes(k.asTai2)||name.includes(k.raw)||name.includes(k.asTai)||name.includes(k.asTai2)||name2.includes(k.raw)||name2.includes(k.asTai)||name2.includes(k.asTai2);
        if(!hit) continue;
      }
      out += `<option value="${s.id}-${s.name}"></option>`;
      count++; if(count>=limit) break;
    }
    dl.innerHTML=out;
  }

  function fillTrainDatalist(keyword){
    const dl = document.getElementById('trainNumberList'); if(!dl) return;
    const k = String(keyword||'').trim();
    const limit=100; let out=''; let count=0;
    const nums = Object.keys(baseSchedule||{}).sort((a,b)=>String(a).localeCompare(String(b),'en'));
    for(let i=0;i<nums.length;i++){
      const n=nums[i]; if(k && !String(n).includes(k)) continue;
      const t=baseSchedule[n]; const arr=t?.['車站時間']||[];
      const range=(arr.length>=2)?`${arr[0][0]}➝${arr.slice(-1)[0][0]}`:'';
      out+=`<option value="${n}-${t?.['車種']||''}-${range}"></option>`;
      count++; if(count>=limit) break;
    }
    dl.innerHTML=out;
  }

  function extractStationNameFromInput(raw){
    const v=String(raw||'').trim(); if(!v) return '';
    const m=v.match(/^(\d{3,6})\s*-\s*(.+)$/);
    if(m && window.stationMap && window.stationMap[m[1]]) return window.stationMap[m[1]];
    if(window.stationMap && window.stationMap[v]) return window.stationMap[v];
    const asTai=normTW(v); if(nameToId[asTai]) return asTai;
    const asTai2=v.replace(/臺/g,'台'); if(nameToId[normTW(asTai2)]) return normTW(asTai2);
    return normTW(v);
  }
  function extractTrainNoFromInput(raw){ const v=String(raw||'').trim(); if(!v) return ''; const m=v.match(/^([0-9A-Za-z]+)\s*-\s*/); return m?m[1]:v; }

  function buildStationIndex(){
    nameToId={}; stationListSorted=[];
    if(!window.stationMap) return;
    Object.entries(window.stationMap).forEach(([id,name])=>{
      if(!id||!name) return; const nameNorm=normTW(name);
      nameToId[nameNorm]=id; stationListSorted.push({id,name:nameNorm});
    });
    stationListSorted.sort((a,b)=>String(a.id).localeCompare(String(b.id),'en'));
  }

  function parseTime(t){ if(!t || !/\d{1,2}:\d{2}/.test(t)) return null; let [h,m]=t.split(':').map(x=>parseInt(x,10)); return h*60+m; }
  function splitArrDep(stopRow){
    const t1=stopRow?.[1]||''; const t2=stopRow?.[2]||'';
    if(!t2) return {arr:t1,dep:t1}; if(!t1) return {arr:t2,dep:t2};
    const m1=parseTime(t1), m2=parseTime(t2);
    if(m1===null||m2===null) return {arr:t1,dep:t2};
    if(m2<=m1) return {arr:t2,dep:t1}; return {arr:t1,dep:t2};
  }

  function buildAbsMinutes(stops){
    const out=[]; let day=0, prev=null;
    for(let i=0;i<stops.length;i++){
      const ad=splitArrDep(stops[i]); const tStr=ad.dep||ad.arr||''; const m=parseTime(tStr);
      if(m===null){ out.push({abs:null,day:day}); continue; }
      if(prev!==null && m<prev) day+=1;
      out.push({abs:day*1440+m, day}); prev=m;
    }
    return out;
  }
  function buildAbsArrDep(stops){
    const absArr=[], absDep=[], dayArr=[]; let day=0, prevKey=null;
    for(let i=0;i<stops.length;i++){
      const arrStr=stops[i][1]||'', depStr=stops[i][2]||'';
      const arrMin=parseTime(arrStr), depMin=parseTime(depStr);
      let keyMin=null;
      if(depMin!==null && arrMin!==null) keyMin=Math.max(depMin,arrMin);
      else keyMin=(depMin!==null)?depMin:((arrMin!==null)?arrMin:null);
      if(keyMin===null){ absArr.push(null); absDep.push(null); dayArr.push(day); continue; }
      if(prevKey!==null && keyMin<prevKey) day+=1;
      const base=day*1440;
      absArr.push(arrMin===null?null:base+arrMin); absDep.push(depMin===null?null:base+depMin);
      dayArr.push(day); prevKey=keyMin;
    }
    return {absArr,absDep,day:dayArr};
  }
  function getStopDateStr(originDateStr, absMin){ if(absMin===null||absMin===undefined) return originDateStr; const dayOffset=Math.floor(absMin/1440); return addDays(originDateStr,dayOffset); }

  function getTrainStatusLabel(trainNo, originDateStr, firstTimeStr, lastTimeStr, passedStationTimeStr){
    const todayStr=fmtDate(new Date());
    if(originDateStr && originDateStr>todayStr) return '未發車';
    if(originDateStr && originDateStr<todayStr) return '已到終點';
    let raw=''; try{ if(typeof getDelayStatus==='function') raw=getDelayStatus(String(trainNo))||''; }catch(e){}
    if(raw && /停駛|取消|暫停|終止|運轉整理|截短|折返|部分停駛/i.test(raw)) return raw;
    if(passedStationTimeStr && originDateStr===todayStr){
      const now=new Date(), nowMin=now.getHours()*60+now.getMinutes(), passMin=parseTime(passedStationTimeStr);
      if(passMin!==null && nowMin>passMin) return '已過站';
    }
    if(raw){
      if(/準點/.test(raw)) return '準點';
      const m=raw.match(/晚\s*([\-\d]+)\s*分/);
      if(m){ const d=parseInt(m[1],10); if(Number.isFinite(d)){ if(d>0) return `誤點 ${d} 分`; if(d<0) return `提早 ${Math.abs(d)} 分`; return '準點'; }}
      return raw||'即時';
    }
    const f=parseTime(firstTimeStr), l=parseTime(lastTimeStr);
    const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
    if(f!==null && nowMin<f) return '未發車';
    if(f!==null && l!==null){ const crosses=l<f; const endMin=crosses?l+1440:l; const nowAdj=(crosses&&nowMin<f)?nowMin+1440:nowMin; if(nowAdj>endMin+10) return '已到終點'; }
    return '無即時資訊';
  }

  function colorStatus(label){ const s=String(label||''); if(s==='準點') return `<span style="color:#16a34a;font-weight:700">${s}</span>`; if(s==='已過站') return `<span style="color:#94a3b8;font-weight:700">${s}</span>`; if(s==='未發車'||s==='已到終點'||s==='已到終點站') return `<span style="color:var(--text-main);font-weight:700">${s}</span>`; return `<span style="color:#dc2626;font-weight:700">${s}</span>`; }
  function statusBadge(label){ const s=String(label||''); let bg='rgba(15,23,42,.08)', fg='var(--text-main)'; if(s==='準點'){ bg='rgba(22,163,74,.12)'; fg='#166534'; }else if(s==='未發車'){ bg='rgba(100,116,139,.10)'; fg='#334155'; }else if(s==='已到終點'||s==='已到終點站'){ bg='rgba(37,99,235,.12)'; fg='#1d4ed8'; }else if(s==='停駛'){ bg='rgba(15,23,42,.85)'; fg='#fff'; }else if(/誤點/.test(s)){ bg='rgba(220,38,38,.12)'; fg='#b91c1c'; }else if(/提早/.test(s)){ bg='rgba(14,165,233,.14)'; fg='#0369a1'; } return `<span style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:${bg};color:${fg};font-weight:900;font-size:.85rem;white-space:nowrap;">${s}</span>`; }

  function getStatusForModal(trainNo, originDateStr, stopsArr){
    const todayStr=fmtDate(new Date());
    if(originDateStr>todayStr) return '未發車'; if(originDateStr<todayStr) return '已到終點站';
    let raw=''; try{ if(typeof getDelayStatus==='function') raw=getDelayStatus(String(trainNo))||''; }catch(e){}
    if(raw && /停駛|取消|暫停|終止|運轉整理|截短|折返|部分停駛/i.test(raw)) return '停駛';
    const first=(splitArrDep(stopsArr?.[0]||[]).dep || splitArrDep(stopsArr?.[0]||[]).arr || ''), last=(splitArrDep(stopsArr?.[stopsArr.length-1]||[]).arr || splitArrDep(stopsArr?.[stopsArr.length-1]||[]).dep || '');
    const f=parseTime(first), l=parseTime(last), now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
    if(f!==null && l!==null){ const crosses=l<f; const endMin=crosses?l+1440:l; const nowAdj=(crosses&&nowMin<f)?nowMin+1440:nowMin; if(nowAdj>endMin+10) return '已到終點站'; if(nowAdj<f) return '未發車'; }
    else { if(f!==null && nowMin<f) return '未發車'; }
    if(raw){ if(/準點/.test(raw)) return '準點'; const m=raw.match(/晚\s*([\-\d]+)\s*分/); if(m){ const d=parseInt(m[1],10); if(Number.isFinite(d)){ if(d>0) return `誤點 ${d} 分`; if(d<0) return `提早 ${Math.abs(d)} 分`; return '準點'; } } }
    else { const d=isQueryToday(originDateStr)?getDelayMinutes(trainNo):0; if(d>0) return `誤點 ${d} 分`; if(d<0) return `提早 ${Math.abs(d)} 分`; if(isQueryToday(originDateStr)) return '準點'; }
    return '準點';
  }

  // ===== TDX 訂票 =====
  let _tdxTokenCache={token:'',exp:0}, _deeplinkCooldownUntil=0;
  async function getAccessToken(force=false){
    if(!force && _tdxTokenCache.token && Date.now()<_tdxTokenCache.exp-30000) return _tdxTokenCache.token;
    const tokenUrl='https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
    const body=new URLSearchParams({grant_type:'client_credentials',client_id:TDX_CONFIG.clientId,client_secret:TDX_CONFIG.clientSecret});
    try{ const res=await fetch(tokenUrl,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}); if(!res.ok) throw new Error("認證失敗"); const data=await res.json(); _tdxTokenCache={token:data.access_token,exp:Date.now()+(data.expires_in*1000)}; return data.access_token; }catch(err){ console.error("TDX Auth Error:",err); return ""; }
  }
  async function openTraBookingDeepLink(trainNo, startStationName, endStationName, dateStr){
    try{
      const token=await getAccessToken(); if(!token){ alert("認證授權失敗"); return; }
      const sName=startStationName.replace(/台/g,'臺'), eName=endStationName.replace(/台/g,'臺');
      const apiUrl=`https://tdx.transportdata.tw/api/maas-tra/booking/deeplink/direct/tra?start_station=${encodeURIComponent(sName)}&end_station=${encodeURIComponent(eName)}&train_date=${encodeURIComponent(dateStr)}&train_number=${encodeURIComponent(String(trainNo))}`;
      const response=await fetch(apiUrl,{method:'GET',headers:{'Authorization':`Bearer ${token}`,'Accept':'application/json'}});
      if(response.status===401||response.status===403){ alert("存取被拒絕，請檢查 API Key"); return; }
      const result=await response.json(); const jumpUrl=(result.data && result.data.deeplink)||result.DeepLinkUrl||result.url;
      if(jumpUrl) window.location.href=jumpUrl; else alert("取得連結失敗");
    }catch(err){ console.error("訂票錯誤:",err); alert("系統錯誤"); }
  }

  function highlightPeak(t){ return t||'--'; }
  function percentile(arr, p){ if(!arr||!arr.length) return 1; const idx=(arr.length-1)*p; const lo=Math.floor(idx), hi=Math.ceil(idx), w=idx-lo; if(lo===hi) return arr[lo]; return arr[lo]*(1-w)+arr[hi]*w; }
  function travelColor(norm){ const t=Math.max(0,Math.min(1,norm)); const hue=120+(10-120)*t; return {a:`hsl(${hue.toFixed(1)}, 85%, 52%)`,b:`hsl(${hue.toFixed(1)}, 85%, 40%)`}; }
  function getTravelBarStyle(val, capMin){ const cap=Math.max(1,capMin||1); const isExtreme=val>=cap; const norm=isExtreme?1:(val/cap); const w=Math.max(0,Math.min(1,norm))*100; const c=travelColor(norm); return {widthPct:w, isExtreme, fillBg:`linear-gradient(90deg, ${c.a}, ${c.b})`}; }
  function colorType(t){ const map={太魯閣:'#2563eb',莒光號:'#ea580c',新自強:'#8600FF',普悠瑪:'#db2777','自強號(新)':'#e11d48','自強號':'#e11d48',區間快:'#16a34a',復興號:'#0284c7',區間車:document.body.classList.contains('dark-mode')?'#a3a3a3':'#475569',加班車:'#0ea5e9'}; const c=map[t]||'#64748b'; return `<span style="color:${c};font-weight:700">${t}</span>`; }

  const HISTORY_KEY='tra_search_history_v2';
  function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); }catch(e){ return []; } }
  function saveHistory(list){ localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0,10))); }
  
  function setupThemeToggle(){
    const btn=document.getElementById('themeToggle'); if(!btn) return;
    const saved=localStorage.getItem('tra_theme')||'';
    if(saved==='dark'){ document.body.classList.add('dark-mode'); document.body.classList.remove('light-mode'); btn.textContent='☀️ 日間模式'; }
    else{ document.body.classList.remove('dark-mode'); document.body.classList.add('light-mode'); btn.textContent='🌙 深夜模式'; }
    try{ adjustHeaderForMobile(); }catch(e){}
    btn.addEventListener('click', async ()=>{
      document.body.classList.toggle('dark-mode');
      const isDark=document.body.classList.contains('dark-mode');
      document.body.classList.toggle('light-mode', !isDark);
      localStorage.setItem('tra_theme', isDark?'dark':'light');
      btn.textContent=isDark?'☀️ 日間模式':'🌙 深夜模式';
      try{ adjustHeaderForMobile(); if(typeof rerenderVisibleResults==='function') await rerenderVisibleResults(); }catch(e){}
    });
  }
  function setupHomeBtn(){ const btn=document.getElementById('homeBtn'); if(btn) btn.addEventListener('click', ()=>{ location.href='../index.html'; }); }

  let _typeFilterCtx={containerId:'',apply:null};
  function openTypeFilter(id, fn){
    const modal=document.getElementById('typeFilterModal'), list=document.getElementById('typeFilterList'); if(!modal||!list) return;
    _typeFilterCtx={containerId:id, apply:fn};
    const sel=new Set(getSelectedTypes(id)), types=new Set(Object.keys(baseSchedule||{}).map(k=>baseSchedule[k]?.['車種']).filter(Boolean));
    list.innerHTML=Array.from(types).sort().map(t=>`<label class="chip-label" style="margin:0;"><input type="checkbox" value="${t}" ${sel.has(t)?'checked':''}><span>${t}</span></label>`).join('');
    modal.style.display='flex';
  }
  function closeTypeFilter(){ const m=document.getElementById('typeFilterModal'); if(m) m.style.display='none'; }
  function applyTypeFilterSelection(){
    const id=_typeFilterCtx.containerId; if(!id) return;
    const picked=new Set(Array.from(document.querySelectorAll('#typeFilterList input:checked')).map(x=>x.value));
    document.querySelectorAll(`#${id} input`).forEach(cb=>{ cb.checked=picked.has(cb.value); });
    closeTypeFilter(); if(typeof _typeFilterCtx.apply==='function') _typeFilterCtx.apply();
  }
  function initTypeFilterUI(){
    const b1=document.getElementById('openTypeFilterStartEnd'); if(b1) b1.addEventListener('click', ()=>openTypeFilter('trainTypeChipsStartEnd', ()=>{ if(lastStartEndQuery){ selectedTrainTypesStartEnd=getSelectedTypes('trainTypeChipsStartEnd'); if(lastStartEndQuery.accept){ buildTransferList(lastStartEndQuery.st, lastStartEndQuery.ed); renderTransferTable(); }else{ buildDirectList(lastStartEndQuery.st, lastStartEndQuery.ed); renderStartEndTable(); } } }));
    const b2=document.getElementById('openTypeFilterStation'); if(b2) b2.addEventListener('click', ()=>openTypeFilter('trainTypeChipsStation', ()=>filterTrainScheduleByStationName()));
    document.getElementById('typeFilterClose')?.addEventListener('click', closeTypeFilter);
    document.getElementById('typeFilterApply')?.addEventListener('click', applyTypeFilterSelection);
    document.getElementById('typeFilterSelectAll')?.addEventListener('click', ()=>{ document.querySelectorAll('#typeFilterList input').forEach(cb=>cb.checked=true); });
    document.getElementById('typeFilterClear')?.addEventListener('click', ()=>{ document.querySelectorAll('#typeFilterList input').forEach(cb=>cb.checked=false); });
    const m=document.getElementById('typeFilterModal'); if(m) m.addEventListener('click', e=>{ if(e.target===m) closeTypeFilter(); });
  }
  function adjustHeaderForMobile(){
    const btn=document.getElementById('themeToggle'); if(!btn) return;
    const isMobile=window.matchMedia('(max-width: 760px)').matches;
    btn.textContent=document.body.classList.contains('dark-mode')?(isMobile?'☀️':'☀️ 日間模式'):(isMobile?'🌙':'🌙 深夜模式');
  }

  function renderHistory(){
    const box=document.getElementById('searchHistory'); if(!box) return;
    box.innerHTML=loadHistory().map(i=>`<div class="history-chip">${i.s} → ${i.e}</div>`).join('');
    box.querySelectorAll('.history-chip').forEach((el,idx)=>{
      el.addEventListener('click', ()=>{
        const item=loadHistory()[idx];
        document.getElementById('startStation').value=item.s; document.getElementById('endStation').value=item.e; document.getElementById('acceptTransfers').checked=!!item.t;
        runStartEndSearch();
      });
    });
  }

  let selectedTrainTypesStartEnd=[], selectedTrainTypesStation=[];
  function buildTrainTypeChips(id, onChange){
    const box=document.getElementById(id); if(!box) return;
    box.innerHTML='';
    const types=new Set(Object.keys(baseSchedule||{}).map(k=>baseSchedule[k]['車種']).filter(Boolean));
    Array.from(types).sort().forEach(t=>{
      const l=document.createElement('label'); l.className='chip-label';
      l.innerHTML=`<input type="checkbox" value="${t}"><span>${t}</span>`;
      l.querySelector('input').addEventListener('change', onChange);
      box.appendChild(l);
    });
  }
  function getSelectedTypes(id){ return Array.from(document.querySelectorAll(`#${id} input:checked`)).map(x=>x.value); }

  async function refreshData(dateStr){
    currentQueryDateStr=dateStr||'';
    document.getElementById('loading-overlay').style.display='flex';
    document.getElementById('loading-text').textContent=`正在獲取 ${dateStr} 真實時刻表...`;
    await fetchRealData(dateStr); baseSchedule=structuredClone(window.trainSchedule);
    const prev=addDays(dateStr,-1); await fetchRealData(prev); prevSchedule=structuredClone(window.trainSchedule);
    await fetchRealData(dateStr); window.trainSchedule=baseSchedule;
    if(dateStr===fmtDate(new Date())) await updateLiveDelay();
    buildStationIndex(); originDateByKey={}; scheduleKeyList=[];
    Object.keys(baseSchedule).forEach(k=>{ const key=`${k}@${dateStr}`; originDateByKey[key]=dateStr; scheduleKeyList.push({key, trainNo:k, originDate:dateStr, data:baseSchedule[k]}); });
    Object.keys(prevSchedule).forEach(k=>{ const key=`${k}@${prev}`; originDateByKey[key]=prev; scheduleKeyList.push({key, trainNo:k, originDate:prev, data:prevSchedule[k]}); });
    fillStationDatalist(''); fillTrainDatalist(''); buildTrainTypeChips('trainTypeChipsStartEnd',()=>{}); buildTrainTypeChips('trainTypeChipsStation',()=>{}); renderHistory();
    document.getElementById('loading-overlay').style.display='none';
  }

  function bindStationInput(id){
    const el=document.getElementById(id); if(!el) return;
    let tmr; el.addEventListener('focus', ()=>fillStationDatalist(el.value));
    el.addEventListener('input', ()=>{ clearTimeout(tmr); tmr=setTimeout(()=>fillStationDatalist(el.value),100); });
    el.addEventListener('blur', ()=>{ const v=extractStationNameFromInput(el.value); if(v) el.value=v; });
  }
  function bindTrainInput(id){
    const el=document.getElementById(id); if(!el) return;
    let tmr; el.addEventListener('focus', ()=>fillTrainDatalist(el.value));
    el.addEventListener('input', ()=>{ clearTimeout(tmr); tmr=setTimeout(()=>fillTrainDatalist(el.value),100); });
    el.addEventListener('blur', ()=>{ const v=extractTrainNoFromInput(el.value); if(v) el.value=v; });
  }

  // ===== Main Logic =====
  let currentStartEndList=[], currentTransferList=[];
  
  function runStartEndSearch(){
    const s=extractStationNameFromInput(document.getElementById('startStation').value), e=extractStationNameFromInput(document.getElementById('endStation').value);
    document.getElementById('startStation').value=s; document.getElementById('endStation').value=e;
    if(!s||!e) return;
    const accept=document.getElementById('acceptTransfers').checked;
    lastStartEndQuery={st:s,ed:e,accept};
    const h=loadHistory().filter(x=>!(x.s===s&&x.e===e&&x.t===accept)); h.unshift({s,e,t:accept}); saveHistory(h); renderHistory();
    selectedTrainTypesStartEnd=getSelectedTypes('trainTypeChipsStartEnd');
    if(accept){ buildTransferList(s,e); renderTransferTable(); } else { buildDirectList(s,e); renderStartEndTable(); }
  }

  function getDelayMinutes(n){
    let raw=''; try{ raw=(typeof getDelayStatus==='function')?getDelayStatus(String(n))||'':''; }catch(e){}
    if(!raw) return 0;
    let m=raw.match(/晚\s*(\d+)/); if(m) return parseInt(m[1],10);
    m=raw.match(/誤點\s*(\d+)/); if(m) return parseInt(m[1],10);
    m=raw.match(/提早\s*(\d+)/); if(m) return -parseInt(m[1],10);
    return 0;
  }
  function addMinutesToHHMM(t, d){
    if(!t||!d) return t; const [h,m]=t.split(':').map(Number);
    let min=h*60+m+d; min=((min%1440)+1440)%1440;
    return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;
  }
  function isQueryToday(d){ return !!d && d===fmtDate(new Date()); }
  function getAdjustedTime(n, sched, qDate){
    if(!isQueryToday(qDate)) return {sched, adj:sched, adjMin:parseTime(sched), hasDelay:false};
    const d=getDelayMinutes(n); if(!d) return {sched, adj:sched, adjMin:parseTime(sched), hasDelay:false};
    const adj=addMinutesToHHMM(sched, d); return {sched, adj, adjMin:parseTime(adj), hasDelay:true};
  }
  function isSpecialCharterTrainNo(n){ return /^6\d{3}$/.test(String(n||'').trim()); }
  function isNonReservedLocalType(t){ return String(t).includes('區間'); }
  function getBookingEligibilityByRow(r){
    if(!r) return {ok:false}; const n=String(r.num).trim(), t=String(r.type);
    if(isSpecialCharterTrainNo(n)||t.includes('專車')) return {ok:false, reason:'專車不提供訂票'};
    if(isNonReservedLocalType(t)) return {ok:false, reason:'區間車不可訂票'};
    const adj=getAdjustedTime(n, r.depSched, currentQueryDateStr);
    const dt=buildDateTimeFromDateAndHHMM(currentQueryDateStr, adj.adj);
    if(!dt || dt < new Date(Date.now()+600000)) return {ok:false, reason:'已發車或時間過近'};
    return {ok:true};
  }
  function buildDateTimeFromDateAndHHMM(d, t){ if(!d||!t) return null; const [y,m,dd]=d.split('-').map(Number), [hh,mm]=t.split(':').map(Number); return new Date(y,m-1,dd,hh,mm); }

  function renderTimeWithDelay(n, sched, qDate, opts){
    const t=getAdjustedTime(n, sched, qDate);
    if(!t.hasDelay || (opts&&opts.suppressStrike)) return (t.sched||'--');
    return `<span style="text-decoration:line-through;color:var(--text-muted);margin-right:6px;">${t.sched}</span><span style="font-weight:800;color:var(--text-main);">${t.adj}</span>`;
  }

  function collapseAllExpansions(){ document.querySelectorAll('tr.more-row, tr.stops-row').forEach(x=>x.remove()); document.querySelectorAll('.more-btn').forEach(b=>b.textContent='＋'); }
  function toggleMoreRow(tr, r, idx, btn){
    if(!tr||!r) return;
    if(btn && btn.textContent==='－'){ collapseAllExpansions(); return; }
    const next=tr.nextElementSibling; if(next && next.classList.contains('more-row')){ next.remove(); btn.textContent='＋'; return; }
    const more=document.createElement('tr'); more.className='more-row';
    const stopsText = r.stopsCount>0 ? `${r.stopsCount}站 <span class="toggle-arrow">▼</span>` : '<span style="color:#16a34a;font-weight:700">直達</span>';
    const elig=getBookingEligibilityByRow(r);
    const ticketHtml=elig.ok ? `<button class="ticket-btn" data-idx="${idx}">🎫</button>` : `<span style="color:var(--text-muted);font-weight:800">不可訂票</span>`;
    more.innerHTML=`<td colspan="9"><div class="more-box"><div class="more-grid"><div class="more-item"><span>停靠</span><b>${stopsText}</b></div><div class="more-item"><span>狀態</span><b>${colorStatus(r.status)}</b></div><div class="more-item"><span>區間</span><b>${r.range}</b></div></div><div class="more-actions"><div class="left"><span style="color:var(--text-muted);font-weight:800;font-size:.8rem;">更多功能</span></div><div class="right">${ticketHtml}</div></div></div></td>`;
    tr.insertAdjacentElement('afterend', more); if(btn) btn.textContent='－';
  }

  function renderStartEndTable(){
    const th=document.querySelector('#scheduleTableByStation thead tr');
    if(th){ th.innerHTML=`<th>車次</th><th>車種</th><th>出發 <span id="sortDepIcon">↕</span></th><th>抵達 <span id="sortArrIcon">↕</span></th><th>耗時 <span id="sortDurIcon">↕</span></th><th>停靠</th><th>狀態</th><th style="text-align:center">訂票</th><th class="col-more" style="text-align:center">＋</th>`; initStartEndSorting(); updateStartEndSortIcons(); }
    const tb=document.querySelector('#scheduleTableByStation tbody'); tb.innerHTML='';
    if(!currentStartEndList.length){ tb.innerHTML='<tr><td colspan="9" style="padding:14px;color:#ef4444;font-weight:700;">查無班次</td></tr>'; return; }
    tb.onclick=async(e)=>{
      const more=e.target.closest('.more-btn'); if(more){ e.stopPropagation(); const tr=more.closest('tr'), idx=Number(tr.dataset.idx); toggleMoreRow(tr, currentStartEndList[idx], idx, more); return; }
      const tick=e.target.closest('.ticket-btn'); if(tick){ e.stopPropagation(); const idx=Number(tick.dataset.idx), r=currentStartEndList[idx]; if(r){ try{await openTraBookingDeepLink(r.num, r.startStation, r.endStation, r.boardDate||currentQueryDateStr);}catch(err){alert('失敗');} } return; }
      const arrow=e.target.closest('.toggle-arrow'); if(arrow){ e.stopPropagation(); let tr=arrow.closest('tr'); if(tr&&!tr.dataset.idx) tr=tr.previousElementSibling; const idx=Number(tr.dataset.idx), r=currentStartEndList[idx]; toggleStopsRow(tr, r.startStation, r.endStation, r.num); return; }
      const tr=e.target.closest('tr'); if(tr&&tr.parentElement===tb){ const idx=Number(tr.dataset.idx), r=currentStartEndList[idx]; showTrainDetails(r.num, r.originDate); }
    };
    const caps=percentile(currentStartEndList.map(x=>x.travelMin).sort((a,b)=>a-b), 0.95);
    currentStartEndList.forEach((r,i)=>{
      let tr=tb.insertRow(); tr.dataset.idx=i;
      tr.insertCell().innerHTML=String(r.num).includes('A')?`<b>${r.num}</b><span class="badge-sea">海</span>`:`<b>${r.num}</b>`;
      tr.insertCell().innerHTML=`${colorType(r.type)} <span class="train-route">(${r.range})</span>`;
      tr.insertCell().innerHTML=r.depHTML; tr.insertCell().innerHTML=r.arrHTML;
      const bar=getTravelBarStyle(r.travelMin, caps);
      tr.insertCell().innerHTML=`<div style="font-size:.85rem;font-weight:600">${r.travel}</div><div class="progress-bar"><div class="progress-fill" style="width:${bar.widthPct.toFixed(1)}%;background:${bar.fillBg}"></div></div>`;
      let sc=tr.insertCell(); sc.className='col-stops'; sc.innerHTML=r.stopsCount>0?`${r.stopsCount}站 <span class="toggle-arrow">▼</span>`:'<span style="color:#16a34a;font-weight:600">直達</span>';
      let stc=tr.insertCell(); stc.className='col-status'; stc.innerHTML=colorStatus(r.status);
      let bc=tr.insertCell(); bc.className='col-booking'; bc.style.textAlign='center'; bc.innerHTML=getBookingEligibilityByRow(r).ok?`<button class="ticket-btn" data-idx="${i}">🎫</button>`:'';
      let mc=tr.insertCell(); mc.className='col-more'; mc.innerHTML='<button class="more-btn">＋</button>';
    });
  }

  function toggleStopsRow(tr, s, e, n){
    const next=tr.nextElementSibling; if(next && next.classList.contains('stops-row')){ next.remove(); return; }
    let t=baseSchedule[n], od=currentQueryDateStr; if(!t && prevSchedule[n]){ t=prevSchedule[n]; od=addDays(currentQueryDateStr,-1); } if(!t) return;
    const arr=t['車站時間']||[], si=arr.findIndex(x=>x[0]===s), ei=arr.findIndex(x=>x[0]===e);
    if(si<0||ei<0) return;
    const stops=arr.slice(si+1,ei).map(x=>`${x[0]}(${splitArrDep(x).dep||'--'})`).join('、');
    const row=document.createElement('tr'); row.className='stops-row'; row.innerHTML=`<td colspan="9">${stops?`沿途停靠：${stops}`:'（無中途停靠）'}</td>`;
    tr.parentNode.insertBefore(row, tr.nextSibling);
  }

  // ===== Switch & Tabs =====
  function switchQueryPanel(id){
    ['panel-startend','panel-station','panel-trainno'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
    document.querySelectorAll('.query-tab').forEach(b=>b.classList.toggle('active',b.dataset.target===id));
  }
  function bindQueryTabs(){
    document.querySelectorAll('.query-tab').forEach(b=>b.addEventListener('click',()=>switchQueryPanel(b.dataset.target)));
  }

  // ===== Sorting =====
  let startEndSortState={key:null,dir:1};
  function initStartEndSorting(){
    ['sortDepIcon','sortArrIcon','sortDurIcon'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.addEventListener('click', e=>{ e.stopPropagation(); toggleSort(id.replace('sort','').replace('Icon','').toLowerCase()); });
    });
  }
  function toggleSort(k){
    if(startEndSortState.key===k) startEndSortState.dir*=-1; else{ startEndSortState.key=k; startEndSortState.dir=1; }
    const list=document.getElementById('acceptTransfers').checked ? currentTransferList : currentStartEndList;
    sortStartEndListInPlace(list, startEndSortState);
    document.getElementById('acceptTransfers').checked ? renderTransferTable() : renderStartEndTable();
    updateStartEndSortIcons();
  }
  function sortStartEndListInPlace(l, s){
    const d=s.dir, k=s.key;
    l.sort((a,b)=>{
      if(k==='dep') return ((a.depSortMin||9999)-(b.depSortMin||9999))*d;
      if(k==='arr') return ((a.arrSortMin||9999)-(b.arrSortMin||9999))*d;
      if(k==='dur') return ((a.travelMin||9999)-(b.travelMin||9999))*d;
      return 0;
    });
  }
  function updateStartEndSortIcons(){
    const k=startEndSortState.key, d=startEndSortState.dir===1?'↑':'↓';
    ['dep','arr','dur'].forEach(x=>document.getElementById(`sort${x.charAt(0).toUpperCase()+x.slice(1)}Icon`).textContent=(k===x?d:'↕'));
  }

  // ===== 常用行程按鈕 =====
  function initFavButton(){
    const btn = document.getElementById('favMenuBtn');
    const dropdown = document.getElementById('favDropdown');
    if(!btn || !dropdown) return;

    // 生成選單
    function buildDropdown(){
      dropdown.innerHTML = '';
      let has = false;
      for(let i=1; i<=3; i++){
        const s = localStorage.getItem(`tr_s${i}`);
        const e = localStorage.getItem(`tr_e${i}`);
        if(s && e){
          has = true;
          const item = document.createElement('div');
          item.style.cssText = "padding:10px 15px;cursor:pointer;font-size:0.9rem;border-radius:8px;transition:0.2s;";
          item.innerHTML = `📍 ${s} → ${e}`;
          item.onmouseover = ()=> item.style.background = "var(--bg-body)";
          item.onmouseout = ()=> item.style.background = "transparent";
          item.onclick = ()=>{
            document.getElementById('startStation').value = s;
            document.getElementById('endStation').value = e;
            dropdown.style.display = 'none';
            runStartEndSearch();
          };
          dropdown.appendChild(item);
        }
      }
      if(!has) dropdown.innerHTML = '<div style="padding:10px;color:var(--text-muted);font-size:0.85rem;">尚未設定常用行程</div>';
    }

    btn.onclick = (e)=>{
      e.stopPropagation();
      const isShow = dropdown.style.display === 'block';
      dropdown.style.display = isShow ? 'none' : 'block';
      if(!isShow) buildDropdown();
    };

    document.addEventListener('click', ()=>{ dropdown.style.display = 'none'; });
  }

  // ===== Init =====
  window.addEventListener('load', async () => {
    bindQueryTabs(); switchQueryPanel('panel-startend');
    initDatePickerWindow(); setupThemeToggle(); setupHomeBtn(); initTypeFilterUI(); adjustHeaderForMobile();
    window.addEventListener('resize', adjustHeaderForMobile, { passive: true });
    
    initFavButton(); // 呼叫這裡

    if(localStorage.getItem('theme')==='light') document.body.classList.add('light-mode');

    // Data Load
    await refreshData(document.getElementById('mainQueryDate').value);

    // Smart Fill Logic
    const p = new URLSearchParams(window.location.search);
    const startP = p.get('start'), endP = p.get('end'), stP = p.get('station');

    // Wait data
    let retries=0; while((!window.trainSchedule || !Object.keys(window.trainSchedule).length) && retries<20){ await new Promise(r=>setTimeout(r,100)); retries++; }

    if(startP && endP){
      switchQueryPanel('panel-startend');
      document.getElementById('startStation').value = startP;
      document.getElementById('endStation').value = endP;
      runStartEndSearch();
    }
    else if(stP){
      // 1. Fill Station Timetable
      switchQueryPanel('panel-station');
      document.getElementById('stationNameInput').value = stP;
      filterTrainScheduleByStationName();
      // 2. ALSO Fill Start-End Input
      document.getElementById('startStation').value = stP;
    }

    // Auto Refresh Live Status
    setInterval(async ()=>{
      if(document.getElementById('mainQueryDate').value===fmtDate(new Date())){
        if(typeof updateLiveDelay==='function') await updateLiveDelay();
        // Rerender current view
        if(lastStartEndQuery){
           if(lastStartEndQuery.accept){ buildTransferList(lastStartEndQuery.st,lastStartEndQuery.ed); renderTransferTable(); }
           else { buildDirectList(lastStartEndQuery.st,lastStartEndQuery.ed); renderStartEndTable(); }
        }
        if(lastStationQuery) filterTrainScheduleByStationName();
        if(lastTrainQuery) filterTrainScheduleByNumber();
      }
    }, 60000);

    bindStationInput('startStation'); bindStationInput('endStation'); bindStationInput('stationNameInput');
    bindTrainInput('trainNumberInput');
    document.getElementById('swapBtn').addEventListener('click', ()=>{
      const a=document.getElementById('startStation'), b=document.getElementById('endStation'), t=a.value; a.value=b.value; b.value=t;
    });
    document.getElementById('searchBtn').addEventListener('click', runStartEndSearch);
    document.getElementById('stationSearchBtn').addEventListener('click', filterTrainScheduleByStationName);
    document.getElementById('trainNumberBtn').addEventListener('click', filterTrainScheduleByNumber);
    document.getElementById('refreshBtn').addEventListener('click', async ()=> refreshData(document.getElementById('mainQueryDate').value));
  });
  
  // Placeholder for missing func
  window.fetchCollegeDiscount = async function(){ return {}; };
</script>
