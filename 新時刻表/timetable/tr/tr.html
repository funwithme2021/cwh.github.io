async function locateNearestTraStation(target) {
    if (!Array.isArray(window.stationGeoList) || !window.stationGeoList.length) {
        await initStationMap();
    }
    const position = await getBrowserGeoPosition();
    const lat = Number(position?.coords?.latitude);
    const lon = Number(position?.coords?.longitude);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('無法取得目前位置');
    let nearest = null;
    let minDistance = Infinity;
    (window.stationGeoList || []).forEach((station) => {
        const d = getGeoDistanceKm(lat, lon, station.lat, station.lon);
        if (d < minDistance) {
            minDistance = d;
            nearest = station;
        }
    });
    if (!nearest?.name) throw new Error('找不到最近車站');
    persistTraNearestStation(nearest.name);
    if (target === 'start') return fillTraStartStationFromLocation(nearest.name);
    return fillTraStationQueryFromLocation(nearest.name);
}

let traGeoSegmentCatalogCache = null;

function makeTraGeoSegmentKey(a, b) {
    const names = [normalizeTraLinkedStation(a), normalizeTraLinkedStation(b)].filter(Boolean);
    if (names.length !== 2 || names[0] === names[1]) return '';
    names.sort();
    return `${names[0]}|||${names[1]}`;
}

function getTraGeoSegmentCatalog() {
    if (traGeoSegmentCatalogCache) return traGeoSegmentCatalogCache;
    const map = new Map();
    const segments = window.RailNetwork?.getTraSegments?.() || [];
    segments.forEach((segment) => {
        const names = (Array.isArray(segment?.stations) ? segment.stations : [])
            .map((name) => normalizeTraLinkedStation(name))
            .filter(Boolean);
        for (let i = 0; i < names.length - 1; i++) {
            const first = names[i];
            const second = names[i + 1];
            if (!first || !second || first === second) continue;
            const key = makeTraGeoSegmentKey(first, second);
            if (!key || map.has(key)) continue;
            const ordered = [first, second].sort();
            const fromName = ordered[0];
            const toName = ordered[1];
            const fromGeo = getTraStationGeoItem(fromName);
            const toGeo = getTraStationGeoItem(toName);
            if (!fromGeo || !toGeo) continue;
            map.set(key, { key, fromName, toName, fromGeo, toGeo });
        }
    });
    traGeoSegmentCatalogCache = {
        list: Array.from(map.values()),
        map
    };
    return traGeoSegmentCatalogCache;
}

function getNearestTraGeoStation(lat, lon) {
    let best = null;
    (window.stationGeoList || []).forEach((station) => {
        const distanceKm = getGeoDistanceKm(lat, lon, station.lat, station.lon);
        if (!best || distanceKm < best.distanceKm) {
            best = { ...station, distanceKm };
        }
    });
    return best;
}

function getNearestTraGeoSegment(lat, lon) {
    const catalog = getTraGeoSegmentCatalog();
    let best = null;
    catalog.list.forEach((segment) => {
        const projection = projectPointToGeoSegment(lat, lon, segment.fromGeo, segment.toGeo);
        if (!projection) return;
        if (!best || projection.distanceKm < best.distanceKm) {
            best = { ...segment, ...projection };
        }
    });
    return best;
}

function getTraGeoSampleSpreadKm(points) {
    const list = Array.isArray(points) ? points : [];
    let maxDistance = 0;
    for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
            maxDistance = Math.max(
                maxDistance,
                getGeoDistanceKm(list[i].lat, list[i].lon, list[j].lat, list[j].lon)
            );
        }
    }
    return maxDistance;
}

function analyzeTraGeoSamples(samples) {
    const normalizedSamples = (Array.isArray(samples) ? samples : []).map((position) => {
        const lat = Number(position?.coords?.latitude);
        const lon = Number(position?.coords?.longitude);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
        const accuracyKm = Number(position?.coords?.accuracy) > 0 ? (Number(position.coords.accuracy) / 1000) : null;
        return {
            lat,
            lon,
            accuracyKm,
            timestampMs: Number(position?.timestamp) || Date.now(),
            nearestStation: getNearestTraGeoStation(lat, lon),
            nearestSegment: getNearestTraGeoSegment(lat, lon)
        };
    }).filter(Boolean);
    if (!normalizedSamples.length) throw new Error('無法取得目前位置');

    const spreadKm = getTraGeoSampleSpreadKm(normalizedSamples);
    const medianAccuracyKm = getMedianNumber(normalizedSamples.map((sample) => sample.accuracyKm)) || 0.08;
    const stationThresholdKm = Math.max(0.12, Math.min(0.42, (medianAccuracyKm * 1.2) + 0.04));
    const stationSpreadThresholdKm = Math.max(0.12, Math.min(0.58, stationThresholdKm * 1.65));

    const stationGroups = new Map();
    normalizedSamples.forEach((sample) => {
        const station = sample.nearestStation;
        if (!station?.name) return;
        if (!stationGroups.has(station.name)) {
            stationGroups.set(station.name, { stationName: station.name, count: 0, distances: [] });
        }
        const group = stationGroups.get(station.name);
        group.count += 1;
        group.distances.push(station.distanceKm);
    });
    const bestStation = Array.from(stationGroups.values()).sort((a, b) => {
        if (b.count !== a.count) return b.count - a.count;
        return (getMedianNumber(a.distances) || Infinity) - (getMedianNumber(b.distances) || Infinity);
    })[0] || null;

    const stationLikely = !!bestStation && (
        (normalizedSamples.length === 1 && (getMedianNumber(bestStation.distances) || Infinity) <= stationThresholdKm) ||
        (bestStation.count >= 2 &&
            (getMedianNumber(bestStation.distances) || Infinity) <= stationThresholdKm &&
            spreadKm <= stationSpreadThresholdKm)
    );
    if (stationLikely) {
        return {
            kind: 'station',
            stationName: bestStation.stationName,
            points: normalizedSamples,
            spreadKm
        };
    }

    const segmentGroups = new Map();
    normalizedSamples.forEach((sample) => {
        const segment = sample.nearestSegment;
        if (!segment?.key) return;
        if (!segmentGroups.has(segment.key)) {
            segmentGroups.set(segment.key, { key: segment.key, count: 0, distances: [] });
        }
        const group = segmentGroups.get(segment.key);
        group.count += 1;
        group.distances.push(segment.distanceKm);
    });
    const bestSegmentGroup = Array.from(segmentGroups.values()).sort((a, b) => {
        if (b.count !== a.count) return b.count - a.count;
        return (getMedianNumber(a.distances) || Infinity) - (getMedianNumber(b.distances) || Infinity);
    })[0];
    const segmentCatalog = getTraGeoSegmentCatalog();
    const segment = segmentCatalog.map.get(bestSegmentGroup?.key || '');
    if (!segment) throw new Error('附近沒有可判定的站間區段');

    const points = normalizedSamples.map((sample) => ({
        ...sample,
        projection: projectPointToGeoSegment(sample.lat, sample.lon, segment.fromGeo, segment.toGeo)
    }));
    return {
        kind: 'segment',
        segment,
        points,
        spreadKm,
        userRatio: getMedianNumber(points.map((sample) => sample.projection?.ratio))
    };
}

function getNowAbsFromOriginAt(originDateStr, timestampMs) {
    const now = Number.isFinite(Number(timestampMs)) ? new Date(Number(timestampMs)) : new Date();
    const todayStr = fmtDate(now);
    const dayDiff = originDateStr ? diffDays(originDateStr, todayStr) : 0;
    return (dayDiff * 1440) + now.getHours() * 60 + now.getMinutes() + (now.getSeconds() / 60) + (now.getMilliseconds() / 60000);
}

function getTraLocatedTrainState(entry, timestampMs) {
    const stops = entry?.data?.['車站時間'] || [];
    if (!Array.isArray(stops) || stops.length < 2) return null;
    const absAD = buildAbsArrDep(stops);
    const nowAbs = getNowAbsFromOriginAt(entry.originDate, timestampMs);
    let delayMin = 0;
    try {
        delayMin = Math.max(0, Number(getDelayMinutes(String(entry.trainNo)) || 0));
    } catch (_) {}
    const shift = (absValue) => Number.isFinite(absValue) ? (absValue + delayMin) : null;
    const firstAbs = shift(absAD.absDep?.[0] ?? absAD.absArr?.[0]);
    const lastAbs = shift(absAD.absArr?.[stops.length - 1] ?? absAD.absDep?.[stops.length - 1]);
    if (!Number.isFinite(firstAbs) || !Number.isFinite(lastAbs)) return null;
    if (nowAbs < (firstAbs - 2) || nowAbs > (lastAbs + 5)) return null;

    for (let i = 0; i < stops.length; i++) {
        const stationGeo = getTraStationGeoItem(stops[i]?.[0]);
        if (!stationGeo) continue;
        const arrAbs = shift(absAD.absArr?.[i]);
        const depAbs = shift(absAD.absDep?.[i]);
        const startAbs = Number.isFinite(arrAbs) ? arrAbs : depAbs;
        const endAbs = Number.isFinite(depAbs) ? depAbs : arrAbs;
        if (Number.isFinite(startAbs) && Number.isFinite(endAbs) && nowAbs >= Math.min(startAbs, endAbs) && nowAbs <= Math.max(startAbs, endAbs)) {
            return {
                kind: 'station',
                stationName: normalizeTraLinkedStation(stops[i]?.[0]),
                lat: stationGeo.lat,
                lon: stationGeo.lon,
                pathPoints: [stationGeo]
            };
        }
    }

    const segmentMap = getTraGeoSegmentCatalog().map;
    for (let i = 0; i < stops.length - 1; i++) {
        const depAbs = shift(absAD.absDep?.[i] ?? absAD.absArr?.[i]);
        const arrAbs = shift(absAD.absArr?.[i + 1] ?? absAD.absDep?.[i + 1]);
        if (!Number.isFinite(depAbs) || !Number.isFinite(arrAbs) || arrAbs < depAbs) continue;
        if (nowAbs < depAbs || nowAbs > arrAbs) continue;
        const span = Math.max(1, arrAbs - depAbs);
        const pathNames = window.RailNetwork?.findTraRoutePath?.(stops[i]?.[0], stops[i + 1]?.[0]) || [stops[i]?.[0], stops[i + 1]?.[0]];
        const profile = buildGeoPathProfile(pathNames, getTraStationGeoItem);
        if (profile.length >= 2) {
            const located = locatePointOnProfileSegment(profile, (nowAbs - depAbs) / span, makeTraGeoSegmentKey, segmentMap);
            if (located) return located;
        }
        const fromGeo = getTraStationGeoItem(stops[i]?.[0]);
        const toGeo = getTraStationGeoItem(stops[i + 1]?.[0]);
        if (!fromGeo || !toGeo) continue;
        const fallbackKey = makeTraGeoSegmentKey(stops[i]?.[0], stops[i + 1]?.[0]);
        const fallbackSegment = segmentMap.get(fallbackKey) || null;
        const fallbackProjection = projectPointToGeoSegment(
            interpolateGeoPoint(fromGeo, toGeo, (nowAbs - depAbs) / span).lat,
            interpolateGeoPoint(fromGeo, toGeo, (nowAbs - depAbs) / span).lon,
            fallbackSegment?.fromGeo || fromGeo,
            fallbackSegment?.toGeo || toGeo
        );
        return {
            ...interpolateGeoPoint(fromGeo, toGeo, (nowAbs - depAbs) / span),
            pathPoints: [fromGeo, toGeo],
            kind: 'segment',
            segmentKey: fallbackKey,
            segmentRatio: fallbackProjection?.ratio ?? Math.max(0, Math.min(1, (nowAbs - depAbs) / span)),
            segment: fallbackSegment
        };
    }

    return null;
}

async function prepareTraLiveLocateData() {
    const todayStr = fmtDate(new Date());
    if (currentQueryDateStr !== todayStr || !Object.keys(baseSchedule || {}).length) {
        const dateInput = document.getElementById('mainQueryDate');
        if (dateInput) dateInput.value = todayStr;
        await refreshData(todayStr, { silent: true });
    }
    try {
        if (typeof updateLiveDelay === 'function') await updateLiveDelay();
    } catch (_) {}
}

function scoreTraEntryForGeoContext(entry, context) {
    const segmentMap = getTraGeoSegmentCatalog().map;
    let matched = 0;
    let totalScore = 0;
    let totalDistanceKm = 0;
    context.points.forEach((sample) => {
        const state = getTraLocatedTrainState(entry, sample.timestampMs);
        if (!state) return;
        const pointDistanceKm = getGeoDistanceKm(sample.lat, sample.lon, state.lat, state.lon);
        if (context.kind === 'segment') {
            const userRatio = sample.projection?.ratio ?? context.userRatio ?? 0.5;
            if (state.kind === 'segment' && state.segmentKey === context.segment.key) {
                totalScore += (Math.abs((Number(state.segmentRatio) || 0) - userRatio) * 8) + (pointDistanceKm * 0.35);
                totalDistanceKm += pointDistanceKm;
                matched += 1;
                return;
            }
            if (state.kind === 'station') {
                const endpointRatio = state.stationName === context.segment.fromName ? 0 : (state.stationName === context.segment.toName ? 1 : null);
                if (endpointRatio !== null) {
                    totalScore += (Math.abs(endpointRatio - userRatio) * 8) + (pointDistanceKm * 0.4) + 0.8;
                    totalDistanceKm += pointDistanceKm;
                    matched += 1;
                }
            }
            return;
        }

        if (state.kind === 'station' && state.stationName === context.stationName) {
            totalScore += pointDistanceKm * 0.45;
            totalDistanceKm += pointDistanceKm;
            matched += 1;
            return;
        }
        if (state.kind === 'segment') {
            const segment = segmentMap.get(state.segmentKey || '');
            if (!segment) return;
            const endpointRatio = segment.fromName === context.stationName ? 0 : (segment.toName === context.stationName ? 1 : null);
            if (endpointRatio === null) return;
            totalScore += (Math.abs((Number(state.segmentRatio) || 0) - endpointRatio) * 8) + (pointDistanceKm * 0.4) + 0.7;
            totalDistanceKm += pointDistanceKm;
            matched += 1;
        }
    });
    if (!matched) return null;
    return {
        matched,
        avgDistanceKm: totalDistanceKm / matched,
        score: (totalScore / matched) + ((context.points.length - matched) * 1.75)
    };
}

async function locateTraRunningTrainByPosition(options) {
    const opts = options || {};
    if (!Array.isArray(window.stationGeoList) || !window.stationGeoList.length) {
        await initStationMap();
    }
    await prepareTraLiveLocateData();
    const samples = await collectGeoPositionSamples({ durationMs: 3200, targetCount: 3 });
    const context = analyzeTraGeoSamples(samples);
    let best = null;
    (scheduleKeyList || []).forEach((entry) => {
        const scored = scoreTraEntryForGeoContext(entry, context);
        if (!scored) return;
        if (!best || scored.score < best.score) {
            best = { entry, ...scored };
        }
    });
    if (!best || best.avgDistanceKm > 12) {
        throw new Error('附近沒有可判定的行駛中列車');
    }
    const result = { entry: best.entry, avgDistanceKm: best.avgDistanceKm, matched: best.matched, score: best.score, context };
    if (opts.applyTrainQuery === false) return result;
    switchQueryPanel('panel-trainno');
    const trainNo = String(best.entry.trainNo || '');
    const input = document.getElementById('trainNumberInput');
    if (input) input.value = trainNo;
    if (typeof updateHeroSnapshot === 'function') updateHeroSnapshot();
    result.queryResult = await Promise.resolve(filterTrainScheduleByNumberV2(trainNo));
    return result;
}

window.locateTraRunningTrainByPosition = locateTraRunningTrainByPosition;

(function bindHomeLocatorBridge(){
    if (window.__homeLocatorBridgeTraBound) return;
    window.__homeLocatorBridgeTraBound = true;
    window.addEventListener('message', async (event) => {
        const data = event?.data;
        if (!data || data.type !== 'HOME_LOCATOR_REQUEST' || data.sys !== 'tr') return;
        const requestId = String(data.requestId || '').trim();
        const respond = (payload) => {
            const message = { type: 'HOME_LOCATOR_RESPONSE', requestId, sys: 'tr', ...payload };
            try {
                if (event.source && typeof event.source.postMessage === 'function') {
                    event.source.postMessage(message, '*');
                    return;
                }
            } catch (e) {}
            try { parent.postMessage(message, '*'); } catch (e) {}
        };
        try {
            if (data.coords) persistSharedHomeGeoSnapshot(data.coords, 'home-request');
            const result = await locateTraRunningTrainByPosition({ applyTrainQuery: false });
            respond({
                ok: true,
                result: {
                    entry: { trainNo: String(result?.entry?.trainNo || '').trim() },
                    avgDistanceKm: Number(result?.avgDistanceKm || 0),
                    matched: result?.matched || null
                }
            });
        } catch (error) {
            respond({
                ok: false,
                error: error instanceof Error && error.message ? error.message : '附近沒有可判定的行駛中列車'
            });
        }
    });
})();

function handleTraUrlParams() {
    const p = new URLSearchParams(window.location.search);
    const pStart = normalizeTraLinkedStation(p.get('start'));
    const pEnd = normalizeTraLinkedStation(p.get('end'));
    const pStation = normalizeTraLinkedStation(p.get('station'));
    const pTrain = extractTrainNoFromInput(p.get('train') || p.get('trainNo') || '');
    const pTransfer = ['1', 'true', 'yes', 'on'].includes(String(p.get('transfer') || p.get('acceptTransfers') || '').trim().toLowerCase());
    const startEndPanelId = resolveStartEndPanelId('panel-startend');
    const acceptTransfers = document.getElementById('acceptTransfers');

    if (pStart && pEnd) {
        document.getElementById('startStation').value = pStart;
        document.getElementById('endStation').value = pEnd;
        if (acceptTransfers) acceptTransfers.checked = pTransfer;
        syncTraStartEndSummaryUI();
        if (startEndPanelId === 'panel-startend2') {
            startEndQuery2Controller?.setState?.({
                start: pStart,
                end: pEnd,
                modeEnabled: pTransfer
            });
            setTimeout(()=>startEndQuery2Controller?.search?.(pStart, pEnd, { updateInput: true }), 600);
        } else {
            setTimeout(runStartEndSearch, 600);
        }
        return;
    }

    if (pStation) {
        document.getElementById('startStation').value = pStation;
        document.getElementById('stationNameInput').value = pStation;
        document.getElementById('stationNameInput2').value = pStation;
        syncTraStartEndSummaryUI();
        switchQueryPanel('panel-station2');
        stationQuery2Controller?.setState?.({ station: pStation });
        setTimeout(()=>stationQuery2Controller?.search?.(pStation, { updateInput: true }), 300);
        return;
    }

    if (pTrain) {
        switchQueryPanel('panel-trainno');
        const input = document.getElementById('trainNumberInput');
        if (input) input.value = pTrain;
        setTimeout(() => {
            filterTrainScheduleByNumberV2(pTrain);
        }, 300);
        return;
    }

    updateHeroSnapshot();
}

function setTraFavDropdownVisible(show) {
    if (!favDropdown) return;
    favDropdown.classList.toggle('show', !!show);
}

function buildFavDropdown() {
    if (!favDropdown) return;
    favDropdown.innerHTML = '';
    let hasFav = false;

    for (let i = 1; i <= 3; i++) {
        const s = normalizeTraLinkedStation(localStorage.getItem(`tr_s${i}`));
        const e = normalizeTraLinkedStation(localStorage.getItem(`tr_e${i}`));

        if (s && e) {
            hasFav = true;
            const item = document.createElement('div');
            item.className = 'fav-item';
            item.innerHTML = `<span style="color:var(--primary);">📍</span> ${s} → ${e}`;

            item.onclick = () => {
                fillTraStartEndInputs(s, e);
                setTraFavDropdownVisible(false);
                runStartEndSearch();
            };
            favDropdown.appendChild(item);
        }
    }

    if (!hasFav) {
        const empty = document.createElement('div');
        empty.className = 'fav-empty';
        empty.innerText = '尚無常用行程，請至首頁設定';
        favDropdown.appendChild(empty);
    }
}

function initTraFavButton() {
    if (!favBtn || !favDropdown || favBtn.dataset.bound === '1') return;
    favBtn.dataset.bound = '1';
    favBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = favDropdown.classList.contains('show');
        if (!isOpen) buildFavDropdown();
        setTraFavDropdownVisible(!isOpen);
    });
}

initTraFavButton();

document.addEventListener('click', (event) => {
    if (!favDropdown || !favBtn) return;
    if (favDropdown.contains(event.target) || favBtn.contains(event.target)) return;
    setTraFavDropdownVisible(false);
});

<script>
(function(){
  const wrap = document.getElementById('tripControlsWrap');
  const openBtn = document.getElementById('tripOpenBtn');
  const sum = document.getElementById('tripSummaryText');
  const quickSearchBtn = document.getElementById('tripCompactSearch');
  const backdrop = document.getElementById('tripSheetBackdrop');
  const closeBtn = document.getElementById('tripSheetClose');
  if(!wrap || !openBtn || !sum || !quickSearchBtn) return;

  const isMobile = () => window.matchMedia && window.matchMedia('(max-width: 520px)').matches;

  function getVal(id){
    const el = document.getElementById(id);
    return (el && el.value) ? el.value.trim() : '';
  }


  let prevOverflow = '';
  function lockScroll(on){
    if(!isMobile()) return;
    if(on){
      prevOverflow = document.body.style.overflow || '';
      document.body.style.overflow = 'hidden';
    }else{
      document.body.style.overflow = prevOverflow;
    }
  }

  function openSheet(){
    if(!isMobile()) return;
    wrap.classList.add('is-open');
    wrap.classList.remove('is-collapsed');
    if(backdrop) backdrop.classList.add('show');
    lockScroll(true);
  }

  function closeSheet(){
    wrap.classList.remove('is-open');
    if(backdrop) backdrop.classList.remove('show');
    if(isMobile()) wrap.classList.add('is-collapsed');
    lockScroll(false);
  }

  function syncByViewport(){
    if(isMobile()){
      closeSheet();
    }else{
      wrap.classList.remove('is-collapsed');
      wrap.classList.remove('is-open');
      if(backdrop) backdrop.classList.remove('show');
      lockScroll(false);
    }
    updateSummary();
  }

  window.addEventListener('resize', syncByViewport);
  syncByViewport();

  openBtn.addEventListener('click', ()=>{
    if(!isMobile()) return;
    const isOpen = wrap.classList.contains('is-open');
    if(isOpen) closeSheet(); else openSheet();
  });

  if(closeBtn){
    closeBtn.addEventListener('click', closeSheet);
  }
  if(backdrop){
    backdrop.addEventListener('click', closeSheet);
  }

  quickSearchBtn.addEventListener('click', ()=>{
    updateSummary();
    const realBtn = document.getElementById('searchBtn');
    if(realBtn) realBtn.click();
    if(isMobile()) closeSheet();
  });

  ['startStation','endStation'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', updateSummary);
  });
  const acc = document.getElementById('acceptTransfers');
  if(acc) acc.addEventListener('change', updateSummary);

  const realBtn = document.getElementById('searchBtn');
  if(realBtn){
    realBtn.addEventListener('click', ()=>{
      updateSummary();
      if(isMobile()) closeSheet();
    });
  }

  function updateSummary(){
    const st = getVal('startStation') || '出發';
    const ed = getVal('endStation')   || '到達';
    const acc = document.getElementById('acceptTransfers');
    const accTxt = acc && acc.checked ? '轉乘' : '直達';
    sum.textContent = `${st} → ${ed} · ${accTxt}`;
    updateHeroSnapshot();
  }
})();
</script>
