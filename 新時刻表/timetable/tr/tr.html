            if(dir === 'odd'  && ev !== false) return;
      
            // 本站一律用「開車時間」
            const dep = splitArrDep(arr[idx]).dep || '--';
      
            // 判斷這站實際顯示是哪一天（跨日/延誤跨日都要算進去）
            const abs = buildAbsMinutes(arr);
            const absMin = abs[idx]?.abs;
            if(absMin === null) return;

            const depAdj = getAdjustedTime(trainNo, dep, currentQueryDateStr, absMin, originDate);
            const stopDate = getDisplayStopDateStr(depAdj, originDate, absMin);
            if(stopDate !== currentQueryDateStr) return; // 只顯示「選的那天」

            const status = getTrainStatusLabel(
              trainNo,
              originDate, // 狀態永遠用發車日
              (arr[0]?.[2]||arr[0]?.[1]||''),
              (arr.slice(-1)[0]?.[1]||arr.slice(-1)[0]?.[2]||''),
              absMin, // 用本站 absMin 判斷已過站
              arr,
              idx
            );

            rows.push({
              trainNo, originDate,
              type: data['車種'],
              range: `${arr[0][0]}➝${arr.slice(-1)[0][0]}`,
              depHTML: renderTimeWithDelay(trainNo, dep, currentQueryDateStr, { suppressStrike: status==='已過站' }, absMin, originDate),
              depMin: (status==='已過站' ? (parseTime(dep) ?? 9999) : (depAdj.adjMin ?? 9999)),
              status
            });
          });
      
          rows.sort((a,b)=>a.depMin-b.depMin);
      
          rows.forEach(r=>{
            let tr=tbody.insertRow();
            tr.insertCell().innerHTML=String(r.trainNo).includes('A')?`<b>${r.trainNo}</b><span class="badge-sea">海</span>`:`<b>${r.trainNo}</b>`;
            tr.insertCell().innerHTML=renderTraTypeCell(r.type, r.range);
            tr.insertCell().innerHTML=highlightPeak(r.depHTML);
            tr.insertCell().innerHTML=colorStatus(r.status);
            tr.addEventListener('click',()=>showTrainDetails(r.trainNo, r.originDate));
          });
        
    }finally{
      hideLoading();
    }
  },0);
  });}

  function getTraStationDirectionLabel(dir){
    return dir === 'odd' ? '逆行 / 奇數車次' : '順行 / 偶數車次';
  }

  function getTraStationStatusTone(label){
    const text = String(label || '');
    if(/停駛|取消|暫停|終止|截短|折返|部分停駛|異常/.test(text)) return 'danger';
    if(/晚|延遲|誤點/.test(text)) return 'warning';
    if(/準點|即將進站|停靠中|即將開車/.test(text)) return 'success';
    if(/已過站|已到終點|已到終點站/.test(text)) return 'muted';
    return 'neutral';
  }

  function getTraStationLiveSupplementStatus(trainNo, originDateStr, stationName, arrAbs, depAbs, runtimeCtx, stopsArr, stationIndex){
    const liveMatch = getTraLiveStationMatch(trainNo, originDateStr, stopsArr);
    if(!liveMatch || !liveMatch.isStop) return '';
    if(normalizeTraLinkedStation(stationName) !== liveMatch.station) return '';
    if(Number.isInteger(stationIndex) && liveMatch.index !== stationIndex) return '';
    if(liveMatch.index === 0) return '';
    const nowAbs = Number(runtimeCtx?.nowAbs);
    if(!Number.isFinite(nowAbs)) return '';
    const shift = Math.max(0, Number(runtimeCtx?.delayMin) || 0);
    const depEff = Number.isFinite(depAbs) ? (depAbs + shift) : null;
    return (Number.isFinite(depEff) && nowAbs < depEff) ? '停靠中' : '';
  }

  function getTraSupplementStatus(baseStatus, arrAbs, depAbs, runtimeCtx, stationLiveStatus=''){
    const base = String(baseStatus || '');
    if(/已過站|已到終點|已到終點站/.test(base)) return '';
    const liveStatus = String(stationLiveStatus || '').trim();
    if(liveStatus === '停靠中') return liveStatus;
    const nowAbs = Number(runtimeCtx?.nowAbs);
    if(!Number.isFinite(nowAbs)) return '';
    const delayMin = Number(runtimeCtx?.delayMin);
    const shift = Number.isFinite(delayMin) ? delayMin : 0;
    const arrEff = Number.isFinite(arrAbs) ? (arrAbs + shift) : null;
    const depEff = Number.isFinite(depAbs) ? (depAbs + shift) : null;
    if(arrEff !== null && depEff !== null && arrEff === depEff && nowAbs === depEff) return '停靠中';
    if(depEff !== null && nowAbs >= (depEff - 1) && nowAbs < depEff) return '即將開車';
    if(arrEff !== null && depEff !== null && nowAbs >= arrEff && nowAbs < depEff) return '停靠中';
    if(arrEff !== null && nowAbs >= (arrEff - 2) && nowAbs < arrEff) return '即將進站';
    return '';
  }

  function buildTraStatusDisplay(baseStatus, supplementStatus){
    const base = String(baseStatus || '').trim() || '--';
    const supplement = String(supplementStatus || '').trim();
    if(!supplement || supplement === base){
      return {
        html: escapeTrainQueryHtml(base),
        tone: getTraStationStatusTone(base)
      };
    }
    const renderItem = (label, kind) => `<span class="rail-status-rotator-item ${kind} rail-status-tone-${getTraStationStatusTone(label)}">${escapeTrainQueryHtml(label)}</span>`;
    return {
      html: `<span class="rail-status-rotator" title="${escapeTrainQueryHtml(`${supplement} / ${base}`)}"><span class="rail-status-rotator-track">${renderItem(supplement, 'is-primary')}${renderItem(base, 'is-secondary')}</span></span>`,
      tone: 'neutral'
    };
  }

  function getTraStationStatusDisplayForTrain(trainNo, originDateStr, stationName, baseStatus){
    const schedule = getScheduleByOrigin(trainNo, originDateStr);
    const stops = schedule?.['車站時間'] || [];
    const idx = stops.findIndex((stop)=>normalizeTraLinkedStation(stop?.[0]) === normalizeTraLinkedStation(stationName));
    if(idx < 0) return buildTraStatusDisplay(baseStatus, '');
    const absAD = buildAbsArrDep(stops);
    const first = splitArrDep(stops[0] || []);
    const last = splitArrDep(stops[stops.length - 1] || []);
    const runtimeCtx = getTrainDetailRuntimeContext(
      trainNo,
      originDateStr,
      first.dep || first.arr || '',
      last.arr || last.dep || ''
    );
    const stationLiveStatus = getTraStationLiveSupplementStatus(
      trainNo,
      originDateStr,
      stationName,
      absAD.absArr[idx],
      absAD.absDep[idx],
      runtimeCtx,
      stops,
      idx
    );
    return buildTraStatusDisplay(
      baseStatus,
      getTraSupplementStatus(baseStatus, absAD.absArr[idx], absAD.absDep[idx], runtimeCtx, stationLiveStatus)
    );
  }

  function stripQuery2HtmlText(html){
    return String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function parseQuery2DisplayTime(html, fallbackText){
    const raw = String(html || '');
    const oldMatch = raw.match(/text-decoration:line-through[^>]*>\s*([^<]+)/i);
    const newMatches = [...raw.matchAll(/font-weight:800[^>]*>\s*([^<]+)/ig)].map((item)=>String(item[1] || '').trim()).filter(Boolean);
    if(oldMatch && newMatches.length){
      return { oldText: String(oldMatch[1] || '').trim(), newText: newMatches[newMatches.length - 1] };
    }
    const text = stripQuery2HtmlText(raw) || String(fallbackText || '--');
    return { oldText: '', newText: text };
  }

  function buildQuery2CombinedTimeHtml(depHtml, arrHtml, depFallback, arrFallback){
    const dep = parseQuery2DisplayTime(depHtml, depFallback);
    const arr = parseQuery2DisplayTime(arrHtml, arrFallback);
    if(dep.oldText || arr.oldText){
      return `<div class="rod2-timecell"><div class="rsv2-time-sub"><span class="rod2-time-original">${escapeTrainQueryHtml(dep.oldText || dep.newText || '--')} → ${escapeTrainQueryHtml(arr.oldText || arr.newText || '--')}</span></div><div class="rsv2-time-main">${escapeTrainQueryHtml(dep.newText || '--')} → ${escapeTrainQueryHtml(arr.newText || '--')}</div></div>`;
    }
    return `<div class="rod2-timecell"><div class="rsv2-time-main">${escapeTrainQueryHtml(dep.newText || '--')} → ${escapeTrainQueryHtml(arr.newText || '--')}</div></div>`;
  }

    const dep = parseQuery2DisplayTime(depHtml, depFallback);

ueryHtml(nextRow.trainNo || '')}</span></span></span></span>`

  function sortTraStartEndQuery2Rows(rows, sortKey){
    const key = sortKey === 'arr' || sortKey === 'dur' ? sortKey : 'dep';
    return (rows || []).slice().sort((a,b)=>{
      const av = key === 'arr' ? (a?.sortArr ?? 9999) : key === 'dur' ? (a?.sortDur ?? 999999) : (a?.sortDep ?? 9999);
      const bv = key === 'arr' ? (b?.sortArr ?? 9999) : key === 'dur' ? (b?.sortDur ?? 999999) : (b?.sortDep ?? 9999);
      if(av !== bv) return av - bv;
      return String(a?.trainNo || '').localeCompare(String(b?.trainNo || ''),'en');
    });
  }

  function getTraWestBranchByTripLine(tripLine){
    const value = String(tripLine || '').trim();
    if(!value) return '';
    if(/[海]/.test(value) || /^2$/.test(value) || /sea/i.test(value)) return 'sea';
    if(/[山]/.test(value) || /^1$/.test(value) || /mountain/i.test(value)) return 'mountain';
    return '';
  }

  function getTraViaLabelFromStops(stops, options = {}){
    const rawStopNames = (Array.isArray(stops) ? stops : [])
      .map(stop => normTW(stop?.[0] || ''))
      .filter(Boolean);
    if(!rawStopNames.length) return '';

    const rawNameSet = new Set(rawStopNames);
    let expandedStopPath = rawStopNames.slice();
    try{
      const expanded = window.RailNetwork?.expandTraStopPath?.(stops);
      const normalizedExpanded = (Array.isArray(expanded) ? expanded : [])
        .map(name => normTW(name))
        .filter(Boolean);
      if(normalizedExpanded.length) expandedStopPath = normalizedExpanded;
    }catch(_){}

    const getFirstIndex = (stationList, sourceList = rawStopNames) => {
      const normalizedSet = new Set(stationList.map(name => normTW(name)));
      return sourceList.findIndex(name => normalizedSet.has(name));
    };
    const getWestBranchFirstIndex = () => {
      const boundaryIndex = getFirstIndex(traWestBranchBoundaryStations, rawStopNames);
      return boundaryIndex >= 0 ? boundaryIndex : 0;
    };
    const buildLineUsage = (stationList, options = {}) => {
      const sourceList = Array.isArray(options.sourceList) && options.sourceList.length
        ? options.sourceList
        : rawStopNames;
      const orderSourceList = Array.isArray(options.orderSourceList) && options.orderSourceList.length
        ? options.orderSourceList
        : rawStopNames;
      const boundaryAware = !!options.boundaryAware;
      const normalizedLine = stationList.map(name => normTW(name));
      const lineIndexMap = new Map(normalizedLine.map((name, idx) => [name, idx]));
      const hits = [];
      sourceList.forEach((name, sourceIndex) => {
        const lineIndex = lineIndexMap.get(name);
        if(lineIndex == null) return;
        hits.push({ sourceIndex, lineIndex });
      });
      if(!hits.length) return null;
      const interiorHits = hits.filter(hit => hit.lineIndex > 0 && hit.lineIndex < normalizedLine.length - 1);
      if(boundaryAware && interiorHits.length === 0 && hits.length < 2) return null;
      let firstIndex = getFirstIndex(stationList, orderSourceList);
      if(firstIndex < 0) firstIndex = hits[0].sourceIndex;
      return { firstIndex };
    };

    const matchedLabels = [];
    const pushLabel = (label, usage) => {
      if(!usage || matchedLabels.some(item => item.label === label)) return;
      matchedLabels.push({ label, firstIndex: usage.firstIndex });
    };

    traViaBranchMatchers.forEach(item => {
      pushLabel(item.label, buildLineUsage(item.stations));
    });

    if(rawNameSet.has(normTW('成功')) && rawNameSet.has(normTW('追分'))){
      pushLabel('成追線', { firstIndex: Math.min(getFirstIndex(['成功']), getFirstIndex(['追分'])) });
    }

    const westBranchHint = (() => {
      if(traSeaLineStations.some(name => rawNameSet.has(normTW(name)))) return 'sea';
      if(traMountainLineStations.some(name => rawNameSet.has(normTW(name)))) return 'mountain';
      const tripLineBranch = getTraWestBranchByTripLine(options.tripLine);
      if(tripLineBranch) return tripLineBranch;
      if(/A/i.test(String(options.trainNo || '').trim())) return 'sea';
      return '';
    })();
    if(westBranchHint === 'sea'){
      pushLabel('海線', { firstIndex: getWestBranchFirstIndex() });
    }else if(westBranchHint === 'mountain'){
      pushLabel('山線', { firstIndex: getWestBranchFirstIndex() });
    }

    pushLabel('北迴線', buildLineUsage(traNorthLinkStations, {
      sourceList: expandedStopPath,
      orderSourceList: rawStopNames,
      boundaryAware: true
    }));
    pushLabel('南迴線', buildLineUsage(traSouthLinkStations, {
      sourceList: expandedStopPath,
      orderSourceList: rawStopNames,
      boundaryAware: true
    }));
    if(!westBranchHint){
      pushLabel('海線', buildLineUsage(traSeaLineStations));
      pushLabel('山線', buildLineUsage(traMountainLineStations));
    }

    return matchedLabels
      .sort((a, b) => a.firstIndex - b.firstIndex)
      .map(item => item.label)
      .join('／');
  }

  function buildTraStationQueryV2Rows(station, dir, selectedTypes){
    const selectedSet = new Set((selectedTypes || []).map(type => String(type || '')));
    const rows = [];

    scheduleKeyList.forEach(item=>{
      const { trainNo, originDate, data } = item;
      if(!data) return;

      const typeLabel = normalizeTraTypeDisplay(data['車種']);
      if(selectedSet.size && !selectedSet.has(typeLabel)) return;

      const arr = data['車站時間'] || [];
      const idx = arr.findIndex(stop => stop[0] === station);
      if(idx < 0) return;

      const ev = isEvenTrainNo(trainNo);
      if(dir === 'even' && ev !== true) return;
      if(dir === 'odd' && ev !== false) return;

      const dep = splitArrDep(arr[idx]).dep || '--';
      const abs = buildAbsMinutes(arr);
      const absMin = abs[idx]?.abs;
      if(absMin === null || absMin === undefined) return;

      const depAdj = getAdjustedTime(trainNo, dep, currentQueryDateStr, absMin, originDate);
      const stopDate = getDisplayStopDateStr(depAdj, originDate, absMin);
      if(stopDate !== currentQueryDateStr) return;

      const status = getTrainStatusLabel(
        trainNo,
        originDate,
        (arr[0]?.[2] || arr[0]?.[1] || ''),
        (arr.slice(-1)[0]?.[1] || arr.slice(-1)[0]?.[2] || ''),
        absMin,
        arr,
        idx
      );
      const runtimeCtx = getTrainDetailRuntimeContext(
        trainNo,
        originDate,
        (arr[0]?.[2] || arr[0]?.[1] || ''),
        (arr.slice(-1)[0]?.[1] || arr.slice(-1)[0]?.[2] || '')
      );
      const absAD = buildAbsArrDep(arr);
      const statusDisplay = buildTraStatusDisplay(
        status,
        getTraSupplementStatus(
          status,
          absAD.absArr[idx],
          absAD.absDep[idx],
          runtimeCtx,
          getTraStationLiveSupplementStatus(trainNo, originDate, station, absAD.absArr[idx], absAD.absDep[idx], runtimeCtx, arr, idx)
        )
      );

      rows.push({
        trainNo,
        originDate,
        type: typeLabel,
        range: `${arr[0][0]} → ${arr.slice(-1)[0][0]}`,
        viaLabel: getTraViaLabelFromStops(arr, {
          tripLine: data['行別'] || data['路線'] || data['TripLine'] || data['銵'] || '',
          trainNo
        }),
        depHTML: highlightPeak(renderTimeWithDelay(trainNo, dep, currentQueryDateStr, { suppressStrike: status === '已過站' }, absMin, originDate)),
        displayTime: status === '已過站' ? (dep || '--') : (depAdj.adj || dep || '--'),
        depMin: status === '已過站' ? (parseTime(dep) ?? 9999) : (depAdj.adjMin ?? 9999),
        status,
        statusHtml: statusDisplay.html,
        statusTone: statusDisplay.tone,
        isCrossDay: originDate !== currentQueryDateStr,
        isSea: String(trainNo).includes('A')
      });
    });

    rows.sort((a,b)=>{
      if(a.depMin === b.depMin) return String(a.trainNo).localeCompare(String(b.trainNo),'en');
      return a.depMin - b.depMin;
    });
    return rows;
  }

function getTraDirectionLabel(trainNo){
  const digits = String(trainNo || '').match(/\d+/);
  if(!digits) return '';
  return (Number(digits[0]) % 2 === 0) ? '順行 / 偶數車次' : '逆行 / 奇數車次';
}

function getTrainQueryToneByStatus(label){
  const text = String(label || '');
  if(/取消|停駛|異常|查無/.test(text)) return 'danger';
  if(/晚|延遲|誤點/.test(text)) return 'warning';
  if(/提早|準點|下一站|下一停靠|即將通過|停靠中|即將發車/.test(text)) return 'success';
  if(/已過站|已到終點/.test(text)) return 'muted';
  return 'neutral';
}

function formatTrainQueryStopTime(kind, arrText, depText){
  const arr = String(arrText || '').trim();
  const dep = String(depText || '').trim();
  if(kind === 'origin') return dep || arr || '--';
  if(kind === 'terminal') return arr || dep || '--';
  if(arr && dep && arr !== dep) return `${arr} / ${dep}`;
  return dep || arr || '--';
}

function formatTrainQueryDelayLabel(delayMin, fallback){
  const value = Number(delayMin);
  if(Number.isFinite(value) && value > 0) return `晚${value}分`;
  if(Number.isFinite(value) && value < 0) return `提早${Math.abs(value)}分`;
  return fallback || '表定';
}

function escapeTrainQueryHtml(value){
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function buildTraTrainQueryDisplayHtml(trainNo, typeLabel){
  return `<span>${escapeTrainQueryHtml(trainNo)}${colorType(typeLabel)}</span>`;
}

function formatTrainQueryDurationCompact(totalMinutes){
  const mins = Number(totalMinutes);
  if(!Number.isFinite(mins) || mins < 0) return '--';
  const hours = Math.floor(mins / 60);
  const remain = mins % 60;
  if(hours > 0 && remain > 0) return `${hours}時${remain}分`;
  if(hours > 0) return `${hours}時`;
  return `${remain}分`;
}

function buildTrainQueryProgressText(elapsedMinutes, totalMinutes, progressPercent){
  if(!Number.isFinite(totalMinutes) || totalMinutes < 0) return `${Math.round(progressPercent)}%`;
  return `${formatTrainQueryDurationCompact(elapsedMinutes)}/${formatTrainQueryDurationCompact(totalMinutes)} (${Math.round(progressPercent)}%)`;
}

function getTraTrainQueryProgress(runtimeCtx, originDateStr){
  const startAbs = Number.isFinite(runtimeCtx?.firstAbsEff) ? runtimeCtx.firstAbsEff : runtimeCtx?.firstAbs;
  const lastAbs = Number.isFinite(runtimeCtx?.lastAbsEff) ? runtimeCtx.lastAbsEff : runtimeCtx?.lastAbs;
  let progressPercent = 0;
  if(originDateStr > runtimeCtx?.todayStr){
    progressPercent = 0;
  }else if(originDateStr < runtimeCtx?.todayStr && !runtimeCtx?.isActiveWindow){
    progressPercent = 100;
  }else if(Number.isFinite(startAbs) && Number.isFinite(lastAbs) && lastAbs > startAbs){
    progressPercent = ((Number(runtimeCtx?.nowAbs) - startAbs) / (lastAbs - startAbs)) * 100;
  }
  return Math.max(0, Math.min(100, progressPercent));
}

function findTraNextTimelineIndex(rows, nowAbs, delayMin, canNext){
  if(!canNext || !Array.isArray(rows) || !rows.length) return -1;
  const positiveDelay = Math.max(0, Number(delayMin) || 0);
  for(let i = 0; i < rows.length; i++){
    const eventAbs = rows[i]?.eventAbs;
    if(Number.isFinite(eventAbs) && Number.isFinite(nowAbs) && (eventAbs + positiveDelay) > nowAbs){
      return i;
    }
  }
  return rows.length ? rows.length - 1 : -1;
}

function isTraTimelineEventPassed(row, nowAbs, delayMin){
  const positiveDelay = Math.max(0, Number(delayMin) || 0);
  const eventAbs = row?.eventAbs;
  return Number.isFinite(eventAbs) && Number.isFinite(nowAbs) && (eventAbs + positiveDelay) <= nowAbs;
}

function normalizeTraNextTimelineIndex(rows, startIndex, nowAbs, delayMin, canNext){
  if(!canNext || !Array.isArray(rows) || !rows.length || !Number.isInteger(startIndex) || startIndex < 0) return startIndex;
  let index = startIndex;
  while(index < rows.length - 1 && isTraTimelineEventPassed(rows[index], nowAbs, delayMin)){
    index += 1;
  }
  return index;
}

function getNextTraStopIndex(rows, fromIndex, skipCurrentStop){
  if(!Array.isArray(rows) || fromIndex < 0) return -1;
  let startIndex = fromIndex;
  if(rows[fromIndex]?.kind === 'pass' || skipCurrentStop) startIndex = fromIndex + 1;
  for(let i = startIndex; i < rows.length; i++){
    if(rows[i]?.kind !== 'pass') return i;
  }
  return -1;
}

function buildTraTrainQueryV2StopRows(trainNo, originDateStr, stops, runtimeCtx, trainStatus, showPassStops, trainType){
  const firstStop = stops?.[0] || [];
  const lastStop = stops?.[stops.length - 1] || [];
  const firstTimeStr = (firstStop?.[2] || firstStop?.[1] || '');
  const lastTimeStr  = (lastStop?.[1] || lastStop?.[2] || '');
  const nowAbs = runtimeCtx?.nowAbs;
  const positiveDelay = Math.max(0, Number(runtimeCtx?.delayMin) || 0);
  const canNext =
    runtimeCtx?.isActiveWindow &&
    (!Number.isFinite(runtimeCtx?.lastAbsEff) || !Number.isFinite(nowAbs) || nowAbs <= (runtimeCtx.lastAbsEff + 5));
  const locationRows = buildTraTimelineRows(stops || [], true, trainType);
  const visibleRows = buildTraTimelineRows(stops || [], showPassStops, trainType);
  const runtimeLocationRows = buildTraEffectiveTimelineRows(locationRows, positiveDelay, trainType);
  const runtimeVisibleRows = buildTraEffectiveTimelineRows(visibleRows, positiveDelay, trainType);
  const liveProgress = getTraLiveTimelineProgress(trainNo, originDateStr, locationRows, visibleRows);
  const liveCanAdvanceTimeline = canAdvanceTraTimelineByLive(liveProgress);
  const trackerSnapshot = getTraTrackerSnapshot(trainNo, originDateStr);
  const originRuntimeRow = runtimeLocationRows.find((row)=>row?.kind === 'origin') || runtimeLocationRows[0] || null;
  const originStationName = originRuntimeRow?.station || firstStop?.[0] || trackerSnapshot?.currentFrom || '--';
  const originEffectiveDepartureAbs =
    Number.isFinite(originRuntimeRow?.depAbs)
      ? originRuntimeRow.depAbs
      : (Number.isFinite(originRuntimeRow?.primaryAbs)
          ? originRuntimeRow.primaryAbs
          : originRuntimeRow?.secondaryAbs);
  const originSoonToDepart =
    Number.isFinite(originEffectiveDepartureAbs) &&
    Number.isFinite(nowAbs) &&
    nowAbs >= (originEffectiveDepartureAbs - 10) &&
    nowAbs <= originEffectiveDepartureAbs;
  const trackerPreDepartureLock =
    !!trackerSnapshot &&
    Number.isFinite(originEffectiveDepartureAbs) &&
    Number.isFinite(nowAbs) &&
    nowAbs < originEffectiveDepartureAbs;
  const effectiveTrackerSnapshot = trackerPreDepartureLock
    ? {
        ...trackerSnapshot,
        state: 'upcoming',
        currentFrom: originStationName,
        currentTo: originStationName,
        nextStation: originStationName,
        soonStation: originStationName,
        soonKind: 'stop',
        nextStopStation: originStationName,
        locationText: `即將由 ${originStationName} 發車`,
        statusText: `${originSoonToDepart ? '即將發車' : '尚未發車'}`
      }
    : trackerSnapshot;
  if(effectiveTrackerSnapshot && !trackerPreDepartureLock){
    const trackerPassMinuteMap = buildTraTrackerPassMinuteMap(effectiveTrackerSnapshot);
    applyTraTrackerPassMinutes(runtimeLocationRows, trackerPassMinuteMap);
    applyTraTrackerPassMinutes(runtimeVisibleRows, trackerPassMinuteMap);
  }
  const trackerCurrentVisibleIndex = effectiveTrackerSnapshot
    ? findTraTimelineRowIndex(runtimeVisibleRows, effectiveTrackerSnapshot.currentFrom, effectiveTrackerSnapshot.state === 'running' ? null : false)
    : -1;
  const trackerSoonVisibleIndex = effectiveTrackerSnapshot
    ? (
        effectiveTrackerSnapshot.state === 'running'
          ? findTraTimelineRowIndex(runtimeVisibleRows, effectiveTrackerSnapshot.soonStation, effectiveTrackerSnapshot.soonKind === 'pass')
          : trackerCurrentVisibleIndex
      )
    : -1;
  const trackerNextStopVisibleIndex = effectiveTrackerSnapshot
    ? findTraTimelineRowIndex(runtimeVisibleRows, effectiveTrackerSnapshot.nextStopStation || effectiveTrackerSnapshot.nextStation, false)
    : -1;
  const trackerCurrentLocationIndex = effectiveTrackerSnapshot
    ? findTraTimelineRowIndex(runtimeLocationRows, effectiveTrackerSnapshot.currentFrom, effectiveTrackerSnapshot.state === 'running' ? null : false)
    : -1;
  const trackerSoonLocationIndex = effectiveTrackerSnapshot
    ? (
        effectiveTrackerSnapshot.state === 'running'
          ? findTraTimelineRowIndex(runtimeLocationRows, effectiveTrackerSnapshot.soonStation, effectiveTrackerSnapshot.soonKind === 'pass')
          : trackerCurrentLocationIndex
      )
    : -1;
  let nextLocationIndex = findTraNextTimelineIndex(runtimeLocationRows, nowAbs, 0, canNext);
  let nextVisibleIndex = findTraNextTimelineIndex(runtimeVisibleRows, nowAbs, 0, canNext);
  if(effectiveTrackerSnapshot && trackerSoonLocationIndex >= 0){
    nextLocationIndex = trackerSoonLocationIndex;
  }
  if(effectiveTrackerSnapshot && trackerSoonVisibleIndex >= 0){
    nextVisibleIndex = trackerSoonVisibleIndex;
  }
  if(canNext && liveCanAdvanceTimeline && (!Number.isInteger(nextLocationIndex) || nextLocationIndex < liveProgress.locationNextIndex)){
    nextLocationIndex = liveProgress.locationNextIndex;
  }
  if(canNext && liveCanAdvanceTimeline && liveProgress.visibleNextIndex >= 0 && (!Number.isInteger(nextVisibleIndex) || nextVisibleIndex < liveProgress.visibleNextIndex)){
    nextVisibleIndex = liveProgress.visibleNextIndex;
  }
  nextLocationIndex = normalizeTraNextTimelineIndex(runtimeLocationRows, nextLocationIndex, nowAbs, 0, canNext);
  nextVisibleIndex = normalizeTraNextTimelineIndex(runtimeVisibleRows, nextVisibleIndex, nowAbs, 0, canNext);
  const liveLocationRow = liveProgress.locationRowIndex >= 0 ? (runtimeLocationRows[liveProgress.locationRowIndex] || null) : null;
  const nextLocationRow = nextLocationIndex >= 0 ? (runtimeLocationRows[nextLocationIndex] || null) : null;
  const scheduledArrivalAbsRaw =
    Number.isFinite(nextLocationRow?.secondaryAbs)
      ? nextLocationRow.secondaryAbs
      : (nextLocationRow?.kind === 'terminal' ? nextLocationRow?.primaryAbs : null);
  const scheduledDepartureAbsRaw =
    Number.isFinite(nextLocationRow?.primaryAbs)
      ? nextLocationRow.primaryAbs
      : nextLocationRow?.secondaryAbs;
  const scheduledArrivalAbs = Number.isFinite(scheduledArrivalAbsRaw) ? scheduledArrivalAbsRaw : null;
  const scheduledDepartureAbs = Number.isFinite(scheduledDepartureAbsRaw) ? scheduledDepartureAbsRaw : null;
  const scheduledStopHoldActive =
    nextLocationRow?.kind !== 'pass' &&
    Number.isFinite(nowAbs) &&
    Number.isFinite(scheduledArrivalAbs) &&
    Number.isFinite(scheduledDepartureAbs) &&
    scheduledArrivalAbs <= nowAbs &&
    nowAbs < scheduledDepartureAbs;
  const liveStopDepartureAbs =
    canNext &&
    liveProgress.isStopStation &&
    liveLocationRow?.kind !== 'pass'
      ? (Number.isFinite(liveLocationRow?.primaryAbs) ? liveLocationRow.primaryAbs : liveLocationRow?.secondaryAbs)
      : null;
  const liveStopHoldActive =
    !!liveProgress.isStopStation &&
    liveLocationRow?.kind !== 'pass' &&
    Number.isFinite(liveStopDepartureAbs) &&
    Number.isFinite(nowAbs) &&
    nowAbs < liveStopDepartureAbs;
  const holdAtStopActive = scheduledStopHoldActive || liveStopHoldActive;
  const nextVisibleStopIndex = holdAtStopActive
    ? -1
    : (effectiveTrackerSnapshot && effectiveTrackerSnapshot.state === 'running' && effectiveTrackerSnapshot.soonKind === 'pass' && trackerNextStopVisibleIndex >= 0
        ? trackerNextStopVisibleIndex
        : getNextTraStopIndex(runtimeVisibleRows, nextVisibleIndex, false));
  const nextLocationStopIndex = holdAtStopActive ? -1 : getNextTraStopIndex(runtimeLocationRows, nextLocationIndex, false);
  const nextLocationStopRow = nextLocationStopIndex >= 0 ? (runtimeLocationRows[nextLocationStopIndex] || null) : null;
  const currentLocation = effectiveTrackerSnapshot?.locationText || getCurrentLocationText(
    stops,
    runtimeLocationRows,
    nextLocationIndex,
    trainStatus,
    canNext,
    nowAbs,
    0,
    liveProgress,
    holdAtStopActive
  );

  const ended =
    trainStatus === '已到終點' ||
    trainStatus === '已到終點站' ||
    (originDateStr && originDateStr < runtimeCtx?.todayStr && !runtimeCtx?.isActiveWindow);

  let nextHint = currentLocation || '--';
  if(effectiveTrackerSnapshot){
    if(effectiveTrackerSnapshot.state === 'upcoming'){
      nextHint = `${/即將發車/.test(String(effectiveTrackerSnapshot.statusText || '')) ? '即將發車' : '尚未發車'} · ${effectiveTrackerSnapshot.currentFrom || firstStop?.[0] || '--'}`;
    }else if(effectiveTrackerSnapshot.state === 'dwell'){
      nextHint = `停靠中 ${effectiveTrackerSnapshot.currentFrom || '--'}`;
    }else if(effectiveTrackerSnapshot.state === 'running'){
      nextHint = effectiveTrackerSnapshot.soonKind === 'pass'
        ? (effectiveTrackerSnapshot.nextStopStation
            ? `即將通過 ${effectiveTrackerSnapshot.soonStation} · 下一停靠 ${effectiveTrackerSnapshot.nextStopStation}`
            : `即將通過 ${effectiveTrackerSnapshot.soonStation}`)
        : `下一停靠 ${effectiveTrackerSnapshot.nextStopStation || effectiveTrackerSnapshot.soonStation || effectiveTrackerSnapshot.nextStation || '--'}`;
    }else if(effectiveTrackerSnapshot.state === 'arrived'){
      nextHint = `已抵達 ${effectiveTrackerSnapshot.currentTo || lastStop?.[0] || '--'}`;
    }
  }else if(trainStatus === '未發車'){
    const firstEventAbs = runtimeLocationRows[0]?.primaryAbs ?? runtimeLocationRows[0]?.secondaryAbs ?? runtimeLocationRows[0]?.eventAbs ?? null;
    const firstEventEff = Number.isFinite(firstEventAbs) ? firstEventAbs : null;
    const soonToDepart =
      Number.isFinite(firstEventEff) &&
      Number.isFinite(nowAbs) &&
      nowAbs >= (firstEventEff - 10) &&
      nowAbs <= firstEventEff;
    const liveAtOrigin = !!liveStopHoldActive && nextLocationIndex === 0;
    nextHint = `${(soonToDepart || liveAtOrigin) ? '即將發車' : '尚未發車'} · ${firstStop?.[0] || '--'}`;
  }else if(trainStatus === '已到終點' || trainStatus === '已到終點站'){
    nextHint = `已抵達 ${lastStop?.[0] || '--'}`;
  }else if(holdAtStopActive && nextLocationRow){
    nextHint = `停靠中 ${nextLocationRow.station || '--'}`;
  }else if(nextLocationRow){
    if(scheduledStopHoldActive){
      nextHint = `停靠中 ${nextLocationRow.station || '--'}`;
    }else if(nextLocationRow.kind === 'pass'){
        nextHint = nextLocationStopRow?.station
        ? `即將通過 ${nextLocationRow.station} · 下一停靠 ${nextLocationStopRow.station}`
        : `即將通過 ${nextLocationRow.station}`;
    }else{
      nextHint = `下一停靠 ${nextLocationRow.station || '--'}`;
    }
  }

  const hasTrackerTruth = !!effectiveTrackerSnapshot && ['upcoming','dwell','running','arrived'].includes(String(effectiveTrackerSnapshot.state || ''));
  const stopRows = visibleRows.map((row, index) => {
    const runtimeRow = runtimeVisibleRows[index] || row;
    const livePassedHere = liveProgress.visibleNextIndex >= 0 && index < liveProgress.visibleNextIndex;
    const runtimeArrivalAbs =
      Number.isFinite(runtimeRow?.arrAbs)
        ? runtimeRow.arrAbs
        : (Number.isFinite(runtimeRow?.secondaryAbs)
            ? runtimeRow.secondaryAbs
            : (runtimeRow?.kind === 'terminal' ? runtimeRow?.primaryAbs : null));
    const runtimeDepartureAbs =
      Number.isFinite(runtimeRow?.depAbs)
        ? runtimeRow.depAbs
        : (Number.isFinite(runtimeRow?.primaryAbs)
            ? runtimeRow.primaryAbs
            : runtimeRow?.secondaryAbs);
    const scheduledPassed =
      row.kind === 'pass'
        ? (Number.isFinite(runtimeRow?.eventAbs) && Number.isFinite(nowAbs) && nowAbs >= runtimeRow.eventAbs)
        : row.kind === 'terminal'
          ? (Number.isFinite(runtimeArrivalAbs) && Number.isFinite(nowAbs) && nowAbs >= runtimeArrivalAbs)
          : (Number.isFinite(runtimeDepartureAbs) && Number.isFinite(nowAbs) && nowAbs >= runtimeDepartureAbs);
    const trackerBoundaryIndex =
      effectiveTrackerSnapshot?.state === 'running'
        ? trackerSoonVisibleIndex
        : trackerCurrentVisibleIndex;
    const isPassed = hasTrackerTruth
      ? (
          effectiveTrackerSnapshot.state === 'arrived'
            ? (row.kind === 'terminal' ? true : index < runtimeVisibleRows.length)
            : (Number.isInteger(trackerBoundaryIndex) && trackerBoundaryIndex >= 0 ? index < trackerBoundaryIndex : (ended || livePassedHere || scheduledPassed))
        )
      : (ended || livePassedHere || scheduledPassed);
    const arrivalAbsRaw =
      Number.isFinite(row.arrAbs)
        ? row.arrAbs
        : (Number.isFinite(row.secondaryAbs)
            ? row.secondaryAbs
            : (row.kind === 'terminal' ? row.primaryAbs : null));
    const departureAbsRaw =
      Number.isFinite(row.depAbs)
        ? row.depAbs
        : (Number.isFinite(row.primaryAbs)
            ? row.primaryAbs
            : row.secondaryAbs);
    const arrivalAbs = Number.isFinite(runtimeArrivalAbs) ? runtimeArrivalAbs : null;
    const departureAbs = Number.isFinite(runtimeDepartureAbs) ? runtimeDepartureAbs : null;
    const isLiveOriginHold = liveStopHoldActive && index === 0 && liveProgress.visibleNextIndex === index;
    const isLiveCurrentStop =
      liveStopHoldActive &&
      row.kind !== 'pass' &&
      liveProgress.visibleNextIndex === index &&
      !isLiveOriginHold;
    const fallbackIsCurrent =
      (!isPassed &&
      row.kind !== 'pass' &&
      Number.isFinite(nowAbs) &&
      Number.isFinite(arrivalAbs) &&
      Number.isFinite(departureAbs) &&
      arrivalAbs <= nowAbs &&
      nowAbs < departureAbs) ||
      isLiveCurrentStop;
    const isTrackerOriginUpcoming =
      hasTrackerTruth &&
      effectiveTrackerSnapshot.state === 'upcoming' &&
      trackerCurrentVisibleIndex === index &&
      row.kind !== 'pass';
    const isCurrent = hasTrackerTruth
      ? (
          effectiveTrackerSnapshot.state === 'dwell' &&
          trackerCurrentVisibleIndex === index &&
          row.kind !== 'pass'
        )
      : fallbackIsCurrent;
    const fallbackIsNext = !isPassed && !isCurrent && nextVisibleIndex === index;
    const isNext = hasTrackerTruth
      ? (
          effectiveTrackerSnapshot.state === 'running' &&
          trackerSoonVisibleIndex === index
        )
      : fallbackIsNext;
    const fallbackIsNextStop = !isPassed && !isCurrent && !isNext && nextVisibleStopIndex === index;
    const isNextStop = hasTrackerTruth
      ? (
          effectiveTrackerSnapshot.state === 'running' &&
          effectiveTrackerSnapshot.soonKind === 'pass' &&
          trackerNextStopVisibleIndex >= 0 &&
          trackerNextStopVisibleIndex === index &&
          trackerNextStopVisibleIndex !== trackerSoonVisibleIndex
        )
      : fallbackIsNextStop;

    let arrHtml = '--';
    let depHtml = '--';

    if(row.kind === 'pass'){
      const passSched = row.secondaryText || row.passText || '--';
      const passSchedAbs = Number.isFinite(row?.eventAbs) ? row.eventAbs : null;
      const passResolvedAbs = Number.isFinite(runtimeRow?.eventAbs) ? runtimeRow.eventAbs : passSchedAbs;
      const passResolved = Number.isFinite(passResolvedAbs)
        ? formatAbsTime(passResolvedAbs)
        : (runtimeRow?.secondaryText || runtimeRow?.passText || passSched);
      const passHtml = isPassed
        ? escapeTrainQueryHtml(passSched)
        : renderResolvedTimeForTrainDetail(passSched, passResolved, { stackVertical: true }, passSchedAbs, passResolvedAbs, originDateStr);
      arrHtml = passHtml;
      depHtml = escapeTrainQueryHtml('-');
    }else if(row.kind === 'origin'){
      const arrSched = row.arrText || row.secondaryText || row.primaryText || '--';
      const depSched = row.depText || row.primaryText || row.secondaryText || '--';
      const arrTimeHtml = isPassed
        ? escapeTrainQueryHtml(arrSched)
        : renderTimeWithDelayForTrainDetail(arrSched, currentQueryDateStr, { stackVertical: true }, arrivalAbsRaw, originDateStr, runtimeCtx?.delayMin || 0);
      const depTimeHtml = isPassed
        ? escapeTrainQueryHtml(depSched)
        : renderTimeWithDelayForTrainDetail(depSched, currentQueryDateStr, { stackVertical: true }, departureAbsRaw, originDateStr, runtimeCtx?.delayMin || 0);
      arrHtml = arrTimeHtml;
      depHtml = depTimeHtml;
    }else if(row.kind === 'terminal'){
      const arrSched = row.arrText || row.primaryText || row.secondaryText || '--';
      const depSched = row.depText || row.secondaryText || row.primaryText || '--';
      const arrTimeHtml = isPassed
        ? escapeTrainQueryHtml(arrSched)
        : renderTimeWithDelayForTrainDetail(arrSched, currentQueryDateStr, { stackVertical: true }, arrivalAbsRaw, originDateStr, runtimeCtx?.delayMin || 0);
      const depTimeHtml = isPassed
        ? escapeTrainQueryHtml(depSched)
        : renderTimeWithDelayForTrainDetail(depSched, currentQueryDateStr, { stackVertical: true }, departureAbsRaw, originDateStr, runtimeCtx?.delayMin || 0);
      arrHtml = arrTimeHtml;
      depHtml = depTimeHtml;
    }else{
      const arrSched = row.arrText || row.secondaryText || row.primaryText || '--';
      const depSched = row.depText || row.primaryText || row.secondaryText || '--';
      arrHtml = isPassed
        ? escapeTrainQueryHtml(arrSched)
        : renderTimeWithDelayForTrainDetail(arrSched, currentQueryDateStr, { stackVertical: true }, arrivalAbsRaw, originDateStr, runtimeCtx?.delayMin || 0);
      depHtml = isPassed
        ? escapeTrainQueryHtml(depSched)
        : renderTimeWithDelayForTrainDetail(depSched, currentQueryDateStr, { stackVertical: true }, departureAbsRaw, originDateStr, runtimeCtx?.delayMin || 0);
    }

    let stateText = row.kind === 'pass' ? '通過' : '停靠';
    if(isTrackerOriginUpcoming && row.kind === 'origin'){
      stateText = '即將發車';
    }else if(isCurrent){
      stateText = '停靠中';
    }else if(isPassed){
      stateText = row.kind === 'pass' ? '已通過' : (row.kind === 'terminal' && ended ? '已到終點' : '已過站');
    }else if(trainStatus === '未發車' && row.kind === 'origin'){
      const originEventAbs = departureAbs;
      const soonToDepart =
        Number.isFinite(originEventAbs) &&
        Number.isFinite(nowAbs) &&
        nowAbs >= (originEventAbs - 10) &&
        nowAbs <= originEventAbs;
      stateText = (soonToDepart || isLiveOriginHold) ? '即將發車' : '尚未發車';
    }else if(isNext){
      stateText = row.kind === 'pass' ? '即將通過' : '下一停靠';
    }else if(isNextStop){
      stateText = '下一停靠';
    }

    const tone = /已過站|已通過|^通過$/.test(stateText)
      ? 'muted'
      : (/下一停靠|即將通過|即將發車|尚未發車|停靠中/.test(stateText) ? 'success' : 'neutral');

    return {
      seq: index + 1,
      station: row.station || '--',
      arrHtml,
      depHtml,
      stateText,
      stateTone: tone,
      isPassed,
      isCurrent,
      isNext,
      isPass: row.kind === 'pass'
    };
  });

  return { stopRows, currentLocation, nextHint };
}

function buildTraTrainQueryV2Data(trainNo, options){
  const opts = options || {};
  const showPassStops = !!opts.showPassStops;
  const t = baseSchedule[trainNo] || null;
  if(!t) return null;
  const stops = t['車站時間'] || [];
  if(!stops.length) return null;
  const firstStop = stops[0] || [];
  const lastStop = stops[stops.length - 1] || [];
  const first = splitArrDep(firstStop);
  const last = splitArrDep(lastStop);
  const depTime = first.dep || first.arr || '';
  const arrTime = last.arr || last.dep || '';
  const typeLabel = normalizeTraTypeDisplay(t['車種']);
  const directionLabel = getTraDirectionLabel(trainNo);
  const absAD = buildAbsArrDep(stops);
  const firstHeroAbs = absAD.absDep[0] ?? absAD.absArr[0] ?? null;
  const lastHeroAbs = absAD.absArr[stops.length - 1] ?? absAD.absDep[stops.length - 1] ?? null;
  const runtimeCtx = getTrainDetailRuntimeContext(
    trainNo,
    currentQueryDateStr,
    firstStop?.[2] || firstStop?.[1] || '',
    lastStop?.[1] || lastStop?.[2] || ''
  );
  const statusLabel = Number(runtimeCtx?.delayMin) < 0
    ? `提早${Math.abs(Number(runtimeCtx.delayMin))}分`
    : getTrainStatusLabel(
        trainNo,
        currentQueryDateStr,
        firstStop?.[2] || firstStop?.[1] || '',
        lastStop?.[1] || lastStop?.[2] || ''
      );
  const board = buildTraTrainQueryV2StopRows(trainNo, currentQueryDateStr, stops, runtimeCtx, statusLabel, showPassStops, typeLabel);
  const progressPercent = getTraTrainQueryProgress(runtimeCtx, currentQueryDateStr);
  const totalRunMinutes =
    Number.isFinite(runtimeCtx?.firstAbsEff) && Number.isFinite(runtimeCtx?.lastAbsEff)
      ? Math.max(0, runtimeCtx.lastAbsEff - runtimeCtx.firstAbsEff)
      : (Number.isFinite(runtimeCtx?.firstAbs) && Number.isFinite(runtimeCtx?.lastAbs)
          ? Math.max(0, runtimeCtx.lastAbs - runtimeCtx.firstAbs)
          : null);
  const startProgressAbs = Number.isFinite(runtimeCtx?.firstAbsEff) ? runtimeCtx.firstAbsEff : runtimeCtx?.firstAbs;
  const elapsedRunMinutes =
    Number.isFinite(totalRunMinutes) && Number.isFinite(startProgressAbs) && Number.isFinite(runtimeCtx?.nowAbs)
      ? Math.max(0, Math.min(totalRunMinutes, runtimeCtx.nowAbs - startProgressAbs))
      : 0;

  return {
    trainNo,
    systemLabel: '台鐵',

// ===== Modal: 列車詳情（顯示站別用開車優先，並且跨日顯示正確日期）（顯示站別用開車優先，並且跨日顯示正確日期） =====
  const modal=document.getElementById('trainModal');
  const modalClose=document.getElementById('modalClose');

  function closeModal(){
    if(modal) modal.style.display='none';
    modalCtx = null;
  }
  if(modalClose){ modalClose.addEventListener('click', closeModal); }
  if(modal){ modal.addEventListener('click',(e)=>{ if(e.target===modal) closeModal(); }); }
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape' && modal && modal.style.display==='flex') closeModal(); });

  function getTrainDetailRuntimeContext(trainNo, originDateStr, firstTimeStr, lastTimeStr){
    const todayStr = fmtDate(new Date());
    const yestStr  = addDays(todayStr, -1);
    const { firstAbs, lastAbs, crosses } = getFirstLastAbs(firstTimeStr, lastTimeStr);
    const nowAbs = getNowAbsFromOrigin(originDateStr || todayStr);
    const isTodayOrigin = originDateStr === todayStr;
    const isYesterdayOrigin = originDateStr === yestStr;

    let rawDelayMin = 0;
    if(trainNo && (isTodayOrigin || isYesterdayOrigin)){
      try{ if(typeof getDelayMinutes==='function') rawDelayMin = Number(getDelayMinutes(String(trainNo)) || 0); }catch(e){ rawDelayMin = 0; }
    }
    if(!Number.isFinite(rawDelayMin)) rawDelayMin = 0;

    const rawPositiveDelay = Math.max(0, rawDelayMin);
    const rawLastAbsEff = Number.isFinite(lastAbs) ? (lastAbs + rawPositiveDelay) : lastAbs;

    let prevCarryoverActive = false;
    if(isTodayOrigin){
      const prevOriginDate = addDays(todayStr, -1);
      const prevData = getScheduleByOrigin(trainNo, prevOriginDate);
      const prevStops = prevData?.['車站時間'] || [];
      if(prevStops.length){
        const prevFirstTimeStr = (prevStops[0]?.[2]||prevStops[0]?.[1]||'');
        const prevLastTimeStr  = (prevStops.slice(-1)[0]?.[1]||prevStops.slice(-1)[0]?.[2]||'');
        const prevRange = getFirstLastAbs(prevFirstTimeStr, prevLastTimeStr);
        const prevNowAbs = getNowAbsFromOrigin(prevOriginDate);
        const prevLastAbsEff = Number.isFinite(prevRange.lastAbs) ? (prevRange.lastAbs + rawPositiveDelay) : prevRange.lastAbs;
        const todayServiceStarted = Number.isFinite(firstAbs) && Number.isFinite(nowAbs) && nowAbs >= firstAbs;
        prevCarryoverActive =
          Number.isFinite(prevLastAbsEff) &&
          prevLastAbsEff >= 1440 &&
          Number.isFinite(prevNowAbs) &&
          prevNowAbs <= (prevLastAbsEff + 360) &&
          !todayServiceStarted;
      }
    }

    const ownsLiveInfo =
      (
        (isYesterdayOrigin && Number.isFinite(rawLastAbsEff) && rawLastAbsEff >= 1440 && Number.isFinite(nowAbs) && nowAbs <= (rawLastAbsEff + 360)) ||
        (isTodayOrigin && !prevCarryoverActive)
      );

    const delayMin = ownsLiveInfo ? rawDelayMin : 0;
    const positiveDelay = Math.max(0, delayMin);
    const firstAbsEff = Number.isFinite(firstAbs) ? (firstAbs + positiveDelay) : firstAbs;
    const lastAbsEff  = Number.isFinite(lastAbs ) ? (lastAbs  + positiveDelay) : lastAbs;
    const crossesEff = Number.isFinite(lastAbsEff) && lastAbsEff >= 1440;
    const isActiveWindow =
      (originDateStr === todayStr) ||
      (originDateStr === yestStr && crossesEff && Number.isFinite(nowAbs) && nowAbs <= (lastAbsEff + 360));

    return {
      todayStr,
      yestStr,
      firstAbs,
      lastAbs,
      crosses,
      nowAbs,
      ownsLiveInfo,
      delayMin,
      firstAbsEff,
      lastAbsEff,
      crossesEff,
      isActiveWindow
    };
  }

  function getAdjustedTimeForTrainDetail(schedHHMM, queryDateStr, baseAbsMin=null, originDateStr=null, delayMin=0){
    const sched = schedHHMM || '--';
    if(!delayMin){
      return {
        sched, adj: sched,
        adjMin: parseTime(sched),
        hasDelay: false,
        schedAbsMin: (baseAbsMin!=null ? baseAbsMin : parseTime(sched)),
        adjAbsMin: (baseAbsMin!=null ? baseAbsMin : parseTime(sched)),
        schedDateStr: (originDateStr && baseAbsMin!=null ? getStopDateStr(originDateStr, baseAbsMin) : null),
        adjDateStr: (originDateStr && baseAbsMin!=null ? getStopDateStr(originDateStr, baseAbsMin) : null)
      };
    }

    const adj = addMinutesToHHMM(sched, delayMin);
    const schedAbs = (baseAbsMin!=null ? baseAbsMin : parseTime(sched));
    const adjAbs = (baseAbsMin!=null ? (baseAbsMin + delayMin) : parseTime(adj));
    const schedDateStr = (originDateStr && baseAbsMin!=null ? getStopDateStr(originDateStr, baseAbsMin) : null);
    const adjDateStr   = (originDateStr && baseAbsMin!=null ? getStopDateStr(originDateStr, adjAbs) : null);
    return { sched, adj, adjMin: parseTime(adj), hasDelay: true, schedAbsMin: schedAbs, adjAbsMin: adjAbs, schedDateStr, adjDateStr };
  }

  function renderTimeWithDelayForTrainDetail(schedHHMM, queryDateStr, opts, baseAbsMin=null, originDateStr=null, delayMin=0){
    const t = getAdjustedTimeForTrainDetail(schedHHMM, queryDateStr, baseAbsMin, originDateStr, delayMin);
    if(!t.hasDelay) return (schedHHMM || '--');

    const suppress = !!(opts && opts.suppressStrike);
    const stackVertical = !!(opts && opts.stackVertical);
    if(suppress){
      return (t.sched || schedHHMM || '--');
    }

    let dayHint = '';
    if(t.adjDateStr && t.schedDateStr && t.adjDateStr !== t.schedDateStr){
      const md = t.adjDateStr.slice(5).replace('-', '/');
      dayHint = `<span style="margin-left:6px;color:var(--text-muted);font-weight:700;font-size:.78em;">${md}</span>`;
    }

    if(stackVertical){
      return `
        <span style="display:grid;gap:2px;justify-items:start;text-align:left;">
          <span style="text-decoration:line-through;color:var(--detail-time-muted-color,var(--text-muted));font-size:.92em;">
            ${t.sched}
          </span>
          <span style="font-weight:800;color:var(--detail-time-main-color,var(--text-main));">
            ${t.adj}${dayHint ? ` ${dayHint}` : ''}
          </span>
        </span>
      `;
    }

    return `
      <span style="text-decoration:line-through;color:var(--detail-time-muted-color,var(--text-muted));margin-right:6px;">
        ${t.sched}
      </span>
      <span style="font-weight:800;color:var(--detail-time-main-color,var(--text-main));">
        ${t.adj}
      </span>
      ${dayHint}
    `;
  }

  function renderResolvedTimeForTrainDetail(schedHHMM, resolvedHHMM, opts, schedAbsMin=null, resolvedAbsMin=null, originDateStr=null){
    const sched = schedHHMM || '--';
    const resolved = resolvedHHMM || sched;
    if(!resolved || resolved === sched) return sched;

    const stackVertical = !!(opts && opts.stackVertical);
    let dayHint = '';
    if(originDateStr && Number.isFinite(schedAbsMin) && Number.isFinite(resolvedAbsMin)){
      const schedDateStr = getStopDateStr(originDateStr, schedAbsMin);
      const resolvedDateStr = getStopDateStr(originDateStr, resolvedAbsMin);
      if(schedDateStr && resolvedDateStr && schedDateStr !== resolvedDateStr){
        const md = resolvedDateStr.slice(5).replace('-', '/');
        dayHint = `<span style="margin-left:6px;color:var(--text-muted);font-weight:700;font-size:.78em;">${md}</span>`;
      }
    }

    if(stackVertical){
      return `
        <span style="display:grid;gap:2px;justify-items:start;text-align:left;">
          <span style="text-decoration:line-through;color:var(--detail-time-muted-color,var(--text-muted));font-size:.92em;">
            ${sched}
          </span>
          <span style="font-weight:800;color:var(--detail-time-main-color,var(--text-main));">
            ${resolved}${dayHint ? ` ${dayHint}` : ''}
          </span>
        </span>
      `;
    }

    return `
      <span style="text-decoration:line-through;color:var(--detail-time-muted-color,var(--text-muted));margin-right:6px;">
        ${sched}
      </span>
      <span style="font-weight:800;color:var(--detail-time-main-color,var(--text-main));">
        ${resolved}
      </span>
      ${dayHint}
    `;
  }

  function getTrainDetailStatusLabel(trainNo, originDateStr, firstTimeStr, lastTimeStr, passedStationAbsOrTime, runtimeCtx){
    const ctx = runtimeCtx || getTrainDetailRuntimeContext(trainNo, originDateStr, firstTimeStr, lastTimeStr);

    if(originDateStr && originDateStr > ctx.todayStr) return '未發車';
    if(originDateStr && originDateStr < ctx.todayStr && !ctx.isActiveWindow) return '已到終點';

    let raw = '';
    if(ctx.ownsLiveInfo){
      try{ if(typeof getDelayStatus==='function') raw = getDelayStatus(String(trainNo)) || ''; }catch(e){ raw=''; }
    }
    if(raw && /停駛|取消|暫停|終止|運轉整理|截短|折返|部分停駛/i.test(raw)) return raw;

    const delayMin = ctx.delayMin;
    if(passedStationAbsOrTime !== null && passedStationAbsOrTime !== undefined){
      let passAbs = null;
      if(typeof passedStationAbsOrTime === 'number'){
        passAbs = passedStationAbsOrTime;
      }else if(typeof passedStationAbsOrTime === 'string'){
        passAbs = getAbsFromHHMMMaybeCross(passedStationAbsOrTime, ctx.firstAbs);
      }
      if(Number.isFinite(delayMin) && delayMin>0 && passAbs!==null && Number.isFinite(passAbs)) passAbs += Math.max(0, delayMin);
      if(passAbs !== null && Number.isFinite(passAbs) && Number.isFinite(ctx.nowAbs) && ctx.nowAbs >= passAbs){
        return '已過站';
      }
    }

    if(ctx.firstAbs !== null && Number.isFinite(ctx.firstAbs) && Number.isFinite(ctx.nowAbs) && ctx.nowAbs < ctx.firstAbsEff) return '未發車';
    if(ctx.lastAbs !== null && Number.isFinite(ctx.lastAbs) && Number.isFinite(ctx.nowAbs) && ctx.nowAbs > (ctx.lastAbsEff + 10)) return '已到終點';
    if(!ctx.isActiveWindow) return '準點';
    if(Number.isFinite(delayMin) && delayMin > 0) return `晚${delayMin}分`;
    return '準點';
  }

  function showTrainDetails(trainNo, originDateStr, options){
    const showPassStops = !!(options && options.showPassStops);
    modalCtx = { trainNo, originDate: originDateStr, showPassStops };

    const t = getScheduleByOrigin(trainNo, originDateStr);
    if(!t) return;

    const arr=t['車站時間']||[];
    if(!arr.length) return;

    const firstStation = arr[0]?.[0] || '';
    const lastStation = arr[arr.length - 1]?.[0] || '';
    const firstStop = splitArrDep(arr[0] || []);
    const lastStop = splitArrDep(arr[arr.length - 1] || []);
    const trainType = normalizeTraTypeDisplay(t['車種'] || '');
    const firstDep = firstStop.dep || firstStop.arr || '--';
    const lastArr = lastStop.arr || lastStop.dep || '--';
    const firstTimeStr = (arr[0]?.[2]||arr[0]?.[1]||'');
    const lastTimeStr = (arr.slice(-1)[0]?.[1]||arr.slice(-1)[0]?.[2]||'');
    const runtimeCtx = getTrainDetailRuntimeContext(trainNo, originDateStr, firstTimeStr, lastTimeStr);
    const status = getTrainDetailStatusLabel(
      trainNo,
      originDateStr,
      firstTimeStr,
      lastTimeStr,
      null,
      runtimeCtx
    );

    const body=document.getElementById('modalBody');
    const abs = buildAbsMinutes(arr);
    const absAD = buildAbsArrDep(arr);
    const firstHeroAbs = absAD.absDep[0] ?? absAD.absArr[0] ?? abs?.[0]?.abs ?? null;
    const lastHeroAbs = absAD.absArr[arr.length - 1] ?? absAD.absDep[arr.length - 1] ?? abs?.[arr.length - 1]?.abs ?? null;

    const nowAbs = runtimeCtx.nowAbs;
    const delayMin = runtimeCtx.delayMin;
    const delayedLastAbs = runtimeCtx.lastAbsEff;
    const isActiveWindow = runtimeCtx.isActiveWindow;

    // 下一站：到終點超過 5 分後不再標示
    const canNext =
      isActiveWindow &&
      (!Number.isFinite(delayedLastAbs) || !Number.isFinite(nowAbs) || nowAbs <= (delayedLastAbs + 5));

    const locationRows = buildTraTimelineRows(arr, true, trainType);
    const visibleTimelineRows = buildTraTimelineRows(arr, showPassStops, trainType);
    const runtimeLocationRows = buildTraEffectiveTimelineRows(locationRows, Math.max(0, delayMin), trainType, { trainNo, originDateStr });
    const runtimeVisibleTimelineRows = buildTraEffectiveTimelineRows(visibleTimelineRows, Math.max(0, delayMin), trainType, { trainNo, originDateStr });
    const liveProgress = getTraLiveTimelineProgress(trainNo, originDateStr, locationRows, visibleTimelineRows);
    const liveCanAdvanceTimeline = canAdvanceTraTimelineByLive(liveProgress);
    let nextLocationIndex=-1;
    if(canNext){
      for(let i=0;i<runtimeLocationRows.length;i++){
        const a = runtimeLocationRows[i]?.eventAbs;
        if(a!==null && a!==undefined && Number.isFinite(a) && Number.isFinite(nowAbs) && a > nowAbs){
          nextLocationIndex=i; break;
        }
      }
      if(nextLocationIndex===-1 && runtimeLocationRows.length) nextLocationIndex = runtimeLocationRows.length-1;
      if(liveCanAdvanceTimeline && liveProgress.locationNextIndex >= 0 && nextLocationIndex < liveProgress.locationNextIndex){
        nextLocationIndex = liveProgress.locationNextIndex;
      }
    }
    nextLocationIndex = normalizeTraNextTimelineIndex(runtimeLocationRows, nextLocationIndex, nowAbs, 0, canNext);
    const liveLocationRow = liveProgress.locationRowIndex >= 0 ? (runtimeLocationRows[liveProgress.locationRowIndex] || null) : null;
    const nextLocationRow = nextLocationIndex >= 0 ? (runtimeLocationRows[nextLocationIndex] || null) : null;
    const scheduledArrivalAbsRaw =
      Number.isFinite(nextLocationRow?.secondaryAbs)
        ? nextLocationRow.secondaryAbs
        : (nextLocationRow?.kind === 'terminal' ? nextLocationRow?.primaryAbs : null);
    const scheduledDepartureAbsRaw =
      Number.isFinite(nextLocationRow?.primaryAbs)
        ? nextLocationRow.primaryAbs
        : nextLocationRow?.secondaryAbs;
    const scheduledArrivalAbs = Number.isFinite(scheduledArrivalAbsRaw) ? scheduledArrivalAbsRaw : null;
    const scheduledDepartureAbs = Number.isFinite(scheduledDepartureAbsRaw) ? scheduledDepartureAbsRaw : null;
    const scheduledStopHoldActive =
      nextLocationRow?.kind !== 'pass' &&
      Number.isFinite(nowAbs) &&
      Number.isFinite(scheduledArrivalAbs) &&
      Number.isFinite(scheduledDepartureAbs) &&
      scheduledArrivalAbs <= nowAbs &&
      nowAbs < scheduledDepartureAbs;
    const liveStopDepartureAbs =
      canNext &&
      liveProgress.isStopStation &&
      liveLocationRow?.kind !== 'pass'
        ? (Number.isFinite(liveLocationRow?.primaryAbs) ? liveLocationRow.primaryAbs : liveLocationRow?.secondaryAbs)
        : null;
    const liveStopHoldActive =
      !!liveProgress.isStopStation &&
      liveLocationRow?.kind !== 'pass' &&
      Number.isFinite(liveStopDepartureAbs) &&
      Number.isFinite(nowAbs) &&
      nowAbs < liveStopDepartureAbs;
    const holdAtStopActive = scheduledStopHoldActive || liveStopHoldActive;

    const scheduledCrossDayInfo = getCrossDayInfo(arr);
    const crossDayInfo =
      (!scheduledCrossDayInfo.crosses && runtimeCtx.crossesEff)
        ? { crosses: true, label: '延誤跨日 · 次日到達' }
        : scheduledCrossDayInfo;
    const detailBoard = buildTraTrainQueryV2StopRows(trainNo, originDateStr, arr, runtimeCtx, status, showPassStops, trainType);
    const detailStateRows = Array.isArray(detailBoard?.stopRows) ? detailBoard.stopRows : [];
    const detailHintPriority = ['停靠中', '即將通過', '即將發車', '尚未發車', '下一停靠'];
    const detailPrimaryHintIndex = detailHintPriority.reduce((found, label)=>{
      if(found >= 0) return found;
      return detailStateRows.findIndex((row)=>String(row?.stateText || '') === label);
    }, -1);
    const currentLocation = detailBoard?.currentLocation || getCurrentLocationText(arr, runtimeLocationRows, nextLocationIndex, status, canNext, nowAbs, 0, liveProgress, holdAtStopActive);
    const timelineRows = runtimeVisibleTimelineRows;

    document.getElementById('modalTitleMain').innerHTML = `
      <span class="modal-brand-tag">TR</span>
      <span class="modal-train-no">${trainNo}</span>
      ${renderTrainTypeText(t['車種'] || '列車')}
    `;
    document.getElementById('modalTitleSub').innerHTML = `
      <div class="modal-meta-line">
        <span>${firstStation} → ${lastStation}</span>
        <span class="modal-meta-sep">·</span>
        <span>發車日 ${originDateStr}</span>
        <span class="modal-meta-sep">·</span>
        <span>狀態 ${statusBadge(status)}</span>
      </div>
    `;

    body.innerHTML = `
      <section class="modal-hero">
        <div class="modal-route-strip">
          <div class="modal-route-point route-start">
            <span>${firstStation}</span>
            <strong>${renderTimeWithDelayForTrainDetail(firstDep, currentQueryDateStr, null, firstHeroAbs, originDateStr, delayMin)}</strong>
          </div>
          <div class="modal-route-line"></div>
          <div class="modal-route-point route-end">
            <strong>${renderTimeWithDelayForTrainDetail(lastArr, currentQueryDateStr, null, lastHeroAbs, originDateStr, delayMin)}</strong>
            <span>${lastStation}</span>
          </div>
        </div>
        <div class="modal-stats">
          <div class="modal-stat"><span>車程</span><strong>${getTravelTextFromStops(arr)}</strong></div>
          <div class="modal-stat"><span>中途</span><strong>${Math.max(0, arr.length - 2)} 站</strong></div>
          <div class="modal-stat"><span>目前位置</span><strong>${currentLocation}</strong></div>
          <div class="modal-stat"><span>跨日</span><strong>${crossDayInfo.label}</strong></div>
        </div>
      </section>
      <section class="modal-section modal-timeline-card">
        <div class="modal-timeline-tools">
          <div class="modal-timeline-copy">
            <div class="modal-timeline-title">停靠時間軸</div>
            <div class="modal-timeline-subtitle">${showPassStops ? '含通過站顯示' : '只顯示實際停靠站'}</div>
          </div>
          <button type="button" class="modal-toggle-btn" id="modalPassToggle">${showPassStops ? '隱藏通過站' : '查看通過站'}</button>
        </div>
        <div class="modal-timeline-body">${renderTraDetailStopTable(detailStateRows, detailPrimaryHintIndex)}</div>
      </section>
    `;
    body.querySelector('#modalPassToggle')?.addEventListener('click', ()=>{
      if(!modalCtx) return;
      showTrainDetails(modalCtx.trainNo, modalCtx.originDate, { showPassStops: !modalCtx.showPassStops });
    });
    modal.style.display='flex';

  function buildTimelineForTrain(trainNo, originDateStr, arr, transferStation){
    const timeline = document.createElement('div');
    timeline.className = 'timeline';

    const abs = buildAbsMinutes(arr);
    const absAD = buildAbsArrDep(arr);

    const firstTimeStr = (arr?.[0]?.[2]||arr?.[0]?.[1]||'');
    const lastTimeStr  = (arr?.slice(-1)?.[0]?.[1]||arr?.slice(-1)?.[0]?.[2]||'');
    const runtimeCtx = getTrainDetailRuntimeContext(trainNo, originDateStr, firstTimeStr, lastTimeStr);
    const nowAbs = runtimeCtx.nowAbs;
    const isActiveWindow = runtimeCtx.isActiveWindow;

    const canNext =
      isActiveWindow &&
      (!Number.isFinite(runtimeCtx.lastAbsEff) || !Number.isFinite(nowAbs) || nowAbs <= (runtimeCtx.lastAbsEff + 5));

    // 用誤點分鐘修正「下一站/已過站」判斷（避免誤點時提前跳站）
    const delayMin = runtimeCtx.delayMin;

    let nextIndex = -1;
    if(canNext){
      for(let i=0;i<arr.length;i++){
        const a = abs?.[i]?.abs;
        if(a!==null && a!==undefined && Number.isFinite(a) && Number.isFinite(nowAbs) && (a + Math.max(0,delayMin)) > nowAbs){
          nextIndex=i; break;
        }
      }
      if(nextIndex===-1) nextIndex = arr.length-1;
    }

    arr.forEach((s, i)=>{
      const item = document.createElement('div');
      item.className = 'timeline-item';

      const ad = splitArrDep(s);
      const depTime = ad.dep || ad.arr || '--';
      const arrTime = ad.arr || '';
      const depAbs = absAD.absDep[i] ?? absAD.absArr[i] ?? abs?.[i]?.abs ?? null;
      const arrAbs = absAD.absArr[i] ?? absAD.absDep[i] ?? abs?.[i]?.abs ?? null;

      const passedHere = canNext && (nextIndex===-1 ? false : i < nextIndex);

      let depHTML, arrHTML;
      if(passedHere){
        depHTML = `<span style="color:var(--text-muted);">${depTime}</span>`;
        arrHTML = arrTime ? `<span style="color:var(--text-muted);">${arrTime}</span>` : '';
      }else{
        depHTML = renderTimeWithDelay(trainNo, depTime, currentQueryDateStr, null, depAbs, originDateStr);
        arrHTML = arrTime ? renderTimeWithDelay(trainNo, arrTime, currentQueryDateStr, null, arrAbs, originDateStr) : '';
      }

      const badgeNext = (canNext && i===nextIndex) ? ` <span class="badge-next">下一站</span>` : '';
      const badgeXfer = (transferStation && s[0]===transferStation) ? ` <span class="badge-xfer">轉乘</span>` : '';
      const tag = (i===0) ? '起站' : (i===arr.length-1 ? '終點' : '');

      item.innerHTML = `
        <div class="tl-time">${depHTML}</div>
        <div class="tl-marker">
          <div class="tl-dot"></div>
          <div class="tl-line"></div>
        </div>
        <div class="tl-content">
          <div class="tl-station"><span>${s[0]}</span>${arrHTML?`<span class="st-arr">${arrHTML}</span>`:""}${badgeXfer}${badgeNext}</div>
          ${tag ? `<div class="tl-desc">${tag}</div>` : ''}
        </div>
      `;

      if(transferStation && s[0]===transferStation) item.classList.add('transfer');
      if(canNext){
        if(i<nextIndex) item.classList.add('passed');
        if(i===nextIndex) item.classList.add('next');
      }
      timeline.appendChild(item);
    });

    return timeline;
  }

function initStartEndSorting(){
    const dep = document.getElementById('sortDepIcon');
    const arr = document.getElementById('sortArrIcon');

  function toggleSort(key){
    if(startEndSortState.key === key){
      startEndSortState.dir *= -1;
    }else{
      startEndSortState.key = key;
      startEndSortState.dir = 1;
    }

    const accept = !!document.getElementById('acceptTransfers')?.checked;

    if(accept){
      sortStartEndListInPlace(currentTransferList, startEndSortState);
      renderTransferTable();
    }else{
      sortStartEndListInPlace(currentStartEndList, startEndSortState);
      renderStartEndTable();
    }

    updateStartEndSortIcons();
  }

  function sortStartEndListInPlace(list, state){
    if(!Array.isArray(list) || !state?.key) return;
    const dir = state.dir || 1;
    const key = state.key;

    const get = (r)=>{
      if(key === 'dep') return (r.depSortMin ?? 9999);
      if(key === 'arr') return (r.arrSortMin ?? 9999);
      if(key === 'dur') return (r.travelMin ?? 999999);
      return 999999;
    };

    list.sort((a,b)=> (get(a) - get(b)) * dir );
  }

  function updateStartEndSortIcons(){
    const dep = document.getElementById('sortDepIcon');
    const arr = document.getElementById('sortArrIcon');
    const dur = document.getElementById('sortDurIcon');
    if(!dep || !arr || !dur) return;

    const icon = (k)=>{
      if(startEndSortState.key !== k) return '↕';
      return startEndSortState.dir === 1 ? '↑' : '↓';
    };

    dep.textContent = icon('dep');
    arr.textContent = icon('arr');
    dur.textContent = icon('dur');
  }

function persistSharedHomeGeoSnapshot(coords, source = 'tr') {
    const lat = Number(coords?.latitude ?? coords?.lat);
    const lon = Number(coords?.longitude ?? coords?.lon);
    const accuracy = Number(coords?.accuracy);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    try {
        localStorage.setItem(HOME_SHARED_GEO_KEY, JSON.stringify({
            lat,
            lon,
            accuracy: Number.isFinite(accuracy) && accuracy >= 0 ? accuracy : null,
            source,
            ts: Date.now()
        }));
    } catch (_) {}
}

function readSharedHomeGeoSnapshot(maxAgeMs = 15 * 60 * 1000) {
    try {
        const raw = JSON.parse(localStorage.getItem(HOME_SHARED_GEO_KEY) || 'null');
        const lat = Number(raw?.lat);
        const lon = Number(raw?.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
        const ts = Number(raw?.ts);
        if (Number.isFinite(ts) && maxAgeMs > 0 && (Date.now() - ts) > maxAgeMs) return null;
        return {
            lat,
            lon,
            accuracy: Number(raw?.accuracy),
            ts: Number.isFinite(ts) ? ts : Date.now(),
            source: String(raw?.source || 'shared')
        };
    } catch (_) {
        return null;
    }
}

function buildSharedGeoFallbackSamples(targetCount = 3) {
    const snapshot = readSharedHomeGeoSnapshot();
    if (!snapshot) return null;
    const count = Math.max(1, Number(targetCount) || 1);
    return Array.from({ length: count }, (_, index) => ({
        coords: {
            latitude: snapshot.lat,
            longitude: snapshot.lon,
            accuracy: Number.isFinite(snapshot.accuracy) && snapshot.accuracy >= 0 ? snapshot.accuracy : 80
        },
        timestamp: snapshot.ts + index
    }));
}

function getGeoDistanceKm(lat1, lon1, lat2, lon2) {
    const toRad = (value) => (Number(value) * Math.PI) / 180;
    const R = 6371;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function interpolateGeoPoint(fromPoint, toPoint, ratio) {
    const r = Math.max(0, Math.min(1, Number(ratio) || 0));
    return {
        lat: fromPoint.lat + ((toPoint.lat - fromPoint.lat) * r),
        lon: fromPoint.lon + ((toPoint.lon - fromPoint.lon) * r)
    };
}

function buildGeoPathProfile(pathNames, resolveGeoItem, resolveScalar) {
    const points = [];
    let cumulative = 0;
    let previous = null;
    (Array.isArray(pathNames) ? pathNames : []).forEach((name) => {
        const geo = resolveGeoItem?.(name);
        if (!geo) return;
        const explicitScalar = resolveScalar ? Number(resolveScalar(name)) : NaN;
        if (previous) {
            if (Number.isFinite(explicitScalar) && Number.isFinite(previous.rawScalar)) {
                cumulative += Math.abs(explicitScalar - previous.rawScalar);
            } else {
                cumulative += getGeoDistanceKm(previous.lat, previous.lon, geo.lat, geo.lon);
            }
        }
        const point = { name, lat: geo.lat, lon: geo.lon, scalar: cumulative };
        if (Number.isFinite(explicitScalar)) point.rawScalar = explicitScalar;
        points.push(point);
        previous = point;
    });
    return points;
}

function interpolatePointOnProfile(profile, ratio) {
    const points = Array.isArray(profile) ? profile : [];
    if (!points.length) return null;
    if (points.length === 1) return { lat: points[0].lat, lon: points[0].lon, pathPoints: points };
    const firstScalar = Number(points[0].scalar);
    const lastScalar = Number(points[points.length - 1].scalar);
    const span = lastScalar - firstScalar;
    if (!Number.isFinite(span) || span <= 0) {
        const fallback = interpolateGeoPoint(points[0], points[points.length - 1], ratio);
        return { ...fallback, pathPoints: points };
    }
    const targetScalar = firstScalar + (span * Math.max(0, Math.min(1, Number(ratio) || 0)));
    for (let i = 0; i < points.length - 1; i++) {
        const from = points[i];
        const to = points[i + 1];
        const fromScalar = Number(from.scalar);
        const toScalar = Number(to.scalar);
        if (!Number.isFinite(fromScalar) || !Number.isFinite(toScalar) || toScalar < fromScalar) continue;
        if (targetScalar < fromScalar || targetScalar > toScalar) continue;
        const localRatio = toScalar === fromScalar ? 0 : ((targetScalar - fromScalar) / (toScalar - fromScalar));
        return { ...interpolateGeoPoint(from, to, localRatio), pathPoints: points };
    }
    return { lat: points[points.length - 1].lat, lon: points[points.length - 1].lon, pathPoints: points };
}

function locatePointOnProfileSegment(profile, ratio, makeSegmentKey, segmentMap) {
    const points = Array.isArray(profile) ? profile : [];
    if (!points.length) return null;
    if (points.length === 1) {
        return {
            lat: points[0].lat,
            lon: points[0].lon,
            pathPoints: points,
            kind: 'station',
            stationName: points[0].name
        };
    }
    const firstScalar = Number(points[0].scalar);
    const lastScalar = Number(points[points.length - 1].scalar);
    const span = lastScalar - firstScalar;
    if (!Number.isFinite(span) || span <= 0) {
        const fallback = interpolateGeoPoint(points[0], points[points.length - 1], ratio);
        const segmentKey = makeSegmentKey?.(points[0]?.name, points[points.length - 1]?.name) || '';
        return {
            ...fallback,
            pathPoints: points,
            kind: 'segment',
            segmentKey,
            segmentRatio: Math.max(0, Math.min(1, Number(ratio) || 0))
        };
    }
    const targetScalar = firstScalar + (span * Math.max(0, Math.min(1, Number(ratio) || 0)));
    for (let i = 0; i < points.length - 1; i++) {
        const from = points[i];
        const to = points[i + 1];
        const fromScalar = Number(from.scalar);
        const toScalar = Number(to.scalar);
        if (!Number.isFinite(fromScalar) || !Number.isFinite(toScalar) || toScalar < fromScalar) continue;
        if (targetScalar < fromScalar || targetScalar > toScalar) continue;
        const localRatio = toScalar === fromScalar ? 0 : ((targetScalar - fromScalar) / (toScalar - fromScalar));
        const segmentKey = makeSegmentKey?.(from.name, to.name) || '';
        const segment = segmentMap?.get(segmentKey) || null;
        const segmentRatio = !segment
            ? localRatio
            : (segment.fromName === from.name && segment.toName === to.name ? localRatio : (1 - localRatio));
        return {
            ...interpolateGeoPoint(from, to, localRatio),
            pathPoints: points,
            kind: 'segment',
            segmentKey,
            segmentRatio,
            segment
        };
    }
    return {
        lat: points[points.length - 1].lat,
        lon: points[points.length - 1].lon,
        pathPoints: points,
        kind: 'station',
        stationName: points[points.length - 1].name
    };
}

function projectPointToGeoSegment(lat, lon, fromPoint, toPoint) {
    if (!fromPoint || !toPoint) return null;
    const refLat = Number(fromPoint.lat);
    const meanLat = ((Number(fromPoint.lat) + Number(toPoint.lat) + Number(lat)) / 3);
    const kmPerLat = 111.32;
    const kmPerLon = 111.32 * Math.cos((meanLat * Math.PI) / 180);
    const px = (Number(lon) - Number(fromPoint.lon)) * kmPerLon;
    const py = (Number(lat) - refLat) * kmPerLat;
    const bx = (Number(toPoint.lon) - Number(fromPoint.lon)) * kmPerLon;
    const by = (Number(toPoint.lat) - refLat) * kmPerLat;
    const len2 = (bx * bx) + (by * by);
    const ratio = len2 > 0 ? Math.max(0, Math.min(1, ((px * bx) + (py * by)) / len2)) : 0;
    const projX = bx * ratio;
    const projY = by * ratio;
    return {
        ratio,
        lat: fromPoint.lat + ((toPoint.lat - fromPoint.lat) * ratio),
        lon: fromPoint.lon + ((toPoint.lon - fromPoint.lon) * ratio),
        distanceKm: Math.hypot(px - projX, py - projY)
    };
}

function getMedianNumber(values) {
    const list = (Array.isArray(values) ? values : []).filter((value) => Number.isFinite(value)).sort((a, b) => a - b);
    if (!list.length) return null;
    const middle = Math.floor(list.length / 2);
    return list.length % 2 ? list[middle] : ((list[middle - 1] + list[middle]) / 2);
}

function getPolylineMinDistanceKm(lat, lon, pathPoints) {
    const points = Array.isArray(pathPoints) ? pathPoints : [];
    if (!points.length) return Infinity;
    const refLat = Number(lat);
    const toXY = (point) => {
        const meanLat = (refLat + Number(point.lat)) / 2;
        const kmPerLat = 111.32;
        const kmPerLon = 111.32 * Math.cos((meanLat * Math.PI) / 180);
        return {
            x: (Number(point.lon) - Number(lon)) * kmPerLon,
            y: (Number(point.lat) - refLat) * kmPerLat
        };
    };
    const pointDistance = (point) => Math.hypot(toXY(point).x, toXY(point).y);
    if (points.length === 1) return pointDistance(points[0]);
    let minDistance = Infinity;
    for (let i = 0; i < points.length - 1; i++) {
        const a = toXY(points[i]);
        const b = toXY(points[i + 1]);
        const abx = b.x - a.x;
        const aby = b.y - a.y;
        const len2 = (abx * abx) + (aby * aby);
        let t = 0;
        if (len2 > 0) {
            t = Math.max(0, Math.min(1, (-(a.x * abx) - (a.y * aby)) / len2));
        }
        const projX = a.x + (abx * t);
        const projY = a.y + (aby * t);
        minDistance = Math.min(minDistance, Math.hypot(projX, projY));
    }
    return minDistance;
}

function getGeoLocateError(error, fallbackMessage) {
    const code = Number(error?.code);
    if (code === 1) return new Error('請允許定位權限');
    if (code === 2) return new Error('目前無法取得可用定位，請確認裝置已開啟定位服務');
    if (code === 3) return new Error('定位逾時，請到訊號較好的地方再試一次');
    const message = String(error?.message || fallbackMessage || '定位失敗，請稍後再試').trim();
    return new Error(message || '定位失敗，請稍後再試');
}

function getBrowserGeoPosition() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            reject(getGeoLocateError(null, '瀏覽器不支援定位'));
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (position) => {
                persistSharedHomeGeoSnapshot(position?.coords, 'tr-browser');
                resolve(position);
            },
            (error) => reject(getGeoLocateError(error, '無法取得目前位置')),
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
    });
}

function collectGeoPositionSamples(options = {}) {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            const fallbackSamples = buildSharedGeoFallbackSamples(Number(options.targetCount) || 3);
            if (fallbackSamples?.length) {
                resolve(fallbackSamples);
                return;
            }
            reject(getGeoLocateError(null, '瀏覽器不支援定位'));
            return;
        }
        const durationMs = Math.max(2600, Number(options.durationMs) || 3200);
        const targetCount = Math.max(2, Number(options.targetCount) || 3);
        const samples = [];
        let finished = false;
        let watchId = null;
        let timer = null;
        let lastError = null;
        const done = (error) => {
            if (finished) return;
            finished = true;
            if (timer) clearTimeout(timer);
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (samples.length) {
                persistSharedHomeGeoSnapshot(samples[samples.length - 1]?.coords, 'tr-watch');
                resolve(samples.slice(0, targetCount));
                return;
            }
            const fallbackSamples = buildSharedGeoFallbackSamples(targetCount);
            if (fallbackSamples?.length) {
                resolve(fallbackSamples);
                return;
            }
            reject(getGeoLocateError(error || lastError, '無法取得目前位置'));
        };
        watchId = navigator.geolocation.watchPosition(
            (position) => {
                const ts = Number(position?.timestamp) || Date.now();
                const lastTs = samples.length ? Number(samples[samples.length - 1]?.timestamp || 0) : 0;
                if (lastTs && (ts - lastTs) < 650) {
                    samples[samples.length - 1] = position;
                } else {
                    samples.push(position);
                }
                if (samples.length >= targetCount) done();
            },
            (error) => {
                lastError = error;
                if (Number(error?.code) === 1) {
                    const fallbackSamples = buildSharedGeoFallbackSamples(targetCount);
                    if (fallbackSamples?.length) {
                        done();
                    }
                }
            },
            { enableHighAccuracy: true, timeout: durationMs, maximumAge: 0 }
        );
        timer = setTimeout(() => done(samples.length ? null : getGeoLocateError(lastError, '定位逾時，請到訊號較好的地方再試一次')), durationMs + 600);
    });
}

function setGeoButtonBusy(button, busy) {
    if (!button) return;
    if (!button.dataset.desktopLabel) button.dataset.desktopLabel = button.textContent || '';
    button.disabled = !!busy;
    const mobile = !!(window.matchMedia && window.matchMedia('(max-width: 720px)').matches);
    const idleLabel = mobile && button.dataset.mobileLabel
        ? button.dataset.mobileLabel
        : (button.dataset.desktopLabel || button.textContent || '');
    button.textContent = busy ? '…' : (idleLabel || '📍');
}

function syncGeoButtonLabel(button) {
    if (!button || button.disabled) return;
    const mobile = !!(window.matchMedia && window.matchMedia('(max-width: 720px)').matches);
    button.textContent = (mobile && button.dataset.mobileLabel)
        ? button.dataset.mobileLabel
        : (button.dataset.desktopLabel || button.textContent || '📍');
}

function installGeoButtonResizeSync() {
    if (window.__traGeoButtonResizeSyncInstalled) return;
    window.__traGeoButtonResizeSyncInstalled = true;
    window.addEventListener('resize', () => {
        document.querySelectorAll('.rail-geo-btn').forEach(syncGeoButtonLabel);
    });
}

function ensureGeoInlineButton(inputId, options = {}) {
    const input = document.getElementById(inputId);
    if (!input) return null;
    const wrap = input.closest('.rod2-wrap, .rsv2-input-wrap, .rtq2-input-wrap, .input-group');
    if (!wrap) return null;
    const key = String(options.key || inputId);
    const existing = wrap.querySelector(`.rail-geo-btn[data-geo-key="${key}"]`);
    if (existing) return existing;
    wrap.classList.add('rail-geo-input-host');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'rail-geo-btn';
    button.dataset.geoKey = key;
    button.dataset.kind = options.kind || 'station';
    const desktopLabel = options.icon || '📍';
    const mobileLabel = options.mobileIcon || desktopLabel;
    button.dataset.desktopLabel = desktopLabel;
    button.dataset.mobileLabel = mobileLabel;
    button.title = options.title || desktopLabel || '定位';
    button.setAttribute('aria-label', options.title || desktopLabel || '定位');
    button.textContent = desktopLabel;
    button.addEventListener('click', async (event) => {
        event.preventDefault();
        event.stopPropagation();
        setGeoButtonBusy(button, true);
        try {
            await Promise.resolve(options.onClick?.(button, input));
        } catch (error) {
            alert(error?.message || '定位失敗，請稍後再試');
        } finally {
            setGeoButtonBusy(button, false);
        }
    });
    wrap.appendChild(button);
    installGeoButtonResizeSync();
    syncGeoButtonLabel(button);
    return button;
}
