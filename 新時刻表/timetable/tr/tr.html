<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台鐵即時時刻表</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
  /* ===== 全域效能優化 (Performance) ===== */
  /* 針對所有裝置基礎設定 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  /* ===== 行動裝置優化增強 (Mobile Overrides) ===== */
  @media (max-width: 760px) {
    /* 1. 隱藏背景特效以解決卡頓 */
    .bg-blobs { display: none !important; }
    
    /* 2. 手機版欄位顯示控制 */
    .col-range, .col-stops, .col-ticket { display: none !important; }
    .col-type, .col-duration { display: table-cell !important; }

    /* 3. 調整表格字體與內距 */
    table { font-size: 0.85rem; }
    th, td { padding: 12px 6px !important; }
    
    /* 4. 展開按鈕樣式 */
    .mobile-expand-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px; height: 24px;
        background: var(--primary-bg);
        color: var(--primary);
        border-radius: 50%;
        margin-right: 6px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        user-select: none;
    }

    /* 5. 手機版詳情行樣式 */
    .mobile-detail-row td {
        background: var(--bg-body) !important;
        padding: 12px 16px !important;
        border-left: 4px solid var(--primary);
        box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    /* 詳情頁面佈局：第一行 (區間 + 訂票) */
    .detail-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--border);
    }

    .detail-range-info {
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--text-main);
    }

    /* 詳情頁面佈局：第二行 (停靠站) */
    .detail-stops-container {
        margin-top: 8px;
    }
    
    .detail-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 700;
        margin-bottom: 6px;
        display: block;
    }

    /* 6. 手機版篩選器 (垂直清單模式) */
    .desktop-filters { display: none !important; }
    .mobile-filter-container { display: block !important; margin-bottom: 16px; position: relative; }
    
    .filter-btn {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
    }
    
    .filter-dropdown {
        display: none;
        position: absolute;
        top: 100%; left: 0; right: 0;
        background: var(--bg-surface); /* 純色背景避免卡頓 */
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px 0;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        margin-top: 6px;
        max-height: 300px;
        overflow-y: auto;
    }
    
    .filter-dropdown.show { display: block; }

    /* 垂直選單項目樣式 */
    .filter-list-item {
        display: flex;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
    }
    .filter-list-item:last-child { border-bottom: none; }
    .filter-list-item input { width: auto; margin-right: 12px; transform: scale(1.3); }
    .filter-list-item span { font-size: 0.95rem; font-weight: 500; }
  }

  /* 非手機端樣式 */
  @media (min-width: 761px) {
    .mobile-expand-btn { display: none; }
    .mobile-filter-container { display: none !important; }
    .desktop-filters { display: flex !important; }
  }

  /* 通用：停靠站 Grid 排版 (固定寬度換行) */
  .stops-grid {
      display: grid;
      /* 自動填滿，每格至少 5.5em (約可放 '台北(12:00)')，再寬就平分 */
      grid-template-columns: repeat(auto-fill, minmax(6.5em, 1fr));
      gap: 6px 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
  }
  .stop-item {
      white-space: nowrap;
      display: inline-block;
  }

  /* ===== 1. 核心變數與 Reset ===== */
  :root {
  --tr-color: #3b82f6;
  --thsr-color: #fb923c;

  --bg-dark: #020617;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-light: #64748b;

  --glass-bg: rgba(30, 41, 59, 0.45);
  --glass-border: rgba(255, 255, 255, 0.10);
  --dock-bg: rgba(15, 23, 42, 0.70);
  --modal-bg: rgba(15, 23, 42, 0.98);

  --font-main: 'Inter', 'Noto Sans TC', sans-serif;

  /* keep old var names to avoid touching JS/HTML */
  --bg-body: var(--bg-dark);
  --bg-surface: var(--glass-bg);
  --bg-header: rgba(15, 23, 42, 0.55);

  --border: var(--glass-border);
  --primary: var(--tr-color);
  --primary-bg: rgba(59, 130, 246, 0.18);

  --shadow-sm: 0 20px 50px rgba(0,0,0,0.35);
  --radius: 28px;
}

body.light-mode {
  --bg-dark: #f8fafc;
  --text-main: #0f172a;
  --text-muted: #475569;
  --text-light: #64748b;

  --glass-bg: #ffffff;
  --glass-border: rgba(15, 23, 42, 0.08);
  --dock-bg: rgba(255, 255, 255, 0.90);
  --modal-bg: rgba(255, 255, 255, 1);

  --bg-body: var(--bg-dark);
  --bg-surface: var(--glass-bg);
  --bg-header: #ffffff;

  --border: var(--glass-border);
  --primary: var(--tr-color);
  --primary-bg: rgba(59, 130, 246, 0.15);

  --shadow-sm: 0 18px 45px rgba(2, 6, 23, 0.08);
}

.lang-switch {
    background: var(--glass-bg);
    color: #ffffff;
    border: 1px solid var(--glass-border);
    padding: 8px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
}

  .booking-tip {
    font-size: 12px;
    color: #666;
    display: flex;
    align-items: center;
    margin-top: 4px;
}
.booking-tip i {
    margin-right: 4px;
    color: #f39c12;
}

  body.dark-mode {
    --bg-body: #0f172a;
    --bg-surface: #1e293b;
    --bg-header: rgba(30, 41, 59, 0.9);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --text-light: #64748b;
    --border: #334155;
    --primary: #60a5fa;
    --primary-bg: rgba(96, 165, 250, 0.15);
  }

  body {
    font-family: var(--font-main);
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 40px;
  }

  /* ===== 2. 導航列 ===== */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.8rem 1.5rem;
    background: var(--bg-header);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .navbar .brand { font-weight: 700; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .nav-links { display: flex; gap: 4px; align-items: center; }
  .nav-links a {
    color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500;
    padding: 6px 12px; border-radius: 6px; transition: 0.2s;
  }
  .nav-links a:hover { background: var(--bg-body); color: var(--primary); }
  .theme-btn {
    border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 5px; }
  .hamburger span { width: 24px; height: 2px; background: var(--text-main); }

  @media(max-width: 900px) {
    .nav-links {
      position: absolute; top: 100%; left: 0; width: 100%;
      background: var(--bg-surface); border-bottom: 1px solid var(--border);
      flex-direction: column; align-items: flex-start; padding: 0;
      max-height: 0; overflow: hidden; opacity: 0; transition: 0.3s;
    }
    .nav-links.open { max-height: 500px; opacity: 1; padding: 1rem; }
    .nav-links a { width: 100%; padding: 10px; }
    .hamburger { display: flex; }
  }

  /* ===== 3. 主要容器 ===== */
  .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
  .grid { display: grid; gap: 24px; }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }

  .section-title {
    font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

  /* ===== 4. 表單與篩選 ===== */
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; position: relative; }
  
  .input-group { 
    display: flex; align-items: center; gap: 8px; 
    background: var(--bg-body); padding: 4px 8px; 
    border: 1px solid var(--border); border-radius: 8px; 
    flex: 1; min-width: 120px;
  }
  .input-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  input, select {
    border: none; background: transparent; color: var(--text-main); 
    font-size: 0.95rem; padding: 6px; outline: none; width: 100%; 
  }

  /* 互換按鈕 */
  .swap-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--primary);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: 0.2s; font-size: 1.1rem;
  }
  .swap-btn:hover { background: var(--bg-body); transform: rotate(180deg); }

  button.btn-primary {
    background: var(--primary); color: #fff; border: none;
    padding: 8px 16px; border-radius: 8px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }

  /* 歷史紀錄 Chips */
  .history-chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .history-chip {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 12px;
    background: var(--bg-body); color: var(--text-muted);
    border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .history-chip:hover { background: var(--primary-bg); color: var(--primary); border-color: var(--primary); }

  /* 標籤式 Checkbox (Desktop) */
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
    user-select: none; transition: 0.2s;
  }
  .chip-label:hover { background: var(--bg-body); }
  .chip-label input { display: none; }
  .chip-label:has(input:checked) {
    background: var(--primary-bg); color: var(--primary); border-color: var(--primary); font-weight: 500;
  }
  .chip-label input:checked + span { color: var(--primary); }

  /* ===== 5. 表格樣式 ===== */
  .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
  
  th {
    background: var(--bg-body); color: var(--text-muted); font-weight: 600; text-align: left;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  th.sortable { cursor: pointer; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-main); }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: var(--bg-body); cursor: pointer; }

  /* 數字對齊 */
  td { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  
  /* 標籤 Badge */
  .badge-sea { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #0ea5e9; color: #fff; margin-left: 4px; }
  
  .train-route { font-size: 0.85rem; color: var(--text-muted); margin-left: 6px; }
  .progress-bar { width: 60px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; }

  /* ===== 6. Modal (彈窗) & 時間軸 ===== */
  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
    z-index: 2000; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s;
  }
  .modal[style*="display: flex"] { opacity: 1; }

  .modal-content {
    background: var(--bg-surface); width: 95%; max-width: 500px; max-height: 85vh;
    border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden; display: flex; flex-direction: column;
    transform: translateY(20px); transition: transform 0.3s;
  }
  .modal[style*="display: flex"] .modal-content { transform: translateY(0); }

  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-body);
  }
  .modal-title-main { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .modal-title-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
  .close{font-size:26px;color:var(--text-muted);background:transparent;width:auto;height:auto;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;user-select:none;flex:0 0 auto;padding:6px 10px;line-height:1;}
.close:hover{background:rgba(148,163,184,0.18);color:var(--text-main);}

  .modal-body { padding: 0; overflow-y: auto; background: var(--bg-surface); }

  /* 時間軸樣式 */
  .timeline { padding: 10px 20px; }
  .timeline-item { display: flex; position: relative; padding-bottom: 0; }
  
  /* 左側時間 */
  .tl-time {
    width: 50px; text-align: right; font-size: 0.9rem; font-weight: 600; 
    color: var(--text-main); padding-right: 15px; padding-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  
  /* 中間線條與圓點 */
  .tl-marker {
    display: flex; flex-direction: column; align-items: center; width: 20px; position: relative;
  }
  .tl-line {
    width: 2px; background: var(--border); flex-grow: 1; margin-top: 4px; margin-bottom: -4px;
  }
  .timeline-item:last-child .tl-line { display: none; }
  .tl-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--border);
    border: 2px solid var(--bg-surface); z-index: 1; flex-shrink: 0; transition: all 0.3s;
  }
  
  /* 右側站名 */
  .tl-content { padding-left: 15px; padding-bottom: 24px; flex-grow: 1; }
  .timeline-item:last-child .tl-content { padding-bottom: 10px; }
  
  .tl-station { font-size: 1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; }
  .st-arr{ font-size:0.75em; font-weight:600; color:var(--text-muted); margin-left:8px; font-variant-numeric: tabular-nums; }
  .tl-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

  /* --- 狀態樣式 --- */
  .timeline-item.passed .tl-time, 
  .timeline-item.passed .tl-station { opacity: 0.4; filter: grayscale(1); }
  .timeline-item.passed .tl-dot { background: var(--border); }

  .timeline-item.next .tl-dot { 
    background: #22c55e; width: 14px; height: 14px; 
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2); 
    border-color: #fff; 
  }
  .timeline-item.next .tl-station { color: #15803d; font-weight: 700; }
  body.dark-mode .timeline-item.next .tl-station { color: #4ade80; }
  
  .timeline-item.transfer .tl-dot { background: #d97706; width: 12px; height: 12px; }
  .timeline-item.transfer .tl-station { color: #b45309; }

  .badge-next {
    display: inline-flex; align-items: center; gap: 4px;
    background: #22c55e; color: #fff; font-size: 0.7rem; 
    padding: 2px 8px; border-radius: 10px; margin-left: 8px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

  .transfer-banner {
    background: var(--bg-body); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 10px 20px; display: flex; align-items: center; gap: 10px; margin: 10px -20px 20px -20px;
  }

  /* ===== 轉乘詳情：摘要卡片 ===== */
  .transfer-summary{
    padding: 14px 20px 6px 20px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  .transfer-card{
    border: 1px solid var(--border);
    background: var(--bg-body);
    border-radius: 14px;
    padding: 12px 12px;
    box-shadow: var(--shadow-sm);
  }
  .transfer-card-title{
    font-size: .78rem;
    color: var(--text-muted);
    font-weight: 800;
    letter-spacing: .02em;
    margin-bottom: 6px;
  }
  .transfer-card-main{
    font-size: .95rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .kv-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
  }
  .kv{
    display:flex; flex-direction:column; gap:2px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-surface);
  }
  .kv span{ font-size:.75rem; color: var(--text-muted); font-weight:700; }
  .kv b{ font-size:.92rem; font-variant-numeric: tabular-nums; }
  .transfer-section{ padding: 0 0 6px 0; }
  .transfer-sec-title{
    padding: 10px 20px 0 20px;
    font-weight: 900;
    font-size: 1rem;
  }

  @media (max-width: 760px){
    .transfer-summary{ grid-template-columns: 1fr; }
    .kv-grid{ grid-template-columns: 1fr 1fr; }
  }
  
  /* ===== Query Tabs ===== */
  .query-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px 0}
  .query-tab{appearance:none;border:1px solid var(--border);background:var(--card-bg);color:var(--text-main);
    padding:10px 12px;border-radius:12px;font-weight:700;cursor:pointer;transition:.15s}
  .query-tab:hover{transform:translateY(-1px)}
  .query-tab.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent}
  .query-panel.hidden{display:none}


  .ticket-btn{
    border:1px solid var(--border);
    background:var(--bg-body);
    color:var(--text-main);
    border-radius:10px;
    padding:6px 12px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
    font-weight: 700;
  }
  .ticket-btn:active{ transform:scale(.98); }
  .ticket-btn[disabled]{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
  }
  .ticket-btn[disabled]:active{ transform:none; }


/* ===== Homepage-style background blobs ===== */
.bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(120px); opacity: 0.42; pointer-events:none; }
.blob { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; animation: float 25s infinite alternate ease-in-out; }
.blob-1 { background: var(--tr-color); top: -10%; left: -10%; }
.blob-2 { background: var(--thsr-color); bottom: -10%; right: -10%; }
@keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(10%, 15%); } }

/* ===== Performance: Disable glass effect on mobile to prevent lag ===== */
@media (max-width: 760px) {
    .header, .navbar, .card, .modal-content, .filter-dropdown {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: var(--bg-surface) !important;
    }
}

/* container align with homepage */
.container { max-width: 1200px; width: 90%; margin: 26px auto; padding: 0; }
.grid { display: grid; gap: 18px; }

/* glass cards like homepage */
.card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  border-radius: 32px;
  padding: 22px 22px;
  box-shadow: var(--shadow-sm);
}

/* sticky header look */
.header{
  background: var(--bg-header);
  border-bottom: 1px solid var(--glass-border);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  padding: 18px 24px;
}
.header-content{ max-width: 1200px; width: 90%; margin: 0 auto; }

.logo{ font-weight: 900; letter-spacing: 1px; color: var(--text-muted); }
.logo span{ color: var(--text-muted); opacity: .9; }

/* buttons */

<script src="./train.real-schedule.js"></script>
<script>
  // ===== 全域 =====
  let nameToId = {};
  let stationListSorted = []; // [{id,name}]
  let currentQueryDateStr = ''; // 使用者選的「顯示日期」（站別顯示要用）
  let baseSchedule = {};       // 發車日 = currentQueryDateStr
  let prevSchedule = {};       // 發車日 = currentQueryDateStr - 1（用來補跨日到今天的站）
  let originDateByKey = {};    // key -> originDate (YYYY-MM-DD)
  let scheduleKeyList = [];    // [{key, trainNo, originDate, data}]
  // ===== 自動更新：記住最後一次查詢 =====
let lastStartEndQuery = null;   // {st, ed, accept}
let lastStationQuery  = null;   // {station, dir}
let lastTrainQuery    = null;   // {trainNo}
let modalCtx = null;            // {trainNo, originDate}


  // ===== 日期工具 =====
  function fmtDate(d){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function addDays(dateStr, delta){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate()+delta);
    return fmtDate(dt);
  }

  // ===== 日期：昨天 ~ 未來 60 天（預設今天） =====
  function initDatePickerWindow(){
    const el = document.getElementById('mainQueryDate');
    if(!el) return;
    const today = new Date();
    const minD = new Date(today); minD.setDate(minD.getDate()-3);
    const maxD = new Date(today); maxD.setDate(maxD.getDate()+120);
    el.min = fmtDate(minD);
    el.max = fmtDate(maxD);
    el.value = fmtDate(today);
    el.addEventListener('change', ()=>refreshData(el.value));
  }

  // ===== 台/臺 正規化 =====
  function normTW(s){ return String(s||'').trim().replace(/台/g,'臺'); }
  function normLoose(s){
    const t = String(s||'').trim();
    return { raw:t, asTai:t.replace(/台/g,'臺'), asTai2:t.replace(/臺/g,'台') };
  }

  // ===== datalist 動態填入：站名 =====
  function fillStationDatalist(keyword){
    const dl = document.getElementById('stationList');
    if(!dl) return;

    const k = normLoose(keyword||'');
    // ★ 手機效能：最多只顯示前 50 筆，且一次 innerHTML 寫入（避免大量 DOM append）
    const limit = 50;
    let out = '';
    let count = 0;

    for(let i=0;i<stationListSorted.length;i++){
      const s = stationListSorted[i];
      if(!s) continue;

      if(k.raw){
        const id = String(s.id);
        const name = String(s.name);
        const name2 = name.replace(/臺/g,'台');
        const hit = id.includes(k.raw) || id.includes(k.asTai) || id.includes(k.asTai2) ||
                    name.includes(k.raw) || name.includes(k.asTai) || name.includes(k.asTai2) ||
                    name2.includes(k.raw) || name2.includes(k.asTai) || name2.includes(k.asTai2);
        if(!hit) continue;
      }

      out += `<option value="${s.id}-${s.name}"></option>`;
      count++;
      if(count >= limit) break;
    }

    dl.innerHTML = out;
  }

  // ===== datalist 動態填入：車次 =====
  function fillTrainDatalist(keyword){
    const dl = document.getElementById('trainNumberList');
    if(!dl) return;

    const k = String(keyword||'').trim();
    // ★ 手機效能：最多只顯示前 100 筆，且一次 innerHTML 寫入
    const limit = 100;
    let out = '';
    let count = 0;

    const nums = Object.keys(baseSchedule||{}).sort((a,b)=>String(a).localeCompare(String(b),'en'));
    for(let i=0;i<nums.length;i++){
      const n = nums[i];
      if(k && !String(n).includes(k)) continue;

      const t = baseSchedule[n];
      const arr = t?.['車站時間']||[];
      const range = (arr.length>=2)?`${arr[0][0]}➝${arr.slice(-1)[0][0]}`:'';
      out += `<option value="${n}-${t?.['車種']||''}-${range}"></option>`;
      count++;
      if(count >= limit) break;
    }

    dl.innerHTML = out;
  }

  function extractStationNameFromInput(raw){
    const v = String(raw||'').trim();
    if(!v) return '';
    // 允許 1000-臺北
    const m = v.match(/^(\d{3,6})\s*-\s*(.+)$/);
    if(m && window.stationMap && window.stationMap[m[1]]) return window.stationMap[m[1]];
    // 允許只輸入站碼
    if(window.stationMap && window.stationMap[v]) return window.stationMap[v];
    // 允許站名台/臺
    const asTai = normTW(v);
    if(nameToId[asTai]) return asTai;
    const asTai2 = v.replace(/臺/g,'台');
    if(nameToId[normTW(asTai2)]) return normTW(asTai2);
    return normTW(v);
  }

  function extractTrainNoFromInput(raw){
    const v = String(raw||'').trim();
    if(!v) return '';
    const m = v.match(/^([0-9A-Za-z]+)\s*-\s*/);
    if(m) return m[1];
    return v;
  }

  // ===== 建 station index =====
  function buildStationIndex(){
    nameToId = {};
    stationListSorted = [];
    if(!window.stationMap) return;

    Object.entries(window.stationMap).forEach(([id, name])=>{
      if(!id || !name) return;
      const nameNorm = normTW(name);
      nameToId[nameNorm] = id;
      stationListSorted.push({id, name:nameNorm});
    });

    stationListSorted.sort((a,b)=>String(a.id).localeCompare(String(b.id),'en'));
  }

  // ===== 工具：時間處理 =====
  function parseTime(t){
    if(!t || !/\d{1,2}:\d{2}/.test(t)) return null;
    let [h,m]=t.split(':').map(x=>parseInt(x,10));
    return h*60+m;
  }

// 將一站資料拆成 {arr, dep}，兼容兩種資料格式：
// A) [站, 到達, 開車]  或  B) [站, 開車, 到達]
// 規則：若兩個時間都存在，且「較晚」應視為開車(>=到達)
function splitArrDep(stopRow){
  const t1 = stopRow?.[1] || '';
  const t2 = stopRow?.[2] || '';
  if(!t2) return { arr: t1, dep: t1 }; // 只有一個時間時視為到達=開車
  if(!t1) return { arr: t2, dep: t2 };
  const m1 = parseTime(t1);
  const m2 = parseTime(t2);
  if(m1===null || m2===null) return { arr: t1, dep: t2 };

  // dep 應 >= arr；若 t2 <= t1，代表 t1較晚 → t1=dep, t2=arr
  if(m2 <= m1) return { arr: t2, dep: t1 };
  // 否則 t2較晚 → t2=dep, t1=arr
  return { arr: t1, dep: t2 };
}


  // 取得某列車某站「到達/開車」
  function getArrDepFromSchedule(schedule, trainNo, station){
    const t = schedule?.[trainNo];
    if(!t) return null;
    const row = (t['車站時間']||[]).find(s=>s[0]===station);
    if(!row) return null;
    // row: 可能是 [station, 到達, 開車] 或 [station, 開車, 到達]
    const ad = splitArrDep(row);
    return { arr: ad.arr || '', dep: ad.dep || '' };
  }

  // 建立每站 absMin（處理跨日：時間變小就 +1day）
  function buildAbsMinutes(stops){
    // stops: [[station, arr, dep], ...] 以「開車」優先做排序基準（沒有就用到達）
    const out = [];
    let day = 0;
    let prev = null;

    for(let i=0;i<stops.length;i++){
      const ad = splitArrDep(stops[i]);
      const arr = ad.arr || '';
      const dep = ad.dep || '';
      const tStr = dep || arr;           // 用開車為主，缺才用到達
      const m = parseTime(tStr);
      if(m === null){
        out.push({abs:null, day:day});
        continue;
      }
      if(prev !== null && m < prev) day += 1;  // 跨日
      const abs = day*1440 + m;
      out.push({abs, day});
      prev = m;
    }
    return out;
  }

  // 進階：同時建立「到達/開車」的 absMin（用開車/到達的較晚者作為跨日判斷基準）
  // 回傳：{ absArr: number[]|null[], absDep: number[]|null[], day: number[] }
  function buildAbsArrDep(stops){
    const absArr = [];
    const absDep = [];
    const dayArr = [];
    let day = 0;
    let prevKey = null;

    for(let i=0;i<stops.length;i++){
      const arrStr = stops[i][1] || '';
      const depStr = stops[i][2] || '';

      const arrMin = parseTime(arrStr);
      const depMin = parseTime(depStr);

      // 用「較晚者」當作跨日判斷 key（避免同站到/開差 1-2 分造成誤判）
      let keyMin = null;
      if(depMin !== null && arrMin !== null) keyMin = Math.max(depMin, arrMin);
      else keyMin = (depMin !== null) ? depMin : ((arrMin !== null) ? arrMin : null);

      if(keyMin === null){
        absArr.push(null); absDep.push(null); dayArr.push(day);
        continue;
      }

      if(prevKey !== null && keyMin < prevKey) day += 1; // 跨日
      const base = day*1440;

      absArr.push(arrMin === null ? null : base + arrMin);
      absDep.push(depMin === null ? null : base + depMin);
      dayArr.push(day);
      prevKey = keyMin;
    }

    return { absArr, absDep, day: dayArr };
  }


  function getStopDateStr(originDateStr, absMin){
    if(absMin === null || absMin === undefined) return originDateStr;
    const dayOffset = Math.floor(absMin/1440);
    return addDays(originDateStr, dayOffset);
  }

  // ===== 狀態：用「發車日」判斷（不是站別跨日後的日期） =====
  function getTrainStatusLabel(trainNo, originDateStr, firstTimeStr, lastTimeStr, passedStationTimeStr){
    const todayStr = fmtDate(new Date());

    // 未來發車日：一律未發車
    if(originDateStr && originDateStr > todayStr) return '未發車';
    // 過去發車日：一律已到終點
    if(originDateStr && originDateStr < todayStr) return '已到終點';

    // 只有「今天發車」才抓即時
    let raw='';
    try{ if(typeof getDelayStatus==='function') raw = getDelayStatus(String(trainNo)) || ''; }catch(e){ raw=''; }

    // 停駛/截短等優先顯示（比已過站更重要）
    if(raw && /停駛|取消|暫停|終止|運轉整理|截短|折返|部分停駛/i.test(raw)) return raw;

    // 已過站：以「查詢的站（出發站 / 指定車站）」的「開車時間」判斷
    if(passedStationTimeStr && originDateStr === todayStr){
      const now = new Date();
      const nowMin = now.getHours()*60 + now.getMinutes();
      const passMin = parseTime(passedStationTimeStr);
      if(passMin !== null && nowMin > passMin) return '已過站';
    }

    // 即時準點/誤點
    if(raw){
      if(/準點/.test(raw)) return '準點';
      const m = raw.match(/晚\s*([\-\d]+)\s*分/);
      if(m){
        const d = parseInt(m[1],10);
        if(Number.isFinite(d) && d>0) return `誤點 ${d} 分`;
        if(Number.isFinite(d) && d<0) return `提早 ${Math.abs(d)} 分`;
        return '準點';
      }
      return raw || '即時';
    }

    // 沒即時資訊：用時間粗判
    const f = parseTime(firstTimeStr);
    const l = parseTime(lastTimeStr);
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();

    if(f !== null && nowMin < f) return '未發車';
    if(f !== null && l !== null){
      const crosses = l < f;
      const endMin = crosses ? l+1440 : l;
      const nowAdj = crosses && nowMin < f ? nowMin+1440 : nowMin;
      if(nowAdj > endMin + 10) return '已到終點';
    }
    return '無即時資訊';
  }

  // ===== 詳細視窗用狀態（不顯示「已過站」） =====
  function getStatusForModal(trainNo, originDateStr, stopsArr){
    const todayStr = fmtDate(new Date());

    // 未來/過去：直接固定
    if(originDateStr && originDateStr > todayStr) return '未發車';
    if(originDateStr && originDateStr < todayStr) return '已到終點站';

    // 只有查今天才有即時意義
    let raw = '';
    try{ if(typeof getDelayStatus==='function') raw = getDelayStatus(String(trainNo)) || ''; }catch(e){ raw=''; }

    if(raw && /停駛|取消|暫停|終止|運轉整理|截短|折返|部分停駛/i.test(raw)) return '停駛';

    const first = (splitArrDep(stopsArr?.[0]||[]).dep || splitArrDep(stopsArr?.[0]||[]).arr || '');
    const last  = (splitArrDep(stopsArr?.[stopsArr.length-1]||[]).arr || splitArrDep(stopsArr?.[stopsArr.length-1]||[]).dep || '');

    const f = parseTime(first);
    const l = parseTime(last);
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();

    // 若已超過終點抵達時間（含跨日），優先顯示「已到終點站」（不要再顯示準點）
    if(f !== null && l !== null){
      const crosses = l < f;
      const endMin = crosses ? l+1440 : l;
      const nowAdj = crosses && nowMin < f ? nowMin+1440 : nowMin;
      if(nowAdj > endMin + 10) return '已到終點站';
      if(nowAdj < f) return '未發車';
    }else{
      if(f !== null && nowMin < f) return '未發車';
    }

    // 先用即時誤點顯示（若有）
    if(raw){
      if(/準點/.test(raw)) return '準點';
      const m = raw.match(/晚\s*([\-\d]+)\s*分/);
      if(m){
        const d = parseInt(m[1],10);
        if(Number.isFinite(d) && d>0) return `誤點 ${d} 分`;
        if(Number.isFinite(d) && d<0) return `提早 ${Math.abs(d)} 分`;
        return '準點';
      }
    }else{
      const d = isQueryToday(originDateStr) ? getDelayMinutes(trainNo) : 0;
      if(d>0) return `誤點 ${d} 分`;
      if(d<0) return `提早 ${Math.abs(d)} 分`;
      if(isQueryToday(originDateStr)) return '準點';
    }

    return '準點';
  }

  // ===== 起訖站直達：台鐵e訂通 深度連結（TDX）=====
  
// =============================
// TDX OAuth2 (client credentials)
// ⚠️ 注意：把 clientSecret 放在前端是不安全的；正式上線建議改由後端代取 token。
// =============================


let _tdxTokenCache = { token: '', exp: 0 }; // exp: ms epoch
let _deeplinkInFlight = false;
let _deeplinkCooldownUntil = 0; // ms epoch
function _getDeeplinkCooldownMs(resp){
  const ra = resp?.headers?.get?.('retry-after');
  const sec = ra ? parseInt(ra,10) : NaN;
  if(Number.isFinite(sec) && sec>0) return sec*1000;
  return 12000; // default 12s
}

// 修改 test.html 內的 getTDXAccessToken，確保它能抓到 token
async function getTDXAccessToken(force = false) {
  // 檢查是否已有快取且未過期
  if (!force && _tdxTokenCache.token && Date.now() < _tdxTokenCache.exp - 30000) {
    return _tdxTokenCache.token;
  }

  const tokenUrl = 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
  const body = new URLSearchParams({
    grant_type: 'client_credentials',
    client_id: TDX_CONFIG.clientId, // 使用 train.real-schedule.js 定義的 ID
    client_secret: TDX_CONFIG.clientSecret // 使用密鑰
  });

  try {
    const res = await fetch(tokenUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body
    });

    if (!res.ok) throw new Error("認證失敗，請檢查 Key 是否正確");

    const data = await res.json();
    _tdxTokenCache = {
      token: data.access_token,
      exp: Date.now() + (data.expires_in * 1000)
    };
    return data.access_token;
  } catch (err) {
    console.error("TDX Auth Error:", err);
    return "";
  }
}

  // ===== 耗時條：極端值處理（P95 cap）+ 漸層色 =====
  function percentile(sortedArr, p){
    if(!sortedArr || !sortedArr.length) return 1;
    const idx = (sortedArr.length - 1) * p;
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    if(lo === hi) return sortedArr[lo];
    const w = idx - lo;
    return sortedArr[lo] * (1 - w) + sortedArr[hi] * w;
  }
  function travelColor(norm01){
    const t = Math.max(0, Math.min(1, norm01));
    const hue = 120 + (10 - 120) * t; // 綠 -> 紅
    return {
      a: `hsl(${hue.toFixed(1)}, 85%, 52%)`,
      b: `hsl(${hue.toFixed(1)}, 85%, 40%)`
    };
  }
  function getTravelBarStyle(travelMin, capMin){
    const cap = Math.max(1, capMin || 1);
    const isExtreme = travelMin >= cap;
    const norm = isExtreme ? 1 : (travelMin / cap);
    const widthPct = Math.max(0, Math.min(1, norm)) * 100;
    const {a,b} = travelColor(norm);
    const fillBg = `linear-gradient(90deg, ${a}, ${b})`;
    return { widthPct, isExtreme, fillBg };
  }

  function buildDirectList(st, ed){
    const list = [];

    (scheduleKeyList||[]).forEach(inst=>{
      const num = inst.trainNo;
      const t = inst.data;
      const originDate = inst.originDate;

      if(!t) return;
      if(selectedTrainTypesStartEnd.length && !selectedTrainTypesStartEnd.includes(t['車種'])) return;

      const arr = t['車站時間'] || [];
      const si = arr.findIndex(x=>x[0]===st);
      const ei = arr.findIndex(x=>x[0]===ed);
      if(si<0 || ei<0 || ei<=si) return;

      // 用到/開雙時刻的 absMin 來推跨日日期（比照高鐵版）
      const absAD = buildAbsArrDep(arr);
      const stAbs = absAD.absDep[si] ?? absAD.absArr[si];
      const edAbs = absAD.absArr[ei] ?? absAD.absDep[ei];
      if(stAbs === null || stAbs === undefined || edAbs === null || edAbs === undefined) return;

      // ★ 顯示日期：以「出發站 st 的時刻」落在哪一天為準
      const depStopDateStr = getStopDateStr(originDate, stAbs);

      // 只收「出發站日期 = 使用者選的查詢日期」的結果
      if(depStopDateStr !== currentQueryDateStr) return;

      const depSched = splitArrDep(arr[si]).dep || '--'; // 出發：開車
      const arrSched = splitArrDep(arr[ei]).arr || '--'; // 抵達：到達

      // ★★ 核心：誤點時間只套用「查今天」且「今天發車」的班次（原本規則不變）
      const depAdj = getAdjustedTime(num, depSched, currentQueryDateStr);
      const arrAdj = getAdjustedTime(num, arrSched, currentQueryDateStr);

      const travelMin = edAbs - stAbs;
      const travel = `${Math.floor(travelMin/60)}h ${travelMin%60}m`;
      const stopsCount = ei - si - 1;

      // 取得停靠站列表
      const stopsList = arr.slice(si+1, ei).map(x => x[0]);

      const status = getTrainStatusLabel(
        num,
        originDate,
        (arr[0]?.[2]||arr[0]?.[1]||''),
        (arr.slice(-1)[0]?.[1]||arr.slice(-1)[0]?.[2]||''),
        depSched
      );

      list.push({
        num,
        originDate, // ★ 重要：點進詳情必須用發車日
        type: t['車種'],
        range: `${arr[0][0]}➝${arr[arr.length-1][0]}`,
        depSched,
        arrSched,
        depHTML: renderTimeWithDelay(num, depSched, currentQueryDateStr, { suppressStrike: status==='已過站' }),
        arrHTML: renderTimeWithDelay(num, arrSched, currentQueryDateStr, { suppressStrike: (status==='已到終點' || status==='已過站') }),
        depSortMin: (status==='已過站' ? (parseTime(depSched) ?? 9999) : (depAdj.adjMin ?? 9999)),
        arrSortMin: ((status==='已到終點' || status==='已過站') ? (parseTime(arrSched) ?? 9999) : (arrAdj.adjMin ?? 9999)),
        travel,
        travelMin,
        stopsCount,
        stopsList, // 新增：純站名列表
        status,
        startStation: st,
        endStation: ed
      });
    });

    // 用「誤點後時間」排序（原規則不變）
    list.sort((a,b)=>a.depSortMin - b.depSortMin);
    currentStartEndList = list;
  }



  // ===== 即時誤點：取分鐘數（晚到/提早） =====
function getDelayMinutes(trainNo){
  let raw = '';
  try { raw = (typeof getDelayStatus === 'function') ? (getDelayStatus(String(trainNo)) || '') : ''; } catch(e){ raw=''; }
  if(!raw) return 0;

  // 常見格式：晚 5 分、晚5分
  let m = raw.match(/晚\s*([\-]?\d+)\s*分/);
  if(m) return parseInt(m[1], 10) || 0;

  // 也支援你 UI 轉成的字串：誤點 5 分 / 提早 3 分
  m = raw.match(/誤點\s*([\-]?\d+)\s*分/);
  if(m) return parseInt(m[1], 10) || 0;

  m = raw.match(/提早\s*([\-]?\d+)\s*分/);
  if(m) return -(parseInt(m[1], 10) || 0);

  return 0;
}

function addMinutesToHHMM(hhmm, deltaMin){
  if(!hhmm || !/^\d{1,2}:\d{2}$/.test(hhmm)) return hhmm;
  const [h, m] = hhmm.split(':').map(x=>parseInt(x,10));
  let t = h*60 + m + deltaMin;
  // 允許跨日：限制在 0..1439 內
  t = ((t % 1440) + 1440) % 1440;
  const nh = String(Math.floor(t/60)).padStart(2,'0');
  const nm = String(t%60).padStart(2,'0');
  return `${nh}:${nm}`;
}

// 只在「查今天」才套用誤點時間
function isQueryToday(dateStr){
  const todayStr = fmtDate(new Date());
  return !!dateStr && dateStr === todayStr;
}

// 回傳：{sched, adj, adjMin, hasDelay}
function getAdjustedTime(trainNo, schedHHMM, queryDateStr){
  const sched = schedHHMM || '--';
  if(!isQueryToday(queryDateStr)) {
    return { sched, adj: sched, adjMin: parseTime(sched), hasDelay: false };
  }
  const dmin = getDelayMinutes(trainNo);
  // 只有「真的有誤點/提早」才顯示雙時間；0 就保持單時間
  if(!dmin) return { sched, adj: sched, adjMin: parseTime(sched), hasDelay: false };
  const adj = addMinutesToHHMM(sched, dmin);
  return { sched, adj, adjMin: parseTime(adj), hasDelay: true };
}

// ===== 訂票可用性判斷（對號車 + 開車>=現在+10分鐘） =====
function isSpecialCharterTrainNo(trainNo){
  const s = String(trainNo||'').trim();
  return /^6\d{3}$/.test(s); // 6xxx 專車
}

function isNonReservedLocalType(typeStr){
  const t = String(typeStr||'');
  // 區間 / 區間快 一律不可訂票
  return t.includes('區間快') || t.includes('區間');
}

function buildDateTimeFromDateAndHHMM(dateStr, hhmm){
  // dateStr: YYYY-MM-DD, hhmm: HH:MM
  if(!dateStr || !hhmm || hhmm==='--') return null;
  const m = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(hhmm);
  if(!m) return null;
  const [y,mo,d] = String(dateStr).split('-').map(x=>parseInt(x,10));
  const H = parseInt(m[1],10), M = parseInt(m[2],10);
  // 用本地時區（你環境 +08）
  return new Date(y, (mo||1)-1, d||1, H, M, 0, 0);
}

function getBookingEligibilityByRow(r){
  // r: currentStartEndList item
  if(!r) return { ok:false, reason:'無法取得列車資訊' };

  const trainNo = String(r.num||'').trim();
  const typeStr = String(r.type||'');

  if(isSpecialCharterTrainNo(trainNo) || typeStr.includes('專車')){
    return { ok:false, reason:'專車不提供訂票' };
  }
  if(isNonReservedLocalType(typeStr)){
    return { ok:false, reason:'區間/區間快不提供訂票' };
  }

  // 以「誤點後」開車時間判斷是否>=現在+10分鐘
  const tAdj = getAdjustedTime(trainNo, r.depSched, currentQueryDateStr);
  const depHHMM = (tAdj && tAdj.adj) ? tAdj.adj : r.depSched;
  const depDT = buildDateTimeFromDateAndHHMM(currentQueryDateStr, depHHMM);
  if(!depDT) return { ok:false, reason:'開車時間無法判斷' };

  const now = new Date();
  const threshold = new Date(now.getTime() + 10*60*1000);
  if(depDT < threshold){
    return { ok:false, reason:'開車時間距離現在未滿10分鐘' };
  }

  return { ok:true, reason:'' };
}



// UI：把時間顯示成「原時間刪線 + 新時間」

// opts: { suppressStrike?: boolean }  // 已過站時可關閉刪線，只顯示更新後時間
function renderTimeWithDelay(trainNo, schedHHMM, queryDateStr, opts){
  const t = getAdjustedTime(trainNo, schedHHMM, queryDateStr);
  if(!t.hasDelay) return (schedHHMM || '--');

  const suppress = !!(opts && opts.suppressStrike);
  if(suppress){
    // 已過站/已到終點：顯示原始時刻，不套用誤點
    return (t.sched || schedHHMM || '--');
  }

  // 不動你原本 CSS：用 inline style
  return `
    <span style="text-decoration:line-through;color:var(--text-muted);margin-right:6px;">
      ${t.sched}
    </span>
    <span style="font-weight:800;color:var(--text-main);">
      ${t.adj}
    </span>
  `;
}

  // ===== 轉乘（中途站：到達/開車分開） =====
  
function buildTransferList(st, ed){
  // 轉乘模式：同一個「出發班次 n1」只保留「耗時最短」的一個方案（可能是直達，也可能是轉乘）
  // 顯示日期判斷：以「出發站 st 的時刻」落在哪一天為準（比照高鐵版）
  const insts = scheduleKeyList || [];
  const plans = []; // {n1, n2?, ...}

  insts.forEach(inst1=>{
    const n1 = String(inst1.trainNo);
    const t1 = inst1.data;
    const originDate1 = inst1.originDate;

    if(!t1) return;
    if(selectedTrainTypesStartEnd.length && !selectedTrainTypesStartEnd.includes(t1['車種'])) return;

    const a1 = t1['車站時間']||[];
    if(a1.length < 2) return;

    const sIdx = a1.findIndex(x=>x[0]===st);
    if(sIdx < 0) return;

    const abs1 = buildAbsArrDep(a1);

    // ✅ 以「查詢出發站 st」的開車時間作為方案出發時間與耗時計算基準
    const stDepStr = (splitArrDep(a1[sIdx]||[]).dep || splitArrDep(a1[sIdx]||[]).arr || '--');
    const stDepAbs = abs1.absDep[sIdx] ?? abs1.absArr[sIdx];
    if(stDepAbs === null || stDepAbs === undefined) return;

    const depStopDateStr = getStopDateStr(originDate1, stDepAbs);
    if(depStopDateStr !== currentQueryDateStr) return;

    const depDT = buildDateTimeFromDateAndHHMM(depStopDateStr, stDepStr);
    if(!depDT) return;

    const stDepAdj = getAdjustedTime(n1, stDepStr, currentQueryDateStr);
    const originStation = a1[0]?.[0] || '';

    // 試算「直達方案」
    let bestPlan = null;

    const eIdxDirect = a1.findIndex(x=>x[0]===ed);
    if(eIdxDirect >= 0 && eIdxDirect > sIdx){
      const endArrStr = (splitArrDep(a1[eIdxDirect]||[]).arr || splitArrDep(a1[eIdxDirect]||[]).dep || '--');
      const endArrAbs = abs1.absArr[eIdxDirect] ?? abs1.absDep[eIdxDirect];

      if(endArrAbs !== null && endArrAbs !== undefined){
        const endArrDateStr = getStopDateStr(originDate1, endArrAbs);
        const endArrDT = buildDateTimeFromDateAndHHMM(endArrDateStr, endArrStr);
        if(endArrDT){
          const travelMin = Math.round((endArrDT - depDT)/60000);
          if(Number.isFinite(travelMin) && travelMin >= 0){
            const status = getTrainStatusLabel(
              n1,
              originDate1,
              (a1[0]?.[2]||a1[0]?.[1]||''),
              (a1.slice(-1)[0]?.[1]||a1.slice(-1)[0]?.[2]||''),
              stDepStr
            );

            const endArrAdj = getAdjustedTime(n1, endArrStr, currentQueryDateStr);

            bestPlan = {
              trainNumber: String(n1),
              n1,
              n2: null,
              originDate1,
              originDate2: null,

              type1: t1['車種'],
              type2: null,
              isDirect: true,
              startStation: st,
              endStation: ed,
              transferStation: null,

              originStation,
              stDepStr,
              depSched: stDepStr,
              depHTML: renderTimeWithDelay(n1, stDepStr, currentQueryDateStr, { suppressStrike: status==='已過站' }),
              startDepAtQueryStation: stDepStr,

              arrSched: endArrStr,
              arrHTML: renderTimeWithDelay(n1, endArrStr, currentQueryDateStr, { suppressStrike: (status==='已到終點' || status==='已過站') }),

              depSortMin: (status==='已過站' ? (parseTime(stDepStr) ?? 9999) : (stDepAdj.adjMin ?? 9999)),
              arrSortMin: ((status==='已到終點' || status==='已過站') ? (parseTime(endArrStr) ?? 9999) : (endArrAdj.adjMin ?? 9999)),

              travelMin,
              travel: `${Math.floor(travelMin/60)}h ${travelMin%60}m`,
              status
            };
          }
        }
      }
    }

    // 試算「轉乘方案」：n1 (st -> mid) + n2 (mid -> ed)
    insts.forEach(inst2=>{
      const n2 = String(inst2.trainNo);
      if(n2 === n1) return;

      const t2 = inst2.data;
      const originDate2 = inst2.originDate;
      if(!t2) return;
      if(selectedTrainTypesStartEnd.length && !selectedTrainTypesStartEnd.includes(t2['車種'])) return;

      const a2 = t2['車站時間']||[];
      if(a2.length < 2) return;

      const eIdx2 = a2.findIndex(x=>x[0]===ed);
      if(eIdx2 < 0) return;

      const abs2 = buildAbsArrDep(a2);
      const endArrAbs2 = abs2.absArr[eIdx2] ?? abs2.absDep[eIdx2];
      const endArrStr2 = (splitArrDep(a2[eIdx2]||[]).arr || splitArrDep(a2[eIdx2]||[]).dep || '--');
      if(endArrAbs2 === null || endArrAbs2 === undefined) return;

      const endArrDateStr2 = getStopDateStr(originDate2, endArrAbs2);
      const endArrDT2 = buildDateTimeFromDateAndHHMM(endArrDateStr2, endArrStr2);
      if(!endArrDT2) return;

      for(let i=sIdx+1;i<a1.length;i++){
        const mid = a1[i][0];

        const midIdx2 = a2.findIndex(x=>x[0]===mid);
        if(midIdx2 < 0) continue;
        if(!(midIdx2 < eIdx2)) continue;

        const midArrStr1 = (splitArrDep(a1[i]||[]).arr || splitArrDep(a1[i]||[]).dep || '--');
        const midArrAbs1 = abs1.absArr[i] ?? abs1.absDep[i];
        if(midArrAbs1 === null || midArrAbs1 === undefined) continue;

        const midArrDateStr1 = getStopDateStr(originDate1, midArrAbs1);
        const midArrDT1 = buildDateTimeFromDateAndHHMM(midArrDateStr1, midArrStr1);
        if(!midArrDT1) continue;

        const midDepStr2 = (splitArrDep(a2[midIdx2]||[]).dep || splitArrDep(a2[midIdx2]||[]).arr || '--');
        const midDepAbs2 = abs2.absDep[midIdx2] ?? abs2.absArr[midIdx2];
        if(midDepAbs2 === null || midDepAbs2 === undefined) continue;

        const midDepDateStr2 = getStopDateStr(originDate2, midDepAbs2);
        const midDepDT2 = buildDateTimeFromDateAndHHMM(midDepDateStr2, midDepStr2);
        if(!midDepDT2) continue;

        const waitMin = Math.round((midDepDT2 - midArrDT1)/60000);
        if(!Number.isFinite(waitMin) || waitMin < 0) continue;

        // 轉乘等待上限維持原本精神（避免過長等待）
        if(waitMin > 90) continue;

        const travelMin = Math.round((endArrDT2 - depDT)/60000);
        if(!Number.isFinite(travelMin) || travelMin < 0) continue;

        const status = getTrainStatusLabel(
          n1,
          originDate1,
          (a1[0]?.[2]||a1[0]?.[1]||''),
          (a1.slice(-1)[0]?.[1]||a1.slice(-1)[0]?.[2]||''),
          stDepStr
        );

        const endArrAdj2 = getAdjustedTime(n2, endArrStr2, currentQueryDateStr);

        const candidate = {
          trainNumber: `${n1}+${n2}`,
          n1,
          n2,
          originDate1,
          originDate2,

          type1: t1['車種'],
          type2: t2['車種'],
          isDirect: false,
          startStation: st,
          endStation: ed,
          transferStation: mid,

          originStation,
          stDepStr,
          depSched: stDepStr,
          depHTML: renderTimeWithDelay(n1, stDepStr, currentQueryDateStr, { suppressStrike: status==='已過站' }),

          midArr: midArrStr1,
          midDep: midDepStr2,
          waitMin,
          midArrHTML: renderTimeWithDelay(n1, midArrStr1, currentQueryDateStr, { suppressStrike: false }),
          midDepHTML: renderTimeWithDelay(n2, midDepStr2, currentQueryDateStr, { suppressStrike: false }),

          arrSched: endArrStr2,
          arrHTML: renderTimeWithDelay(n2, endArrStr2, currentQueryDateStr, { suppressStrike: false }),

          depSortMin: (status==='已過站' ? (parseTime(stDepStr) ?? 9999) : (stDepAdj.adjMin ?? 9999)),
          arrSortMin: (endArrAdj2.adjMin ?? (parseTime(endArrStr2) ?? 9999)),

          travelMin,
          travel: `${Math.floor(travelMin/60)}h ${travelMin%60}m`,
          status
        };

        if(!bestPlan || candidate.travelMin < bestPlan.travelMin){
          bestPlan = candidate;
        }
      }
    });

    if(bestPlan) plans.push(bestPlan);
  });

  // ✅ 同一個「出發班次 n1（含發車日）」只保留最短耗時方案
  const bestByN1 = new Map();
  plans.forEach(p=>{
    const key = String(p.n1) + '@' + String(p.originDate1||'');
    const cur = bestByN1.get(key);
    if(!cur || p.travelMin < cur.travelMin) bestByN1.set(key, p);
  });

  currentTransferList = Array.from(bestByN1.values());

  // ✅ 去除「最後搭同一班直達車」但更慢(或一樣慢)的轉乘方案
  const directMinByTrain = new Map();
  currentTransferList.forEach(p=>{
    if(p && p.isDirect){
      directMinByTrain.set(String(p.n1), p.travelMin);
    }
  });
  currentTransferList = currentTransferList.filter(p=>{
    if(!p || p.isDirect) return true;
    const n2 = p.n2 ? String(p.n2) : '';
    if(!n2) return true;
    const dmin = directMinByTrain.get(n2);
    if(dmin === undefined) return true;
    return p.travelMin < dmin;
  });

  // ✅ 同一個後續轉乘車次 n2 且「抵達時間相同」：只留耗時最短的一個方案（沿用你原本規則）
  (function dedupeSameN2SameArr(){
    const directs = currentTransferList.filter(p=>p && p.isDirect);
    const transfers = currentTransferList.filter(p=>p && !p.isDirect);

    const groups = new Map(); // key: n2|arrSched  -> plans[]
    transfers.forEach(p=>{
      const n2 = p.n2 ? String(p.n2) : '';
      const arr = p.arrSched || '';
      const key = n2 + '|' + arr;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });

    const kept = [];
    groups.forEach(list=>{
      list.sort((a,b)=>(a.travelMin||999999)-(b.travelMin||999999));
      const best = list[0];
      kept.push(best);

      const second = list[1];
      if(second && Number.isFinite(best.waitMin) && best.waitMin < 10){
        kept.push(second);
      }
    });

    currentTransferList = directs.concat(kept);
  })();

  // 排序：仍用 depSortMin
  currentTransferList.sort((a,b)=> (a.depSortMin??999999) - (b.depSortMin??999999));
}


function renderTransferTable(){

  const mins = currentTransferList.map(r=>r.travelMin).filter(x=>Number.isFinite(x)).sort((a,b)=>a-b);

      ? `<b>${r.trainNumber}</b><span class="badge-sea">海</span>` : `<b>${r.trainNumber}</b>`;

        `${colorType(r.type2)}<span class="train-route">(${r.transferStation}➝${r.endStation})</span>`;
    }

    tr.insertCell().innerHTML = r.depHTML;

    // 轉乘欄
    if(r.isDirect){
      tr.insertCell().innerHTML = `<span style="color:var(--text-muted);">—</span>`;
    }else{

        `<div style="font-weight:700">${r.transferStation}</div>`+
        `<div class="train-route">抵達 ${r.midArrHTML||highlightPeak(r.midArr)} / 發車 ${r.midDepHTML||highlightPeak(r.midDep)}（等 ${r.waitMin} 分）</div>`;
}

    tr.insertCell().innerHTML = r.arrHTML;

    const bar = getTravelBarStyle(r.travelMin, cap);
    let cell = tr.insertCell();

    cell.innerHTML = `
      <div style="font-size:.85rem;font-weight:600">${r.travel}${bar.isExtreme ? ' <span style="color:var(--text-muted);font-weight:600"></span>' : ''}</div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${bar.widthPct.toFixed(1)}%;background:${bar.fillBg};"></div>
      </div>
    `;

    tr.insertCell().innerHTML = colorStatus(r.status);
  });
}


  // ===== 車站時刻表：順行=偶數車次 / 逆行=奇數車次 =====
  function isEvenTrainNo(num){
    const m = String(num).match(/\d+/);
    if(!m) return null;
    const n = parseInt(m[0],10);
    if(!Number.isFinite(n)) return null;
    return (n % 2 === 0);
  }

  // 車站時刻表：顯示日 = currentQueryDateStr
  // 但列車來源可能是：發車日 = currentQueryDateStr 或 currentQueryDateStr-1
  function filterTrainScheduleByStationName(){
    const station = extractStationNameFromInput(document.getElementById('stationNameInput').value);
    document.getElementById('stationNameInput').value = station;
    if(!station) return;

    const dir=document.getElementById('directionSelect').value; // even / odd
    lastStationQuery = { station, dir };

    const tbody=document.querySelector('#scheduleTableByStationName tbody');
    tbody.innerHTML='';
  // 單一事件代理（避免每列綁 click，手機效能更好）
  tbody.onclick = (e)=>{
    const tr = e.target.closest('tr');
    if(!tr || tr.parentElement !== tbody) return;

    if(!Number.isFinite(idx)) return;

    if(r.isDirect) showTrainDetails(r.n1, r.originDate1||currentQueryDateStr);

  };

    selectedTrainTypesStation=getSelectedTypesSafe('station');

    const rows = [];

      if(dir === 'odd'  && ev !== false) return;

      const dep = splitArrDep(arr[idx]).dep || '--';

      // 判斷這站實際是哪一天（跨日要落到隔天）

      tr.insertCell().innerHTML=colorStatus(r.status);
      tr.addEventListener('click',()=>showTrainDetails(r.trainNo, r.originDate));
    });
  }

    const isTodayUI = (currentQueryDateStr === todayStr);
    const canNext = isTodayOrigin && isTodayUI;

    const now=new Date();
    const nowMin=now.getHours()*60+now.getMinutes();
    let nextIndex=-1;

    if(canNext){
      for(let i=0;i<arr.length;i++){
        const tStr = (splitArrDep(arr[i]||[]).dep || splitArrDep(arr[i]||[]).arr || '');

    arr.forEach((s, i)=>{

      // 右側：到達時間（可能為空；起站通常沒有到達）
      const arrTime = ad.arr || '';
      const passedHere = canNext && (nextIndex===-1 ? true : i < nextIndex);


      // --- 修改：已過站顯示邏輯 ---

    }
    // -------------------------



    

      const badgeNext = (canNext && i===nextIndex) ? ` <span class="badge-next">下一站</span>` : '';
      const tag = (i===0) ? '起站' : (i===arr.length-1 ? '終點' : '');

      item.innerHTML=`
        <div class="tl-time">${depHTML}</div>
        <div class="tl-marker">
          <div class="tl-dot"></div>

        </div>
        <div class="tl-content">
          <div class="tl-station"><span>${s[0]}</span>${arrHTML?`<span class="st-arr">${arrHTML}</span>`:""}${badgeNext}</div>
          ${tag ? `<div class="tl-desc">${tag}</div>` : ''}
        </div>
      `;

      if(canNext){
        if(i<nextIndex) item.classList.add('passed');
        if(i===nextIndex) item.classList.add('next');

      timeline.appendChild(item);
    });

    body.appendChild(timeline);
    modal.style.display='flex';
  }


  // ===== 點對點表格排序（出發/抵達/耗時） =====
  let startEndSortState = { key: null, dir: 1 }; // dir: 1=asc, -1=desc

  
  // ===== Modal: 轉乘詳情（兩班列車，標示轉乘站） =====
  function showTransferDetails(plan){
    if(!plan) return;

    const od1 = plan.originDate1 || currentQueryDateStr;
    const od2 = plan.originDate2 || currentQueryDateStr;

    const originDateStr1 = od1;
    const originDateStr2 = od2;

    const t1 = (od1 === currentQueryDateStr) ? baseSchedule[plan.n1] : (prevSchedule[plan.n1] || baseSchedule[plan.n1]);
    const t2 = (od2 === currentQueryDateStr) ? baseSchedule[plan.n2] : (prevSchedule[plan.n2] || baseSchedule[plan.n2]);
    if(!t1 || !t2) return;

    const arr1All = t1['車站時間']||[];
    const arr2All = t2['車站時間']||[];

    const pickIndex = (arr, name)=>arr.findIndex(x=>x[0]===name);
    const i1Mid = pickIndex(arr1All, plan.transferStation);
    const i2Mid = pickIndex(arr2All, plan.transferStation);
    const i2End = pickIndex(arr2All, plan.endStation);

    if(i1Mid < 0 || i2Mid < 0 || i2End < 0) return;

    // 第一段只顯示到「轉乘站」；第二段只顯示「轉乘站→迄站」
    const i1Start = pickIndex(arr1All, plan.startStation);
    if(i1Start < 0 || i1Mid <= i1Start) return;
    const arr1 = arr1All.slice(i1Start, i1Mid+1);
    const arr2 = arr2All.slice(i2Mid, i2End+1);

    const seg1Dep = (splitArrDep(arr1[0]||[]).dep || splitArrDep(arr1[0]||[]).arr || '--'); // 起站開車
    const seg1Arr = (splitArrDep(arr1[arr1.length-1]||[]).arr || splitArrDep(arr1[arr1.length-1]||[]).dep || '--'); // 轉乘站到達

    const seg2Dep = (splitArrDep(arr2[0]||[]).dep || splitArrDep(arr2[0]||[]).arr || '--'); // 轉乘站開車
    const seg2Arr = (splitArrDep(arr2[arr2.length-1]||[]).arr || splitArrDep(arr2[arr2.length-1]||[]).dep || '--'); // 迄站到達（★修正：不是開車）

    // 狀態：不顯示「已過站」
    const s1 = getStatusForModal(plan.n1, originDateStr1, arr1All);
    const s2 = getStatusForModal(plan.n2, originDateStr2, arr2All);

    document.getElementById('modalTitleMain').textContent = `${plan.n1}+${plan.n2}｜轉乘`;
    document.getElementById('modalTitleSub').innerHTML = `${plan.startStation} ➝ ${plan.endStation}`;

    const body = document.getElementById('modalBody');
    body.innerHTML = '';

    // ===== 顶部資訊卡（兩班車 + 轉乘點 + 狀態）=====
    const top = document.createElement('div');
    top.style.padding = '16px 16px 8px 16px';

    top.innerHTML = `
      <div style="display:grid;gap:10px;">
        <div style="display:flex;align-items:flex-start;gap:10px;background:var(--bg-body);border:1px solid var(--border);border-radius:12px;padding:12px;">
          <div style="font-size:20px;line-height:1">🚆</div>
          <div style="flex:1">
            <div style="font-weight:900">
              ${plan.n1}｜${t1['車種']} <span class="train-route">(${plan.startStation}➝${plan.transferStation})</span>
            </div>
            <div class="train-route" style="margin-top:2px;">
              出發站開車 ${renderTimeWithDelay(plan.n1, seg1Dep, originDateStr1)} ｜轉乘站抵達 ${renderTimeWithDelay(plan.n1, seg1Arr, originDateStr1)}
            </div>
          </div>
          <div>${statusBadge(s1)}</div>
        </div>

        <div class="transfer-banner" style="margin:0;">
          <div style="width:34px;height:34px;border-radius:10px;background:rgba(217,119,6,.12);display:flex;align-items:center;justify-content:center;font-weight:900;color:#b45309;">⇄</div>
          <div style="flex:1">
            <div style="font-weight:900;color:var(--text-main);">${plan.transferStation} 轉乘</div>
            <div class="train-route">
              第一段抵達 ${renderTimeWithDelay(plan.n1, seg1Arr, originDateStr1)} ｜第二段發車 ${renderTimeWithDelay(plan.n2, seg2Dep, originDateStr2)} ｜等待 <b>${plan.waitMin}</b> 分
            </div>
          </div>
        </div>

        <div style="display:flex;align-items:flex-start;gap:10px;background:var(--bg-body);border:1px solid var(--border);border-radius:12px;padding:12px;">
          <div style="font-size:20px;line-height:1">🚆</div>
          <div style="flex:1">
            <div style="font-weight:900">
              ${plan.n2}｜${t2['車種']} <span class="train-route">(${plan.transferStation}➝${plan.endStation})</span>
            </div>
            <div class="train-route" style="margin-top:2px;">
              轉乘站開車 ${renderTimeWithDelay(plan.n2, seg2Dep, originDateStr2)} ｜迄站抵達 ${renderTimeWithDelay(plan.n2, seg2Arr, originDateStr2)}
            </div>
          </div>
          <div>${statusBadge(s2)}</div>
        </div>
      </div>
    `;

    body.appendChild(top);

    // ===== 站表（第一段到轉乘站；第二段到迄站）=====
    const wrap = document.createElement('div');
    wrap.style.padding = '0 16px 16px 16px';

    const sec1 = document.createElement('div');
    sec1.className = 'transfer-section';
    sec1.innerHTML = `<div class="transfer-sec-title">${plan.n1}｜${t1['車種']} <span class="train-route">(${arr1[0]?.[0]||''}➝${arr1.slice(-1)[0]?.[0]||''})</span></div>`;
    sec1.appendChild(buildTimelineForTrain(plan.n1, arr1, plan.transferStation));
    wrap.appendChild(sec1);

    const banner2 = document.createElement('div');
    banner2.className = 'transfer-banner';
    banner2.style.marginTop = '10px';
    banner2.innerHTML = `
      <div style="width:34px;height:34px;border-radius:10px;background:rgba(217,119,6,.12);display:flex;align-items:center;justify-content:center;font-weight:900;color:#b45309;">⇄</div>
      <div style="flex:1">
        <div style="font-weight:900">${plan.transferStation}</div>
        <div class="train-route">等待 ${plan.waitMin} 分（${renderTimeWithDelay(plan.n1, seg1Arr, originDateStr1)} → ${renderTimeWithDelay(plan.n2, seg2Dep, originDateStr2)}）</div>
      </div>
    `;
    wrap.appendChild(banner2);

    const sec2 = document.createElement('div');
    sec2.className = 'transfer-section';
    sec2.style.marginTop = '10px';
    sec2.innerHTML = `<div class="transfer-sec-title">${plan.n2}｜${t2['車種']} <span class="train-route">(${arr2[0]?.[0]||''}➝${arr2.slice(-1)[0]?.[0]||''})</span></div>`;
    sec2.appendChild(buildTimelineForTrain(plan.n2, arr2, plan.transferStation));
    wrap.appendChild(sec2);

    body.appendChild(wrap);

    modal.style.display = 'flex';
  }


  function buildTimelineForTrain(trainNo, arr, transferStation){
    const timeline = document.createElement('div');
    timeline.className = 'timeline';

    const abs = buildAbsMinutes(arr);

    const todayStr = fmtDate(new Date());
    const isTodayOrigin = (currentQueryDateStr === todayStr); // 這頁本來就只顯示查詢日
    const canNext = isTodayOrigin; // 只有查今天才顯示下一站

    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    let nextIndex = -1;

    if(canNext){
      for(let i=0;i<arr.length;i++){
        const tStr = (splitArrDep(arr[i]||[]).dep || splitArrDep(arr[i]||[]).arr || '');
        const m = parseTime(tStr);
        if(m!==null && m>=nowMin){ nextIndex=i; break; }
      }
    }

    arr.forEach((s,i)=>{
      const item = document.createElement('div');
      item.className = 'timeline-item';

      const ad = splitArrDep(s);
      const depTime = ad.dep || ad.arr || '--';
      const arrTime = ad.arr || '';
      const passedHere = canNext && (nextIndex===-1 ? true : i < nextIndex);

      const depHTML = renderTimeWithDelay(trainNo, depTime, currentQueryDateStr, { suppressStrike: passedHere });
      const arrHTML = arrTime ? renderTimeWithDelay(trainNo, arrTime, currentQueryDateStr, { suppressStrike: passedHere }) : '';

      const badgeNext = (canNext && i===nextIndex) ? ` <span class="badge-next">下一站</span>` : '';
      const badgeXfer = (transferStation && s[0]===transferStation) ? ` <span class="badge-xfer">轉乘</span>` : '';
      const tag = (i===0) ? '起站' : (i===arr.length-1 ? '終點' : '');

      item.innerHTML = `
        <div class="tl-time">${depHTML}</div>
        <div class="tl-marker">
          <div class="tl-dot"></div>
          <div class="tl-line"></div>
        </div>
        <div class="tl-content">
          <div class="tl-station"><span>${s[0]}</span>${arrHTML?`<span class="st-arr">${arrHTML}</span>`:""}${badgeXfer}${badgeNext}</div>
          ${tag ? `<div class="tl-desc">${tag}</div>` : ''}
        </div>
      `;

      if(canNext){
        if(i<nextIndex) item.classList.add('passed');
        if(i===nextIndex) item.classList.add('next');
      }
      timeline.appendChild(item);
    });

    return timeline;
  }

function initStartEndSorting(){
    const dep = document.getElementById('sortDepIcon');
    const arr = document.getElementById('sortArrIcon');
    const dur = document.getElementById('sortDurIcon');
    if(!dep || !arr || !dur) return;

    [dep, arr, dur].forEach(el=>{
      el.style.cursor = 'pointer';
      el.title = '點擊排序';
    });

    dep.addEventListener('click', ()=>toggleSort('dep'));
    arr.addEventListener('click', ()=>toggleSort('arr'));
    dur.addEventListener('click', ()=>toggleSort('dur'));
  }

  function toggleSort(key){
    if(startEndSortState.key === key){
      startEndSortState.dir *= -1;
    }else{
      startEndSortState.key = key;
      startEndSortState.dir = 1;
    }

    const accept = !!document.getElementById('acceptTransfers')?.checked;

    if(accept){
      sortStartEndListInPlace(currentTransferList, startEndSortState);
      renderTransferTable();
    }else{
      sortStartEndListInPlace(currentStartEndList, startEndSortState);
      renderStartEndTable();
    }

    updateStartEndSortIcons();
  }

  function sortStartEndListInPlace(list, state){
    if(!Array.isArray(list) || !state?.key) return;
    const dir = state.dir || 1;
    const key = state.key;

    const get = (r)=>{
      if(key === 'dep') return (r.depSortMin ?? 9999);
      if(key === 'arr') return (r.arrSortMin ?? 9999);
      if(key === 'dur') return (r.travelMin ?? 999999);
      return 999999;
    };

    list.sort((a,b)=> (get(a) - get(b)) * dir );
  }

  function updateStartEndSortIcons(){
    const dep = document.getElementById('sortDepIcon');
    const arr = document.getElementById('sortArrIcon');
    const dur = document.getElementById('sortDurIcon');
    if(!dep || !arr || !dur) return;

    const icon = (k)=>{
      if(startEndSortState.key !== k) return '↕';
      return startEndSortState.dir === 1 ? '↑' : '↓';
    };

    dep.textContent = icon('dep');
    arr.textContent = icon('arr');
    dur.textContent = icon('dur');
  }

  // ===== 查詢模式切換（互斥顯示） =====
  function switchQueryPanel(panelId){
    const panels = ['panel-startend','panel-station','panel-trainno'];
    panels.forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.classList.toggle('hidden', id !== panelId);
    });
    document.querySelectorAll('.query-tab').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.target === panelId);
    });
  }

  function bindQueryTabs(){
    document.querySelectorAll('.query-tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        switchQueryPanel(btn.dataset.target);
      });
    });
  }

  // ===== 事件綁定 =====

  document.getElementById('searchBtn').addEventListener('click', runStartEndSearch);
  document.getElementById('stationSearchBtn').addEventListener('click', filterTrainScheduleByStationName);
  document.getElementById('trainNumberBtn').addEventListener('click', filterTrainScheduleByNumber);

  document.getElementById('swapBtn').addEventListener('click', ()=>{
    const a=document.getElementById('startStation');
    const b=document.getElementById('endStation');
    const t=a.value; a.value=b.value; b.value=t;
  });

 // ===== 整合首頁連動邏輯 =====

    // 1. 同步主題配色
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const startParam = urlParams.get('start');
    const endParam = urlParams.get('end');
    const stationParam = urlParams.get('station');


if (stationParam) {
    switchQueryPanel('panel-station'); 
    document.getElementById('stationNameInput').value = stationParam;
    filterTrainScheduleByStationName();
}

    // 確保資料載入後的檢查函式
    const checkDataReady = () => {
        return window.trainSchedule && Object.keys(window.trainSchedule).length > 0;
    };

    // 等待資料準備就緒（最多等 3 秒）
    let retryCount = 0;

        retryCount++;
    }

    // A. 處理「常用行程」帶入 (起訖站)
    if (startParam && endParam) {

        document.getElementById('endStation').value = endParam;
        
        console.log("自動執行起訖站查詢:", startParam, "->", endParam);
        runStartEndSearch();
    } 
    // B. 處理「常用車站」帶入 (車站時刻)
    else if (stationParam) {
        switchQueryPanel('panel-station'); // 切換到車站時刻面板
        const stationInput = document.getElementById('stationName');
        if (stationInput) {
            stationInput.value = stationParam;
            console.log("自動執行車站查詢:", stationParam);
            filterTrainScheduleByStationName();
        }
    }
    // 在 tr.html 底部腳本的 window.addEventListener('load', ... ) 內加入：

// ===== 常用行程選單邏輯 =====
const favBtn = document.getElementById('favMenuBtn');
const favDropdown = document.getElementById('favDropdown');

// 1. 生成選單內容
function buildFavDropdown() {
    favDropdown.innerHTML = ''; // 清空
    let hasFav = false;

    // 讀取 localStorage (與 index.html 儲存鍵值一致)
    for (let i = 1; i <= 3; i++) {
        const s = localStorage.getItem(`tr_s${i}`);
        const e = localStorage.getItem(`tr_e${i}`);

        if (s && e) {
            hasFav = true;
            const item = document.createElement('div');
            item.style.cssText = "padding: 10px 15px; cursor: pointer; font-size: 0.9rem; border-radius: 8px; transition: 0.2s;";
            item.innerHTML = `📍 ${s} → ${e}`;
            
            // 滑鼠經過效果
            item.onmouseover = () => item.style.background = "var(--bg-body)";
            item.onmouseout = () => item.style.background = "transparent";
            
            // 點擊事件：帶入並查詢
            item.onclick = () => {
                document.getElementById('startStation').value = s;
                document.getElementById('endStation').value = e;
                favDropdown.style.display = 'none';
                runStartEndSearch(); // 自動執行查詢
            };
            favDropdown.appendChild(item);
        }
    }

    if (!hasFav) {
        favDropdown.innerHTML = '<div style="padding: 10px; color: var(--text-muted); font-size: 0.85rem;">尚未設定常用行程</div>';
    }
}

// 2. 綁定開關事件
if (favBtn) {
    favBtn.onclick = (e) => {
        e.stopPropagation();
        const isShow = favDropdown.style.display === 'block';
        favDropdown.style.display = isShow ? 'none' : 'block';
        if (!isShow) buildFavDropdown();
    };
}

// 3. 點擊外部關閉選單
document.addEventListener('click', () => {
    if (favDropdown) favDropdown.style.display = 'none';
});

// 執行生成
renderQuickFavs();
});
