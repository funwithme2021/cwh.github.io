<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台鐵即時時刻表</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
  /* ===== 全域效能優化 (Performance) ===== */
  /* 針對所有裝置基礎設定 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  /* ===== 行動裝置優化增強 (Mobile Overrides) ===== */
  @media (max-width: 760px) {
    /* 1. 隱藏背景特效以解決卡頓 */
    .bg-blobs { display: none !important; }

    /* 0. 手機版頂部固定區：更緊湊、避免太多字 */
    .header{ padding: 10px 12px; }
    .header-content{ width: 100%; gap: 8px; flex-wrap: nowrap; align-items: center; justify-content: space-between; }
    .logo{ font-size: 14px; }
    .logo span{ display:none; } /* 只留 TR */
    .date-picker label{ display:none !important; }
    .date-picker{ display:flex; flex-wrap: wrap; gap: 8px; align-items:center; justify-content:flex-end; }

    .date-picker input[type="date"]{ min-width: 138px; }

  }

  /* 更小螢幕：表頭使用 2x2 grid 排列（不可巢狀 media） */
  @media (max-width: 520px){
    .header-content{ display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; row-gap: 8px; }
    .logo{ grid-column: 1 / 2; grid-row: 1; }
    #homeBtn{ grid-column: 2; grid-row: 1; justify-self: end; }
    .date-picker{ grid-column: 1 / 2; grid-row: 2; justify-self: start; }
    .header-actions{ grid-column: 2; grid-row: 2; justify-self: end; display:flex; gap:8px; }
    .header-actions .btn-primary{ padding: 10px 12px; }
    .header-actions .mode-toggle{ padding: 10px 12px; }
  }

  /* 回到手機樣式延伸 */
  @media (max-width: 760px) {
    .date-picker .btn-ghost, .date-picker button.btn-primary{ padding: 8px 12px; font-size: 12px; }
    .toggle-theme{ padding: 8px 10px; font-size: 12px; }

    /* 表頭：全部不可換行，行動版以圖示為主 */
    .header, .header *{ white-space: nowrap; }
    .header .btn-text{ display: none; }
    .header .ico{ font-size: 16px; line-height: 1; }
    #homeBtn, #refreshBtn, #themeToggle{ display:flex; align-items:center; justify-content:center; gap:6px; }

    /* 2. 手機版欄位顯示控制 */
    .col-range, .col-stops, .col-ticket { display: none !important; }
    .col-type, .col-duration { display: table-cell !important; }

    /* 3. 調整表格字體與內距 */
    table { font-size: 0.85rem; }
    th, td { padding: 12px 6px !important; }
    
    /* 4. 展開按鈕樣式 */
    .mobile-expand-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px; height: 24px;
        background: var(--primary-bg);
        color: var(--primary);
        border-radius: 50%;
        margin-right: 6px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        user-select: none;
    }

    /* 5. 手機版詳情行樣式 */
    .mobile-detail-row td {
        background: var(--bg-body) !important;
        padding: 12px 16px !important;
        border-left: 4px solid var(--primary);
        box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    /* 轉乘查詢手機展開：細部樣式（僅補齊，不影響其它） */
    .mobile-detail-wrap{ display:flex; flex-direction:column; gap:10px; }
    .mblk{ display:flex; flex-direction:column; gap:4px; }
    .mt{ font-size:12px; font-weight:800; color:var(--text-muted); letter-spacing:.02em; }
    .mv{ font-size:14px; font-weight:700; color:var(--text); line-height:1.35; }
    .mact{ margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
    .muted{ color:var(--text-muted); font-weight:700; }

    .stop-pill{
      display:inline;
      padding:0;
      border:none;
      border-radius:0;
      background:transparent;
      font-weight:600;
      color:var(--text);
      white-space:nowrap;
    }
    .stop-time{
      font-size:12px; font-weight:800; color:var(--text-muted);
      padding:2px 8px; border-radius:999px;
      background: rgba(0,0,0,0.04);
    }


    /* 詳情頁面佈局：第一行 (區間 + 訂票) */
    .detail-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--border);
    }

    .detail-range-info {
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--text-main);
    }

    /* 詳情頁面佈局：第二行 (停靠站) */
    .detail-stops-container {
        margin-top: 8px;
    }
    
    .detail-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 700;
        margin-bottom: 6px;
        display: block;
    }

    /* 6. 手機版篩選器 (垂直清單模式) */
    .desktop-filters { display: none !important; }
    .mobile-filter-container { display: block !important; margin-bottom: 16px; position: relative; }
    
    .filter-btn {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
    }
    
    .filter-dropdown {
        display: none;
        position: absolute;
        top: 100%; left: 0; right: 0;
        background: var(--bg-surface); /* 純色背景避免卡頓 */
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px 0;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        margin-top: 6px;
        max-height: 300px;
        overflow-y: auto;
    }
    
    .filter-dropdown.show { display: block; }

    /* 垂直選單項目樣式 */
    .filter-list-item {
        display: flex;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
    }
    .filter-list-item:last-child { border-bottom: none; }
    .filter-list-item input { width: auto; margin-right: 12px; transform: scale(1.3); }
    .filter-list-item span { font-size: 0.95rem; font-weight: 500; }
  }

  /* 非手機端樣式 */
  @media (min-width: 761px) {
    .mobile-expand-btn { display: none; }
    .mobile-filter-container { display: none !important; }
    .desktop-filters { display: flex !important; }
  }

  /* 通用：停靠站 Grid 排版 (固定寬度換行) */
  .stops-grid {
      display: grid;
      /* 自動填滿，每格至少 5.5em (約可放 '台北(12:00)')，再寬就平分 */
      grid-template-columns: repeat(auto-fill, minmax(6.5em, 1fr));
      gap: 6px 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
  }
  .stop-item {
      white-space: nowrap;
      display: inline-block;
  }

  /* ===== 1. 核心變數與 Reset ===== */
  :root {
  --tr-color: #3b82f6;
  --thsr-color: #fb923c;

  --bg-dark: #020617;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-light: #64748b;

  --glass-bg: rgba(30, 41, 59, 0.45);
  --glass-border: rgba(255, 255, 255, 0.10);
  --dock-bg: rgba(15, 23, 42, 0.70);
  --modal-bg: rgba(15, 23, 42, 0.98);

  --font-main: 'Inter', 'Noto Sans TC', sans-serif;

  /* keep old var names to avoid touching JS/HTML */
  --bg-body: var(--bg-dark);
  --bg-surface: var(--glass-bg);
  --bg-header: rgba(15, 23, 42, 0.55);

  --border: var(--glass-border);
  --primary: var(--tr-color);
  --primary-bg: rgba(59, 130, 246, 0.18);

  --shadow-sm: 0 20px 50px rgba(0,0,0,0.35);
  --radius: 28px;
}

body.light-mode {
  --bg-dark: #f8fafc;
  --text-main: #0f172a;
  --text-muted: #475569;
  --text-light: #64748b;

  --glass-bg: #ffffff;
  --glass-border: rgba(15, 23, 42, 0.08);
  --dock-bg: rgba(255, 255, 255, 0.90);
  --modal-bg: rgba(255, 255, 255, 1);

  --bg-body: var(--bg-dark);
  --bg-surface: var(--glass-bg);
  --bg-header: #ffffff;

  --border: var(--glass-border);
  --primary: var(--tr-color);
  --primary-bg: rgba(59, 130, 246, 0.15);

  --shadow-sm: 0 18px 45px rgba(2, 6, 23, 0.08);
}

.lang-switch {
    background: var(--glass-bg);
    color: #ffffff;
    border: 1px solid var(--glass-border);
    padding: 8px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
}

  .booking-tip {
    font-size: 12px;
    color: #666;
    display: flex;
    align-items: center;
    margin-top: 4px;
}
.booking-tip i {
    margin-right: 4px;
    color: #f39c12;
}

  body.dark-mode {
    --bg-body: #0f172a;
    --bg-surface: #1e293b;
    --glass-bg: #1e293b;
    --bg-header: rgba(30, 41, 59, 0.9);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --text-light: #64748b;
    --border: #334155;
    --primary: #60a5fa;
    --primary-bg: rgba(96, 165, 250, 0.15);
    --glass-border: rgba(255, 255, 255, 0.12);
  }

  body {
    font-family: var(--font-main);
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 40px;
  }

  /* ===== 2. 導航列 ===== */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.8rem 1.5rem;
    background: var(--bg-header);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .navbar .brand { font-weight: 700; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .nav-links { display: flex; gap: 4px; align-items: center; }
  .nav-links a {
    color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500;
    padding: 6px 12px; border-radius: 6px; transition: 0.2s;
  }
  .nav-links a:hover { background: var(--bg-body); color: var(--primary); }
  .theme-btn {
    border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 5px; }
  .hamburger span { width: 24px; height: 2px; background: var(--text-main); }

  @media(max-width: 900px) {
    .nav-links {
      position: absolute; top: 100%; left: 0; width: 100%;
      background: var(--bg-surface); border-bottom: 1px solid var(--border);
      flex-direction: column; align-items: flex-start; padding: 0;
      max-height: 0; overflow: hidden; opacity: 0; transition: 0.3s;
    }
    .nav-links.open { max-height: 500px; opacity: 1; padding: 1rem; }
    .nav-links a { width: 100%; padding: 10px; }
    .hamburger { display: flex; }
  }

  /* ===== 3. 主要容器 ===== */
  .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
  .grid { display: grid; gap: 24px; }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }

  .section-title {
    font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

  /* ===== 4. 表單與篩選 ===== */
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; position: relative; }
  
  .input-group { 
    display: flex; align-items: center; gap: 8px; 
    background: var(--bg-body); padding: 4px 8px; 
    border: 1px solid var(--border); border-radius: 8px; 
    flex: 1; min-width: 120px;
  }
  .input-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  input, select {
    border: none; background: transparent; color: var(--text-main); 
    font-size: 0.95rem; padding: 6px; outline: none; width: 100%; 
  }

  /* 互換按鈕 */
  .swap-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--primary);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: 0.2s; font-size: 1.1rem;
  }
  .swap-btn:hover { background: var(--bg-body); transform: rotate(180deg); }

  button.btn-primary {
    background: var(--primary); color: #fff; border: none;
    padding: 8px 16px; border-radius: 8px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }

  .fav-wrap {
    position: relative;
    display: inline-block;
  }
  #favMenuBtn {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #favDropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 50;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 8px;
    min-width: 220px;
    display: none;
    flex-direction: column;
    gap: 4px;
  }
  #favDropdown.show { display: flex; }
  #favDropdown .fav-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--text-main);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s, color 0.1s;
  }
  #favDropdown .fav-item:hover {
    background: var(--bg-body);
    color: var(--primary);
  }
  #favDropdown .fav-empty {
    padding: 10px;
    color: var(--text-muted);
    font-size: 0.85rem;
    text-align: center;
  }

  /* 歷史紀錄 Chips */
  .history-chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .history-chip {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 12px;
    background: var(--bg-body); color: var(--text-muted);
    border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .history-chips.history-collapsed{ max-height: 44px; overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .history-chips.history-collapsed .history-chip{ flex: 0 0 auto; }
  .history-toggle{ margin: -8px 0 14px 0; padding: 6px 10px; font-size: 0.8rem; }

  
  /* 手機版：起訖站區塊更省空間（不改邏輯，只改排版） */
  @media (max-width: 760px){
    #panel-startend .form-row{ gap: 8px; }
    #panel-startend .input-group label{ font-size: 0.78rem; }
    #panel-startend .fav-wrap{ width: 100%; }
    #panel-startend #favMenuBtn{ width: 100%; justify-content: center; padding: 10px 10px; border-radius: 14px; }
    #panel-startend #favMenuBtn span{ margin-right: 0; }
    #panel-startend .swap-btn{ width: 40px; height: 40px; border-radius: 14px; }
    #panel-startend .chip-label{ padding: 10px 10px; border-radius: 14px; }
    #panel-startend .btn-primary#runStartEndBtn{ padding: 10px 14px; border-radius: 14px; }
  }

.history-chip:hover { background: var(--primary-bg); color: var(--primary); border-color: var(--primary); }

  /* 標籤式 Checkbox (Desktop) */
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
    user-select: none; transition: 0.2s;
  }
  .chip-label:hover { background: var(--bg-body); }
  .chip-label input { display: none; }
  .chip-label:has(input:checked) {
    background: var(--primary-bg); color: var(--primary); border-color: var(--primary); font-weight: 500;
  }
  .chip-label input:checked + span { color: var(--primary); }

  /* ===== 5. 表格樣式 ===== */
  .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
  
  th {
    background: var(--bg-body); color: var(--text-muted); font-weight: 600; text-align: left;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  th.sortable { cursor: pointer; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-main); }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: var(--bg-body); cursor: pointer; }

  /* 數字對齊 */
  td { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  
  /* 標籤 Badge */
  .badge-sea { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #0ea5e9; color: #fff; margin-left: 4px; }
  
  .train-route { font-size: 0.85rem; color: var(--text-muted); margin-left: 6px; }
  .progress-bar { width: 60px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; }

  /* ===== 6. Modal (彈窗) & 時間軸 ===== */
  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
    z-index: 2000; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s;
  }
  .modal[style*="display: flex"] { opacity: 1; }

  .modal-content {
    background: var(--bg-surface); width: 95%; max-width: 500px; max-height: 85vh;
    border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden; display: flex; flex-direction: column;
    transform: translateY(20px); transition: transform 0.3s;
  }
  .modal[style*="display: flex"] .modal-content { transform: translateY(0); }

  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-body);
  }
  .modal-title-main { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .modal-title-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
  .close{font-size:26px;color:var(--text-muted);background:transparent;width:auto;height:auto;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;user-select:none;flex:0 0 auto;padding:6px 10px;line-height:1;}
.close:hover{background:rgba(148,163,184,0.18);color:var(--text-main);}

  .modal-body { padding: 0; overflow-y: auto; background: var(--bg-surface); }

  /* 時間軸樣式 */
  .timeline { padding: 10px 20px; }
  .timeline-item { display: flex; position: relative; padding-bottom: 0; }
  
  /* 左側時間 */
  .tl-time {
    width: 50px; text-align: right; font-size: 0.9rem; font-weight: 600; 
    color: var(--text-main); padding-right: 15px; padding-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  
  /* 中間線條與圓點 */
  .tl-marker {
    display: flex; flex-direction: column; align-items: center; width: 20px; position: relative;
  }
  .tl-line {
    width: 2px; background: var(--border); flex-grow: 1; margin-top: 4px; margin-bottom: -4px;
  }
  .timeline-item:last-child .tl-line { display: none; }
  .tl-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--border);
    border: 2px solid var(--bg-surface); z-index: 1; flex-shrink: 0; transition: all 0.3s;
  }
  
  /* 右側站名 */
  .tl-content { padding-left: 15px; padding-bottom: 24px; flex-grow: 1; }
  .timeline-item:last-child .tl-content { padding-bottom: 10px; }
  
  .tl-station { font-size: 1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; }
  .st-arr{ font-size:0.75em; font-weight:600; color:var(--text-muted); margin-left:8px; font-variant-numeric: tabular-nums; }
  .tl-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

  /* --- 狀態樣式 --- */
  .timeline-item.passed .tl-time, 
  .timeline-item.passed .tl-station { opacity: 0.4; filter: grayscale(1); }
  .timeline-item.passed .tl-dot { background: var(--border); }

  .timeline-item.next .tl-dot { 
    background: #22c55e; width: 14px; height: 14px; 
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);

  <style>
    .rail-geo-input-host{

    .rail-geo-btn{
      appearance: none;
      border: none;

      min-height: 32px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(37,99,235,0.12);
      color: var(--primary, #2563eb);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, opacity .16s ease;
    }
    .rail-geo-btn[data-kind="train"]{
      background: rgba(16,185,129,0.12);
      color: #0f766e;
    }
    .rail-status-rotator{
      position: relative;
      display: inline-grid;
      align-items: center;
      vertical-align: middle;
      min-width: 0;
    }
    .rail-status-rotator-track{
      display: grid;
    }
    .rail-status-rotator-item{
      grid-area: 1 / 1;
      white-space: nowrap;
      opacity: 0;
      animation-duration: 4.2s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    .rail-status-rotator-item.is-primary{ animation-name: railStatusPrimarySwap; }
    .rail-status-rotator-item.is-secondary{ animation-name: railStatusSecondarySwap; }
    .rail-status-tone-success{ color: #16a34a; }
    .rail-status-tone-warning{ color: #c2410c; }
    .rail-status-tone-danger{ color: #b91c1c; }
    .rail-status-tone-muted{ color: #94a3b8; }
    .rail-status-tone-neutral{ color: var(--text-main); }
    @keyframes railStatusPrimarySwap{
      0%, 44% { opacity: 1; }
      50%, 94% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes railStatusSecondarySwap{
      0%, 44% { opacity: 0; }
      50%, 94% { opacity: 1; }
      100% { opacity: 0; }
    }
    .rail-geo-btn:hover{
      transform: translateY(-1px);
    }
    .rail-geo-btn[disabled]{
      opacity: .62;
      cursor: wait;
      transform: none;
    }
    .rail-geo-btn:focus-visible{
      outline: 2px solid rgba(37,99,235,0.32);
      outline-offset: 2px;
    }
    body.dark-mode .rail-geo-btn{
      background: rgba(96,165,250,0.18);
      color: #bfdbfe;
    }
    body.dark-mode .rail-geo-btn[data-kind="train"]{
      background: rgba(45,212,191,0.18);
      color: #99f6e4;
    }
  </style>
</head>

<body class="light-mode">

<div id="loading-overlay">

      <label style="font-size: 0.8em; color: var(--text-muted);">選擇查詢日期：</label>
      <input type="date" id="mainQueryDate" class="input-field" style="width: auto; display: inline-block;">
      <button class="btn-primary" id="refreshBtn" style="padding: 6px 12px;"><span class="ico">⟳</span><span class="btn-text">更新資料</span></button>
      <button class="btn-ghost" id="themeToggle" type="button" title="切換深夜模式"><span class="ico">🌙</span><span class="btn-text">深夜模式</span></button>
    </div>
  </div>
</header>

<script charset="UTF-8" src="./train.real-schedule.js?v=20260404-stationlive1"></script>

<script charset="UTF-8" src="../shared/rail-station-timetable-v2.js?v=20260330-stationv2"></script>
<script charset="UTF-8" src="../shared/rail-train-query-v2.js?v=20260329-trainquery2"></script>
<script charset="UTF-8" src="../shared/rail-origin-destination-query-v2.js?v=20260403-odquery2mobilecards10"></script>
<script>
  // ===== 全域 =====
  let nameToId = {};
  let stationListSorted = []; // [{id,name}]
  let currentQueryDateStr = ''; // 使用者選的「顯示日期」（站別顯示要用）
  let baseSchedule = {};       // 發車日 = currentQueryDateStr
  let prevSchedule = {};       // 發車日 = currentQueryDateStr - 1（用來補跨日到今天的站）
  let originDateByKey = {};    // key -> originDate (YYYY-MM-DD)
  let scheduleKeyList = [];    // [{key, trainNo, originDate, data}]
  // ===== 自動更新：記住最後一次查詢 =====
let lastStartEndQuery = null;   // {st, ed, accept, selectedTypes}
let lastStationQuery  = null;   // {station, dir}
let lastStationQueryV2 = null;  // {station, dir, selectedTypes}
let lastTrainQuery    = null;   // {trainNo}
let lastTrainQueryV2  = null;   // {trainNo}
let modalCtx = null;            // {trainNo, originDate}
let stationQuery2Controller = null;
let trainQuery2Controller = null;
let startEndQuery2Controller = null;

// ===== Loading Overlay (避免看起來像當機) =====
let __loadingCount = 0;
let __loadingShownAt = 0;
const __loadingMinMs = 240; // 最少顯示時間，避免「一閃就沒」像沒出現

function __setLoadingVisible(on, msg){
  const ov = document.getElementById('loading-overlay');
  const tx = document.getElementById('loading-text');
  if(!ov) return;
  if(typeof msg === 'string' && tx) tx.textContent = msg;

  if(on){
    ov.style.display = 'flex';
    // 強制 reflow，確保顯示狀態真的被套用（避免看起來像沒出現）
    void ov.offsetHeight;
    __loadingShownAt = Date.now();
  }else{
    ov.style.display = 'none';
  }
}

function showLoading(msg='載入中...'){
  __loadingCount++;
  __setLoadingVisible(true, msg);
  // 強制一次 reflow，避免手機上大量同步運算導致遮罩不出現、看起來像當機
  try{ document.getElementById('loading-overlay')?.offsetHeight; }catch(e){}
}

function hideLoading(){
  __loadingCount = Math.max(0, __loadingCount-1);
  if(__loadingCount!==0) return;

  const elapsed = Date.now() - (__loadingShownAt||0);
  const remain = __loadingMinMs - elapsed;
  if(remain > 0){
    setTimeout(()=>{
      if(__loadingCount===0) __setLoadingVisible(false);
    }, remain);
  }else{
    __setLoadingVisible(false);
  }
}

function nextFrame(){ return new Promise(r=>requestAnimationFrame(()=>r())); }
// 依「trainNo + originDate」取得正確時刻資料（跨日/前一天補齊也能用）
function getScheduleByOrigin(trainNo, originDate){
  const inst = (scheduleKeyList||[]).find(x=>String(x.trainNo)===String(trainNo) && String(x.originDate)===String(originDate));
  return inst?.data || baseSchedule?.[trainNo] || prevSchedule?.[trainNo] || null;
}

let __startEndDelegated = false;



  // ===== 日期工具 =====
  function fmtDate(d){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function addDays(dateStr, delta){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate()+delta);
    return fmtDate(dt);
  }

  // ===== 日期：昨天 ~ 未來 60 天（預設今天） =====
  function initDatePickerWindow(){
    const el = document.getElementById('mainQueryDate');
    if(!el) return;
    const today = new Date();
    const minD = new Date(today); minD.setDate(minD.getDate()-3);
    const maxD = new Date(today); maxD.setDate(maxD.getDate()+120);
    const linkedDate = String(new URLSearchParams(window.location.search).get('date') || '').trim();
    el.min = fmtDate(minD);
    el.max = fmtDate(maxD);
    el.value = /^\d{4}-\d{2}-\d{2}$/.test(linkedDate) ? linkedDate : fmtDate(today);
    el.addEventListener('change', ()=>{
      refreshData(el.value);
      updateHeroSnapshot();
    });
  }

  // ===== 台/臺 正規化 =====
  function normTW(s){ return String(s||'').trim().replace(/台/g,'臺'); }
  function normLoose(s){
    const t = String(s||'').trim();
    return { raw:t, asTai:t.replace(/台/g,'臺'), asTai2:t.replace(/臺/g,'台') };
  }

  // ===== datalist 動態填入：站名 =====
  function fillStationDatalist(keyword){
    const dl = document.getElementById('stationList');
    if(!dl) return;

    const k = normLoose(keyword||'');
    const wantsDualTaiForms = /[台臺]/.test(k.raw);
    // ★ 手機效能：最多只顯示前 50 筆，且一次 innerHTML 寫入（避免大量 DOM append）
    const limit = 50;
    let out = '';
    let count = 0;
    const seen = new Set();

    for(let i=0;i<stationListSorted.length;i++){
      const s = stationListSorted[i];
      if(!s) continue;

      if(k.raw){
        const id = String(s.id);
        const name = String(s.name);
        const name2 = name.replace(/臺/g,'台');
        const hit = id.includes(k.raw) || id.includes(k.asTai) || id.includes(k.asTai2) ||
                    name.includes(k.raw) || name.includes(k.asTai) || name.includes(k.asTai2) ||
                    name2.includes(k.raw) || name2.includes(k.asTai) || name2.includes(k.asTai2);
        if(!hit) continue;
      }

      const names = wantsDualTaiForms
        ? [String(s.name || ''), String(s.name || '').replace(/臺/g, '台')]
        : [String(s.name || '').replace(/臺/g, '台')];
      for(let j=0;j<names.length;j++){
        const displayName = String(names[j] || '').trim();
        if(!displayName) continue;
        const optionValue = `${s.id}-${displayName}`;
        if(seen.has(optionValue)) continue;
        seen.add(optionValue);
        out += `<option value="${optionValue}"></option>`;
        count++;
        if(count >= limit) break;
      }
      if(count >= limit) break;
    }

    dl.innerHTML = out;
  }

  // ===== datalist 動態填入：車次 =====
  function fillTrainDatalist(keyword){
    const dl = document.getElementById('trainNumberList');
    if(!dl) return;

    const k = String(keyword||'').trim();
    // ★ 手機效能：最多只顯示前 100 筆，且一次 innerHTML 寫入
    const limit = 100;
    let out = '';
    let count = 0;

    const nums = Object.keys(baseSchedule||{}).sort((a,b)=>String(a).localeCompare(String(b),'en'));
    for(let i=0;i<nums.length;i++){
      const n = nums[i];
      if(k && !String(n).includes(k)) continue;

      const t = baseSchedule[n];
      const arr = t?.['車站時間']||[];
      const range = (arr.length>=2)?`${arr[0][0]}➝${arr.slice(-1)[0][0]}`:'';
      out += `<option value="${n}-${t?.['車種']||''}-${range}"></option>`;
      count++;
      if(count >= limit) break;
    }

    dl.innerHTML = out;
  }

  function extractStationNameFromInput(raw){
    const v = String(raw||'').trim();
    if(!v) return '';
    // 允許 1000-臺北
    const m = v.match(/^(\d{3,6})\s*-\s*(.+)$/);
    if(m) return (window.stationMap && window.stationMap[m[1]]) ? window.stationMap[m[1]] : normTW(m[2]);
    // 允許只輸入站碼
    if(window.stationMap && window.stationMap[v]) return window.stationMap[v];
    // 允許站名台/臺
    const asTai = normTW(v);
    if(nameToId[asTai]) return asTai;
    const asTai2 = v.replace(/臺/g,'台');
    if(nameToId[normTW(asTai2)]) return normTW(asTai2);
    return normTW(v);
  }

  function extractTrainNoFromInput(raw){
    const v = String(raw||'').trim();
    if(!v) return '';
    const m = v.match(/^([0-9A-Za-z]+)\s*-\s*/);
    if(m) return m[1];
    return v;
  }

  // ===== 建 station index =====
  function buildStationIndex(){
    nameToId = {};
    stationListSorted = [];
    if(!window.stationMap) return;

    Object.entries(window.stationMap).forEach(([id, name])=>{
      if(!id || !name) return;
      const nameNorm = normTW(name);
      nameToId[nameNorm] = id;
      stationListSorted.push({id, name:nameNorm});
    });

    stationListSorted.sort((a,b)=>String(a.id).localeCompare(String(b.id),'en'));
  }

  // ===== 工具：時間處理 =====
  function parseTime(t){
    if(!t || !/\d{1,2}:\d{2}/.test(t)) return null;
    let [h,m]=t.split(':').map(x=>parseInt(x,10));
    return h*60+m;
  }

// 將一站資料拆成 {arr, dep}，兼容兩種資料格式：
// A) [站, 到達, 開車]  或  B) [站, 開車, 到達]
// 規則：若兩個時間都存在，且「較晚」應視為開車(>=到達)
function splitArrDep(stopRow){
  const t1 = stopRow?.[1] || '';
  const t2 = stopRow?.[2] || '';
  if(!t2) return { arr: t1, dep: t1 }; // 只有一個時間時視為到達=開車
  if(!t1) return { arr: t2, dep: t2 };
  const m1 = parseTime(t1);
  const m2 = parseTime(t2);
  if(m1===null || m2===null) return { arr: t1, dep: t2 };

  // dep 應 >= arr；若 t2 <= t1，代表 t1較晚 → t1=dep, t2=arr
  if(m2 <= m1) return { arr: t2, dep: t1 };
  // 否則 t2較晚 → t2=dep, t1=arr
  return { arr: t1, dep: t2 };
}


  // 取得某列車某站「到達/開車」
  function getArrDepFromSchedule(schedule, trainNo, station){
    const t = schedule?.[trainNo];
    if(!t) return null;
    const row = (t['車站時間']||[]).find(s=>s[0]===station);
    if(!row) return null;
    // row: 可能是 [station, 到達, 開車] 或 [station, 開車, 到達]
    const ad = splitArrDep(row);
    return { arr: ad.arr || '', dep: ad.dep || '' };
  }

  // 建立每站 absMin（處理跨日：時間變小就 +1day）
  function buildAbsMinutes(stops){
    // stops: [[station, arr, dep], ...] 以「開車」優先做排序基準（沒有就用到達）
    const out = [];
    let day = 0;
    let prev = null;

    for(let i=0;i<stops.length;i++){
      const ad = splitArrDep(stops[i]);
      const arr = ad.arr || '';
      const dep = ad.dep || '';
      const tStr = dep || arr;           // 用開車為主，缺才用到達
      const m = parseTime(tStr);
      if(m === null){
        out.push({abs:null, day:day});
        continue;
      }
      if(prev !== null && m < prev) day += 1;  // 跨日
      const abs = day*1440 + m;
      out.push({abs, day});
      prev = m;
    }
    return out;
  }

  // 進階：同時建立「到達/開車」的 absMin（用開車/到達的較晚者作為跨日判斷基準）
  // 回傳：{ absArr: number[]|null[], absDep: number[]|null[], day: number[] }
  function buildAbsArrDep(stops){
    const absArr = [];
    const absDep = [];
    const dayArr = [];
    let day = 0;
    let prevMin = null;

    const toAbs = (timeStr) => {
      const minute = parseTime(timeStr);
      if(minute === null) return null;
      if(prevMin !== null && minute < prevMin) day += 1;
      prevMin = minute;
      return day * 1440 + minute;
    };

    for(let i=0;i<stops.length;i++){
      const ad = splitArrDep(stops[i]);
      let arrAbs = null;
      let depAbs = null;

      if(ad.arr && ad.dep && ad.arr === ad.dep){
        const abs = toAbs(ad.dep || ad.arr);
        arrAbs = abs;
        depAbs = abs;
      }else{
        if(ad.arr) arrAbs = toAbs(ad.arr);
        if(ad.dep) depAbs = toAbs(ad.dep);
      }

      absArr.push(arrAbs);
      absDep.push(depAbs);
      dayArr.push(day);
    }

    return { absArr, absDep, day: dayArr };
  }

  function formatAbsTime(absMin){
    if(absMin === null || absMin === undefined || !Number.isFinite(absMin)) return '';
    const minute = ((Math.round(absMin) % 1440) + 1440) % 1440;
    const hh = Math.floor(minute / 60);
    const mm = minute % 60;
    return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  }

  function getTraRouteStationsBetween(startStation, endStation){
    if(!startStation || !endStation) return [startStation, endStation].filter(Boolean);
    if(startStation === endStation) return [startStation];
    const finder = window.RailNetwork?.findTraRoutePath;
    const path = (typeof finder === 'function') ? finder(startStation, endStation) : [];
    if(Array.isArray(path) && path.length) return path.slice();
    return [startStation, endStation];
  }

  function getTraLiveTimelineAnchor(trainNo, originDateStr, actualEntries){
    const liveEntry = getTraLiveBoardEntrySafe(trainNo, originDateStr);
    const station = normalizeTraLinkedStation(liveEntry?.stationName || '');
    if(!station || !Array.isArray(actualEntries) || !actualEntries.length) return null;
    let anchorIndex = -1;
    actualEntries.forEach((entry, index)=>{
      if(normalizeTraLinkedStation(entry?.station) === station) anchorIndex = index;
    });
    if(anchorIndex < 0) return null;
    const anchorEntry = actualEntries[anchorIndex];
    const scheduledEventAbs = anchorEntry?.kind === 'terminal'
      ? (anchorEntry.arrAbs ?? anchorEntry.depAbs ?? anchorEntry.eventAbs)
      : (anchorEntry.depAbs ?? anchorEntry.arrAbs ?? anchorEntry.eventAbs);
    if(!Number.isFinite(scheduledEventAbs)) return null;
    const liveEventAbs = parseTraLiveTimestampAbs(liveEntry?.srcUpdateTime || liveEntry?.updateTime || '', originDateStr);
    const eventAbs = Number.isFinite(liveEventAbs) ? Math.min(scheduledEventAbs, liveEventAbs) : scheduledEventAbs;
    return {
      station,
      index: anchorIndex,
      entry: anchorEntry,
      eventAbs
    };
  }

  function applyTraLiveTimelineAssist(actualEntries, expandedEntries, trainType, liveOptions){
    const trainNo = String(liveOptions?.trainNo || '').trim();
    const originDateStr = String(liveOptions?.originDateStr || '').trim();
    if(!trainNo || !originDateStr || !Array.isArray(actualEntries) || !Array.isArray(expandedEntries)) return expandedEntries;
    const anchor = getTraLiveTimelineAnchor(trainNo, originDateStr, actualEntries);
    if(!anchor) return expandedEntries;
    if(anchor.entry?.kind !== 'pass') return expandedEntries;
    const adjusted = expandedEntries.map((entry)=>({ ...entry }));
    const normalizedAnchor = normalizeTraLinkedStation(anchor.station);
    for(let index=adjusted.length-1; index>=0; index--){
      const row = adjusted[index];
      if(normalizeTraLinkedStation(row?.station) !== normalizedAnchor) continue;
      if(row?.kind !== anchor.entry.kind) continue;
      if(anchor.entry.kind === 'pass'){
        row.eventAbs = anchor.eventAbs;
        row.passText = formatAbsTime(anchor.eventAbs);
      }
      break;
    }

    let nextFixed = null;
    for(let index = anchor.index + 1; index < actualEntries.length; index += 1){
      if(actualEntries[index]?.kind === 'pass') continue;
      nextFixed = actualEntries[index];
      break;
    }
    if(!nextFixed) return adjusted;
    const endAbs = nextFixed.arrAbs ?? nextFixed.depAbs ?? nextFixed.eventAbs;
    if(!(Number.isFinite(anchor.eventAbs) && Number.isFinite(endAbs) && endAbs > anchor.eventAbs)) return adjusted;

    const path = getTraRouteStationsBetween(anchor.station, nextFixed.station);
    if(path.length <= 1) return adjusted;
    const duration = endAbs - anchor.eventAbs;
    const getTraRatio = window.RailNetwork?.getTraTimedInterpolationRatio;
    const nextStationNorm = normalizeTraLinkedStation(nextFixed.station);
    for(let step = 1; step < path.length - 1; step += 1){
      const station = path[step];
      const fallbackRatio = step / (path.length - 1);
      const ratio = (typeof getTraRatio === 'function')
        ? getTraRatio(path, 0, path.length - 1, step, duration, anchor.entry.kind !== 'pass', nextFixed.kind !== 'pass', trainType, fallbackRatio)
        : fallbackRatio;
      const passAbs = Math.round(anchor.eventAbs + (duration * ratio));
      const stationNorm = normalizeTraLinkedStation(station);
      for(let index = 0; index < adjusted.length; index += 1){
        const row = adjusted[index];
        if(row?.kind !== 'pass') continue;
        if(normalizeTraLinkedStation(row?.station) !== stationNorm) continue;
        row.eventAbs = passAbs;
        row.passText = formatAbsTime(passAbs);
        break;
      }
    }
    return adjusted.map((row)=>{
      if(normalizeTraLinkedStation(row?.station) === nextStationNorm && row.kind !== 'pass'){
        return { ...row };
      }
      return row;
    });
  }

  function buildTraTimelineRows(stops, showPassStops, trainType, liveOptions){
    const rows = stops || [];
    const absAD = buildAbsArrDep(rows);
    const actualEntries = [];

    for(let i=0;i<rows.length;i++){
      const row = rows[i] || [];
      const station = row[0] || '';
      if(!station) continue;

      const raw1 = row[1] || '';
      const raw2 = row[2] || '';
      const hasSingleTime = !!((raw1 || raw2) && !(raw1 && raw2));
      const isEdge = i === 0 || i === rows.length - 1;
      const isPassOnly = !isEdge && hasSingleTime;
      const ad = splitArrDep(row);
      const kind = isPassOnly ? 'pass' : (i === 0 ? 'origin' : (i === rows.length - 1 ? 'terminal' : 'stop'));

      actualEntries.push({
        station,
        kind,
        source: 'schedule',
        arrText: ad.arr || '',
        depText: ad.dep || '',
        arrAbs: absAD.absArr[i],
        depAbs: absAD.absDep[i],
        eventAbs: (i === rows.length - 1) ? (absAD.absArr[i] ?? absAD.absDep[i]) : (absAD.absDep[i] ?? absAD.absArr[i]),
        hasSeparateArrival: !!(raw1 && raw2),
      });
    }

    const expanded = [];
    if(showPassStops && actualEntries.length){
      expanded.push(actualEntries[0]);
      for(let i=0;i<actualEntries.length-1;i++){
        const current = actualEntries[i];
        const next = actualEntries[i+1];
        const path = getTraRouteStationsBetween(current.station, next.station);
        if(path.length <= 1){
          expanded.push(next);
          continue;
        }

        const startAbs = current.depAbs ?? current.arrAbs ?? current.eventAbs;
        const endAbs = next.arrAbs ?? next.depAbs ?? next.eventAbs;
        const segmentCount = Math.max(1, path.length - 1);
        const duration = (Number.isFinite(startAbs) && Number.isFinite(endAbs)) ? Math.max(0, endAbs - startAbs) : null;
        const getTraRatio = window.RailNetwork?.getTraTimedInterpolationRatio;

        for(let step=1; step<path.length; step++){
          if(step === path.length - 1){
            expanded.push(next);
            continue;
          }
          const fallbackRatio = step / segmentCount;
          const ratio = (typeof getTraRatio === 'function')
            ? getTraRatio(path, 0, path.length - 1, step, duration, current.kind !== 'pass', next.kind !== 'pass', trainType, fallbackRatio)
            : fallbackRatio;
          const passAbs = (duration === null) ? null : Math.round(startAbs + (duration * ratio));
          expanded.push({
            station: path[step],
            kind: 'pass',
            source: 'estimated',
            arrText: '',
            depText: '',
            arrAbs: null,
            depAbs: null,
            eventAbs: passAbs,
            passText: formatAbsTime(passAbs),
            hasSeparateArrival: false,
          });
        }
      }
    }

    const timelineEntries = applyTraLiveTimelineAssist(actualEntries, showPassStops ? expanded : actualEntries, trainType, liveOptions);
    const visible = showPassStops ? timelineEntries : timelineEntries.filter((entry)=>entry.kind !== 'pass');
    return visible.map((entry)=>{
      const isPass = entry.kind === 'pass';
      const primaryText = isPass ? '' : ((entry.kind === 'terminal') ? (entry.arrText || entry.depText || '') : (entry.depText || entry.arrText || ''));
      const primaryAbs = isPass ? null : ((entry.kind === 'terminal') ? (entry.arrAbs ?? entry.depAbs ?? entry.eventAbs) : (entry.depAbs ?? entry.arrAbs ?? entry.eventAbs));
      const secondaryText = isPass ? (entry.passText || entry.depText || entry.arrText || '') : ((entry.hasSeparateArrival || entry.arrText !== primaryText) ? (entry.arrText || '') : '');
      const secondaryPrefix = isPass ? '通' : (secondaryText ? '到' : '');
      let descriptor = '';
      if(entry.kind === 'origin') descriptor = '起站';
      else if(entry.kind === 'terminal') descriptor = '終點';

      return {
        station: entry.station,
        kind: entry.kind,
        source: entry.source,
        arrText: entry.arrText || '',
        depText: entry.depText || '',
        passText: entry.passText || '',
        arrAbs: entry.arrAbs,
        depAbs: entry.depAbs,
        primaryText,
        primaryAbs,
        secondaryText,
        secondaryPrefix,
        secondaryAbs: isPass ? entry.eventAbs : (entry.arrAbs ?? entry.eventAbs),
        eventAbs: entry.eventAbs,
        descriptor,
      };
    });
  }

  function getTrainStatusLabel(trainNo, originDateStr, firstTimeStr, lastTimeStr, passedStationAbsOrTime, stopsArr=null, passedStationIndex=null){

let _tdxTokenCache = { token: '', exp: 0 }; // exp: ms epoch
let _deeplinkInFlight = false;
let _deeplinkCooldownUntil = 0; // ms epoch
function _getDeeplinkCooldownMs(resp){
  const ra = resp?.headers?.get?.('retry-after');
  const sec = ra ? parseInt(ra,10) : NaN;
  if(Number.isFinite(sec) && sec>0) return sec*1000;
  return 12000; // default 12s

// 修改 test.html 內的 getTDXAccessToken，確保它能抓到 token
async function getTDXAccessToken(force = false) {
  // 檢查是否已有快取且未過期
  if (!force && _tdxTokenCache.token && Date.now() < _tdxTokenCache.exp - 30000) {
    return _tdxTokenCache.token;
  }

  const tokenUrl = 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
  const body = new URLSearchParams({
    grant_type: 'client_credentials',
    client_id: TDX_CONFIG.clientId, // 使用 train.real-schedule.js 定義的 ID
    client_secret: TDX_CONFIG.clientSecret // 使用密鑰
  });

  try {
    const res = await fetch(tokenUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body
    });

    if (!res.ok) throw new Error("認證失敗，請檢查 Key 是否正確");

    const data = await res.json();
    _tdxTokenCache = {
      token: data.access_token,
      exp: Date.now() + (data.expires_in * 1000)
    };
    return data.access_token;
  } catch (err) {
    console.error("TDX Auth Error:", err);
    return "";
  }
}

function showTraSeatQuantityDialog(defaultQty = 1) {
  const modal = document.getElementById('bookingSeatModal');
  const select = document.getElementById('bookingSeatQtySelect');
  const confirmBtn = document.getElementById('bookingSeatConfirm');
  const closeBtn = document.getElementById('bookingSeatClose');
  if(!modal || !select || !confirmBtn || !closeBtn){
    return Promise.resolve(Math.max(1, Math.min(6, parseInt(defaultQty, 10) || 1)));
  }

  const initialQty = Math.max(1, Math.min(6, parseInt(defaultQty, 10) || 1));
  select.value = String(initialQty);

  return new Promise((resolve) => {
    let settled = false;

    const finish = (qty) => {
      if(settled) return;
      settled = true;
      modal.style.display = 'none';
      confirmBtn.removeEventListener('click', onConfirm);
      closeBtn.removeEventListener('click', onCancel);
      modal.removeEventListener('click', onBackdrop);
      document.removeEventListener('keydown', onKeydown);
      resolve(qty);
    };

    const onConfirm = () => {
      const qty = Math.max(1, Math.min(6, parseInt(select.value, 10) || 1));
      finish(qty);
    };
    const onCancel = () => finish(null);
    const onBackdrop = (event) => {
      if(event.target === modal) finish(null);
    };
    const onKeydown = (event) => {
      if(event.key === 'Escape') finish(null);
    };

    confirmBtn.addEventListener('click', onConfirm);
    closeBtn.addEventListener('click', onCancel);
    modal.addEventListener('click', onBackdrop);
    document.addEventListener('keydown', onKeydown);
    modal.style.display = 'flex';
    setTimeout(() => {
      try{ select.focus(); }catch(e){}
    }, 0);
  });
}

function openTraExternalBookingUrl(jumpUrl) {
  const href = String(jumpUrl || '').trim();
  if (!href) return false;

  let targetWindow = window;
  try {
    if (window.top && window.top !== window) targetWindow = window.top;
  } catch (_) {
    targetWindow = window;
  }

  try {
    const anchor = document.createElement('a');
    anchor.href = href;
    anchor.rel = 'noopener';
    anchor.target = targetWindow === window ? '_self' : '_top';
    anchor.style.display = 'none';
    (document.body || document.documentElement).appendChild(anchor);
    anchor.click();
    anchor.remove();
  } catch (_) {}

  window.setTimeout(() => {
    if (document.visibilityState === 'hidden') return;
    try {
      if (typeof targetWindow.location.assign === 'function') targetWindow.location.assign(href);
      else targetWindow.location.href = href;
    } catch (_) {
      window.location.href = href;
    }
  }, 180);

  return true;
}

function shouldUseTraWebFallbackForBookingError(statusCode, errorText) {
  const text = String(errorText || '').trim();
  if (statusCode === 401 || statusCode === 403) return true;
  return /Missing required realm role|required scope\/role|Access key not found/i.test(text);
}

async function openTraBookingDeepLink(trainNo, startStationName, endStationName, dateStr) {
  try {
    const buildBookingHeaders = (token) => {
      if (typeof window.buildTdxAuthHeaders === 'function') {
        return window.buildTdxAuthHeaders(token);
      }
      const headers = {
        'Accept': 'application/json'
      };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      if (window.TDX_CONFIG?.clientId || TDX_CONFIG?.clientId) {
        headers['x-api-key'] = window.TDX_CONFIG?.clientId || TDX_CONFIG.clientId;
      }
      return headers;
    };
    const readErrorText = async (response) => {
      try {
        const raw = await response.text();
        return String(raw || '').trim();
      } catch (_) {
        return '';
      }
    };
    const requestDeepLink = async (forceRefresh = false) => {
      const token = await getAccessToken(forceRefresh);
      if (!token) return { ok: false, reason: 'no-token' };
      const response = await fetch(apiUrl, {
        method: 'GET',
        headers: buildBookingHeaders(token)
      });
      return { ok: response.ok, response };
    };

    const token = await getAccessToken(); 
    if (!token) {
      alert("認證授權失敗，請檢查 Key 設定");
      return;
    }

    // 2. 格式化參數：站名必須轉為「臺」而非「台」
    const sName = startStationName.replace(/台/g, '臺');
    const eName = endStationName.replace(/台/g, '臺');

    const apiUrl = `https://tdx.transportdata.tw/api/maas-tra/booking/deeplink/direct/tra?start_station=${encodeURIComponent(sName)}&end_station=${encodeURIComponent(eName)}&train_date=${encodeURIComponent(dateStr)}&train_number=${encodeURIComponent(String(trainNo))}`;

    let { response } = await requestDeepLink(false);
    if ((response?.status === 401 || response?.status === 403) && typeof getAccessToken === 'function') {
      ({ response } = await requestDeepLink(true));
    }

    if (!response?.ok) {
      const errorText = await readErrorText(response);
      if (response?.status === 401 || response?.status === 403) {
        if (shouldUseTraWebFallbackForBookingError(response.status, errorText)) {
          const fallbackUsed = await maybeFallbackTraBookingToWeb(trainNo, startStationName, endStationName, dateStr, errorText);
          if (fallbackUsed) return;
        }
        alert(`TDX 訂票授權失敗（HTTP ${response.status}）。${errorText ? `\n${errorText}` : '\n請重新整理後再試；若仍失敗，再確認 MaaS API 權限與訂閱設定。'}`);
        return;
      }
      alert(`取得連結失敗（HTTP ${response?.status || '--'}）${errorText ? `\n${errorText}` : ''}`);
      return;
    }

    const result = await response.json();

    // 連結通常在 result.data.deeplink
    const jumpUrl = (result.data && result.data.deeplink) || result.DeepLinkUrl || result.url;

    if (jumpUrl) {
      console.log("正在跳轉至：", jumpUrl);
      openTraExternalBookingUrl(jumpUrl);
    } else {
      console.error("API 結構不符，請檢查：", result);
      alert("取得連結失敗，格式不正確");
    }

  } catch (err) {
    console.error("訂票流程出錯:", err);
    alert("系統錯誤，請查看主控台");
  }
}


  // ===== 取消尖峰時間特別顏色 =====
  function highlightPeak(t){ return t || '--'; }

  // ===== 耗時條：極端值處理（P95 cap）+ 漸層色 =====
  function percentile(sortedArr, p){
    if(!sortedArr || !sortedArr.length) return 1;
    const idx = (sortedArr.length - 1) * p;
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    if(lo === hi) return sortedArr[lo];
    const w = idx - lo;
    return sortedArr[lo] * (1 - w) + sortedArr[hi] * w;
  }
  
  // ===== 耗時條：最短只塗一點 + P95 cap + 單色漸層（綠→黃→橘→紅→紫）=====
  function lerp(a,b,t){ return a + (b-a)*t; }
  function hexToRgb(hex){
    const h = String(hex||'').replace('#','').trim();
    if(h.length===3){
      const r=parseInt(h[0]+h[0],16), g=parseInt(h[1]+h[1],16), b=parseInt(h[2]+h[2],16);
      return {r,g,b};
    }
    if(h.length===6){
      const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
      return {r,g,b};
    }
    return {r:100,g:116,b:139}; // slate-500
  }
  function rgbToCss({r,g,b}){ return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`; }

  function travelColorSolid(norm01){
    const t = Math.max(0, Math.min(1, norm01));
    // 5 段色階：綠/黃/橘/紅/紫（避免看起來像彩虹）
    const stops = [
      {p:0.00, c:'#22c55e'}, // green
      {p:0.25, c:'#eab308'}, // yellow
      {p:0.50, c:'#f97316'}, // orange
      {p:0.75, c:'#ef4444'}, // red
      {p:1.00, c:'#8b5cf6'}  // purple
    ];
    let a = stops[0], b = stops[stops.length-1];
    for(let i=0;i<stops.length-1;i++){
      if(t>=stops[i].p && t<=stops[i+1].p){ a=stops[i]; b=stops[i+1]; break; }
    }
    const tt = (b.p===a.p) ? 0 : (t - a.p)/(b.p - a.p);
    const ra = hexToRgb(a.c), rb = hexToRgb(b.c);
    return rgbToCss({ r: lerp(ra.r, rb.r, tt), g: lerp(ra.g, rb.g, tt), b: lerp(ra.b, rb.b, tt) });
  }

  // minMin：列表最短耗時；capMin：P95 上限（極端值填滿）
  function getTravelBarStyle(travelMin, minv, cap){
  // 規則：
  // - 最短耗時：5%
  // - 極端值(>=cap)：100%
  // - 其餘在 5%~100% 之間按比例分配
  const minFill = 5; // %
  if(!Number.isFinite(travelMin) || travelMin<=0){
    return { widthPct: 0, fillColor: 'var(--tr-color)', isExtreme:false };
  }
  const span = Math.max(1, (cap - minv));
  let widthPct;
  let isExtreme = false;

  if(travelMin >= cap){
    widthPct = 100;
    isExtreme = true;
  }else{
    const t = Math.max(0, Math.min(1, (travelMin - minv) / span));
    widthPct = minFill + t * (100 - minFill);
  }

  // 色階：綠 → 黃 → 橘 → 紅 → 紫（連續漸層），整條使用同一色
  // 以「條長比例」判定色階（最短 5% 視為 0）
  const colorT = Math.max(0, Math.min(1, (widthPct - minFill) / (100 - minFill)));
  const fillColor = gradientGYORP(colorT);

  return { widthPct, fillColor, isExtreme };
}

function gradientGYORP(t){
  const stops = [
    {p:0.00, c:'#22c55e'}, // green
    {p:0.25, c:'#eab308'}, // yellow
    {p:0.50, c:'#f97316'}, // orange
    {p:0.75, c:'#ef4444'}, // red
    {p:1.00, c:'#a855f7'}  // purple
  ];
  t = Math.max(0, Math.min(1, t));
  let a = stops[0], b = stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(t>=stops[i].p && t<=stops[i+1].p){ a=stops[i]; b=stops[i+1]; break; }
  }
  const u = (t - a.p) / Math.max(1e-9, (b.p - a.p));
  const ca = hexToRgb(a.c), cb = hexToRgb(b.c);
  const r = Math.round(ca.r + (cb.r - ca.r)*u);
  const g = Math.round(ca.g + (cb.g - ca.g)*u);
  const bl = Math.round(ca.b + (cb.b - ca.b)*u);
  return `rgb(${r},${g},${bl})`;
}
function hexToRgb(hex){
  const h = hex.replace('#','').trim();
  const n = parseInt(h.length===3 ? h.split('').map(ch=>ch+ch).join('') : h, 16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}

  // ===== 資料刷新：同時抓查詢日 + 前一天（補跨日站別） =====
  async function refreshData(dateStr, options){
    const opts = options || {};
    const silent = !!opts.silent;
    currentQueryDateStr = dateStr || '';

    if(!silent){
      showLoading(`正在獲取「${dateStr||currentQueryDateStr||''}」的資料...`);
    }
    try{
    if(!silent && document.getElementById('loading-text')){
      document.getElementById('loading-text').textContent = `正在獲取 ${dateStr} 真實時刻表...`;
    }

    // 先抓當天（發車日 = dateStr）
    await fetchRealData(dateStr);
    baseSchedule = (typeof structuredClone==='function') ? structuredClone(window.trainSchedule) : JSON.parse(JSON.stringify(window.trainSchedule||{}));

    // 再抓前一天（發車日 = dateStr-1）
    const prevDate = addDays(dateStr, -1);
    await fetchRealData(prevDate);
    prevSchedule = (typeof structuredClone==='function') ? structuredClone(window.trainSchedule) : JSON.parse(JSON.stringify(window.trainSchedule||{}));

    // 抓完再抓回當天（避免 UI 其他功能誤用到 prev）
    await fetchRealData(dateStr);
    window.trainSchedule = baseSchedule;

    // 查今天，或查昨天但列車可能仍在運行時，也要抓即時誤點
    const todayStr = fmtDate(new Date());
    const yestStr = addDays(todayStr, -1);
    if(dateStr === todayStr || dateStr === yestStr) await updateLiveDelay();

    buildStationIndex();

    // 建 train instance list（避免同車次跨日 key 覆蓋）
    originDateByKey = {};
    scheduleKeyList = [];

    Object.keys(baseSchedule||{}).forEach(trainNo=>{
      const key = `${trainNo}@${dateStr}`;
      originDateByKey[key] = dateStr;
      scheduleKeyList.push({ key, trainNo, originDate: dateStr, data: baseSchedule[trainNo] });
    });
    Object.keys(prevSchedule||{}).forEach(trainNo=>{
      const key = `${trainNo}@${prevDate}`;
      originDateByKey[key] = prevDate;
      scheduleKeyList.push({ key, trainNo, originDate: prevDate, data: prevSchedule[trainNo] });
    });

    fillStationDatalist('');
    fillTrainDatalist('');
    selectedTrainTypesStartEnd = getSelectedTypesSafe('startend');
    selectedTrainTypesStation = getSelectedTypesSafe('station');

    // 建置篩選器：手機版改用列表模式 (list)，電腦版維持 chips
    buildTrainTypeChips('trainTypeChipsStartEnd', ()=>{}, 'chips'); 
    buildTrainTypeChips('trainTypeChipsMobile', ()=>{}, 'list');   
    
    buildTrainTypeChips('trainTypeChipsStation', ()=>{}, 'chips');
    buildTrainTypeChips('trainTypeChipsStationMobile', ()=>{}, 'list');
    
    renderHistory();
    if(typeof window.rerenderVisibleResults === 'function'){
      await window.rerenderVisibleResults();
    }else{
      stationQuery2Controller?.refreshChrome?.();
      trainQuery2Controller?.refreshChrome?.();
      if(lastStationQueryV2?.station){
        stationQuery2Controller?.setState?.({
          station: lastStationQueryV2.station,
          direction: lastStationQueryV2.dir,
          selectedFilters: lastStationQueryV2.selectedTypes || []
        });
        await stationQuery2Controller?.rerender?.();
      }
      if(lastTrainQuery?.trainNo) await filterTrainScheduleByNumber(lastTrainQuery.trainNo);
    }
    updateHeroSnapshot();

    }finally{
      if(!silent){
        hideLoading();
      }
    }
  }

function buildDirectList(st, ed){
    const list = [];

    (scheduleKeyList||[]).forEach(inst=>{
      const num = inst.trainNo;
      const t = inst.data;
      const originDate = inst.originDate;

      if(!t) return;
      if(selectedTrainTypesStartEnd.length && !selectedTrainTypesStartEnd.includes(t['車種'])) return;

      const arr = t['車站時間'] || [];
      const si = arr.findIndex(x=>x[0]===st);
      const ei = arr.findIndex(x=>x[0]===ed);
      if(si<0 || ei<0 || ei<=si) return;

      // 用到/開雙時刻的 absMin 來推跨日日期（比照高鐵版）
      const absAD = buildAbsArrDep(arr);
      const stAbs = absAD.absDep[si] ?? absAD.absArr[si];
      const edAbs = absAD.absArr[ei] ?? absAD.absDep[ei];
      if(stAbs === null || stAbs === undefined || edAbs === null || edAbs === undefined) return;

      const depSched = splitArrDep(arr[si]).dep || '--'; // 出發：開車
      const arrSched = splitArrDep(arr[ei]).arr || '--'; // 抵達：到達
 
      const depAdj = getAdjustedTime(num, depSched, currentQueryDateStr, stAbs, originDate);
      const depStopDateStr = getDisplayStopDateStr(depAdj, originDate, stAbs);

      // 只收「出發站實際顯示日期 = 使用者選的查詢日期」的結果
      if(depStopDateStr !== currentQueryDateStr) return;

      const arrAdj = getAdjustedTime(num, arrSched, currentQueryDateStr, edAbs, originDate);

      // ✅ 耗時：以「迄站到達」-「起站開車」為準（跨日用日期時間計算，避免直達算錯）
      const depTimeStr = (splitArrDep(arr[si]).dep || splitArrDep(arr[si]).arr || '--');
      const arrTimeStr = (splitArrDep(arr[ei]).arr || splitArrDep(arr[ei]).dep || '--');
      const depDT2 = buildDateTimeFromDateAndHHMM(getStopDateStr(originDate, stAbs), depTimeStr);
      const arrDT2 = buildDateTimeFromDateAndHHMM(getStopDateStr(originDate, edAbs), arrTimeStr);

      // 耗時 = 抵達(到達) - 出發(開車)
      // 直達段落優先用「HH:MM 自身跨日」處理（避免 DateTime 因查詢日/發車日造成負值）
      const depM = parseTime(depTimeStr);
      const arrM = parseTime(arrTimeStr);
      let travelMin = (depM!==null && arrM!==null) ? (arrM - depM) : null;
      if(Number.isFinite(travelMin) && travelMin < 0) travelMin += 1440;

      // 次選：用含跨日的 absMin；最後才用 DateTime（保留既有邏輯但避免負值）
      if(!Number.isFinite(travelMin)){
        travelMin = (Number.isFinite(edAbs) && Number.isFinite(stAbs)) ? (edAbs - stAbs) : null;
      }
      if(Number.isFinite(travelMin) && travelMin < 0) travelMin += 1440;

      if(!Number.isFinite(travelMin) && depDT2 && arrDT2){
        travelMin = Math.round((arrDT2 - depDT2)/60000);
        if(Number.isFinite(travelMin) && travelMin < 0) travelMin += 1440;
      }

      if(!Number.isFinite(travelMin) || travelMin < 0) travelMin = (edAbs - stAbs);
const travel = `${Math.floor(travelMin/60)}h ${travelMin%60}m`;
const stopsCount = ei - si - 1;

      // 取得停靠站列表
      const stopsList = arr.slice(si+1, ei).map(x => x[0]);

      const status = getTrainStatusLabel(
        num,
        originDate,
        (arr[0]?.[2]||arr[0]?.[1]||''),
        (arr.slice(-1)[0]?.[1]||arr.slice(-1)[0]?.[2]||''),
        stAbs,
        arr,
        si
      );

      list.push({
        num,
        originDate, // ★ 重要：點進詳情必須用發車日
        type: t['車種'],
        rawType: t['原始車種'] || '',
        range: `${arr[0][0]}➝${arr[arr.length-1][0]}`,
        depSched,
        arrSched,
        depAbs: stAbs,
        arrAbs: edAbs,
        depHTML: renderTimeWithDelay(num, depSched, currentQueryDateStr, { suppressStrike: status==='已過站' }, stAbs, originDate),
        arrHTML: renderTimeWithDelay(num, arrSched, currentQueryDateStr, { suppressStrike: (status==='已到終點' || status==='已過站') }, edAbs, originDate),
        depSortMin: (status==='已過站' ? (parseTime(depSched) ?? 9999) : (depAdj.adjMin ?? 9999)),
        arrSortMin: ((status==='已到終點' || status==='已過站') ? (parseTime(arrSched) ?? 9999) : (arrAdj.adjMin ?? 9999)),
        travel,
        travelMin,
        stopsCount,
        stopsList, // 新增：純站名列表
        status,
        startStation: st,
        endStation: ed
      });
    });

    // 用「誤點後時間」排序（原規則不變）
    list.sort((a,b)=>a.depSortMin - b.depSortMin);
    if(startEndSortState.key){
      sortStartEndListInPlace(list, startEndSortState);
    }
    currentStartEndList = list;
  }



  // ===== 即時誤點：取分鐘數（晚到/提早） =====
function getDelayMinutes(trainNo){
  let raw = '';
  try { raw = (typeof getDelayStatus === 'function') ? (getDelayStatus(String(trainNo)) || '') : ''; } catch(e){ raw=''; }
  if(!raw) return 0;

  // 常見格式：晚 5 分、晚5分
  let m = raw.match(/晚\s*([\-]?\d+)\s*分/);
  if(m) return parseInt(m[1], 10) || 0;

  // 也支援你 UI 轉成的字串：誤點 5 分 / 提早 3 分
  m = raw.match(/誤點\s*([\-]?\d+)\s*分/);
  if(m) return parseInt(m[1], 10) || 0;

  m = raw.match(/提早\s*([\-]?\d+)\s*分/);
  if(m) return -(parseInt(m[1], 10) || 0);

  return 0;
}

function addMinutesToHHMM(hhmm, deltaMin){
  if(!hhmm || !/^\d{1,2}:\d{2}$/.test(hhmm)) return hhmm;
  const [h, m] = hhmm.split(':').map(x=>parseInt(x,10));
  let t = h*60 + m + deltaMin;
  // 允許跨日：限制在 0..1439 內
  t = ((t % 1440) + 1440) % 1440;
  const nh = String(Math.floor(t/60)).padStart(2,'0');
  const nm = String(t%60).padStart(2,'0');
  return `${nh}:${nm}`;
}

// 查「今天」或「昨天仍可能在跑的班次」時可套用即時誤點
function isQueryToday(dateStr){
  const todayStr = fmtDate(new Date());
  const yestStr = addDays(todayStr, -1);
  return !!dateStr && (dateStr === todayStr || dateStr === yestStr);
}

// 回傳：{sched, adj, adjMin, hasDelay}
function getAdjustedTime(trainNo, schedHHMM, queryDateStr, baseAbsMin=null, originDateStr=null){
  const sched = schedHHMM || '--';
  const noDelayResult = {
    sched, adj: sched,
    adjMin: parseTime(sched),
    hasDelay: false,
    schedAbsMin: (baseAbsMin!=null ? baseAbsMin : parseTime(sched)),
    adjAbsMin: (baseAbsMin!=null ? baseAbsMin : parseTime(sched)),
    schedDateStr: (originDateStr && baseAbsMin!=null ? getStopDateStr(originDateStr, baseAbsMin) : null),
    adjDateStr: (originDateStr && baseAbsMin!=null ? getStopDateStr(originDateStr, baseAbsMin) : null)
  };

  let dmin = 0;
  if(originDateStr){
    const schedule = getScheduleByOrigin(trainNo, originDateStr);
    const stops = schedule?.['車站時間'] || [];
    if(stops.length){
      const firstTimeStr = (stops[0]?.[2]||stops[0]?.[1]||'');
      const lastTimeStr  = (stops.slice(-1)[0]?.[1]||stops.slice(-1)[0]?.[2]||'');
      dmin = getTrainDetailRuntimeContext(trainNo, originDateStr, firstTimeStr, lastTimeStr).delayMin;
    }else{
      dmin = getDelayMinutes(trainNo);
    }
  }else{
    if(!isQueryToday(queryDateStr)) return noDelayResult;
    dmin = getDelayMinutes(trainNo);
  }

  // 只有「真的有誤點/提早」才顯示雙時間；0 就保持單時間
  if(!dmin) return noDelayResult;

  const adj = addMinutesToHHMM(sched, dmin);

  // 重要：跨日車 + 誤點/提早 可能把時刻推過 00:00（或拉回前一天）
  // 如果提供 baseAbsMin（用於跨日判定），就用它 + dmin 算真正落在哪一天。
  const schedAbs = (baseAbsMin!=null ? baseAbsMin : parseTime(sched));
  const adjAbs = (baseAbsMin!=null ? (baseAbsMin + dmin) : parseTime(adj));

  const schedDateStr = (originDateStr && baseAbsMin!=null ? getStopDateStr(originDateStr, baseAbsMin) : null);
  const adjDateStr   = (originDateStr && baseAbsMin!=null ? getStopDateStr(originDateStr, adjAbs) : null);

  return { sched, adj, adjMin: parseTime(adj), hasDelay: true, schedAbsMin: schedAbs, adjAbsMin: adjAbs, schedDateStr, adjDateStr };
}

function getDisplayStopDateStr(timeInfo, originDateStr, baseAbsMin=null){
  if(timeInfo?.adjDateStr) return timeInfo.adjDateStr;
  if(timeInfo?.schedDateStr) return timeInfo.schedDateStr;
  if(originDateStr && baseAbsMin!==null && baseAbsMin!==undefined) return getStopDateStr(originDateStr, baseAbsMin);
  return originDateStr || '';
}

// ===== 訂票可用性判斷（對號車 + 開車>=現在+10分鐘） =====
function isSpecialCharterTrainNo(trainNo){
  const s = String(trainNo||'').trim();
  return /^6\d{3}$/.test(s); // 6xxx 專車
}

function isNonReservedLocalType(typeStr){
  const t = String(typeStr||'');
  // 區間 / 區間快 一律不可訂票
  return t.includes('區間快') || t.includes('區間');
}

function buildDateTimeFromDateAndHHMM(dateStr, hhmm){
  // dateStr: YYYY-MM-DD, hhmm: HH:MM
  if(!dateStr || !hhmm || hhmm==='--') return null;
  const m = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(hhmm);
  if(!m) return null;
  const [y,mo,d] = String(dateStr).split('-').map(x=>parseInt(x,10));
  const H = parseInt(m[1],10), M = parseInt(m[2],10);
  // 用本地時區（你環境 +08）
  return new Date(y, (mo||1)-1, d||1, H, M, 0, 0);
}

function getBookingEligibilityByRow(r){
  // r: currentStartEndList item
  if(!r) return { ok:false, reason:'無法取得列車資訊' };

  const trainNo = String(r.num || r.trainNo || '').trim();
  const typeStr = String(r.type || '');
  const rawTypeStr = String(r.rawType || r.originalType || r['原始車種'] || '');
  const fullTypeText = `${typeStr} ${rawTypeStr}`;

  if(isSpecialCharterTrainNo(trainNo) || /專車/.test(fullTypeText) || /[（(][^）)]*專車[^）)]*[）)]/.test(fullTypeText)){
    return { ok:false, reason:'專車不提供訂票' };
  }
  if(isNonReservedLocalType(typeStr)){
    return { ok:false, reason:'區間/區間快不提供訂票' };
  }

  // 以「誤點後」開車時間判斷是否>=現在+10分鐘
  const depAbs = (r && r.depAbs !== undefined) ? r.depAbs : null;
  const originDate = r?.originDate || null;
  const tAdj = getAdjustedTime(trainNo, r.depSched, currentQueryDateStr, depAbs, originDate);
  const depHHMM = (tAdj && tAdj.adj) ? tAdj.adj : r.depSched;
  const depDateStr = (originDate && depAbs !== null && depAbs !== undefined) ? getStopDateStr(originDate, depAbs) : currentQueryDateStr;
  const depDT = buildDateTimeFromDateAndHHMM(depDateStr, depHHMM);
  if(!depDT) return { ok:false, reason:'開車時間無法判斷' };

  const now = new Date();
  const threshold = new Date(now.getTime() + 10*60*1000);
  if(depDT < threshold){
    return { ok:false, reason:'開車時間距離現在未滿10分鐘' };
  }

  return { ok:true, reason:'' };
}



// UI：把時間顯示成「原時間刪線 + 新時間」

// UI：把時間顯示成「原時間刪線 + 新時間」
// opts: { suppressStrike?: boolean }  // 已過站時可關閉刪線，只顯示更新後時間
function renderTimeWithDelay(trainNo, schedHHMM, queryDateStr, opts, baseAbsMin=null, originDateStr=null){
  const t = getAdjustedTime(trainNo, schedHHMM, queryDateStr, baseAbsMin, originDateStr);
  if(!t.hasDelay) return (schedHHMM || '--');

  const suppress = !!(opts && opts.suppressStrike);
  if(suppress){
    // 已過站/已到終點：顯示原始時刻，不套用誤點
    return (t.sched || schedHHMM || '--');
  }

  // 若誤點/提早導致「跨日」變動，補一個小日期提示（只在真的變動時顯示）
  let dayHint = '';
  if(t.adjDateStr && t.schedDateStr && t.adjDateStr !== t.schedDateStr){
    const md = t.adjDateStr.slice(5).replace('-', '/'); // MM/DD
    dayHint = `<span style="margin-left:6px;color:var(--text-muted);font-weight:700;font-size:.78em;">${md}</span>`;
  }

  // 不動你原本 CSS：用 inline style
  return `
    <span style="text-decoration:line-through;color:var(--text-muted);margin-right:6px;">
      ${t.sched}
    </span>
    <span style="font-weight:800;color:var(--text-main);">
      ${t.adj}
    </span>
    ${dayHint}
  `;
}

  if(si<0 || ei<0 || ei<=si) return;

  if(icon) icon.textContent = '▲';
}

  // ===== 轉乘（中途站：到達/開車分開） =====
  
function buildTransferList(st, ed){
  // 轉乘模式：同一個「出發班次 n1」只保留「耗時最短」的一個方案（可能是直達，也可能是轉乘）
  // 顯示日期判斷：以「出發站 st 的時刻」落在哪一天為準（比照高鐵版）
  const insts = scheduleKeyList || [];
  const selectedTypes = new Set((selectedTrainTypesStartEnd || []).map((value)=>String(value || '')));
  // 先依車種縮小候選池，再從候選池重新組轉乘方案，避免只是對既有結果做後篩選。
  const candidateInsts = selectedTypes.size
    ? insts.filter((inst)=>inst?.data && selectedTypes.has(String(inst.data['車種'] || '')))
    : insts.slice();
  const plans = []; // {n1, n2?, ...}

  candidateInsts.forEach(inst1=>{
    const n1 = String(inst1.trainNo);
    const t1 = inst1.data;
    const originDate1 = inst1.originDate;

    if(!t1) return;

    const a1 = t1['車站時間']||[];
    if(a1.length < 2) return;

    const sIdx = a1.findIndex(x=>x[0]===st);
    if(sIdx < 0) return;

    const abs1 = buildAbsArrDep(a1);

    // ✅ 以「查詢出發站 st」的開車時間作為方案出發時間與耗時計算基準
    const stDepStr = (splitArrDep(a1[sIdx]||[]).dep || splitArrDep(a1[sIdx]||[]).arr || '--');
    const stDepAbs = abs1.absDep[sIdx] ?? abs1.absArr[sIdx];
    if(stDepAbs === null || stDepAbs === undefined) return;

    const stDepAdj = getAdjustedTime(n1, stDepStr, currentQueryDateStr, stDepAbs, originDate1);
    const depStopDateStr = getDisplayStopDateStr(stDepAdj, originDate1, stDepAbs);
    if(depStopDateStr !== currentQueryDateStr) return;

    const depDT = buildDateTimeFromDateAndHHMM(getStopDateStr(originDate1, stDepAbs), stDepStr);
    if(!depDT) return;

    const originStation = a1[0]?.[0] || '';

    // 試算「直達方案」
    let bestPlan = null;

    const eIdxDirect = a1.findIndex(x=>x[0]===ed);
    if(eIdxDirect >= 0 && eIdxDirect > sIdx){
      const endArrStr = (splitArrDep(a1[eIdxDirect]||[]).arr || splitArrDep(a1[eIdxDirect]||[]).dep || '--');
      const endArrAbs = abs1.absArr[eIdxDirect] ?? abs1.absDep[eIdxDirect];

      if(endArrAbs !== null && endArrAbs !== undefined){
        const endArrDateStr = getStopDateStr(originDate1, endArrAbs);
        const endArrDT = buildDateTimeFromDateAndHHMM(endArrDateStr, endArrStr);
        if(endArrDT){
          const travelMin = Math.round((endArrDT - depDT)/60000);
          if(Number.isFinite(travelMin) && travelMin >= 0){
            const status = getTrainStatusLabel(
              n1,
              originDate1,
              (a1[0]?.[2]||a1[0]?.[1]||''),
              (a1.slice(-1)[0]?.[1]||a1.slice(-1)[0]?.[2]||''),
              stDepAbs,
              a1,
              sIdx
            );
            const suppressPassed = (status === '已過站' || status === '已到終點' || status === '已到終點站');

            const endArrAdj = getAdjustedTime(n1, endArrStr, currentQueryDateStr, endArrAbs, originDate1);

            bestPlan = {
              trainNumber: String(n1),
              n1,
              n2: null,
              originDate1,
              originDate2: null,

              type1: t1['車種'],
              rawType1: t1['原始車種'] || '',
              type2: null,
              isDirect: true,
              startStation: st,
              endStation: ed,
              transferStation: null,

              originStation,
              stDepAbs,
              arrAbs: endArrAbs,
              depSched: stDepStr,
              depHTML: renderTimeWithDelay(n1, stDepStr, currentQueryDateStr, { suppressStrike: suppressPassed }, stDepAbs, originDate1),
              startDepAtQueryStation: stDepStr,

              arrSched: endArrStr,
              arrHTML: renderTimeWithDelay(n1, endArrStr, currentQueryDateStr, { suppressStrike: suppressPassed }, endArrAbs, originDate1),

              depSortMin: (suppressPassed ? (parseTime(stDepStr) ?? 9999) : (stDepAdj.adjMin ?? 9999)),
              arrSortMin: (suppressPassed ? (parseTime(endArrStr) ?? 9999) : (endArrAdj.adjMin ?? 9999)),

              travelMin,
              travel: `${Math.floor(travelMin/60)}h ${travelMin%60}m`,
              status
            };
          }
        }
      }
    }

    // 試算「轉乘方案」：n1 (st -> mid) + n2 (mid -> ed)
    candidateInsts.forEach(inst2=>{
      const n2 = String(inst2.trainNo);
      if(n2 === n1) return;

      const t2 = inst2.data;
      const originDate2 = inst2.originDate;
      if(!t2) return;

      const a2 = t2['車站時間']||[];
      if(a2.length < 2) return;

      const eIdx2 = a2.findIndex(x=>x[0]===ed);
      if(eIdx2 < 0) return;

      const abs2 = buildAbsArrDep(a2);

      if(!endArrDT2) return;

      for(let i=sIdx+1;i<a1.length;i++){

        const midIdx2 = a2.findIndex(x=>x[0]===mid);
        if(midIdx2 < 0) continue;
        if(!(midIdx2 < eIdx2)) continue;

        const midArrStr1 = (splitArrDep(a1[i]||[]).arr || splitArrDep(a1[i]||[]).dep || '--');
        const midArrAbs1 = abs1.absArr[i] ?? abs1.absDep[i];

        const midArrDateStr1 = getStopDateStr(originDate1, midArrAbs1);
        const midArrDT1 = buildDateTimeFromDateAndHHMM(midArrDateStr1, midArrStr1);
        if(!midArrDT1) continue;

        const midDepStr2 = (splitArrDep(a2[midIdx2]||[]).dep || splitArrDep(a2[midIdx2]||[]).arr || '--');
        const midDepAbs2 = abs2.absDep[midIdx2] ?? abs2.absArr[midIdx2];

        const midDepDateStr2 = getStopDateStr(originDate2, midDepAbs2);

        if(!Number.isFinite(waitMin) || waitMin < 0) continue;

        // 轉乘等待上限維持原本精神（避免過長等待）
        if(waitMin > 90) continue;

        const travelMin = Math.round((endArrDT2 - depDT)/60000);
        if(!Number.isFinite(travelMin) || travelMin < 0) continue;

        const status = getTrainStatusLabel(
          n1,
          originDate1,
          (a1[0]?.[2]||a1[0]?.[1]||''),
          (a1.slice(-1)[0]?.[1]||a1.slice(-1)[0]?.[2]||''),
          stDepAbs,
          a1,
          sIdx
        );
        const suppressPassed = (status === '已過站' || status === '已到終點' || status === '已到終點站');

        const endArrAdj2 = getAdjustedTime(n2, endArrStr2, currentQueryDateStr, endArrAbs2, originDate2);

        const candidate = {
          trainNumber: `${n1}+${n2}`,
          n1,
          n2,
          originDate1,
          originDate2,

          type1: t1['車種'],
          rawType1: t1['原始車種'] || '',
          type2: t2['車種'],
          rawType2: t2['原始車種'] || '',
          isDirect: false,
          startStation: st,

          depHTML: renderTimeWithDelay(n1, stDepStr, currentQueryDateStr, { suppressStrike: suppressPassed }, stDepAbs, originDate1),

          midArr: midArrStr1,
          midDep: midDepStr2,
          waitMin,
          midArrHTML: renderTimeWithDelay(n1, midArrStr1, currentQueryDateStr, { suppressStrike: suppressPassed }, midArrAbs1, originDate1),
          midDepHTML: renderTimeWithDelay(n2, midDepStr2, currentQueryDateStr, { suppressStrike: suppressPassed }, midDepAbs2, originDate2),

          arrSched: endArrStr2,
          arrHTML: renderTimeWithDelay(n2, endArrStr2, currentQueryDateStr, { suppressStrike: suppressPassed }, endArrAbs2, originDate2),

          depSortMin: (suppressPassed ? (parseTime(stDepStr) ?? 9999) : (stDepAdj.adjMin ?? 9999)),
          arrSortMin: (suppressPassed ? (parseTime(endArrStr2) ?? 9999) : (endArrAdj2.adjMin ?? (parseTime(endArrStr2) ?? 9999))),

          travelMin,
          travel: `${Math.floor(travelMin/60)}h ${travelMin%60}m`,
          status
        };

        if(!bestPlan || candidate.travelMin < bestPlan.travelMin){
          bestPlan = candidate;
        }
      }
    });

    if(bestPlan) plans.push(bestPlan);
  });

  // ✅ 同一個「出發班次 n1（含發車日）」只保留最短耗時方案
  const bestByN1 = new Map();
  plans.forEach(p=>{
    const key = String(p.n1) + '@' + String(p.originDate1||'');
    const cur = bestByN1.get(key);
    if(!cur || p.travelMin < cur.travelMin) bestByN1.set(key, p);
  });

  currentTransferList = Array.from(bestByN1.values());

  // ✅ 去除「最後搭同一班直達車」但更慢(或一樣慢)的轉乘方案
  const directMinByTrain = new Map();
  currentTransferList.forEach(p=>{
    if(p && p.isDirect){
      directMinByTrain.set(String(p.n1), p.travelMin);
    }
  });
  currentTransferList = currentTransferList.filter(p=>{
    if(!p || p.isDirect) return true;
    const n2 = p.n2 ? String(p.n2) : '';
    if(!n2) return true;
    const dmin = directMinByTrain.get(n2);
    if(dmin === undefined) return true;
    return p.travelMin < dmin;
  });

  // ✅ 同一個後續轉乘車次 n2 且「抵達時間相同」：只留耗時最短的一個方案（沿用你原本規則）
  (function dedupeSameN2SameArr(){
    const directs = currentTransferList.filter(p=>p && p.isDirect);
    const transfers = currentTransferList.filter(p=>p && !p.isDirect);

    const groups = new Map(); // key: n2|arrSched  -> plans[]
    transfers.forEach(p=>{
      const n2 = p.n2 ? String(p.n2) : '';
      const arr = p.arrSched || '';
      const key = n2 + '|' + arr;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });

    const kept = [];
    groups.forEach(list=>{
      list.sort((a,b)=>(a.travelMin||999999)-(b.travelMin||999999));
      const best = list[0];
      kept.push(best);

      const second = list[1];
      if(second && Number.isFinite(best.waitMin) && best.waitMin < 10){
        kept.push(second);
      }
    });

    currentTransferList = directs.concat(kept);
  })();

  // 排序：仍用 depSortMin
  currentTransferList.sort((a,b)=> (a.depSortMin??999999) - (b.depSortMin??999999));
  if(startEndSortState.key){
    sortStartEndListInPlace(currentTransferList, startEndSortState);
  }
}
