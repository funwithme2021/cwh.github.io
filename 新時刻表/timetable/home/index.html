<!DOCTYPE html>
<html lang="zh-Hant" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>Project X</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }

        .entry-frame {
            position: fixed;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            border: 0;
            background: #ffffff;
            overflow: hidden;
        }

        .entry-fallback {
            position: fixed;
            inset: auto 16px 16px 16px;
            z-index: 2;
            display: none;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.88);
            color: #f8fafc;
            line-height: 1.5;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
        }

        .entry-fallback a {
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <iframe
        id="entryFrame"
        class="entry-frame"
        title="Project X"
        scrolling="no"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="clipboard-read; clipboard-write; geolocation"
    ></iframe>

    <div id="entryFallback" class="entry-fallback">
        If the page does not load, open
        <a id="entryFallbackLink" href="https://project-x18fn.vercel.app" target="_blank" rel="noopener">Project X</a>
        directly.
    </div>

    <script>
      (function () {
        const frame = document.getElementById("entryFrame");
        const fallback = document.getElementById("entryFallback");
        const fallbackLink = document.getElementById("entryFallbackLink");
        const target = new URL("https://project-x18fn.vercel.app");

        function buildExternalUrl() {
          const url = new URL(target.href);
          if (location.search) url.search = location.search;
          if (location.hash) url.hash = location.hash;
          return url.toString();
        }

        function syncFrameSrc() {
          const externalUrl = buildExternalUrl();
          if (fallbackLink) fallbackLink.href = externalUrl;
          if (frame && frame.src !== externalUrl) {
            frame.src = externalUrl;
          }
        }

        syncFrameSrc();
        window.addEventListener("hashchange", syncFrameSrc);
        window.addEventListener("popstate", syncFrameSrc);
        window.setTimeout(() => {
          if (frame && !frame.src) {
            if (fallback) fallback.style.display = "block";
            syncFrameSrc();
          }
        }, 3000);
      })();
    </script>
</body>
</html>
