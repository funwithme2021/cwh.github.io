<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rail AI 控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-body:#07111f;
      --bg-header:rgba(7,17,31,0.82);
      --bg-surface:rgba(9,18,34,0.82);
      --bg-soft:rgba(255,255,255,0.04);
      --border:rgba(148,163,184,0.16);
      --text-main:#e2e8f0;
      --text-muted:#94a3b8;
      --accent:#60a5fa;
      --accent-soft:rgba(96,165,250,0.12);
      --shadow:0 24px 56px rgba(2,6,23,0.34);
      --shell-max:1200px;
      --font:'Inter','Noto Sans TC',sans-serif;
    }

    body.light-mode{
      --bg-body:#eef3f8;
      --bg-header:rgba(242,246,251,0.84);
      --bg-surface:rgba(243,247,251,0.9);
      --bg-soft:rgba(226,232,240,0.58);
      --border:rgba(15,23,42,0.08);
      --text-main:#0f172a;
      --text-muted:#475569;
      --accent:#2563eb;
      --accent-soft:rgba(37,99,235,0.10);
      --shadow:0 22px 46px rgba(15,23,42,0.08);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      margin:0;
      min-height:100%;
      font-family:var(--font);
      color:var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(37,99,235,0.18), transparent 24%),
        radial-gradient(circle at bottom right, rgba(14,165,233,0.12), transparent 22%),
        var(--bg-body);
    }

    a,
    button{
      font:inherit;
    }

    .header{
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      background:var(--bg-header);
      border-bottom:1px solid var(--border);
    }

    .header-content,
    .container{
      width:min(var(--shell-max), calc(100% - 32px));
      margin:0 auto;
    }

    .header-content{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:16px 0;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      font-weight:900;
      letter-spacing:.06em;
      color:var(--text-main);
      white-space:nowrap;
    }

    .logo-mark{
      width:40px;
      height:40px;
      display:grid;
      place-items:center;
      border-radius:14px;
      background:linear-gradient(135deg, #2563eb, #0ea5e9);
      color:#fff;
      font-size:.96rem;
      box-shadow:0 14px 30px rgba(37,99,235,0.24);
      flex:0 0 auto;
    }

    .logo-copy{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }

    .logo-copy strong{
      font-size:1rem;
      line-height:1.2;
      letter-spacing:.02em;
    }

    .logo-copy span{
      color:var(--text-muted);
      font-size:.82rem;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn-ghost{
      min-height:42px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--bg-soft);
      color:var(--text-main);
      text-decoration:none;
      cursor:pointer;
      transition:transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .btn-ghost:hover{
      transform:translateY(-1px);
      border-color:rgba(96,165,250,0.28);
      background:var(--accent-soft);
    }

    .btn-ghost .ico{
      font-size:1rem;
      line-height:1;
    }

    .container{
      padding:24px 0 36px;
    }

    .ai-shell{
      border:1px solid var(--border);
      background:
        radial-gradient(circle at top right, rgba(59,130,246,0.10), transparent 26%),
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      box-shadow:var(--shadow);
      border-radius:30px;
      padding:22px;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    body.light-mode .ai-shell{
      background:
        radial-gradient(circle at top right, rgba(59,130,246,0.08), transparent 26%),
        linear-gradient(180deg, rgba(243,247,251,0.92), rgba(234,240,247,0.9));
    }

    @media (max-width: 760px){
      .header-content,
      .container{
        width:min(var(--shell-max), calc(100% - 24px));
      }

      .header-content{
        padding:14px 0;
        align-items:flex-start;
        flex-direction:column;
      }

      .header-actions{
        width:100%;
        justify-content:flex-start;
      }

      .ai-shell{
        padding:16px;
        border-radius:24px;
      }
    }

    @media (max-width: 520px){
      .logo-copy span{
        display:none;
      }

      .btn-ghost .txt{
        display:none;
      }

      .btn-ghost{
        min-width:42px;
        padding:0 12px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <div class="logo" aria-label="Rail AI">
        <div class="logo-mark">AI</div>
        <div class="logo-copy">
          <strong>Rail AI</strong>
          <span>Real-time</span>
        </div>
      </div>

      <div class="header-actions">
        <a class="ai-nav-link btn-ghost" href="./home.html"><span class="ico">🏠</span><span class="txt">首頁</span></a>
        <a class="ai-nav-link btn-ghost" href="../tr/tr.html"><span class="ico">🚆</span><span class="txt">台鐵</span></a>
        <a class="ai-nav-link btn-ghost" href="../thsr/thsr.html"><span class="ico">🚅</span><span class="txt">高鐵</span></a>
        <button class="btn-ghost" id="aiThemeToggle" type="button" title="切換深夜模式"><span class="ico">🌙</span><span class="txt">深夜模式</span></button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="ai-shell" aria-label="AI 助手">
      <div data-rail-assistant-host="ai-page"></div>
    </section>
  </main>

  <script charset="UTF-8" src="./assistant-embed-bridge.js?v=20260326-embedbridge10"></script>
  <script charset="UTF-8" src="../shared/rail-usage-footer.js?v=20260326-footer3"></script>
</body>
</html>
