<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>即時動態</title>
  <style>
    :root {
      --panel-bg: rgba(255, 255, 255, .92);
      --panel-border: rgba(15, 23, 42, .14);
      --text-main: #111827;
      --text-muted: #4b5563;
      --line-tra: #0f766e;
      --line-thsr: #be185d;
      --accent: #0f766e;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      font-family: "Inter", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background: #edf2f7;
      overflow: hidden;
    }

    .home-live-shell {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100vh;
    }

    .home-live-map {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #e6eef2;
    }

    .home-live-topbar {
      position: absolute;
      z-index: 550;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }

    .home-live-title,
    .home-live-actions {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 28px rgba(15, 23, 42, .16);
      backdrop-filter: blur(14px);
    }

    .home-live-title {
      min-width: 0;
      border-radius: 8px;
      padding: 10px 12px;
      pointer-events: auto;
    }

    .home-live-title h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .home-live-title-legend {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #374151;
      font-size: .74rem;
      font-weight: 850;
      line-height: 1;
    }

    .home-live-title-legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .home-live-title-legend i {
      display: inline-block;
      width: 17px;
      height: 3px;
      border-radius: 999px;
      background: currentColor;
    }

    .home-live-inline-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .home-live-popover {
      position: relative;
      line-height: 1;
    }

    .home-live-popover summary {
      list-style: none;
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border: 1px solid rgba(15, 23, 42, .16);
      border-radius: 8px;
      background: #fff;
      color: #111827;
      padding: 0 8px;
      font-size: .74rem;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
    }

    .home-live-popover summary::-webkit-details-marker { display: none; }
    .home-live-popover[open] summary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .home-live-popover-panel {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 700;
      width: min(340px, calc(100vw - 28px));
      padding: 10px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel-bg);
      box-shadow: 0 18px 46px rgba(15, 23, 42, .2);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .home-live-popover:nth-child(2) .home-live-popover-panel {
      left: auto;
      right: 0;
    }

    .home-live-popover-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .78rem;
      color: var(--text-muted);
      font-weight: 900;
    }

    .home-live-popover-panel select,
    .home-live-popover-panel input {
      min-width: 0;
      flex: 1 1 auto;
      height: 34px;
      border: 1px solid rgba(15, 23, 42, .16);
      border-radius: 8px;
      background: #fff;
      color: var(--text-main);
      padding: 0 8px;
      font: inherit;
      font-size: .78rem;
      font-weight: 800;
    }

    .home-live-popover-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .home-live-action-spacer {
      flex: 1 1 auto;
    }

    .home-live-check-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      max-height: min(46vh, 360px);
      overflow: auto;
      padding: 2px;
    }

    .home-live-check-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .home-live-check-group-title {
      color: var(--text-muted);
      font-size: .72rem;
      font-weight: 950;
    }

    .home-live-check-row {
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 7px;
      border: 1px solid rgba(15, 23, 42, .14);
      border-radius: 8px;
      background: rgba(255, 255, 255, .72);
      color: var(--text-main);
      font-size: .78rem;
      font-weight: 900;
      cursor: pointer;
    }

    .home-live-check-row input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
    }

    .home-live-popover-panel p {
      margin: 0;
      color: var(--text-muted);
      font-size: .72rem;
      line-height: 1.5;
    }

    .home-live-title p {
      margin: 3px 0 0;
      color: var(--text-muted);
      font-size: .78rem;
      line-height: 1.35;
      letter-spacing: 0;
      white-space: normal;
    }

    .home-live-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      border-radius: 8px;
      padding: 6px;
      pointer-events: auto;
    }

    .home-live-action {
      appearance: none;
      border: 1px solid rgba(15, 23, 42, .16);
      background: #fff;
      color: #111827;
      border-radius: 8px;
      min-height: 34px;
      padding: 0 10px;
      font: inherit;
      font-size: .82rem;
      font-weight: 850;
      letter-spacing: 0;
      cursor: pointer;
    }

    .home-live-action:hover { border-color: rgba(15, 118, 110, .55); }
    .home-live-action.primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .home-live-filterbar {
      position: absolute;
      z-index: 540;
      top: calc(max(10px, env(safe-area-inset-top)) + 72px);
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
      pointer-events: none;
    }

    .home-live-filter {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      max-width: min(100%, 560px);
      padding: 7px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel-bg);
      box-shadow: 0 10px 28px rgba(15, 23, 42, .14);
      backdrop-filter: blur(14px);
      pointer-events: auto;
    }

    .home-live-filter span {
      padding: 8px 2px 0;
      color: var(--text-muted);
      font-size: .76rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .home-live-filter select,
    .home-live-filter input {
      border: 1px solid rgba(15, 23, 42, .16);
      border-radius: 8px;
      background: #fff;
      color: var(--text-main);
      font: inherit;
      font-size: .78rem;
      font-weight: 800;
    }

    .home-live-filter select {
      min-width: 156px;
      height: 68px;
      padding: 4px 6px;
    }

    .home-live-filter input {
      width: 92px;
      height: 32px;
      padding: 0 8px;
    }

    .home-live-mini-btn {
      border: 1px solid rgba(15, 23, 42, .16);
      background: #fff;
      color: #111827;
      border-radius: 8px;
      min-height: 32px;
      padding: 0 8px;
      font: inherit;
      font-size: .76rem;
      font-weight: 900;
      cursor: pointer;
    }

    .home-live-mini-btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .home-live-track-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-width: 220px;
      padding-top: 2px;
    }

    .home-live-track-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 28px;
      border: 1px solid rgba(15, 118, 110, .26);
      border-radius: 999px;
      background: rgba(15, 118, 110, .08);
      color: var(--text-main);
      padding: 0 8px;
      font: inherit;
      font-size: .76rem;
      font-weight: 900;
      cursor: pointer;
    }

    .home-live-track-empty {
      align-self: center;
      color: var(--text-muted);
      font-size: .76rem;
      font-weight: 850;
    }

    .home-live-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      color: #374151;
      font-size: .76rem;
      font-weight: 750;
    }

    .home-live-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .home-live-legend i {
      display: inline-block;
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: currentColor;
    }

    .home-live-detail-btn {
      appearance: none;
      border: 1px solid rgba(15, 118, 110, .3);
      background: #fff;
      color: #0f766e;
      border-radius: 8px;
      min-height: 34px;
      padding: 0 11px;
      margin-top: 10px;
      font: inherit;
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: 0;
      cursor: pointer;
    }

    .home-live-popup-line {
      margin-top: 5px;
      color: #374151;
      font-size: .84rem;
      line-height: 1.35;
    }

    .home-live-popup-line b {
      color: #111827;
      font-weight: 900;
    }

    .home-live-status-part {
      font-weight: 950;
    }

    .home-live-status-sep {
      padding: 0 3px;
      color: #94a3b8;
      font-weight: 900;
    }

    .home-live-station-label {
      background: transparent !important;
      border: 0 !important;
    }

    .home-live-station-label button {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #1f2937;
      font: inherit;
      font-size: .84rem;
      font-weight: 950;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
      cursor: pointer;
      text-shadow: 0 1px 3px rgba(255, 255, 255, .98), 0 0 9px rgba(255, 255, 255, .86);
    }

    .home-live-station-label.has-alert button {
      color: #b45309;
    }

    .home-live-station-label.is-busy button {
      color: #dc2626;
    }

    .home-live-station-label.is-soon button {
      color: #f97316;
    }

    .home-live-station-label .rail-transfer-badges {
      margin: 0 0 0 1px;
      gap: 1px;
      flex-wrap: nowrap;
    }

    .home-live-station-label .rail-transfer-logo {
      width: 12px;
      height: 12px;
    }

    .home-live-station-popup h3 {
      margin: 0;
      font-size: .98rem;
      line-height: 1.2;
    }

    .home-live-station-popup ul {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
    }

    .home-live-station-popup li {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 6px;
      align-items: baseline;
      padding: 5px 0;
      border-top: 1px solid rgba(15, 23, 42, .1);
      font-size: .82rem;
      line-height: 1.35;
    }

    .home-live-station-popup time {
      color: #0f766e;
      font-weight: 900;
    }

    .home-live-modal {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: block;
      padding: 0;
      background: transparent;
      backdrop-filter: none;
    }

    .home-live-modal.hidden {
      display: none;
    }

    .home-live-modal-card {
      width: min(720px, 100%);
      max-height: min(82vh, 760px);
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      border: 1px solid rgba(15, 23, 42, .14);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 24px 60px rgba(15, 23, 42, .28);
      overflow: hidden;
    }

    .home-live-modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(15, 23, 42, .12);
    }

    .home-live-modal-head h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .home-live-modal-head p {
      margin: 4px 0 0;
      color: #4b5563;
      font-size: .82rem;
      line-height: 1.45;
    }

    .home-live-modal-close {
      appearance: none;
      border: 1px solid rgba(15, 23, 42, .14);
      background: #fff;
      color: #111827;
      border-radius: 8px;
      min-width: 34px;
      height: 34px;
      font: inherit;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }

    .home-live-modal-body {
      overflow: auto;
      padding: 14px 16px 16px;
    }

    .home-live-detail-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .home-live-detail-summary div {
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 8px;
      padding: 9px 10px;
      background: rgba(248, 250, 252, .86);
      min-width: 0;
    }

    .home-live-detail-summary b {
      display: block;
      color: #6b7280;
      font-size: .72rem;
      line-height: 1.2;
    }

    .home-live-detail-summary span {
      display: block;
      margin-top: 4px;
      color: #111827;
      font-size: .86rem;
      font-weight: 900;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .home-live-detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .84rem;
    }

    .home-live-detail-table th,
    .home-live-detail-table td {
      padding: 8px 7px;
      border-bottom: 1px solid rgba(15, 23, 42, .1);
      text-align: left;
      vertical-align: middle;
      line-height: 1.35;
    }

    .home-live-detail-table th {
      color: #6b7280;
      font-size: .74rem;
      font-weight: 900;
    }

    .home-live-detail-pass {
      color: #64748b;
    }

    .home-live-modal .modal-content {
      width: min(780px, 100%);
      max-height: min(86vh, 780px);
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      border: 1px solid rgba(15, 23, 42, .14);
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 24px 60px rgba(15, 23, 42, .28);
      overflow: hidden;
    }

    .home-live-modal .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(15, 23, 42, .12);
      background: rgba(255, 255, 255, .96);
    }

    .home-live-modal .modal-title-main {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      margin: 0;
      color: #111827;
      font-size: 1.1rem;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .home-live-modal .modal-brand-tag {
      display: inline-flex;
      align-items: center;
      border-radius: 8px;
      padding: 3px 7px;
      background: #0f766e;
      color: #fff;
      font-size: .72rem;
      font-weight: 900;
      line-height: 1;
    }

    .home-live-modal .modal-train-no {
      font-weight: 950;
    }

    .home-live-modal .modal-train-type {
      font-size: .9rem;
      font-weight: 950;
    }

    .home-live-modal .modal-title-sub {
      margin-top: 5px;
      color: #4b5563;
      font-size: .84rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .home-live-modal .modal-meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .home-live-modal .modal-meta-sep {
      color: #94a3b8;
      font-weight: 900;
    }

    .home-live-modal .close {
      appearance: none;
      border: 1px solid rgba(15, 23, 42, .14);
      background: #fff;
      color: #111827;
      border-radius: 8px;
      min-width: 34px;
      height: 34px;
      font: inherit;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }

    .home-live-modal .modal-body {
      overflow: auto;
      padding: 16px 18px 18px;
      background: #f8fafc;
    }

    .home-live-modal .modal-hero,
    .home-live-modal .modal-section {
      border: 1px solid rgba(15, 23, 42, .1);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 26px rgba(15, 23, 42, .08);
    }

    .home-live-modal .modal-hero {
      padding: 16px;
    }

    .home-live-modal .modal-route-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(58px, 90px) minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .home-live-modal .modal-route-point {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #111827;
    }

    .home-live-modal .modal-route-point.route-end {
      text-align: right;
      align-items: flex-end;
    }

    .home-live-modal .modal-route-point span {
      font-size: .85rem;
      color: #4b5563;
      font-weight: 800;
    }

    .home-live-modal .modal-route-point strong {
      font-size: 1.15rem;
      color: #111827;
      font-weight: 950;
      line-height: 1.2;
    }

    .home-live-modal .modal-route-line {
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0f766e, #be185d);
    }

    .home-live-modal .modal-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .home-live-modal .modal-stat {
      border: 1px solid rgba(15, 23, 42, .1);
      border-radius: 8px;
      padding: 9px 10px;
      background: #f8fafc;
      min-width: 0;
    }

    .home-live-modal .modal-stat span {
      display: block;
      color: #64748b;
      font-size: .72rem;
      font-weight: 850;
      line-height: 1.2;
    }

    .home-live-modal .modal-stat strong {
      display: block;
      margin-top: 4px;
      color: #111827;
      font-size: .86rem;
      font-weight: 950;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .home-live-modal .modal-section {
      margin-top: 12px;
      overflow: hidden;
    }

    .home-live-modal .modal-timeline-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(15, 23, 42, .1);
    }

    .home-live-modal .modal-timeline-title {
      color: #111827;
      font-size: .96rem;
      font-weight: 950;
      line-height: 1.2;
    }

    .home-live-modal .modal-timeline-subtitle {
      margin-top: 3px;
      color: #64748b;
      font-size: .78rem;
      font-weight: 750;
    }

    .home-live-modal .modal-toggle-btn {
      appearance: none;
      border: 1px solid rgba(15, 118, 110, .25);
      background: #ecfdf5;
      color: #0f766e;
      border-radius: 8px;
      min-height: 32px;
      padding: 0 10px;
      font: inherit;
      font-size: .8rem;
      font-weight: 900;
      cursor: pointer;
    }

    .home-live-modal .modal-stop-table {
      width: 100%;
    }

    .home-live-modal .modal-stop-head,
    .home-live-modal .modal-stop-row {
      display: grid;
      grid-template-columns: 34px minmax(110px, 1.1fr) minmax(72px, .7fr) minmax(72px, .7fr) minmax(86px, .8fr);
      gap: 8px;
      align-items: center;
      padding: 0 14px;
    }

    .home-live-modal .modal-stop-head {
      min-height: 36px;
      color: #64748b;
      font-size: .72rem;
      font-weight: 900;
      background: #f8fafc;
      border-bottom: 1px solid rgba(15, 23, 42, .1);
    }

    .home-live-modal .modal-stop-row {
      min-height: 48px;
      border-bottom: 1px solid rgba(15, 23, 42, .08);
      color: #111827;
      font-size: .82rem;
    }

    .home-live-modal .modal-stop-row.is-passed {
      color: #64748b;
      background: rgba(248, 250, 252, .62);
    }

    .home-live-modal .modal-stop-row.is-pass {
      color: #64748b;
    }

    .home-live-modal .modal-stop-row.is-active,
    .home-live-modal .modal-stop-row.is-current {
      background: rgba(236, 253, 245, .86);
    }

    .home-live-modal .modal-stop-marker-col {
      align-self: stretch;
      display: flex;
      justify-content: center;
    }

    .home-live-modal .modal-stop-marker {
      position: relative;
      width: 16px;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .home-live-modal .modal-stop-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #111827;
      border: 2px solid #fff;
      box-shadow: 0 0 0 2px rgba(15, 23, 42, .16);
      z-index: 1;
    }

    .home-live-modal .modal-stop-line {
      position: absolute;
      top: 50%;
      bottom: -50%;
      width: 2px;
      background: rgba(15, 23, 42, .16);
    }

    .home-live-modal .modal-stop-row:last-child .modal-stop-line {
      display: none;
    }

    .home-live-modal .modal-stop-row.is-active .modal-stop-dot,
    .home-live-modal .modal-stop-row.is-current .modal-stop-dot {
      background: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, .18);
    }

    .home-live-modal .modal-stop-row.is-pass .modal-stop-dot {
      width: 7px;
      height: 7px;
      background: #94a3b8;
    }

    .home-live-modal .modal-stop-station-main {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 950;
      line-height: 1.25;
    }

    .home-live-modal .modal-stop-inline-tag {
      border-radius: 8px;
      padding: 2px 5px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: .68rem;
      font-weight: 900;
    }

    .home-live-modal .modal-stop-time-main {
      color: #111827;
      font-weight: 900;
      line-height: 1.25;
    }

    .home-live-modal .modal-stop-time-empty,
    .home-live-modal .modal-stop-row.is-pass .modal-stop-time-main {
      color: #94a3b8;
    }

    .home-live-modal .modal-stop-state {
      font-weight: 950;
      line-height: 1.25;
    }

    .home-live-modal .modal-tone-success { color: #15803d; }
    .home-live-modal .modal-tone-warning { color: #c2410c; }
    .home-live-modal .modal-tone-danger { color: #b91c1c; }
    .home-live-modal .modal-tone-muted { color: #64748b; }
    .home-live-modal .modal-tone-neutral { color: #111827; }

    .home-live-status {
      position: absolute;
      z-index: 560;
      right: max(10px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      max-width: min(380px, calc(100vw - 20px));
      padding: 9px 11px;
      border-radius: 8px;
      background: rgba(17, 24, 39, .88);
      color: #fff;
      font-size: .78rem;
      font-weight: 750;
      line-height: 1.35;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .22);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }

    .home-live-status.show {
      opacity: 1;
      transform: translateY(0);
    }

    .home-live-train-marker,
    .home-live-user-marker {
      background: transparent !important;
      border: 0 !important;
      overflow: visible !important;
    }

    .leaflet-marker-icon.home-live-train-marker {
      will-change: transform;
    }

    .home-live-map:not(.is-map-interacting) .leaflet-marker-icon.home-live-train-marker {
      transition: transform .28s linear;
    }

    .home-live-map.is-map-interacting .home-live-train-marker strong,
    .home-live-map.is-map-interacting .home-live-station-label,
    .home-live-map.is-heavy-trains.is-low-zoom .home-live-train-marker strong {
      display: none !important;
    }

    .home-live-detail-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    .leaflet-marker-icon.home-live-user-marker {
      transition: transform 2.6s linear;
      will-change: transform;
    }

    .home-live-train-marker button {
      position: relative;
      display: block;
      width: 1px;
      height: 1px;
      border: 0;
      background: transparent;
      color: var(--train-color, #111827);
      padding: 0;
      font: inherit;
      cursor: pointer;
      pointer-events: auto;
    }

    .home-live-train-marker button::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 14px solid var(--train-color, #111827);
      transform: translate(-50%, -50%) rotate(var(--train-angle, 0deg));
      transform-origin: 50% 58%;
      filter: drop-shadow(0 2px 3px rgba(15, 23, 42, .34)) drop-shadow(0 0 2px rgba(255, 255, 255, .92));
    }

    .home-live-train-marker strong {
      position: absolute;
      left: 0;
      top: 0;
      min-width: max-content;
      transform: var(--train-label-transform, translate(13px, -50%));
      color: #0f172a;
      font-size: .8rem;
      font-weight: 950;
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 1px 3px rgba(255, 255, 255, .98), 0 0 9px rgba(255, 255, 255, .86);
      pointer-events: auto;
    }

    .home-live-train-marker.is-active strong {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }

    .home-live-user-marker .dot {
      position: relative;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: #2563eb;
      border: 3px solid #fff;
      box-shadow: 0 0 0 7px rgba(37, 99, 235, .18), 0 4px 10px rgba(30, 64, 175, .28);
      transform: translate(-50%, -50%);
    }

    .home-live-user-marker .speed {
      position: absolute;
      left: 12px;
      top: -10px;
      min-width: max-content;
      color: #1d4ed8;
      font-size: .74rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(255, 255, 255, .98), 0 0 8px rgba(255, 255, 255, .85);
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }

    @media (max-width: 720px) {
      .home-live-topbar {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .home-live-actions {
        justify-content: flex-start;
        width: max-content;
        max-width: 100%;
        gap: 4px;
        padding: 4px;
      }

      .home-live-action {
        flex: 0 0 auto;
        min-height: 30px;
        padding: 0 8px;
        font-size: .76rem;
      }

      .home-live-title h1 {
        gap: 6px;
      }

      .home-live-inline-controls {
        gap: 4px;
      }

      .home-live-popover summary {
        min-height: 26px;
        padding: 0 7px;
        font-size: .7rem;
      }

      .home-live-popover-panel {
        position: fixed;
        top: calc(max(10px, env(safe-area-inset-top)) + 104px);
        left: max(10px, env(safe-area-inset-left)) !important;
        right: max(10px, env(safe-area-inset-right)) !important;
        width: auto;
      }

      .home-live-filterbar {
        top: calc(max(10px, env(safe-area-inset-top)) + 112px);
        gap: 6px;
      }

      .home-live-filter {
        width: 100%;
        max-width: 100%;
        padding: 6px;
      }

      .home-live-filter select {
        flex: 1 1 130px;
        min-width: 0;
        height: 58px;
      }

      .home-live-filter input {
        width: 76px;
      }

      .home-live-check-list {
        grid-template-columns: 1fr;
        max-height: min(54vh, 380px);
      }

      .home-live-track-list {
        max-width: 150px;
      }

      .home-live-station-label button {
        font-size: .78rem;
      }

      .home-live-status {
        left: max(10px, env(safe-area-inset-left));
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
      }

      .home-live-modal {
        padding: 0;
      }

      .home-live-modal-card {
        max-height: 88vh;
      }

      .home-live-detail-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .home-live-detail-table {
        font-size: .78rem;
      }

      .home-live-modal .modal-content {
        max-height: 88vh;
      }

      .home-live-modal .modal-header,
      .home-live-modal .modal-body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .home-live-modal .modal-route-strip {
        grid-template-columns: minmax(0, 1fr) 42px minmax(0, 1fr);
      }

      .home-live-modal .modal-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .home-live-modal .modal-stop-head {
        display: none;
      }

      .home-live-modal .modal-stop-row {
        grid-template-columns: 28px minmax(0, 1fr) auto;
        grid-template-areas:
          "marker station state"
          "marker arr dep";
        gap: 4px 8px;
        padding: 8px 10px;
      }

      .home-live-modal .modal-stop-marker-col { grid-area: marker; }
      .home-live-modal .modal-stop-station-cell { grid-area: station; }
      .home-live-modal .modal-stop-state { grid-area: state; text-align: right; }
      .home-live-modal .modal-stop-time-cell:nth-child(3) { grid-area: arr; }
      .home-live-modal .modal-stop-time-cell:nth-child(4) { grid-area: dep; text-align: right; }
    }
  </style>
</head>
<body>
  <main class="home-live-shell" aria-label="即時動態">
    <div id="homeLiveMap" class="home-live-map"></div>
    <header class="home-live-topbar">
      <div class="home-live-title">
        <h1>
          <span>即時動態</span>
          <span class="home-live-title-legend" aria-label="路線圖例">
            <span style="color: var(--line-tra);"><i></i>台鐵</span>
            <span style="color: var(--line-thsr);"><i></i>高鐵</span>
          </span>
          <span class="home-live-inline-controls" aria-label="台鐵列車顯示篩選">
            <details class="home-live-popover">
              <summary>選擇路段</summary>
              <div class="home-live-popover-panel">
                <label><span>路段</span><select id="homeLiveTraSegments" aria-label="選擇台鐵顯示路段"></select></label>
                <div class="home-live-popover-actions">
                  <button type="button" class="home-live-mini-btn" id="homeLiveTraSegmentAdd">加入</button>
                  <button type="button" class="home-live-mini-btn" id="homeLiveTraSegmentAll">全選</button>
                  <button type="button" class="home-live-mini-btn" id="homeLiveTraSegmentClear">清除</button>
                </div>
                <p>建議最多選 2 個路段，避免白天列車多時卡頓。</p>
              </div>
            </details>
            <details class="home-live-popover">
              <summary>追蹤車次</summary>
              <div class="home-live-popover-panel">
                <label><span>車次</span><input id="homeLiveTrackInput" inputmode="numeric" placeholder="車次" aria-label="追蹤台鐵車次"></label>
                <div class="home-live-popover-actions">
                  <button type="button" class="home-live-mini-btn" id="homeLiveTrackAdd">加入</button>
                  <button type="button" class="home-live-mini-btn" id="homeLiveTrackClear">全部清除</button>
                </div>
                <div class="home-live-track-list" id="homeLiveTrackList"></div>
              </div>
            </details>
          </span>
        </h1>
        <p id="homeLiveSubtitle">台鐵與高鐵全線真實地圖</p>
      </div>
      <div class="home-live-actions" aria-label="地圖操作">
        <button type="button" class="home-live-action" id="homeLiveLocate" aria-label="我的位置">定位</button>
        <button type="button" class="home-live-action" id="homeLiveFit">全線</button>
        <button type="button" class="home-live-action primary" id="homeLiveClose">回首頁</button>
      </div>
    </header>
    <div class="home-live-modal hidden" id="homeLiveTrainModal" aria-hidden="true">
      <iframe id="homeLiveDetailFrame" class="home-live-detail-frame" title="列車詳細資訊" loading="eager" allowtransparency="true"></iframe>
    </div>
    <div class="home-live-status" id="homeLiveStatus" role="status" aria-live="polite"></div>
  </main>

  <script src="../shared/rail-network.js?v=20260419-traedge2"></script>
  <script charset="UTF-8" src="../thsr/thsr.real-schedule.js?v=20260419-tdxgate1"></script>
  <script src="../shared/rail-live-tracker.js?v=20260420-core11"></script>
  <script src="../shared/rail-stop-weather.js?v=20260419-live1"></script>
  <script src="../shared/rail-station-context.js?v=20260419-live1"></script>
  <script src="./home-live-map.js?v=20260420-live19"></script>
</body>
</html>
