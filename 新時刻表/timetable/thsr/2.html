<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>高鐵時刻表</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
  /* ===== 1. 核心變數與 Reset (高鐵橘配色) ===== */
  :root {
    --thsr-color: #f97316; /* Orange-500 */
    --thsr-dark: #c2410c;

    /* Light Mode */
    --bg-body: #f8fafc;
    --bg-surface: #ffffff;
    --bg-header: rgba(255, 255, 255, 0.85);
    --text-main: #0f172a;
    --text-muted: #64748b;
    
    --glass-bg: #ffffff;
    --glass-border: rgba(15, 23, 42, 0.08);
    
    --border: var(--glass-border);
    --primary: var(--thsr-color);
    --primary-bg: rgba(249, 115, 22, 0.12); /* 淺橘色背景 */
    
    --shadow-sm: 0 18px 45px rgba(2, 6, 23, 0.08);
    --radius: 28px;
  }

  /* 深色模式變數 (依照要求：不透明、圓角變小) */
  body.dark-mode {
    --bg-body: #0f172a;      /* Slate-900 */
    --bg-surface: #1e293b;   /* Slate-800 (不透明底色) */
    --bg-header: #1e293b;
    
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    
    --glass-bg: #1e293b;     /* 關鍵：改為不透明深色 */
    --glass-border: #334155;
    
    --border: var(--glass-border);
    --primary: #fb923c;      /* Orange-400 (深色模式下亮一點的橘) */
    --primary-bg: rgba(251, 146, 60, 0.15);
    
    --radius: 16px;          /* 關鍵：圓角變小 */
    --shadow-sm: none;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Inter', 'Noto Sans TC', sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
    margin: 0;
    padding-bottom: 40px;
    transition: background-color 0.3s, color 0.3s;
  }

  /* ===== 2. 佈局容器 ===== */
  .container { max-width: 1000px; margin: 26px auto; padding: 0 20px; }
  @media (max-width: 520px){ .container{ margin: 16px auto; padding: 0 12px; } }

  .card {
    background: var(--glass-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    /* 電腦版可能有毛玻璃，但深色模式會被覆蓋 */
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }

  /* 強制深色模式卡片不透明 & 圓角修正 */
  body.dark-mode .card, 
  body.dark-mode .modal-content,
  body.dark-mode .header {
      background: var(--bg-surface) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border-radius: var(--radius) !important;
  }
  body.dark-mode .input-group,
  body.dark-mode button.btn-primary {
      border-radius: 12px !important;
  }

  /* ===== 3. Header ===== */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    backdrop-filter: blur(12px);
  }
  .header-content {
    max-width: 1000px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-weight: 900; font-size: 1.2rem; color: var(--text-muted); display: flex; align-items: baseline; gap: 6px; }
  .logo span { color: var(--primary); }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* Buttons */
  button { font-family: inherit; }
  .btn-primary {
    background: linear-gradient(135deg, var(--thsr-color), #ea580c);
    color: #fff; border: none;
    padding: 10px 18px; border-radius: 999px;
    font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
    transition: transform 0.1s;
  }
  .btn-primary:active { transform: scale(0.96); }

  .btn-ghost {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-main); padding: 8px 14px; border-radius: 999px;
    font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .btn-ghost:hover { background: var(--bg-surface); }

  .input-field {
    background: var(--bg-surface); border: 1px solid var(--border);
    color: var(--text-main); padding: 8px 12px; border-radius: 12px;
    font-size: 0.95rem; outline: none;
  }

  /* ===== 4. 表單樣式 (Desktop) ===== */
  .form-row { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  
  .input-group {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 20px;
  }
  .input-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
  .input-group select {
    width: 100%; border: none; background: transparent;
    color: var(--text-main); font-size: 1rem; font-weight: 600; cursor: pointer; outline: none;
  }

  .swap-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--primary); display: flex; justify-content: center; align-items: center;
    cursor: pointer; font-size: 1.2rem; flex-shrink: 0;
  }
  .swap-btn:hover { background: var(--primary-bg); }

  /* ===== 5. 表格樣式 ===== */
  .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 20px; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; white-space: nowrap; }
  th { text-align: left; padding: 14px 16px; color: var(--text-muted); font-size: 0.85rem; background: rgba(128,128,128,0.03); border-bottom: 1px solid var(--border); }
  td { padding: 16px; border-bottom: 1px solid var(--border); color: var(--text-main); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  
  /* 行互動 */
  .main-row { cursor: pointer; transition: background 0.1s; }
  .main-row:hover { background: rgba(128,128,128,0.03); }

  /* 徽章 */
  .badge-direct { color: var(--thsr-color); font-weight: 700; background: var(--primary-bg); padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; }
  .badge-normal { color: var(--text-muted); font-size: 0.85rem; }

  /* 訂票按鈕 */
  .ticket-btn {
    display: inline-block; text-decoration: none;
    background: var(--bg-surface); border: 1px solid var(--border);
    color: var(--text-main); padding: 6px 12px; border-radius: 10px;
    font-size: 0.85rem; font-weight: 700;
  }
  .ticket-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* ===== 6. Mobile 專用樣式 (Sheet & Compact Bar) ===== */
  .mobile-only { display: none; }

  @media (max-width: 760px) {
    /* 隱藏桌面元素 */
    .desktop-only, .col-stops, .col-ticket { display: none !important; }
    .mobile-only { display: flex; }

    /* Header 簡化 */
    .header { padding: 10px 16px; }
    .logo span { display: none; }
    .date-picker-label { display: none; }
    #queryDate { width: 130px; }

    /* Compact Bar (浮動摘要條) */
    .trip-compact-bar {
      align-items: center; gap: 10px;
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 10px 12px; margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .trip-open-btn {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--primary-bg); border: none;
      padding: 10px 14px; border-radius: 12px;
      text-align: left; color: var(--text-main);
    }
    .trip-open-btn .label { font-weight: 800; color: var(--primary); font-size: 0.9rem; }
    .trip-open-btn .summary { font-size: 0.9rem; margin-left: auto; opacity: 0.8; }
    
    .trip-icon-btn {
      width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
      background: var(--primary); color: white; border: none; border-radius: 50%;
      font-size: 1.2rem; box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
    }

    /* Bottom Sheet (底部抽屜) */
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

    .sheet-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 999;
      background: var(--bg-surface);
      border-top-left-radius: 24px; border-top-right-radius: 24px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
      transform: translateY(110%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .sheet-panel.show { transform: translateY(0); }

    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .sheet-title { font-weight: 800; font-size: 1.1rem; }
    .sheet-close { font-size: 1.5rem; color: var(--text-muted); padding: 5px; }

    /* Sheet 內的表單佈局 */
    .sheet-form { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
    .sheet-form .input-group { flex-direction: column; align-items: flex-start; gap: 6px; border-radius: 14px; }
    .sheet-form #swapBtn { margin-bottom: 4px; }
    .sheet-form #searchBtn { grid-column: 1 / -1; margin-top: 10px; width: 100%; padding: 14px; border-radius: 16px; font-size: 1rem; }

    /* Mobile Expandable Row */
    .mobile-expand-btn {
      display: inline-flex; width: 24px; height: 24px; border-radius: 50%;
      background: var(--primary-bg); color: var(--primary);
      align-items: center; justify-content: center; font-weight: 800; margin-right: 8px;
    }
    
    .mobile-detail-row td {
      background: var(--bg-body); padding: 12px 16px;
      border-left: 4px solid var(--primary);
    }
    .detail-content { display: flex; justify-content: space-between; align-items: center; }
  }

  /* ===== 7. Timeline Modal ===== */
  .modal {
    position: fixed; inset: 0; z-index: 2000;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    opacity: 0; transition: opacity 0.2s;
  }
  .modal.show { opacity: 1; }

  .modal-content {
    width: 90%; max-width: 420px; max-height: 80vh;
    background: var(--bg-surface); border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; overflow: hidden;
    transform: scale(0.95); transition: transform 0.2s;
  }
  .modal.show .modal-content { transform: scale(1); }

  .modal-header {
    padding: 16px 20px; background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  
  .timeline { flex: 1; overflow-y: auto; padding: 20px; }
  .timeline-item { display: flex; margin-bottom: 0; position: relative; }
  
  .tl-time { width: 50px; text-align: right; font-weight: 700; font-size: 0.9rem; color: var(--text-main); padding-right: 15px; }
  .tl-line-container { display: flex; flex-direction: column; align-items: center; width: 20px; }
  .tl-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border); z-index: 2; border: 2px solid var(--bg-surface); transition: background 0.3s; }
  .tl-line { width: 2px; background: var(--border); flex: 1; margin: 4px 0; }
  .timeline-item:last-child .tl-line { display: none; }
  
  .tl-info { padding-left: 15px; padding-bottom: 24px; flex: 1; }
  .tl-station { font-weight: 700; font-size: 1rem; color: var(--text-main); }
  
  /* Timeline Active/Passed States */
  .timeline-item.passed .tl-dot { background: var(--border); }
  .timeline-item.passed .tl-station, .timeline-item.passed .tl-time { opacity: 0.5; }
  
  .timeline-item.active .tl-dot { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-bg); }
  .timeline-item.active .tl-station { color: var(--primary); }

  /* Loading */
  #loading-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 9999;
    display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
  }
  .spinner {
    width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body class="light-mode">

  <div style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;pointer-events:none;">
    <div style="position:absolute;top:-10%;left:-10%;width:50vw;height:50vw;background:var(--primary);filter:blur(120px);opacity:0.1;border-radius:50%;"></div>
    <div style="position:absolute;bottom:-10%;right:-10%;width:60vw;height:60vw;background:var(--primary);filter:blur(140px);opacity:0.08;border-radius:50%;"></div>
  </div>

  <div id="loading-overlay"><div class="spinner"></div></div>

  <header class="header">
    <div class="header-content">
      <div class="logo">THSR <span>High Speed Rail</span></div>
      <div class="header-actions">
        <label class="date-picker-label" style="font-size:0.85rem;font-weight:600;color:var(--text-muted)">日期：</label>
        <input type="date" id="queryDate" class="input-field">
        <button class="btn-primary desktop-only" id="refreshBtn">更新</button>
        <button class="btn-ghost" id="themeToggle" title="切換模式">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">
    
    <div class="trip-compact-bar mobile-only">
      <button class="trip-open-btn" id="openSheetBtn">
        <span class="label">📍 行程設定</span>
        <span class="summary" id="mobileSummary">南港 → 左營</span>
      </button>
      <button class="trip-icon-btn" id="quickSearchBtn">🔍</button>
    </div>

    <div class="card">
      <div class="section-title desktop-only" style="font-weight:800;font-size:1.2rem;margin-bottom:20px;display:flex;align-items:center;gap:8px;">
        <span style="width:4px;height:20px;background:var(--primary);border-radius:2px;"></span>
        高鐵時刻查詢
      </div>

      <div class="form-row desktop-only">
        <div class="input-group">
          <label>出發</label>
          <select id="startStation"></select>
        </div>
        <button class="swap-btn" id="swapBtn">⇄</button>
        <div class="input-group">
          <label>到達</label>
          <select id="endStation"></select>
        </div>
        <button class="btn-primary" id="searchBtn">查詢時刻</button>
      </div>

      <div class="table-wrapper">
        <table id="resultTable">
          <thead>
            <tr>
              <th>車次</th>
              <th>出發</th>
              <th>抵達</th>
              <th class="col-duration">耗時</th>
              <th class="col-stops">模式</th>
              <th class="col-ticket" style="text-align:center">訂票</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-panel" id="sheetPanel">
    <div class="sheet-header">
      <div class="sheet-title">行程設定</div>
      <div class="sheet-close" id="closeSheetBtn">✕</div>
    </div>
    <div class="sheet-form">
      <div class="input-group">
        <label>出發站</label>
        <select id="mStartStation"></select>
      </div>
      <button class="swap-btn" id="mSwapBtn" style="align-self:center">⇄</button>
      <div class="input-group">
        <label>到達站</label>
        <select id="mEndStation"></select>
      </div>
      <button class="btn-primary" id="mSearchBtn">查詢時刻</button>
    </div>
  </div>

  <div id="trainModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div style="font-weight:800;font-size:1.1rem" id="modalTrainNo">--</div>
          <div style="font-size:0.85rem;color:var(--text-muted)" id="modalRoute">--</div>
        </div>
        <div class="sheet-close" id="closeModalBtn" style="font-size:1.5rem;cursor:pointer">✕</div>
      </div>
      <div class="timeline" id="modalTimeline"></div>
    </div>
  </div>

  <script src="./thsr.schedule.js"></script>
  <script>
    // ===== 1. 資料與初始化 =====
    const stations = [
        {id:"0990", name:"南港"}, {id:"1000", name:"台北"}, {id:"1010", name:"板橋"},
        {id:"1020", name:"桃園"}, {id:"1030", name:"新竹"}, {id:"1035", name:"苗栗"},
        {id:"1040", name:"台中"}, {id:"1043", name:"彰化"}, {id:"1047", name:"雲林"},
        {id:"1050", name:"嘉義"}, {id:"1060", name:"台南"}, {id:"1070", name:"左營"}
    ];

    let trainData = []; // 存放當日班次

    window.addEventListener('load', async () => {
        setupTheme();
        initDateInput();
        renderStationSelects(); // 同步 Desktop & Mobile 選單
        
        // 嘗試載入資料
        await loadData();
        
        // 初始渲染
        doSearch();

        // 綁定事件
        bindEvents();
    });

    // ===== 2. 邏輯處理 =====
    
    // 初始化日期輸入框
    function initDateInput() {
        const d = new Date();
        const str = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        document.getElementById('queryDate').value = str;
    }

    // 產生車站選項 (同步兩個 Select)
    function renderStationSelects() {
        const opts = stations.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        
        ['startStation', 'endStation', 'mStartStation', 'mEndStation'].forEach(id => {
            document.getElementById(id).innerHTML = opts;
        });

        // 預設值
        setStation('startStation', '0990'); // 南港
        setStation('mStartStation', '0990');
        setStation('endStation', '1070');   // 左營
        setStation('mEndStation', '1070');
        
        updateSummary();
    }

    function setStation(id, val) {
        document.getElementById(id).value = val;
    }

    // 更新 Mobile 摘要文字
    function updateSummary() {
        const sId = document.getElementById('mStartStation').value;
        const eId = document.getElementById('mEndStation').value;
        const sName = stations.find(s=>s.id===sId)?.name;
        const eName = stations.find(s=>s.id===eId)?.name;
        document.getElementById('mobileSummary').textContent = `${sName} → ${eName}`;
        
        // 同步回 Desktop (若從 Mobile 操作)
        setStation('startStation', sId);
        setStation('endStation', eId);
    }
    
    // 交換起訖站
    function swapStations(isMobile) {
        const sId = isMobile ? 'mStartStation' : 'startStation';
        const eId = isMobile ? 'mEndStation' : 'endStation';
        
        const sVal = document.getElementById(sId).value;
        const eVal = document.getElementById(eId).value;
        
        setStation(sId, eVal);
        setStation(eId, sVal);
        
        // 同步另一組
        const otherS = isMobile ? 'startStation' : 'mStartStation';
        const otherE = isMobile ? 'endStation' : 'mEndStation';
        setStation(otherS, eVal);
        setStation(otherE, sVal);
        
        updateSummary();
    }

    // 模擬或讀取資料
    async function loadData() {
        const overlay = document.getElementById('loading-overlay');
        overlay.style.display = 'flex';
        
        // 模擬延遲
        await new Promise(r => setTimeout(r, 400));
        
        if (typeof window.thsrSchedule !== 'undefined') {
            trainData = window.thsrSchedule;
        } else {
            // 如果沒有外部 JS，產生一些假資料展示用 (避免空白)
            console.warn("No thsr.schedule.js found, using mock data.");
            trainData = generateMockData(); 
        }
        
        overlay.style.display = 'none';
    }

    // 執行查詢與渲染表格
    function doSearch() {
        const startId = document.getElementById('startStation').value;
        const endId = document.getElementById('endStation').value;
        const tbody = document.querySelector('#resultTable tbody');
        tbody.innerHTML = '';

        if(startId === endId) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:#ef4444;font-weight:700">起訖站不能相同</td></tr>`;
            return;
        }

        // 判斷方向
        const sIdx = stations.findIndex(s=>s.id===startId);
        const eIdx = stations.findIndex(s=>s.id===endId);
        const direction = sIdx < eIdx ? 0 : 1; // 0:南下, 1:北上

        // 過濾班次
        const results = Object.values(trainData).filter(t => {
            if (t.Direction !== direction) return false;
            const sStop = t.Stops.find(s=>s.StationID===startId);
            const eStop = t.Stops.find(s=>s.StationID===endId);
            if(!sStop || !eStop) return false;
            return sStop.DepartureTime < eStop.ArrivalTime; // 時間順序正確
        });

        // 排序
        results.sort((a,b) => {
            const tA = a.Stops.find(s=>s.StationID===startId).DepartureTime;
            const tB = b.Stops.find(s=>s.StationID===startId).DepartureTime;
            return tA.localeCompare(tB);
        });

        if(results.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted)">查無班次</td></tr>`;
            return;
        }

        // 產生 Row
        results.forEach((t, idx) => {
            const sStop = t.Stops.find(s=>s.StationID===startId);
            const eStop = t.Stops.find(s=>s.StationID===endId);
            
            // 計算耗時
            const duration = calcDuration(sStop.DepartureTime, eStop.ArrivalTime);
            
            // 判斷模式 (停靠站數)
            const stopCount = Math.abs(stations.findIndex(s=>s.id===endId) - stations.findIndex(s=>s.id===startId));
            const realStops = countRealStops(t.Stops, startId, endId);
            const isDirect = (realStops <= 1); // 簡單邏輯：中間停 <= 1 站算直達

            const tr = document.createElement('tr');
            tr.className = 'main-row';
            tr.dataset.idx = idx;
            
            // 訂票連結
            const bookLink = "https://irs.thsrc.com.tw/IMINT/";

            tr.innerHTML = `
                <td>
                    <div style="display:flex;align-items:center;">
                        <span class="mobile-expand-btn mobile-only" onclick="event.stopPropagation(); toggleMobileDetail(this, ${idx})">+</span>
                        <b style="font-size:1.1rem">${t.TrainNo}</b>
                    </div>
                </td>
                <td style="font-weight:700;font-size:1.05rem">${sStop.DepartureTime}</td>
                <td style="font-weight:700;font-size:1.05rem">${eStop.ArrivalTime}</td>
                <td class="col-duration">${duration}</td>
                <td class="col-stops">
                    ${isDirect ? '<span class="badge-direct">直達</span>' : '<span class="badge-normal">站站停</span>'}
                </td>
                <td class="col-ticket" style="text-align:center">
                    <a href="${bookLink}" target="_blank" class="ticket-btn" onclick="event.stopPropagation()">訂票</a>
                </td>
            `;
            
            // 綁定點擊開啟 Timeline
            tr.addEventListener('click', () => openTimeline(t));
            
            tbody.appendChild(tr);
        });
    }

    // ===== 3. 行動版互動 (Sheet & Detail Row) =====
    
    // Sheet 控制
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const sheetPanel = document.getElementById('sheetPanel');
    
    function openSheet() {
        sheetBackdrop.classList.add('show');
        sheetPanel.classList.add('show');
        document.body.style.overflow = 'hidden'; // 防止背景捲動
    }
    
    function closeSheet() {
        sheetBackdrop.classList.remove('show');
        sheetPanel.classList.remove('show');
        document.body.style.overflow = '';
        updateSummary(); // 關閉時更新摘要
        
        // 同步 Mobile 選單值到 Desktop (如果沒按查詢)
        setStation('startStation', document.getElementById('mStartStation').value);
        setStation('endStation', document.getElementById('mEndStation').value);
    }

    // Mobile Detail Row (展開詳情)
    window.toggleMobileDetail = function(btn, idx) {
        const tr = btn.closest('tr');
        const next = tr.nextElementSibling;
        
        if (next && next.classList.contains('mobile-detail-row')) {
            next.remove();
            btn.textContent = '+';
            return;
        }

        const duration = tr.querySelector('.col-duration').textContent;
        // 取得隱藏的模式文字 (從 dataset 或重新計算，這裡簡化直接抓)
        // 更好的方式是從 trainData[idx] 抓，但需注意 idx 是過濾後的 index
        // 這裡僅做 UI 展示，顯示訂票按鈕與耗時
        
        const newRow = document.createElement('tr');
        newRow.className = 'mobile-detail-row';
        newRow.innerHTML = `
            <td colspan="6">
                <div class="detail-content">
                    <div>
                        <div style="font-weight:700;color:var(--text-main)">耗時：${duration}</div>
                        <div style="font-size:0.85rem;color:var(--text-muted);margin-top:4px;">點擊查看完整停靠站</div>
                    </div>
                    <a href="https://irs.thsrc.com.tw/IMINT/" target="_blank" class="ticket-btn">🎫 立即訂票</a>
                </div>
            </td>
        `;
        tr.parentNode.insertBefore(newRow, tr.nextSibling);
        btn.textContent = '-';
    }

    // ===== 4. Timeline Modal =====
    const modal = document.getElementById('trainModal');
    
    function openTimeline(train) {
        document.getElementById('modalTrainNo').textContent = `${train.TrainNo} 次`;
        
        const sId = document.getElementById('startStation').value;
        const eId = document.getElementById('endStation').value;
        const sName = stations.find(s=>s.id===sId).name;
        const eName = stations.find(s=>s.id===eId).name;
        document.getElementById('modalRoute').textContent = `${sName} ➝ ${eName}`;
        
        const container = document.getElementById('modalTimeline');
        container.innerHTML = '';
        
        // 模擬現在時間，判斷過站
        const now = new Date();
        const nowHHMM = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        train.Stops.forEach((stop, i) => {
            const stName = stations.find(s=>s.id===stop.StationID)?.name || stop.StationID;
            const time = stop.DepartureTime || stop.ArrivalTime;
            
            // 判斷狀態
            const isPassed = time < nowHHMM;
            // 簡單判斷：如果是這班車的下一站 (上一站已過，這一站未過)
            const isActive = !isPassed && (i > 0 && (train.Stops[i-1].DepartureTime || train.Stops[i-1].ArrivalTime) < nowHHMM);
            
            const div = document.createElement('div');
            div.className = `timeline-item ${isPassed ? 'passed' : ''} ${isActive ? 'active' : ''}`;
            
            div.innerHTML = `
                <div class="tl-time">${time}</div>
                <div class="tl-line-container">
                    <div class="tl-dot"></div>
                    <div class="tl-line"></div>
                </div>
                <div class="tl-info">
                    <div class="tl-station">${stName}</div>
                </div>
            `;
            container.appendChild(div);
        });
        
        modal.style.display = 'flex';
        // 些微延遲觸發 transition
        requestAnimationFrame(() => modal.classList.add('show'));
    }

    function closeModal() {
        modal.classList.remove('show');
        setTimeout(() => modal.style.display = 'none', 200);
    }

    // ===== 5. 綁定事件 =====
    function bindEvents() {
        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // Desktop Search
        document.getElementById('searchBtn').addEventListener('click', doSearch);
        document.getElementById('swapBtn').addEventListener('click', () => swapStations(false));
        document.getElementById('refreshBtn').addEventListener('click', loadData);

        // Mobile Sheet Triggers
        document.getElementById('openSheetBtn').addEventListener('click', openSheet);
        document.getElementById('closeSheetBtn').addEventListener('click', closeSheet);
        sheetBackdrop.addEventListener('click', closeSheet);
        
        // Mobile Sheet Actions
        document.getElementById('mSwapBtn').addEventListener('click', () => swapStations(true));
        document.getElementById('mSearchBtn').addEventListener('click', () => {
            closeSheet();
            doSearch();
        });
        
        // Quick Search (放大鏡)
        document.getElementById('quickSearchBtn').addEventListener('click', () => {
            // 直接以當前設定查詢
            doSearch();
            // 視覺回饋
            const btn = document.getElementById('quickSearchBtn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = '', 100);
        });

        // Sync Mobile Selects
        document.getElementById('mStartStation').addEventListener('change', updateSummary);
        document.getElementById('mEndStation').addEventListener('change', updateSummary);

        // Modal Close
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });
    }

    // 工具：計算時間差
    function calcDuration(start, end) {
        const [h1, m1] = start.split(':').map(Number);
        const [h2, m2] = end.split(':').map(Number);
        let diff = (h2*60 + m2) - (h1*60 + m1);
        if(diff < 0) diff += 24*60;
        const h = Math.floor(diff/60);
        const m = diff % 60;
        return `${h}小時${m}分`;
    }

    // 工具：計算中間停靠站數
    function countRealStops(stops, sId, eId) {
        const sIdx = stops.findIndex(s=>s.StationID===sId);
        const eIdx = stops.findIndex(s=>s.StationID===eId);
        if(sIdx===-1 || eIdx===-1) return 0;
        return Math.abs(eIdx - sIdx) - 1;
    }

    // Mock Data Generator (若無 JS 檔時使用)
    function generateMockData() {
        const mocks = [];
        // 產生一些假班次
        const baseTimes = [
            {no:"0803", dep:"06:15", arr:"08:30", dir:0, type:"stop"},
            {no:"0203", dep:"06:30", arr:"08:10", dir:0, type:"direct"},
            {no:"0805", dep:"07:15", arr:"09:30", dir:0, type:"stop"},
            {no:"0108", dep:"07:30", arr:"09:10", dir:0, type:"direct"},
            {no:"0602", dep:"07:00", arr:"09:00", dir:1, type:"stop"} // 北上
        ];
        
        baseTimes.forEach(b => {
            const stops = [];
            if(b.type === "direct") {
                // 直達: 南港, 台北, 板橋, 台中, 左營
                stops.push({StationID:"0990", DepartureTime: b.dep}); // 南港
                stops.push({StationID:"1000", DepartureTime: addTime(b.dep, 10)}); // 台北
                stops.push({StationID:"1010", DepartureTime: addTime(b.dep, 20)}); // 板橋
                stops.push({StationID:"1040", DepartureTime: addTime(b.dep, 60)}); // 台中
                stops.push({StationID:"1070", ArrivalTime: b.arr}); // 左營
            } else {
                // 站站停
                stations.forEach((s, i) => {
                    stops.push({
                        StationID: s.id, 
                        DepartureTime: addTime(b.dep, i*12),
                        ArrivalTime: addTime(b.dep, i*12)
                    });
                });
            }
            
            mocks.push({
                TrainNo: b.no,
                Direction: b.dir,
                Stops: stops
            });
        });
        return mocks;
    }

    function addTime(time, mins) {
        const [h, m] = time.split(':').map(Number);
        const d = new Date(); d.setHours(h); d.setMinutes(m + mins);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

  </script>
