<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台灣高鐵時刻表 (真實數據即時版)</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
  <style> 
  /* ===== 全域效能優化 (Performance) ===== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ===== 核心變數與 Reset ===== */
  :root {
    --bg-card: #ffffff;
    --font-main: 'Inter', 'Noto Sans TC', sans-serif;
    --bg-body: #f8fafc;
    --bg-surface: #ffffff;
    --bg-header: rgba(255, 255, 255, 0.9);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --border: #e2e8f0;
    --primary: #fb923c; /* 高鐵橘 */
    --primary-bg: rgba(251, 146, 60, 0.1);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --radius: 10px;
  }

  /* 狀態文字顏色 */
  .status-text-未發車 { color: var(--text-muted); }
  .status-text-行駛中, .status-text-準點 { color: #22c55e; font-weight: 600; }
  .status-text-已過站, .status-text-已到終點 { color: var(--text-light); }

  /* 剩餘座位圖示 */
  .seat-icon { font-size: 1.1rem; font-weight: bold; display: inline-block; width: 1.2em; text-align: center; }
  .seat-o { color: #22c55e; }
  .seat-l { color: #f59e0b; }
  .seat-x { color: #ef4444; }
  .seat-none { color: var(--text-light); opacity: 0.5; }

  /* ===== 行動裝置優化增強 (Mobile Overrides) ===== */
  @media (max-width: 760px) {
    /* 1. 隱藏背景特效以解決卡頓 */
    .bg-blobs { display: none !important; }
    .header, .navbar, .card, .modal-content {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: var(--bg-surface) !important;
    }

    /* 2. 手機版欄位顯示控制 */
    .col-range, .col-stops, .col-seat-biz, .col-ticket { display: none !important; }
    /* 強制顯示標準座(col-seat-std)與其他重要資訊 */
    
    /* 3. 調整表格字體與內距 */
    table { font-size: 0.85rem; }
    th, td { padding: 12px 4px !important; }
    
    /* 4. 展開按鈕樣式 */
    .mobile-expand-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px; height: 24px;
        background: var(--primary-bg);
        color: var(--primary);
        border-radius: 50%;
        margin-right: 6px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        user-select: none;
    }

    /* 5. 手機版詳情行樣式 */
    .mobile-detail-row td {
        background: var(--bg-body) !important;
        padding: 12px 16px !important;
        border-left: 4px solid var(--primary);
        box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    /* 詳情頁面佈局 */
    .detail-row-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--border);
    }
    
    .detail-seats-row {
        display: flex; gap: 16px; margin-bottom: 10px;
        font-size: 0.9rem; color: var(--text-main);
        background: rgba(0,0,0,0.02); padding: 8px; border-radius: 8px;
    }

    .detail-range-info {
        font-weight: 700;
        font-size: 1rem;
        color: var(--text-main);
    }

    .detail-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 700;
        margin-bottom: 6px;
        display: block;
    }
  }

  /* 非手機端樣式 */
  @media (min-width: 761px) {
    .mobile-expand-btn { display: none; }
  }

  /* 通用：停靠站 Grid 排版 */
  .stops-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(6.5em, 1fr));
      gap: 6px 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
  }
  .stop-item { white-space: nowrap; display: inline-block; }

  body.dark-mode {
    --bg-body: #0f172a;
    --bg-card: #0b1220;
    --bg-surface: #1e293b;
    --bg-header: rgba(30, 41, 59, 0.9);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --text-light: #64748b;
    --border: #334155;
    --primary: #fb923c;
    --primary-bg: rgba(251, 146, 60, 0.15);
  }

  body {
    font-family: var(--font-main);
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 40px;
  }

  /* ===== 導航列 ===== */
  .header{
      position: sticky; top:0; z-index: 120;
      background: var(--bg-header);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 12px 16px;
  }
  .header-content{
      max-width: 1200px; margin: 0 auto;
      display:flex; align-items:center; justify-content:space-between; gap: 12px;
  }
  .logo{
      font-weight: 800; letter-spacing: .5px; color: var(--primary);
      display:flex; align-items: baseline; gap: 6px;
  }
  .logo span{ font-weight: 600; color: var(--text-muted); font-size: .85rem; }
  .date-picker{ display:flex; align-items:center; gap: 8px; }
  
  .btn-ghost{
      border:1px solid var(--border); background: transparent; color: var(--text-main);
      padding: 6px 12px; border-radius: 999px; cursor:pointer; font-weight:700;
  }
  .btn-ghost:hover{ background: rgba(148,163,184,0.14); }

  /* ===== 3. 主要容器 ===== */
  .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
  @media (max-width: 760px){ .container{ width: 94%; margin: 18px auto; } .header{ padding: 12px 14px; } }
  .grid { display: grid; gap: 24px; }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }
  @media (max-width: 760px){ .card{ padding: 16px 14px; border-radius: 20px; } }

  .section-title {
    font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

  /* ===== 4. 表單與篩選 ===== */
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; position: relative; }
  @media (max-width: 760px){ .form-row{ gap: 10px; } }
  
  .input-group { 
    display: flex; align-items: center; gap: 8px; 
    background: var(--bg-body); padding: 4px 8px; 
    border: 1px solid var(--border); border-radius: 8px; 
    flex: 1; min-width: 120px;
  }
  @media (max-width: 760px){ .input-group{ padding: 8px 10px; min-width: 130px; } }

  .input-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  input, select {
    border: none; background: transparent; color: var(--text-main); 
    font-size: 0.95rem; padding: 6px; outline: none; width: 100%; 
  }
  .input-field{
      border:1px solid var(--border); background: var(--bg-surface); color: var(--text-main);
      padding: 6px 10px; border-radius: 8px; outline: none; font-family: var(--font-main);
  }

  /* 互換按鈕 */
  .swap-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--primary);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: 0.2s; font-size: 1.1rem;
  }
  .swap-btn:hover { background: var(--bg-body); transform: rotate(180deg); }

  button.btn-primary {
    background: var(--primary); color: #fff; border: none;
    padding: 8px 16px; border-radius: 8px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }

  /* 常用行程按鈕 */
  .btn-fav {
    background: var(--primary); 
    color: white; border: none; border-radius: 20px; 
    padding: 6px 14px; font-size: 0.9rem; font-weight: 700;
    display: flex; align-items: center; gap: 4px;
    cursor: pointer; box-shadow: 0 2px 5px rgba(251, 146, 60, 0.3);
    white-space: nowrap; transition: 0.2s;
  }
  .btn-fav:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .fav-star { color: #fff; font-size: 1.1em; }

  .fav-popup {
     position: absolute; top: 100%; left: 0; z-index: 50;
     background: var(--bg-surface); border: 1px solid var(--border);
     border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
     padding: 8px; min-width: 220px; margin-top: 5px;
     display: none; flex-direction: column; gap: 4px;
  }
  .fav-popup.show { display: flex; }
  .fav-item {
     padding: 10px 12px; border-radius: 8px; cursor: pointer;
     font-size: 0.9rem; color: var(--text-main); font-weight: 600;
     display: flex; align-items: center; gap: 8px;
     transition: background 0.1s;
  }
  .fav-item:hover { background: var(--bg-body); color: var(--primary); }
  .fav-empty { padding: 10px; color: var(--text-muted); font-size: 0.85rem; text-align: center; }

  /* Chips */
  .history-chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .history-chip {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 12px;
    background: var(--bg-body); color: var(--text-muted);
    border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .history-chip:hover { background: var(--primary-bg); color: var(--primary); border-color: var(--primary); }

  .chip-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
    user-select: none; transition: 0.2s;
  }
  .chip-label:hover { background: var(--bg-body); }
  .chip-label input { display: none; }
  .chip-label:has(input:checked) {
    background: var(--primary-bg); color: var(--primary); border-color: var(--primary); font-weight: 500;
  }
  .chip-label input:checked + span { color: var(--primary); }

  /* ===== 5. 表格樣式 ===== */
  .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
  
  th {
    background: var(--bg-body); color: var(--text-muted); font-weight: 600; text-align: left;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  th.sortable { cursor: pointer; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-main); }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: var(--bg-body); cursor: pointer; }

  td { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  
  .train-route { font-size: 0.85rem; color: var(--text-muted); margin-left: 6px; }
  /* 進度條寬度在 JS 中動態控制，手機版已要求縮短 */
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; }

  /* ===== 6. Modal (彈窗) & 時間軸 ===== */
  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
    z-index: 2000; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s;
  }
  .modal[style*="display: flex"] { opacity: 1; }

  .modal-content {
    background: var(--bg-surface); width: 95%; max-width: 500px; max-height: 85vh;
    border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden; display: flex; flex-direction: column;
    transform: translateY(20px); transition: transform 0.3s;
  }
  .modal[style*="display: flex"] .modal-content { transform: translateY(0); }

  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-body);
  }
  .modal-title-main { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .modal-title-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
  .close{font-size:26px;color:var(--text-muted);background:transparent;width:auto;height:auto;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;user-select:none;flex:0 0 auto;padding:6px 10px;line-height:1;}
  .close:hover{background:rgba(148,163,184,0.18);color:var(--text-main);}

  .modal-body { padding: 0; overflow-y: auto; background: var(--bg-surface); }

  /* 時間軸樣式 */
  .timeline { padding: 10px 20px; }
  .timeline-item { display: flex; position: relative; padding-bottom: 0; }
  
  .tl-time {
    width: 50px; text-align: right; font-size: 0.9rem; font-weight: 600; 
    color: var(--text-main); padding-right: 15px; padding-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .tl-marker { display: flex; flex-direction: column; align-items: center; width: 20px; position: relative; }
  .tl-line { width: 2px; background: var(--border); flex-grow: 1; margin-top: 4px; margin-bottom: -4px; }
  .timeline-item:last-child .tl-line { display: none; }
  .tl-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--border);
    border: 2px solid var(--bg-surface); z-index: 1; flex-shrink: 0; transition: all 0.3s;
  }
  .tl-content { padding-left: 15px; padding-bottom: 24px; flex-grow: 1; }
  .timeline-item:last-child .tl-content { padding-bottom: 10px; }
  .tl-station { font-size: 1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; }
  .st-arr{ font-size:0.55em; font-weight:600; color:var(--text-muted); margin-left:8px; font-variant-numeric: tabular-nums; }
  .timeline-item.passed .tl-time, .timeline-item.passed .tl-station { opacity: 0.4; filter: grayscale(1); }
  .timeline-item.passed .tl-dot { background: var(--border); }
  .timeline-item.next .tl-dot { 
    background: #22c55e; width: 14px; height: 14px; 
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2); border-color: #fff; 
  }
  .timeline-item.next .tl-station { color: #15803d; font-weight: 700; }
  
  .badge-next {
    display: inline-flex; align-items: center; gap: 4px;
    background: #22c55e; color: #fff; font-size: 0.7rem; 
    padding: 2px 8px; border-radius: 10px; margin-left: 8px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

  .query-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px 0}
  .query-tab{appearance:none;border:1px solid var(--border);background:var(--card-bg);color:var(--text-main);
    padding:10px 12px;border-radius:12px;font-weight:700;cursor:pointer;transition:.15s}
  .query-tab:hover{transform:translateY(-1px)}
  .query-tab.active{background:linear-gradient(135deg, var(--primary), #ea580c);color:#fff;border-color:transparent}
  .query-panel.hidden{display:none}

  .ticket-btn{
    border:1px solid var(--border); background:var(--bg-body); color:var(--text-main);
    border-radius:10px; padding:6px 12px; cursor:pointer; font-size:14px; line-height:1; font-weight: 700;
  }
  .ticket-btn:active{ transform:scale(.98); }
  .ticket-btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }
  .est-tip{ font-size:12px; opacity:.55; cursor:help; line-height:1; }

  #loading-overlay{
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35);
      display:none; align-items:center; justify-content:center; flex-direction:column;
      z-index: 9999; backdrop-filter: blur(6px);
  }
  .spinner{
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.35);
      border-top-color: rgba(255,255,255,0.95);
      animation: spin 1s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to{ transform: rotate(360deg);} }

  /* ===== 背景裝飾 (桌面版) ===== */
  .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(120px); opacity: 0.42; pointer-events:none; }
  .blob { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; animation: float 25s infinite alternate ease-in-out; }
  .blob-1 { background: #fb923c; top: -10%; left: -10%; }
  .blob-2 { background: #2563eb; bottom: -10%; right: -10%; }
  @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(10%, 15%); } }

  /* ===== 行動版：表頭與查詢設定收合（同台鐵）===== */
  @media (max-width: 720px){
    .header-content{ flex-wrap: nowrap; gap: 8px; }
    .logo{ white-space: nowrap; }
    .date-picker{ flex-wrap: nowrap; gap: 8px; min-width: 0; }
    .date-picker label{ display:none; }
    #refreshBtn{ padding: 6px 10px !important; white-space: nowrap; }
    #homeBtn{ padding: 6px 10px !important; }
  }

  /* ===== 全新整合式搜尋列設計 ===== */
  /* 外層容器變成「大膠囊」：承載背景與陰影 */
  .trip-compact-bar {
    display: none; /* 電腦版隱藏 */
    align-items: center;
    /* 關鍵：背景跟陰影移到這裡，讓它看起來是一個整體 */
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 99px; /* 全圓角 */
    box-shadow: 0 8px 24px rgba(0,0,0,0.08); /* 漂亮的懸浮陰影 */
    margin: 12px 0 24px 0; /* 下方留白 */
    padding: 4px; /* 內部留白，讓按鈕不會貼邊 */
    position: relative;
  }

  /* 左側：原本的 Pill 變成透明容器 */
  .trip-pill {
    flex: 1; /* 佔滿剩餘空間 */
    display: flex;
    align-items: center;
    background: transparent; /* 變透明 */
    border: none; /* 無邊框 */
    box-shadow: none; /* 無陰影 */
    padding-left: 12px;
    height: 48px; /* 高度與按鈕一致 */
  }

  /* 圖示區 */
  .trip-pill-left {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--primary);
    font-weight: 900;
    white-space: nowrap;
    padding-right: 12px;
    margin-right: 12px;
    border-right: 1px solid var(--border); /* 分隔線 1 */
    height: 24px;
  }

  .trip-pill-left .trip-open-btn {
    width: auto;
    height: auto;
    border-radius: 0;
    padding: 0;
    /* 移除所有框線背景 */
    border: none !important;
    background: transparent !important;
    font-size: 1.2rem;
  }

  .trip-pill .trip-summary {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.95rem;
    color: var(--text-main);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left; /* 靠左對齊 */
  }

  /* 右側：搜尋按鈕整合進來 */
  .trip-compact-bar .trip-search-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%; /* 圓形 */
    
    /* ★★★ 移除實心橘色背景，改為透明 ★★★ */
    background: transparent;
    color: var(--primary); /* 圖示改用主色 (橘色) */
    
    border: none;
    box-shadow: none; /* 移除陰影 */
    font-size: 1.4rem; /* 圖示稍微放大 */
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0;
  }

  /* 在搜尋按鈕左邊加一條細分隔線，增加層次感 */
  .trip-compact-bar .trip-search-btn::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px; 
    bottom: 10px;
    width: 1px;
    background: var(--border);
  }

  .trip-compact-bar .trip-search-btn:active {
    transform: scale(0.9);
    background: rgba(0,0,0,0.05); /* 點擊時微微變灰 */
  }

  /* 深色模式微調 */
  body.dark-mode .trip-compact-bar {
    background: rgba(30, 41, 59, 0.85); /* 深色半透明背景 */
    border-color: rgba(255,255,255,0.1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  body.dark-mode .trip-search-btn {
    color: var(--primary); /* 深色模式下圖示仍亮橘色 */
  }
  body.dark-mode .trip-search-btn:active {
    background: rgba(255,255,255,0.1);
  }

  .trip-sheet-backdrop{
    display:none;
    position:fixed; inset:0;
    background: rgba(0,0,0,.45);
    z-index: 90;
  }
  .trip-sheet{
    display:none;
    position:fixed;
    left:0; right:0; bottom:0;
    z-index: 91;
    background: var(--bg-card);
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    box-shadow: 0 -12px 40px rgba(0,0,0,.2);
    max-height: 82vh;
    overflow:hidden;
  }
  .trip-sheet-hd{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .trip-sheet-title{ font-weight: 700; }
  .trip-sheet-body{
    padding: 12px 14px 18px;
    overflow:auto;
    max-height: calc(82vh - 56px);
  }

  @media (max-width: 720px){
    /* 行動版：把原本那排 form-row 收起來，改放在底部 sheet */
    #panel-startend .form-row{ display:none; }
    .trip-compact-bar{ display:flex; }
    /* 歷史行程左右滑動 */
    #searchHistory{ overflow-x:auto; white-space: nowrap; }
  }


  .hide-mobile{display:inline;}
  .icon-btn .ico{display:inline-block;}
  .icon-btn .txt{display:inline-block;}
  .home-btn .ico{display:inline-block;}
  .home-btn .txt{display:inline-block;}

  /* 行動版：表頭精簡（同台鐵） */
  @media (max-width: 720px){
    .hide-mobile{display:none !important;}
    .home-btn .txt{display:none !important;}
    .icon-btn .txt{display:none !important;}
    .logo span{display:none !important;}
    .date-picker{gap:8px;}
    .date-picker input[type="date"]{min-width: 150px;}
    #refreshBtn{min-width:44px; padding: 8px 10px !important;}
    #themeToggle{min-width:44px; padding: 8px 10px !important;}
  }

  /* 行動版查詢設定：背景不透明、固定排版 */
  @media (max-width: 720px){
    #searchHistory{display:none !important;}
    .trip-sheet{background: var(--bg-card); box-shadow: 0 -10px 40px rgba(0,0,0,0.25);}
    .trip-sheet-body{padding-top: 10px;}
    .trip-sheet .form-row{display:grid !important; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items:center; position: relative;}
    .trip-sheet .btn-fav{grid-column: 1 / span 3;}
    .trip-sheet .fav-popup{grid-column: 1 / span 3;}
    .trip-sheet .input-group{min-width:0;}
    .trip-sheet .swap-btn{justify-self:center; align-self:center; width: 36px; height:36px; flex:0 0 auto;}
    .trip-sheet label.chip-label{grid-column: 1 / span 3; margin-top: 2px;}
    .trip-sheet #searchBtn{grid-column: 1 / span 3;}
    /* 行動版歷史行程：固定一排、左右滑動 */
    #searchHistoryMobile{display:flex; flex-wrap: nowrap; overflow-x:auto; gap: 10px; padding: 6px 2px 10px; margin-bottom: 6px; -webkit-overflow-scrolling: touch;}
    #searchHistoryMobile .history-chip{flex: 0 0 auto; white-space: nowrap;}
    #searchHistoryMobile::-webkit-scrollbar{height:6px;}
    #searchHistoryMobile::-webkit-scrollbar-thumb{background: rgba(148,163,184,0.35); border-radius: 999px;}
    .trip-sheet .fav-popup{position: static; display:none; flex-direction: row; overflow-x:auto; gap:10px; padding: 6px 2px 10px; margin: 0 0 6px; background: transparent; border: 0; box-shadow:none;}
    .trip-sheet .fav-popup.show{display:flex;}
    .trip-sheet .fav-item{border:1px solid var(--border); border-radius:999px; padding: 8px 12px; background: var(--bg-surface); white-space: nowrap; }
    .trip-sheet .fav-empty{padding: 8px 12px; color: var(--text-muted);}
  }

</style>
</head>
<body class="light-mode">

<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">正在初始化高鐵真實數據...</div>
</div>

<header class="header">
  <div class="header-content">
    <div class="logo">THSR <span>Real-time</span></div>

    <div class="date-picker">
      <button class="btn-ghost home-btn" onclick="window.location.href='../home/index.html'" style="margin-right:8px;" title="回首頁"><span class="ico">🏠</span><span class="txt">首頁</span></button>
      
      <span class="hide-mobile" style="font-size: 0.8em; color: var(--text-muted);">選擇查詢日期：</span>
      <input type="date" id="mainQueryDate" class="input-field" style="width: auto; display: inline-block;">
      <button class="btn-primary icon-btn" id="refreshBtn" style="padding: 6px 12px;" title="更新資料"><span class="ico">⟳</span><span class="txt">更新</span></button>
      <button class="btn-ghost icon-btn" id="themeToggle" type="button" title="切換深夜模式"><span class="ico">🌙</span><span class="txt">深夜模式</span></button>

</header>

<main class="container">
  <div class="grid">

    <div class="query-tabs" role="tablist" aria-label="查詢模式">
      <button class="query-tab active" id="tab-startend" type="button" data-target="panel-startend">起訖站查詢</button>
      <button class="query-tab" id="tab-station" type="button" data-target="panel-station">車站時刻表</button>
      <button class="query-tab" id="tab-trainno" type="button" data-target="panel-trainno">車次查詢</button>

    <section id="panel-startend" class="card query-panel">

      <datalist id="stationList"></datalist>

      <div id="searchHistory" class="history-chips"></div>

      
      <div class="trip-compact-bar" id="tripCompactBar" aria-label="行動版查詢列">
        <div class="trip-pill" id="tripPill" role="button" tabindex="0" aria-label="開啟行程設定">
          <div class="trip-pill-left">
            <button class="btn-ghost trip-open-btn" id="tripOpenBtn" type="button" title="設定查詢">⚙️</button>
            <span class="trip-pill-label">行程</span>
          </div>
          <div class="trip-summary" id="tripSummaryText">出發 → 到達・直達</div>
        </div>
        <button class="btn-primary trip-search-btn" id="tripCompactSearchBtn" type="button" title="查詢">🔍</button>
      </div>
      <div class="trip-sheet-backdrop" id="tripSheetBackdrop"></div>
      <div class="trip-sheet" id="tripSheet" role="dialog" aria-modal="true" aria-label="查詢設定">
        <div class="trip-sheet-hd">
          <div class="trip-sheet-title">查詢設定</div>
          <button class="btn-ghost" id="tripSheetClose" type="button" title="關閉">✕</button>
        </div>
        <div class="trip-sheet-body" id="tripSheetBody">
          <div id="searchHistoryMobile" class="history-chips" aria-label="歷史行程"></div>

<div class="form-row" style="position:relative;">
        <button class="btn-fav" id="favBtn" type="button">
           <span class="fav-star">★</span> 常用行程

              <th>車次</th>

              <th class="col-stops">停靠</th>

          <label>車站</label>
          <input list="stationList" id="stationNameInput" placeholder="請輸入站名或站碼">
        </div>
        <div class="input-group" style="max-width: 220px;">
          <label>方向</label>
          <select id="directionSelect"><option value="south">南下</option><option value="north">北上</option></select>

      <div class="table-wrapper">
        <table id="scheduleTableByStationName">
          <thead><tr><th>車次</th><th>區間</th><th>時間</th><th>狀態</th></tr></thead>

<div id="trainModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <div class="modal-title-main" id="modalTitleMain">列車資訊</div>
        <div class="modal-title-sub" id="modalTitleSub">—</div>

<script src="./thsr.real-schedule.js"></script>
<script>
  let nameToId = {};
  let stationListSorted = [];
  let currentQueryDateStr = '';
  let baseSchedule = {};
  let prevSchedule = {};
  let lastStartEndQuery = null;
  let lastStationQuery  = null;
  let lastTrainQuery    = null;
  let modalCtx = null;
  let currentSeatMap = {}; 
  let currentStartEndList = [];
  let currentStationList = [];

  function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function addDays(dateStr, delta){ const [y,m,d] = dateStr.split('-').map(Number); const dt = new Date(y, m-1, d); dt.setDate(dt.getDate()+delta); return fmtDate(dt); }
  function normTW(s){ return String(s||'').trim().replace(/台/g,'臺'); }
  function sameStation(a,b){ return normTW(a) === normTW(b); }
  const THSR_STATION_ORDER = ['南港','臺北','板橋','桃園','新竹','苗栗','臺中','彰化','雲林','嘉義','臺南','左營'];
  function normTHSRStationName(s){ const n = normTW(s||''); if(n==='高雄' || n==='新左營') return '左營'; return n; }
  function thsrStationIndex(name){ return THSR_STATION_ORDER.indexOf(normTHSRStationName(name)); }
  function parseTime(t){ if(!t || !/\d{1,2}:\d{2}/.test(t)) return null; let [h,m]=t.split(':').map(x=>parseInt(x,10)); return h*60+m; }
  function durationText(depMin, arrMin){ if(depMin===null || arrMin===null) return '--'; let d = arrMin - depMin; if(d < 0) d += 1440; const hh = Math.floor(d/60); const mm = d%60; return `${hh}h ${String(mm).padStart(2,'0')}m`; }
  function isQueryToday(dateStr){ return dateStr === fmtDate(new Date()); }
  function splitArrDep(stopRow){ const t1 = stopRow?.[1] || ''; const t2 = stopRow?.[2] || ''; if(!t2) return { arr: t1, dep: t1 }; if(!t1) return { arr: t2, dep: t2 }; const m1 = parseTime(t1); const m2 = parseTime(t2); if(m1===null || m2===null) return { arr: t1, dep: t2 }; if(m2 <= m1) return { arr: t2, dep: t1 }; return { arr: t1, dep: t2 }; }

  function getStopsWithAdjustedDate(trainNo, originDateStr, scheduleMap) {
    const t = scheduleMap[trainNo]; if (!t) return [];
    const stops = t['車站時間'] || [];
    let dayOffset = 0; let prevMin = -1;
    return stops.map((stop) => {
      const ad = splitArrDep(stop); const timeStr = ad.dep || ad.arr || ''; const currentMin = parseTime(timeStr);
      if (prevMin !== -1 && currentMin !== null && currentMin < prevMin) dayOffset++;
      if (currentMin !== null) prevMin = currentMin;
      return { name: stop[0], time: timeStr, arr: ad.arr, actualDate: addDays(originDateStr, dayOffset), originDate: originDateStr };
    });
  }

  function stopDisplayDate(originDateStr, stops, idx){
    let dayOffset = 0; let prevMin = -1;
    for(let i=0; i<=idx; i++){
        const ad = splitArrDep(stops[i]); const m = parseTime(ad.dep || ad.arr || '');
        if(prevMin !== -1 && m !== null && m < prevMin) dayOffset++;
        if(m !== null) prevMin = m;
    }
    return addDays(originDateStr, dayOffset);
  }

  function getStatusLabel(originDateStr, depTimeStr, arrTimeStr, firstDepTimeStr, mode) {
    const now = new Date(); const todayStr = fmtDate(now);
    if (originDateStr > todayStr) return '未發車'; if (originDateStr < todayStr) return '已到終點';
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const depMin = parseTime(depTimeStr || ''); const arrMin = parseTime(arrTimeStr || ''); const firstDepMin = parseTime(firstDepTimeStr || ''); 
    if (depMin === null) return '未發車';
    let adjustedArrMin = arrMin; if (arrMin !== null && arrMin < depMin) adjustedArrMin += 1440;
    if (nowMin < depMin) { if (firstDepMin !== null && nowMin >= firstDepMin) { return '行駛中'; } return '未發車'; } 
    else if (adjustedArrMin !== null && nowMin < adjustedArrMin) { return (mode === 'train') ? '行駛中' : '已過站'; } 
    else { return '已到終點'; }
  }

  function statusBadge(label){ const s = String(label||''); const tip = '狀態依預定時刻與目前時間推估'; return `<span class="status-badge est" style="background:transparent; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; padding:0;"><span class="status-text-${s}">${s}</span><span class="est-tip" title="${tip}" style="opacity:0.5; cursor:help;">ⓘ</span></span>`; }

  function bindStationInput(inputId){
    const input = document.getElementById(inputId); if(!input) return;
    input.addEventListener('focus', ()=> fillStationDatalist(input.value));
    input.addEventListener('input', ()=> fillStationDatalist(input.value));
    input.addEventListener('blur', ()=>{ const resolved = extractStationNameFromInput(input.value); if(resolved) input.value = resolved; });
  }
  function bindTrainInput(inputId){
    const input = document.getElementById(inputId); if(!input) return;
    input.addEventListener('focus', ()=> fillTrainDatalist(input.value));
    input.addEventListener('input', ()=> fillTrainDatalist(input.value));
    input.addEventListener('blur', ()=>{ const no = extractTrainNoFromInput(input.value); if(no) input.value = no; });
  }
  function extractStationNameFromInput(raw){ 
    const v=String(raw||'').trim(); if(!v) return ''; 
    const m=v.match(/^(\d{3,6})\s*-\s*(.+)$/); 
    if(m&&window.stationMap&&window.stationMap[m[1]]) return window.stationMap[m[1]]; 
    if(window.stationMap&&window.stationMap[v]) return window.stationMap[v]; 
    const asTai=normTW(v); 
    if(asTai==='高雄'||asTai==='新左營') return '左營'; 
    if(nameToId[asTai]) return asTai; 
    return normTW(v); 
  }
  function fillStationDatalist(k){ const dl=document.getElementById('stationList'); if(!dl) return; dl.innerHTML=stationListSorted.filter(s=>s.name.includes(normTW(k))||String(s.id).includes(k)).slice(0,30).map(s=>`<option value="${s.id}-${s.name}"></option>`).join(''); }
  function fillTrainDatalist(k){ 
    const dl=document.getElementById('trainNumberList'); if(!dl) return; 
    const nums = Object.keys(baseSchedule).filter(n=>n.includes(k)).sort();
    const limit = 50; let out = '';
    for(let i=0; i<nums.length; i++){ if(i >= limit) break; const n = nums[i]; const t = baseSchedule[n]; const stops = t?.['車站時間']||[]; const first = stops[0]?.[0] || ''; const last = stops.slice(-1)[0]?.[0] || ''; const range = (first && last) ? `${first}➝${last}` : ''; out += `<option value="${n} - ${range}"></option>`; }
    dl.innerHTML = out; 
  }
  function extractTrainNoFromInput(v){ let no=String(v||'').trim().split('-')[0].trim(); if(/^\d{3}$/.test(no)) no='0'+no; return no; }
  function buildStationIndex(){ nameToId={}; stationListSorted=[]; if(!window.stationMap) return; Object.entries(window.stationMap).forEach(([id,n])=>{ const nn=normTW(n); nameToId[nn]=id; stationListSorted.push({id,name:nn}); }); stationListSorted.sort((a,b)=>String(a.id).localeCompare(String(b.id))); }

  async function refreshData(dateStr){
    currentQueryDateStr = dateStr || '';
    document.getElementById('loading-overlay').style.display = 'flex';
    document.getElementById('loading-text').textContent = `正在獲取 ${dateStr} 資料...`;
    await fetchRealData(dateStr);
    baseSchedule = (typeof structuredClone==='function') ? structuredClone(window.trainSchedule) : JSON.parse(JSON.stringify(window.trainSchedule||{}));
    const prevDateStr = addDays(dateStr, -1);
    await fetchRealData(prevDateStr);
    prevSchedule = (typeof structuredClone==='function') ? structuredClone(window.trainSchedule) : JSON.parse(JSON.stringify(window.trainSchedule||{}));
    window.trainSchedule = structuredClone(baseSchedule);
    buildStationIndex(); fillStationDatalist(''); fillTrainDatalist(''); renderHistory();
    document.getElementById('loading-overlay').style.display = 'none';
    rerenderVisibleResults();
  }

  async function runStartEndSearch() {
    const dateInput = document.getElementById('mainQueryDate');
    const queryDate = dateInput ? dateInput.value : fmtDate(new Date());
    const todayStr = fmtDate(new Date());
    const stInput = document.getElementById('startStation').value;
    const edInput = document.getElementById('endStation').value;
    const st = extractStationNameFromInput(stInput);
    const ed = extractStationNameFromInput(edInput);
    if (!st || !ed || !queryDate) return;
    document.getElementById('startStation').value = st;
    document.getElementById('endStation').value = ed;
    
    // 設定是否為過去日期，影響是否顯示座位
    const isPastDate = queryDate < todayStr;
    // 手機版會隱藏標頭，這裡主要是給桌面版
    document.querySelectorAll('.seat-col-header').forEach(th => { th.style.display = isPastDate ? 'none' : ''; });
    
    lastStartEndQuery = { st, ed };
    buildDirectList(st, ed);
    renderStartEndTable();
    if (queryDate >= todayStr) { await refreshSeatForCurrentOD(st, ed); } else { currentSeatMap = {}; renderStartEndTable(); }
    const h = loadHistory().filter(x => !(x.s === st && x.e === ed));
    h.unshift({ s: st, e: ed });
    saveHistory(h); renderHistory();
    // 行動版：查詢後自動收合查詢設定
    if (window.innerWidth <= 720) { try{ closeTripSheet(); }catch(e){} }
  }

  function buildDirectList(st, ed) {
    const list = [];
    const queryDate = document.getElementById('mainQueryDate').value;
    const onlyDirect = document.getElementById('onlyDirect')?.checked;
    const sources = [{ map: baseSchedule, origin: queryDate }, { map: prevSchedule, origin: addDays(queryDate, -1) }];
    sources.forEach(src => {
      Object.keys(src.map || {}).forEach(trainNo => {
        const adjStops = getStopsWithAdjustedDate(trainNo, src.origin, src.map);
        const i1 = adjStops.findIndex(x => sameStation(x.name, st));
        const i2 = adjStops.findIndex(x => sameStation(x.name, ed));
        if (i1 < 0 || i2 < 0 || i2 <= i1) return;
        const start = adjStops[i1]; const end = adjStops[i2];
        if (src.origin !== queryDate) { const depMin = parseTime(start.time); if (depMin === null || depMin > 240) return; }
        if (start.actualDate !== queryDate) return;
        const dur = (parseTime(end.time) - parseTime(start.time) + 1440) % 1440;
        if (onlyDirect && (i2 - i1 - 1) > 0) return;
        const firstDep = adjStops[0].time; 
        list.push({
          trainNo, dep: start.time, arr: end.time, durMin: dur,
          range: `${adjStops[0].name}➝${adjStops.slice(-1)[0].name}`,
          stopBetween: i2 - i1 - 1,
          status: getStatusLabel(start.originDate, start.time, end.time, firstDep, 'list'),
          originDate: start.originDate, midStops: adjStops.slice(i1 + 1, i2),
          startStation: st, endStation: ed
        });
      });
    });
    currentStartEndList = list.sort((a,b) => parseTime(a.dep) - parseTime(b.dep));
  }

  async function refreshSeatForCurrentOD(st, ed){
    const dateStr = document.getElementById('mainQueryDate').value;
    const todayStr = fmtDate(new Date());
    const oId = nameToId[normTW(st)]; const dId = nameToId[normTW(ed)];
    if(!dateStr || !oId || !dId) return;
    currentSeatMap = {};
    if (dateStr === todayStr) {
        const mToday = await window.fetchSeatStatusOD(dateStr, oId, dId).catch(()=>({}));
        Object.keys(mToday||{}).forEach(k=>{ currentSeatMap[`${String(k)}|${dateStr}`] = mToday[k]; });
    } else {
        const prevDateStr = addDays(dateStr, -1);
        const [mToday, mPrev] = await Promise.all([ window.fetchSeatStatusOD(dateStr, oId, dId).catch(()=>({})), window.fetchSeatStatusOD(prevDateStr, oId, dId).catch(()=>({})) ]);
        Object.keys(mPrev||{}).forEach(k=>{ currentSeatMap[`${String(k)}|${prevDateStr}`] = mPrev[k]; });
        Object.keys(mToday||{}).forEach(k=>{ currentSeatMap[`${String(k)}|${dateStr}`] = mToday[k]; });
    }
    renderStartEndTable();
  }

  function getSeatIcon(trainNo, type, originDateStr) {
    const key = `${String(trainNo)}|${originDateStr}`; const info = currentSeatMap?.[key]; const status = info ? info[type] : '--';
    if(status==='O') return '<span class="seat-icon seat-o">○</span>'; if(status==='L') return '<span class="seat-icon seat-l">△</span>'; if(status==='X') return '<span class="seat-icon seat-x">✕</span>'; return '<span class="seat-icon seat-none">--</span>';
  }
    // ===== 耗時條：極端值處理（P95 cap）+ 漸層色（同色系，不彩虹）=====
    function percentile(sortedArr, p){
      if(!sortedArr || !sortedArr.length) return 1;
      const idx = (sortedArr.length - 1) * p;
      const lo = Math.floor(idx), hi = Math.ceil(idx);
      if(lo === hi) return sortedArr[lo];
      const w = idx - lo;
      return sortedArr[lo] * (1 - w) + sortedArr[hi] * w;
    }
    
    function lerp(a,b,t){ return a + (b-a)*t; }
    function lerpColor(c1,c2,t){
      return {
        r: Math.round(lerp(c1.r,c2.r,t)),
        g: Math.round(lerp(c1.g,c2.g,t)),
        b: Math.round(lerp(c1.b,c2.b,t))
      };
    }
    // 連續色階：綠 -> 黃 -> 橘 -> 紅 -> 紫（取某個比例點的顏色，整條單色）
    function travelColor(norm01){
      const t = Math.max(0, Math.min(1, norm01));
      const stops = [
        {t:0.00, c:{r:34,  g:197, b:94 }},  // green
        {t:0.25, c:{r:234, g:179, b:8  }},  // yellow
        {t:0.50, c:{r:249, g:115, b:22 }},  // orange
        {t:0.75, c:{r:239, g:68,  b:68 }},  // red
        {t:1.00, c:{r:168, g:85,  b:247}}   // purple
      ];
      for(let i=0;i<stops.length-1;i++){
        const a = stops[i], b = stops[i+1];
        if(t >= a.t && t <= b.t){
          const tt = (t - a.t) / (b.t - a.t || 1);
          const c = lerpColor(a.c, b.c, tt);
          return `rgb(${c.r},${c.g},${c.b})`;
        }
      }
      const last = stops[stops.length-1].c;
      return `rgb(${last.r},${last.g},${last.b})`;
    }
    // 耗時長條：最短約 5%，極端值 100%，其餘依 (min..cap) 線性比例
    function getTravelBarStyle(travelMin, minMin, capMin){
      const t = Math.max(0, travelMin || 0);
      const minV = Math.max(0, minMin || 0);
      const capV = Math.max(minV + 1, capMin || (minV + 1));

      const isExtreme = t >= capV;
      const denom = Math.max(1, (capV - minV));
      const norm = isExtreme ? 1 : Math.min(1, Math.max(0, (t - minV) / denom));
      const widthPct = (t > 0) ? Math.max(5, Math.min(100, 5 + norm * 95)) : 0;
      const fillBg = travelColor(norm);
      return { widthPct, isExtreme, fillBg };
    }

    const minDur = Math.max(1, (durSorted[0] || 1));
    const capDur = Math.max(minDur + 1, percentile(durSorted, 0.95)); // P95 作為極端值上限

                `;
                tr.parentNode.insertBefore(detailRow, tr.nextSibling);

            }
            return;
        }

        // B. 訂票按鈕 (PC / 手機展開區共用)
        const ticket = e.target.closest('.ticket-btn');
        if(ticket && !ticket.disabled){

        const stopText = row.stopBetween <= 0

        tr.innerHTML = `
            <td>
                <span class="mobile-expand-btn" data-idx="${idx}">+</span>
                <b>${row.trainNo}</b>

            <td class="col-dur">
                <div style="display:flex;flex-direction:column;gap:4px;">
                    <div style="font-weight:800;font-size:0.85rem;">${durationText(0, row.durMin).replace('0h ','')}</div>
                    <div class="progress-bar" style="width:60px;">
                        <div class="progress-fill" style="width:${(()=>{const s=getTravelBarStyle(row.durMin||0, minDur, capDur); return Math.round(s.widthPct);})()}%; background:${(()=>{const s=getTravelBarStyle(row.durMin||0, minDur, capDur); return s.fillBg;})()};"></div>
                    </div>

        tbody.appendChild(tr);
    });
  }

  function filterTrainScheduleByStationName(){
    const st = extractStationNameFromInput(document.getElementById('stationNameInput').value); document.getElementById('stationNameInput').value = st;
    const dir = document.getElementById('directionSelect').value; if(!st) return;
    lastStationQuery = { station: st, dir }; const list = [];
    const sources = [{ map: baseSchedule, origin: currentQueryDateStr }, { map: prevSchedule, origin: addDays(currentQueryDateStr, -1) }];
    sources.forEach(src=>{
      const sch = src.map || {}; const origin = src.origin;
      Object.keys(sch||{}).forEach(trainNo=>{
        const t = sch[trainNo]; const stops = t?.['車站時間']||[];
        const idx = stops.findIndex(x=>sameStation(x[0], st)); if(idx<0) return;
        const d = stopDisplayDate(origin, stops, idx); if(d !== currentQueryDateStr) return;
        const first = stops[0]?.[0] || ''; const last  = stops.slice(-1)[0]?.[0] || '';
        const fi = thsrStationIndex(first); const li = thsrStationIndex(last);
        const isSouth = (fi>=0 && li>=0) ? (fi < li) : ((first && last) ? (first.localeCompare(last,'zh-Hant') < 0) : true);
        if(dir==='south' && !isSouth) return; if(dir==='north' && isSouth) return;
        const ad = splitArrDep(stops[idx]); const time = ad.dep || ad.arr || ''; const lastArr = (splitArrDep(stops[stops.length-1]||[]).arr || splitArrDep(stops[stops.length-1]||[]).dep || '');
        const range = `${first}➝${last}`; const firstDep = splitArrDep(stops[0]).dep; const status = getStatusLabel(origin, time, lastArr, firstDep, 'list');
        list.push({trainNo, range, time, status, originDate: origin});
      });
    });
    list.sort((a,b)=>{
      const aa = parseTime(a.time); const bb = parseTime(b.time);
      if(aa===null && bb===null) return String(a.trainNo).localeCompare(String(b.trainNo),'en'); if(aa===null) return 1; if(bb===null) return -1; return aa-bb;
    });
    currentStationList = list; renderStationTable();
  }

  function renderTimeline(stops, originDateStr){
    const nowMin = new Date().getHours()*60 + new Date().getMinutes(); const today = isQueryToday(originDateStr);

    const html = stops.map((s,i)=>{
      const ad = splitArrDep(s); const tm = (i===stops.length-1)?ad.arr:ad.dep; let cls = ''; let badge = '';
      if(today){ if(i < nextIdx) cls = 'passed'; else if(i === nextIdx) { cls = 'next'; badge = '<span class="badge-next">下一站</span>'; } }
      const arrInfo = (ad.arr && ad.arr !== tm) ? `<span class="st-arr">到 ${ad.arr}</span>` : '';
      return `<div class="timeline-item ${cls}"><div class="tl-time">${tm || '--'}</div><div class="tl-marker"><div class="tl-dot"></div><div class="tl-line"></div></div><div class="tl-content"><div class="tl-station">${s[0]} ${badge} ${arrInfo}</div></div></div>`;

  async function openTHSRBookingDeepLink(trainNo, dateStr, timeStr){ 
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (!isMobile) { alert("限使用行動裝置並已下載高鐵T Express行動購票App使用"); return; }
    try {
        let st = extractStationNameFromInput(document.getElementById('startStation').value);
        let ed = extractStationNameFromInput(document.getElementById('endStation').value);
        if(!st || !ed){ alert("請先選擇起訖站"); return; }
        st = st.replace(/臺/g, '台'); ed = ed.replace(/臺/g, '台');
        if (typeof getAccessToken !== 'function') { alert("系統錯誤：無法取得授權函式"); return; }
        const token = await getAccessToken(); if(!token) { alert("授權失敗，無法連接 TDX"); return; }
        const apiUrl = `https://tdx.transportdata.tw/api/maas-thsr/booking/deeplink/direct/hsr?start_station=${encodeURIComponent(st)}&end_station=${encodeURIComponent(ed)}&train_date=${dateStr}&train_time=${encodeURIComponent(timeStr)}&train_number=${trainNo}`;
        const res = await fetch(apiUrl, { method: 'GET', headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' } });
        if(!res.ok) { if(res.status === 401) alert("API 存取被拒 (401): Access key not found"); else alert(`訂票連結取得失敗: HTTP ${res.status}`); return; }
        const result = await res.json();
        const jumpUrl = result.url || (result.data && result.data.deeplink) || result.DeepLinkUrl;
        if (jumpUrl) { window.location.href = jumpUrl; } else { console.error("API 回傳結構異常:", result); alert("無法取得 App 喚醒連結"); }
    } catch (e) { console.error("Deep Link Error:", e); alert("系統發生錯誤，請稍後再試"); }
  }

    popup.innerHTML = '';
    
    let hasFav = false;
    for(let i=1; i<=3; i++) {
        const s = localStorage.getItem(`thsr_s${i}`);
        const e = localStorage.getItem(`thsr_e${i}`);
        if(s && e) {
            hasFav = true;
            const item = document.createElement('div');
            item.className = 'fav-item';
            item.innerHTML = `<span style="color:var(--primary);">📍</span> ${s} → ${e}`;
            item.onclick = () => {
                document.getElementById('startStation').value = s;
                document.getElementById('endStation').value = e;
                popup.classList.remove('show');
                runStartEndSearch();
            };
            popup.appendChild(item);
        }
    }

    if (!hasFav) {
        const empty = document.createElement('div');
        empty.className = 'fav-empty';
        empty.innerText = '尚無常用行程，請至首頁設定';
        popup.appendChild(empty);
    }
  }

  window.addEventListener('load', async ()=>{
    bindQueryTabs();
    switchQueryPanel('panel-startend');
    initDatePickerWindow();
    setupThemeToggle();
    bindButtons();
    bindStationInput('startStation');
    bindStationInput('endStation');
    bindStationInput('stationNameInput');
    bindTrainInput('trainNumberInput');
    initStartEndSorting();
    
    initFavButton();
    
    // ★★★ 這行是關鍵修復：網頁一載入就初始化手機版介面 ★★★
    setupMobileTripSheet();

    document.getElementById('startStation').addEventListener('focus',()=>fillStationDatalist(''));
    document.getElementById('endStation').addEventListener('focus',()=>fillStationDatalist(''));

    await refreshData(document.getElementById('mainQueryDate').value);

    handleUrlParams();

    setInterval(()=>{ if(document.getElementById('mainQueryDate').value === fmtDate(new Date())) rerenderVisibleResults(); }, 60000);
  });
  
  window.fetchCollegeDiscount = async function(){ return {}; };

  // ===== 行動版：查詢設定收合 =====
  function isMobileUI(){ return window.matchMedia && window.matchMedia('(max-width: 720px)').matches; }

  function updateTripSummary(){
    const st = (document.getElementById('startStation')?.value||'').trim();
    const ed = (document.getElementById('endStation')?.value||'').trim();
    const onlyDirect = document.getElementById('onlyDirect')?.checked;
    const t = document.getElementById('tripSummaryText');
    if(!t) return;
    if(!st && !ed){ t.textContent = '請設定出發與到達'; return; }
    const seg = `${st||'—'} ➝ ${ed||'—'}`;
    t.textContent = onlyDirect ? `${seg} ｜直達` : seg;
  }

  function openTripSheet(){
    const b = document.getElementById('tripSheetBackdrop');
    const s = document.getElementById('tripSheet');
    if(!b || !s) return;
    b.style.display='block';
    s.style.display='block';
    document.body.style.overflow='hidden';
  }
  function closeTripSheet(){
    const b = document.getElementById('tripSheetBackdrop');
    const s = document.getElementById('tripSheet');
    if(!b || !s) return;
    b.style.display='none';
    s.style.display='none';
    document.body.style.overflow='';
  }

  function setupMobileTripSheet(){
    if(!isMobileUI()) return;
    const panel = document.getElementById('panel-startend');
    const formRow = panel?.querySelector('.form-row');
    const body = document.getElementById('tripSheetBody');
    
    // 檢查並移動元素，並在此時綁定事件，避免重複綁定
    if(formRow && body && !body.dataset.bound){
      body.dataset.bound='1';
      body.appendChild(formRow); // 移到 sheet 裡
      formRow.classList.add('in-sheet');
      formRow.style.position='relative';
      
      const swap = document.getElementById('swapBtn');
      if(swap){
        swap.style.width='';
        swap.style.height='';
        swap.style.justifySelf='center';
        swap.style.alignSelf='center';
      }
      const searchBtn = document.getElementById('searchBtn');
      if(searchBtn){
        searchBtn.style.width='100%';
        searchBtn.style.height='44px';
      }

      // ★★★ 事件綁定移動到這裡，確保只綁定一次 ★★★
      document.getElementById('tripOpenBtn')?.addEventListener('click', (e)=>{
          e.stopPropagation(); 
          openTripSheet();
      });
      document.getElementById('tripSheetClose')?.addEventListener('click', closeTripSheet);
      document.getElementById('tripSheetBackdrop')?.addEventListener('click', closeTripSheet);

      document.getElementById('tripCompactSearchBtn')?.addEventListener('click', (e)=>{
        e.stopPropagation();
        closeTripSheet();
        document.getElementById('searchBtn')?.click();
      });

      // 點擊整個條開啟設定，但排除搜尋按鈕
      document.getElementById('tripCompactBar')?.addEventListener('click', (ev)=>{
        if(ev.target && ev.target.closest && ev.target.closest('#tripCompactSearchBtn')) return;
        openTripSheet();
      });

      // 按下搜尋按鈕後收合
      document.getElementById('searchBtn')?.addEventListener('click', ()=>{ closeTripSheet(); });
    }

    // 內容更新
    ['startStation','endStation'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){ el.addEventListener('input', updateTripSummary); el.addEventListener('change', updateTripSummary); }
    });
    document.getElementById('onlyDirect')?.addEventListener('change', updateTripSummary);

    updateTripSummary();
  }

  window.addEventListener('resize', ()=>{
    // 縮放到手機寬度時再初始化
    setupMobileTripSheet();
    updateTripSummary();
  });

</script>
<script src="../monitor.js"></script>

<script>
  // Embed mode: make '首頁' button close parent overlay instead of navigating.
  (function(){
    try{
      const qs = new URLSearchParams(location.search);
      const isEmbed = qs.get('embed') === '1';
      if (!isEmbed) return;
      if (window.parent && window.parent !== window){
        const btn = document.querySelector('.home-btn');
        if (btn){
          btn.onclick = null;
          btn.removeAttribute('onclick');
          btn.addEventListener('click', function(e){
            e.preventDefault();
            e.stopPropagation();
            window.parent.postMessage({type:'APP_CLOSE'}, '*');
          }, true);
        }
      }
    }catch(e){}
  })();
</script>
