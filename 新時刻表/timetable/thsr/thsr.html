<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台灣高鐵時刻表 (真實數據即時版)</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
  <style> 
  /* ===== 全域效能優化 (Performance) ===== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ===== 核心變數與 Reset ===== */
  :root {
    --bg-card: #ffffff;
    --font-main: 'Inter', 'Noto Sans TC', sans-serif;
    --bg-body: #f8fafc;
    --bg-surface: #ffffff;
    --bg-header: rgba(255, 255, 255, 0.9);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --border: #e2e8f0;
    --primary: #fb923c; /* 高鐵橘 */
    --primary-bg: rgba(251, 146, 60, 0.1);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --radius: 10px;
  }

  /* 狀態文字顏色 */
  .status-text-未發車 { color: var(--text-muted); }
  .status-text-行駛中, .status-text-準點 { color: #22c55e; font-weight: 600; }
  .status-text-已過站, .status-text-已到終點 { color: var(--text-light); }

  /* 剩餘座位圖示 */
  .seat-icon { font-size: 1.1rem; font-weight: bold; display: inline-block; width: 1.2em; text-align: center; }
  .seat-o { color: #22c55e; }
  .seat-l { color: #f59e0b; }
  .seat-x { color: #ef4444; }
  .seat-none { color: var(--text-light); opacity: 0.5; }
  .thsr-station-train-inline {
    display: inline-flex;
    align-items: baseline;
    gap: 0;
    white-space: nowrap;
  }
  .thsr-station-train-inline .rsv2-train-no {
    min-width: auto;
    text-align: left;
  }
  .rail-status-rotator{
    position: relative;
    display: inline-grid;
    align-items: center;
    vertical-align: middle;
    min-width: 0;
  }
  .rail-status-rotator-track{
    display: grid;
  }
  .rail-status-rotator-item{
    grid-area: 1 / 1;
    white-space: nowrap;
    opacity: 0;
    animation-duration: 4.2s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  .rail-status-rotator-item.is-primary{ animation-name: railStatusPrimarySwap; }
  .rail-status-rotator-item.is-secondary{ animation-name: railStatusSecondarySwap; }
  .rail-status-tone-success{ color: #16a34a; }
  .rail-status-tone-warning{ color: #c2410c; }
  .rail-status-tone-danger{ color: #b91c1c; }
  .rail-status-tone-muted{ color: #94a3b8; }
  .rail-status-tone-neutral{ color: var(--text-main); }
  @keyframes railStatusPrimarySwap{
    0%, 44% { opacity: 1; }
    50%, 94% { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes railStatusSecondarySwap{
    0%, 44% { opacity: 0; }
    50%, 94% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ===== 行動裝置優化增強 (Mobile Overrides) ===== */
  @media (max-width: 760px) {
    /* 1. 隱藏背景特效以解決卡頓 */
    .bg-blobs { display: none !important; }
    .header, .navbar, .card, .modal-content {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: var(--bg-surface) !important;
    }

    /* 2. 手機版欄位顯示控制 */
    .col-stops, .col-seat-biz, .col-ticket { display: none !important; }
    .col-range, .col-seat-std, .col-dur { display: table-cell !important; }
    /* 強制顯示標準座(col-seat-std)與其他重要資訊 */
    
    /* 3. 調整表格字體與內距 */
    table { font-size: 0.85rem; }
    th, td { padding: 12px 4px !important; }
    
    /* 4. 展開按鈕樣式 */
    .mobile-expand-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px; height: 24px;
        background: var(--primary-bg);
        color: var(--primary);
        border-radius: 50%;
        margin-right: 6px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        user-select: none;
    }

    /* 5. 手機版詳情行樣式 */
    .mobile-detail-row td {
        background: var(--bg-body) !important;
        padding: 12px 16px !important;
        border-left: 4px solid var(--primary);
        box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    /* 詳情頁面佈局 */
    .detail-row-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--border);
    }
    
    .detail-seats-row {
        display: flex; gap: 16px; margin-bottom: 10px;
        font-size: 0.9rem; color: var(--text-main);
        background: rgba(0,0,0,0.02); padding: 8px; border-radius: 8px;
    }

    .detail-range-info {
        font-weight: 700;
        font-size: 1rem;
        color: var(--text-main);
    }

    .detail-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 700;
        margin-bottom: 6px;
        display: block;
    }
  }

  /* 非手機端樣式 */
  @media (min-width: 761px) {
    .mobile-expand-btn { display: none; }
  }

  /* 通用：停靠站 Grid 排版 */
  .stops-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(6.5em, 1fr));
      gap: 6px 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
  }
  .stop-item { white-space: nowrap; display: inline-block; }

  body.dark-mode {
    --bg-body: #0f172a;
    --bg-card: #0b1220;
    --bg-surface: #1e293b;
    --bg-header: rgba(30, 41, 59, 0.9);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --text-light: #64748b;
    --border: #334155;
    --primary: #fb923c;
    --primary-bg: rgba(251, 146, 60, 0.15);
  }

  body {
    font-family: var(--font-main);
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 40px;
  }

  /* ===== 導航列 ===== */
  .header{
      position: sticky; top:0; z-index: 120;
      background: var(--bg-header);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 12px 16px;
  }
  .header-content{
      max-width: 1200px; margin: 0 auto;
      display:flex; align-items:center; justify-content:space-between; gap: 12px;
  }
  .logo{
      font-weight: 800; letter-spacing: .5px; color: var(--primary);
      display:flex; align-items: baseline; gap: 6px;
  }
  .logo span{ font-weight: 600; color: var(--text-muted); font-size: .85rem; }
  .date-picker{ display:flex; align-items:center; gap: 8px; }
  
  .btn-ghost{
      border:1px solid var(--border); background: transparent; color: var(--text-main);
      padding: 6px 12px; border-radius: 999px; cursor:pointer; font-weight:700;
  }
  .btn-ghost:hover{ background: rgba(148,163,184,0.14); }

  /* ===== 3. 主要容器 ===== */
  .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
  @media (max-width: 760px){ .container{ width: 94%; margin: 18px auto; } .header{ padding: 12px 14px; } }
  .grid { display: grid; gap: 24px; }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }
  @media (max-width: 760px){ .card{ padding: 16px 14px; border-radius: 20px; } }

  .section-title {
    font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

  /* ===== 4. 表單與篩選 ===== */
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; position: relative; }
  @media (max-width: 760px){ .form-row{ gap: 10px; } }
  
  .input-group { 
    display: flex; align-items: center; gap: 8px; 
    background: var(--bg-body); padding: 4px 8px; 
    border: 1px solid var(--border); border-radius: 8px; 
    flex: 1; min-width: 120px;
  }
  @media (max-width: 760px){ .input-group{ padding: 8px 10px; min-width: 130px; } }

  .input-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  input, select {
    border: none; background: transparent; color: var(--text-main); 
    font-size: 0.95rem; padding: 6px; outline: none; width: 100%; 
  }
  .input-field{
      border:1px solid var(--border); background: var(--bg-surface); color: var(--text-main);
      padding: 6px 10px; border-radius: 8px; outline: none; font-family: var(--font-main);
  }

  /* 互換按鈕 */
  .swap-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--primary);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: 0.2s; font-size: 1.1rem;
  }
  .swap-btn:hover { background: var(--bg-body); transform: rotate(180deg); }

  button.btn-primary {
    background: var(--primary); color: #fff; border: none;
    padding: 8px 16px; border-radius: 8px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }

  /* 常用行程按鈕 */
  .btn-fav {
    background: var(--primary); 
    color: white; border: none; border-radius: 20px; 
    padding: 6px 14px; font-size: 0.9rem; font-weight: 700;
    display: flex; align-items: center; gap: 4px;
    cursor: pointer; box-shadow: 0 2px 5px rgba(251, 146, 60, 0.3);
    white-space: nowrap; transition: 0.2s;
  }
  .btn-fav:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .fav-star { color: #fff; font-size: 1.1em; }

  .fav-popup {
     position: absolute; top: 100%; left: 0; z-index: 50;
     background: var(--bg-surface); border: 1px solid var(--border);
     border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
     padding: 8px; min-width: 220px; margin-top: 5px;
     display: none; flex-direction: column; gap: 4px;
  }
  .fav-popup.show { display: flex; }
  .fav-item {
     padding: 10px 12px; border-radius: 8px; cursor: pointer;
     font-size: 0.9rem; color: var(--text-main); font-weight: 600;
     display: flex; align-items: center; gap: 8px;
     transition: background 0.1s;
  }
  .fav-item:hover { background: var(--bg-body); color: var(--primary); }
  .fav-empty { padding: 10px; color: var(--text-muted); font-size: 0.85rem; text-align: center; }

  /* Chips */
  .history-chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .history-chip {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 12px;
    background: var(--bg-body); color: var(--text-muted);
    border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .history-chip:hover { background: var(--primary-bg); color: var(--primary); border-color: var(--primary); }

  .chip-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
    user-select: none; transition: 0.2s;
  }
  .chip-label:hover { background: var(--bg-body); }
  .chip-label input { display: none; }
  .chip-label:has(input:checked) {
    background: var(--primary-bg); color: var(--primary); border-color: var(--primary); font-weight: 500;
  }
  .chip-label input:checked + span { color: var(--primary); }

  /* ===== 5. 表格樣式 ===== */
  .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
  
  th {
    background: var(--bg-body); color: var(--text-muted); font-weight: 600; text-align: left;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  th.sortable { cursor: pointer; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-main); }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: var(--bg-body); cursor: pointer; }

  td { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  
  .train-route { font-size: 0.85rem; color: var(--text-muted); margin-left: 6px; }
  /* 進度條寬度在 JS 中動態控制，手機版已要求縮短 */
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; }

  /* ===== 6. Modal (彈窗) & 時間軸 ===== */
  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
    z-index: 2000; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s;
  }
  .modal[style*="display: flex"] { opacity: 1; }

  .modal-content {
    background: var(--bg-surface); width: 95%; max-width: 500px; max-height: 85vh;
    border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden; display: flex; flex-direction: column;
    transform: translateY(20px); transition: transform 0.3s;
  }
  .modal[style*="display: flex"] .modal-content { transform: translateY(0); }

  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-body);
  }
  .modal-title-main { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .modal-title-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
  .close{font-size:26px;color:var(--text-muted);background:transparent;width:auto;height:auto;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;user-select:none;flex:0 0 auto;padding:6px 10px;line-height:1;}
  .close:hover{background:rgba(148,163,184,0.18);color:var(--text-main);}

  .modal-body { padding: 0; overflow-y: auto; background: var(--bg-surface); }

  /* 時間軸樣式 */
  .timeline { padding: 10px 20px; }
  .timeline-item { display: flex; position: relative; padding-bottom: 0; }
  
  .tl-time {
    width: 50px; text-align: right; font-size: 0.9rem; font-weight: 600; 
    color: var(--text-main); padding-right: 15px; padding-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .tl-marker { display: flex; flex-direction: column; align-items: center; width: 20px; position: relative; }
  .tl-line { width: 2px; background: var(--border); flex-grow: 1; margin-top: 4px; margin-bottom: -4px; }
  .timeline-item:last-child .tl-line { display: none; }
  .tl-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--border);
    border: 2px solid var(--bg-surface); z-index: 1; flex-shrink: 0; transition: all 0.3s;
  }
  .tl-content { padding-left: 15px; padding-bottom: 24px; flex-grow: 1; }
  .timeline-item:last-child .tl-content { padding-bottom: 10px; }
  .tl-station { font-size: 1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; }
  .st-arr{ font-size:0.55em; font-weight:600; color:var(--text-muted); margin-left:8px; font-variant-numeric: tabular-nums; }
  .timeline-item.passed .tl-time, .timeline-item.passed .tl-station { opacity: 0.4; filter: grayscale(1); }
  .timeline-item.passed .tl-dot { background: var(--border); }
  .timeline-item.next .tl-dot { 
    background: #22c55e; width: 14px; height: 14px; 
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2); border-color: #fff; 
  }
  .timeline-item.next .tl-station { color: #15803d; font-weight: 700; }
  
  .badge-next,
  .badge-follow {
    display: inline-flex; align-items: center; gap: 4px;
    background: #22c55e; color: #fff; font-size: 0.7rem; 
    padding: 2px 8px; border-radius: 10px; margin-left: 8px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

  .query-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px 0}
  .query-tab{appearance:none;border:1px solid var(--border);background:var(--card-bg);color:var(--text-main);
    padding:10px 12px;border-radius:12px;font-weight:700;cursor:pointer;transition:.15s}
  .query-tab:hover{transform:translateY(-1px)}
  .query-tab.active{background:linear-gradient(135deg, var(--primary), #ea580c);color:#fff;border-color:transparent}
  .query-panel.hidden{display:none}

  .ticket-btn{
    border:1px solid var(--border); background:var(--bg-body); color:var(--text-main);
    border-radius:10px; padding:6px 12px; cursor:pointer; font-size:14px; line-height:1; font-weight: 700;
  }
  .ticket-btn:active{ transform:scale(.98); }
  .ticket-btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }
  .est-tip{ font-size:12px; opacity:.55; cursor:help; line-height:1; }

  #loading-overlay{
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35);
      display:none; align-items:center; justify-content:center; flex-direction:column;
      z-index: 9999; backdrop-filter: blur(6px);
  }
  .spinner{
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.35);
      border-top-color: rgba(255,255,255,0.95);
      animation: spin 1s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to{ transform: rotate(360deg);} }

  /* ===== 背景裝飾 (桌面版) ===== */
  .bg-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(120px); opacity: 0.42; pointer-events:none; }
  .blob { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; animation: float 25s infinite alternate ease-in-out; }
  .blob-1 { background: #fb923c; top: -10%; left: -10%; }
  .blob-2 { background: #2563eb; bottom: -10%; right: -10%; }
  @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(10%, 15%); } }

  /* ===== 行動版：表頭與查詢設定收合（同台鐵）===== */
  @media (max-width: 720px){
    .header-content{ flex-wrap: nowrap; gap: 8px; }
    .logo{ white-space: nowrap; }
    .date-picker{ flex-wrap: nowrap; gap: 8px; min-width: 0; }
    .date-picker label{ display:none; }
    #refreshBtn{ padding: 6px 10px !important; white-space: nowrap; }
    #homeBtn{ padding: 6px 10px !important; }
  }

  /* ===== 全新整合式搜尋列設計 ===== */
  /* 外層容器變成「大膠囊」：承載背景與陰影 */
  .trip-compact-bar {
    display: none; /* 電腦版隱藏 */
    align-items: center;
    /* 關鍵：背景跟陰影移到這裡，讓它看起來是一個整體 */
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 99px; /* 全圓角 */
    box-shadow: 0 8px 24px rgba(0,0,0,0.08); /* 漂亮的懸浮陰影 */
    margin: 12px 0 24px 0; /* 下方留白 */
    padding: 4px; /* 內部留白，讓按鈕不會貼邊 */
    position: relative;
  }

  /* 左側：原本的 Pill 變成透明容器 */
  .trip-pill {
    flex: 1; /* 佔滿剩餘空間 */
    display: flex;
    align-items: center;
    background: transparent; /* 變透明 */
    border: none; /* 無邊框 */
    box-shadow: none; /* 無陰影 */
    padding-left: 12px;
    height: 48px; /* 高度與按鈕一致 */
  }

  /* 圖示區 */
  .trip-pill-left {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--primary);
    font-weight: 900;
    white-space: nowrap;
    padding-right: 12px;
    margin-right: 12px;
    border-right: 1px solid var(--border); /* 分隔線 1 */
    height: 24px;
  }

  .trip-pill-left .trip-open-btn {
    width: auto;
    height: auto;
    border-radius: 0;
    padding: 0;
    /* 移除所有框線背景 */
    border: none !important;
    background: transparent !important;
    font-size: 1.2rem;
  }

  .trip-pill .trip-summary {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.95rem;
    color: var(--text-main);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left; /* 靠左對齊 */
  }

  /* 右側：搜尋按鈕整合進來 */
  .trip-compact-bar .trip-search-btn {
    width: 48px;
    height: 48px;

  function getSeatIcon(trainNo, type, originDateStr) {

    if(status==='O') return '<span class="seat-icon seat-o">○</span>'; if(status==='L') return '<span class="seat-icon seat-l">△</span>'; if(status==='X') return '<span class="seat-icon seat-x">✕</span>'; return '<span class="seat-icon seat-none">--</span>';

    // ===== 耗時條：極端值處理（P95 cap）+ 漸層色（同色系，不彩虹）=====
    function percentile(sortedArr, p){
      if(!sortedArr || !sortedArr.length) return 1;
      const idx = (sortedArr.length - 1) * p;
      const lo = Math.floor(idx), hi = Math.ceil(idx);
      if(lo === hi) return sortedArr[lo];
      const w = idx - lo;
      return sortedArr[lo] * (1 - w) + sortedArr[hi] * w;
    }
    
    function lerp(a,b,t){ return a + (b-a)*t; }
    function lerpColor(c1,c2,t){
      return {
        r: Math.round(lerp(c1.r,c2.r,t)),
        g: Math.round(lerp(c1.g,c2.g,t)),
        b: Math.round(lerp(c1.b,c2.b,t))
      };
    }
    // 連續色階：綠 -> 黃 -> 橘 -> 紅 -> 紫（取某個比例點的顏色，整條單色）
    function travelColor(norm01){
      const t = Math.max(0, Math.min(1, norm01));
      const stops = [
        {t:0.00, c:{r:34,  g:197, b:94 }},  // green
        {t:0.25, c:{r:234, g:179, b:8  }},  // yellow
        {t:0.50, c:{r:249, g:115, b:22 }},  // orange
        {t:0.75, c:{r:239, g:68,  b:68 }},  // red
        {t:1.00, c:{r:168, g:85,  b:247}}   // purple
      ];
      for(let i=0;i<stops.length-1;i++){
        const a = stops[i], b = stops[i+1];
        if(t >= a.t && t <= b.t){
          const tt = (t - a.t) / (b.t - a.t || 1);
          const c = lerpColor(a.c, b.c, tt);
          return `rgb(${c.r},${c.g},${c.b})`;
        }
      }
      const last = stops[stops.length-1].c;
      return `rgb(${last.r},${last.g},${last.b})`;
    }
    // 耗時長條：最短約 5%，極端值 100%，其餘依 (min..cap) 線性比例
    function getTravelBarStyle(travelMin, minMin, capMin){
      const t = Math.max(0, travelMin || 0);
      const minV = Math.max(0, minMin || 0);
      const capV = Math.max(minV + 1, capMin || (minV + 1));

      const isExtreme = t >= capV;
      const denom = Math.max(1, (capV - minV));
      const norm = isExtreme ? 1 : Math.min(1, Math.max(0, (t - minV) / denom));
      const widthPct = (t > 0) ? Math.max(5, Math.min(100, 5 + norm * 95)) : 0;
      const fillBg = travelColor(norm);
      return { widthPct, isExtreme, fillBg };
    }

  function isMobileTightTable(){
    return !!(window.matchMedia && window.matchMedia('(max-width: 760px)').matches);

  function applyTightMobileTableLayout(table, options){
    if(!table) return;
    const config = options || {};
    const hiddenSet = new Set((config.hiddenColumns || []).map(Number));
    const centeredSet = new Set((config.centeredColumns || []).map(Number));
    const compactSet = new Set((config.compactColumns || []).map(Number));
    const wrapper = table.closest('.table-wrapper');
    if(!isMobileTightTable()){
      if(wrapper){
        wrapper.style.overflowX = '';
        wrapper.style.margin = '';
      }
      table.style.removeProperty('table-layout');
      table.style.removeProperty('width');
      table.style.removeProperty('min-width');
      table.style.removeProperty('max-width');
      table.querySelectorAll('th, td').forEach(cell=>{
        cell.style.width = '';
        cell.style.maxWidth = '';
        cell.style.padding = '';
        cell.style.display = '';
        cell.style.overflow = '';
        cell.style.textOverflow = '';
        cell.style.whiteSpace = '';
        cell.style.fontSize = '';
        cell.style.lineHeight = '';
        cell.style.verticalAlign = '';
        cell.style.textAlign = '';
        cell.style.fontVariantNumeric = '';
      });
      table.querySelectorAll('.progress-bar').forEach(el=>{
        el.style.width = '';
        el.style.marginTop = '';
      });
      table.querySelectorAll('.est-tip').forEach(el=>{ el.style.display = ''; });
      table.querySelectorAll('.train-route').forEach(el=>{
        el.style.display = '';
        el.style.fontSize = '';
        el.style.lineHeight = '';
        el.style.whiteSpace = '';
        el.style.overflow = '';
        el.style.textOverflow = '';
      });
      return;
    }

    if(wrapper){
      wrapper.style.overflowX = 'hidden';
      wrapper.style.margin = '0';
    }
    const wrapperWidth = Math.max(0, wrapper?.clientWidth || table.parentElement?.clientWidth || window.innerWidth || 0);
    const visibleCount = Array.from(table.querySelectorAll('thead tr:first-child > *'))
      .filter((_, idx) => !hiddenSet.has(idx + 1))
      .length || 1;
    const py = 10;
    const edgePad = wrapperWidth <= 360 ? 3 : wrapperWidth <= 420 ? 4 : 5;
    const baseGap = wrapperWidth <= 360 ? 0 : wrapperWidth <= 420 ? 1 : 2;
    const compactFont = wrapperWidth <= 360 ? '.73rem' : '.74rem';
    const normalFont = wrapperWidth <= 360 ? '.76rem' : '.78rem';
    const progressWidth = wrapperWidth <= 360 ? '34px' : wrapperWidth <= 420 ? '37px' : '40px';
    const maxExtraGap = wrapperWidth <= 360 ? 1 : wrapperWidth <= 420 ? 3 : wrapperWidth <= 520 ? 6 : 10;

    table.style.setProperty('table-layout', 'auto', 'important');
    table.style.setProperty('width', 'max-content', 'important');
    table.style.setProperty('min-width', '0', 'important');
    table.style.setProperty('max-width', 'none', 'important');

    table.querySelectorAll('tr').forEach(row=>{
      Array.from(row.children).forEach((cell, idx)=>{
        const col = idx + 1;
        if(hiddenSet.has(col)){
          cell.style.display = 'none';
          cell.style.width = '0';
          cell.style.maxWidth = '0';
          cell.style.padding = '0';
          return;
        }
        cell.style.display = '';
        cell.style.width = '1%';
        cell.style.maxWidth = 'none';
        cell.style.padding = `${py}px ${baseGap}px ${py}px 0`;
        cell.style.overflow = 'hidden';
        cell.style.textOverflow = 'ellipsis';
        cell.style.whiteSpace = 'nowrap';
        cell.style.fontSize = compactSet.has(col) ? compactFont : normalFont;
        cell.style.lineHeight = '1.15';
        cell.style.verticalAlign = 'middle';
        cell.style.textAlign = centeredSet.has(col) ? 'center' : '';
        cell.style.fontVariantNumeric = centeredSet.has(col) ? 'tabular-nums' : '';
      });
    });

    const naturalWidth = Math.ceil(table.scrollWidth || 0);
    const slack = Math.max(0, wrapperWidth - naturalWidth);
    const gapSlots = Math.max(1, visibleCount - 1);
    const extraEach = Math.min(maxExtraGap, Math.floor(slack / gapSlots));
    const extraRemainder = Math.min(gapSlots, Math.max(0, slack - (extraEach * gapSlots)));

    table.style.setProperty('width', '100%', 'important');
    table.style.setProperty('min-width', '100%', 'important');
    table.style.setProperty('max-width', '100%', 'important');

    table.querySelectorAll('tr').forEach(row=>{
      const visibleCells = Array.from(row.children).filter((cell, idx) => !hiddenSet.has(idx + 1));
      visibleCells.forEach((cell, visibleIdx)=>{
        const isFirst = visibleIdx === 0;
        const isLast = visibleIdx === visibleCells.length - 1;
        const sharedExtra = isLast ? 0 : extraEach + (visibleIdx < extraRemainder ? 1 : 0);
        const pr = isLast ? edgePad : baseGap + sharedExtra;
        const pl = isFirst ? edgePad : 0;
        cell.style.padding = `${py}px ${pr}px ${py}px ${pl}px`;
      });
    });

    table.querySelectorAll('.train-route').forEach(el=>{
      el.style.display = 'block';
      el.style.fontSize = compactFont;
      el.style.lineHeight = '1.15';
      el.style.whiteSpace = 'nowrap';
      el.style.overflow = 'hidden';
      el.style.textOverflow = 'ellipsis';
    });
    table.querySelectorAll('.progress-bar').forEach(el=>{
      el.style.width = progressWidth;
      el.style.marginTop = '3px';
    });
    table.querySelectorAll('.est-tip').forEach(el=>{ el.style.display = 'none'; });
  }

    const minDur = Math.max(1, (durSorted[0] || 1));
    const capDur = Math.max(minDur + 1, percentile(durSorted, 0.95)); // P95 作為極端值上限
// 事件代理 (手機版摺疊 + 訂票 + 停靠站展開)
    tbody.onclick = async (e) => {

            if(tr.nextElementSibling && tr.nextElementSibling.classList.contains('mobile-detail-row')){

                let btnHTML = '';
                if(canBook){
                    btnHTML = `<button class="ticket-btn" data-train="${r.trainNo}" data-date="${r.originDate}" data-time="${r.dep}" data-start="${r.startStation}" data-end="${r.endStation}">🎫 立即訂票</button>`;
                } else {
                    btnHTML = `<button class="ticket-btn" disabled style="opacity:0.5;cursor:not-allowed">停止預訂</button>`;
                }

                // 座位狀態 HTML
                const seatStd = getSeatIcon(r.trainNo, 'standard', r.originDate);

                detailRow.innerHTML = `
                    <td colspan="10">
                        <div class="detail-row-flex">
                            <div class="detail-range-info">${r.range}</div>
                            <div>${btnHTML}</div>
                        </div>
                        <div class="detail-seats-row">
                            <div>餘票 - 標準: ${seatStd}</div>
                            <div>商務: ${seatBiz}</div>
                        </div>
                        <div class="detail-label">停靠站</div>
                        ${stopsHTML}
                    </td>
                `;
                tr.parentNode.insertBefore(detailRow, tr.nextSibling);
                expandBtn.textContent = '-';
            }
            return;
        }

        // B. 訂票按鈕 (PC / 手機展開區共用)
        const ticket = e.target.closest('.ticket-btn');
        if(ticket && !ticket.disabled){
            e.stopPropagation();
            // PC 列內的 🎫 按鈕沒有 inline onclick，因此在此統一處理
            const tno = ticket.dataset.train;
            const d   = ticket.dataset.date;
            const tm  = ticket.dataset.time;
            const st  = ticket.dataset.start;
            const ed  = ticket.dataset.end;
            if(tno && d && tm){
              handleTHSRBookingRequest(tno, d, tm, st, ed);
            }
            return;
        }

        // C. 停靠站展開箭頭 (PC)
        const toggle = e.target.closest('.stop-toggle');
        if(toggle){
            e.stopPropagation();
            const tr = toggle.closest('tr');
            const idx = Number(tr.dataset.idx);
            const r = currentStartEndList[idx];
            
            const cnt = toggle.dataset.count || '';
            const next = tr.nextElementSibling;
            if(next && next.classList.contains('stops-row')){
                next.remove();
                toggle.dataset.open = '0';
                if(cnt) toggle.textContent = `${cnt}站 ▼`;
            } else {
                const tr2 = document.createElement('tr');
                tr2.className = 'stops-row';
                const stopsStr = r.midStops.map(s => `${s.name}(${s.arr || s.time})`).join('、');
                tr2.innerHTML = `<td colspan="10">沿途停靠：${stopsStr}</td>`;
                tr.parentNode.insertBefore(tr2, tr.nextSibling);
                toggle.dataset.open = '1';
                if(cnt) toggle.textContent = `${cnt}站 ▲`;
            }
            return;
        }

        // D. 列點擊 (開啟 Modal)
        const tr = e.target.closest('tr');
        if(!tr || tr.parentElement !== tbody || tr.classList.contains('mobile-detail-row') || tr.classList.contains('stops-row')) return;
        const idx = Number(tr.dataset.idx);
        const r = currentStartEndList[idx];
        if(!r) return;
        showTrainDetails(r.trainNo, r.originDate);
    };

    currentStartEndList.forEach((row, idx) => {
        const tr = document.createElement('tr');
        tr.dataset.idx = idx;
        tr.className = "main-row";

        const depMin = parseTime(row.dep);
        const canBook = (row.originDate > todayStr) || (row.originDate === todayStr && depMin !== null && (depMin - nowMin) > 10);
        const ticketBtn = canBook ? `<button class="ticket-btn" data-train="${row.trainNo}" data-date="${row.originDate}" data-time="${row.dep}" data-start="${row.startStation}" data-end="${row.endStation}">🎫</button>` : `<span style="font-size:12px;color:var(--text-light);">停止</span>`;
        
        let seatCells = `<td class="col-seat-std" style="text-align:center;">${getSeatIcon(row.trainNo, 'standard', row.originDate)}</td><td class="col-seat-biz" style="text-align:center;">${getSeatIcon(row.trainNo, 'business', row.originDate)}</td>`;
        if(isPastDate) seatCells = `<td class="col-seat-std" style="text-align:center;">--</td><td class="col-seat-biz" style="text-align:center;">--</td>`;

        const stopText = row.stopBetween <= 0
          ? '直達'
          : `<span class="stop-toggle" data-open="0" data-count="${row.stopBetween}" style="cursor:pointer; color:var(--text-main); font-weight:600;">${row.stopBetween}站 ▼</span>`;

        tr.innerHTML = `
            <td>
                <span class="mobile-expand-btn" data-idx="${idx}">+</span>
                <b>${row.trainNo}</b>
            </td>
            <td class="col-range"><span class="train-route">${row.range}</span></td>
            <td>${row.dep}</td>
            <td>${row.arr}</td>
            <td class="col-dur">
                <div style="display:flex;flex-direction:column;gap:2px;">
                    <div style="font-weight:800;font-size:0.85rem;">${durationText(0, row.durMin).replace('0h ','')}</div>
                    <div class="progress-bar" style="width:44px;">
                        <div class="progress-fill" style="width:${(()=>{const s=getTravelBarStyle(row.durMin||0, minDur, capDur); return Math.round(s.widthPct);})()}%; background:${(()=>{const s=getTravelBarStyle(row.durMin||0, minDur, capDur); return s.fillBg;})()};"></div>
                    </div>
                </div>
            </td>
            <td class="col-stops">${stopText}</td>
            <td>${statusBadge(row.status)}</td>
            ${seatCells}
            <td class="col-ticket" style="text-align:center;">${ticketBtn}</td>`;
        tbody.appendChild(tr);
    });
    applyTHSRMobileTableLayouts();
  }

  function filterTrainScheduleByStationName(){
    const st = extractStationNameFromInput(document.getElementById('stationNameInput').value); document.getElementById('stationNameInput').value = st;
    const dir = document.getElementById('directionSelect').value; if(!st) return;
    lastStationQuery = { station: st, dir };
    const sharedThsrBuilder = window.RailStationQueryCommon?.buildThsrStationRowsFromSources;
    if(typeof sharedThsrBuilder === 'function'){
      currentStationList = sharedThsrBuilder({
        sources: [{ map: baseSchedule, origin: currentQueryDateStr }, { map: prevSchedule, origin: addDays(currentQueryDateStr, -1) }],
        stationName: st,
        directionValue: dir,
        queryDateStr: currentQueryDateStr,
        splitArrDep,
        stopDisplayDate,
        getStatusLabel,
        thsrStationIndex,
        sameStation
      }).map(row => ({
        trainNo: row.trainNo,
        range: row.range,
        time: row.dep || '--',
        status: row.status,
        originDate: row.originDate
      }));
      renderStationTable();
      applyTHSRMobileTableLayouts();
      return;
    }
    const list = [];
    const sources = [{ map: baseSchedule, origin: currentQueryDateStr }, { map: prevSchedule, origin: addDays(currentQueryDateStr, -1) }];
    sources.forEach(src=>{
      const sch = src.map || {}; const origin = src.origin;
      Object.keys(sch||{}).forEach(trainNo=>{
        const t = sch[trainNo]; const stops = t?.['車站時間']||[];
        const idx = stops.findIndex(x=>sameStation(x[0], st)); if(idx<0) return;
        const d = stopDisplayDate(origin, stops, idx); if(d !== currentQueryDateStr) return;
        const first = stops[0]?.[0] || ''; const last  = stops.slice(-1)[0]?.[0] || '';
        const fi = thsrStationIndex(first); const li = thsrStationIndex(last);
        const isSouth = (fi>=0 && li>=0) ? (fi < li) : ((first && last) ? (first.localeCompare(last,'zh-Hant') < 0) : true);
        if(dir==='south' && !isSouth) return; if(dir==='north' && isSouth) return;
        const ad = splitArrDep(stops[idx]); const time = ad.dep || ad.arr || ''; const lastArr = (splitArrDep(stops[stops.length-1]||[]).arr || splitArrDep(stops[stops.length-1]||[]).dep || '');
        const range = `${first}➝${last}`; const firstDep = splitArrDep(stops[0]).dep; const status = getStatusLabel(origin, time, lastArr, firstDep, 'list');
        list.push({trainNo, range, time, status, originDate: origin});
      });
    });
    list.sort((a,b)=>{
      const aa = parseTime(a.time); const bb = parseTime(b.time);
      if(aa===null && bb===null) return String(a.trainNo).localeCompare(String(b.trainNo),'en'); if(aa===null) return 1; if(bb===null) return -1; return aa-bb;
    });
    currentStationList = list; renderStationTable(); applyTHSRMobileTableLayouts();
  }

  function getThsrStationStatusTone(label){
    const text = String(label || '');
    if(/取消|停駛|異常|查無/.test(text)) return 'danger';
    if(/晚|延遲|誤點/.test(text)) return 'warning';
    if(/行駛中|準點|即將進站|停靠中|即將開車/.test(text)) return 'success';
    if(/已過站|已到終點/.test(text)) return 'muted';
    return 'neutral';
  }

  function isThsrQuery2PassedStatus(label){
    return /已過站|已到終點/.test(String(label || ''));
  }

  function isThsrQuery2ActiveStatus(label){
    const text = String(label || '');
    if(isThsrQuery2PassedStatus(text)) return false;
    if(/取消|停駛|異常|查無/.test(text)) return false;

  function getThsrQuery2DelayMinutes(statusText){
    const text = String(statusText || '');
    let match = text.match(/(?:晚|誤點|延遲)\s*([+-]?\d+)\s*分/);
    if(match) return parseInt(match[1], 10) || 0;
    match = text.match(/提早\s*([+-]?\d+)\s*分/);
    if(match) return -(parseInt(match[1], 10) || 0);
    return 0;
  }

  function addThsrQuery2MinutesToHHMM(hhmm, deltaMinutes){
    const base = parseTime(hhmm || '');
    if(base === null || !Number.isFinite(deltaMinutes)) return hhmm || '--';
    let total = base + deltaMinutes;
    total = ((total % 1440) + 1440) % 1440;
    const hour = String(Math.floor(total / 60)).padStart(2, '0');
    const minute = String(total % 60).padStart(2, '0');
    return `${hour}:${minute}`;
  }

  function buildThsrStartEndQuery2MobileTimeHtml(row){
    const depText = String(row?.legacyRow?.dep || row?.depText || '--');
    const arrText = String(row?.legacyRow?.arr || row?.arrText || '--');
    const delayMinutes = getThsrQuery2DelayMinutes(row?.statusText || row?.status || '');
    if(!delayMinutes){
      return `<div class="rod2-timecell thsrq2m-timecell"><span class="thsrq2m-time-frame thsrq2m-time-current">${escapeTrainQueryHtml(depText)} → ${escapeTrainQueryHtml(arrText)}</span></div>`;
    }
    const depNew = addThsrQuery2MinutesToHHMM(depText, delayMinutes);
    const arrNew = addThsrQuery2MinutesToHHMM(arrText, delayMinutes);
    return `<div class="rod2-timecell thsrq2m-timecell is-rotating"><span class="thsrq2m-time-track"><span class="thsrq2m-time-frame thsrq2m-time-current">${escapeTrainQueryHtml(depNew)} → ${escapeTrainQueryHtml(arrNew)}</span><span class="thsrq2m-time-frame thsrq2m-time-original"><span class="rod2-time-original">${escapeTrainQueryHtml(depText)} → ${escapeTrainQueryHtml(arrText)}</span></span></span></div>`;
  }

  function buildThsrStationQueryV2Rows(station, dir){
    const list = [];
    const sources = [{ map: baseSchedule, origin: currentQueryDateStr }, { map: prevSchedule, origin: addDays(currentQueryDateStr, -1) }];
    sources.forEach(src=>{
      const sch = src.map || {};
      const origin = src.origin;
      Object.keys(sch || {}).forEach(trainNo=>{
        const t = sch[trainNo];
        const stops = t?.['車站時間'] || [];
        const idx = stops.findIndex(x => sameStation(x[0], station));
        if(idx < 0) return;
        const displayDate = stopDisplayDate(origin, stops, idx);
        if(displayDate !== currentQueryDateStr) return;
        const first = stops[0]?.[0] || '';
        const last = stops.slice(-1)[0]?.[0] || '';
        const fi = thsrStationIndex(first);
        const li = thsrStationIndex(last);
        const isSouth = (fi >= 0 && li >= 0) ? (fi < li) : ((first && last) ? (first.localeCompare(last,'zh-Hant') < 0) : true);
        if(dir === 'south' && !isSouth) return;
        if(dir === 'north' && isSouth) return;
        const ad = splitArrDep(stops[idx]);
        const time = ad.dep || ad.arr || '';
        const lastArr = (splitArrDep(stops[stops.length - 1] || []).arr || splitArrDep(stops[stops.length - 1] || []).dep || '');
        const firstDep = splitArrDep(stops[0] || []).dep || '';
        const status = getStatusLabel(origin, time, lastArr, firstDep, 'list');
        const statusDisplay = getThsrStopStatusDisplay(stops, idx, origin, status);
        list.push({
          trainNo,
          range: `${first} → ${last}`,
          time: time || '--',
          status,
          statusHtml: statusDisplay.html,
          statusTone: statusDisplay.tone,
          originDate: origin,
          depMin: parseTime(time) ?? 9999,
          isCrossDay: origin !== currentQueryDateStr
        });
      });
    });
    list.sort((a,b)=>{
      if(a.depMin === b.depMin) return String(a.trainNo).localeCompare(String(b.trainNo),'en');
      return a.depMin - b.depMin;
    });
    return list;
  }

  function getTrainQueryToneByStatus(label){

  function formatTrainQueryStopTime(kind, arrText, depText){
    const arr = String(arrText || '').trim();
    const dep = String(depText || '').trim();
    if(kind === 'origin') return dep || arr || '--';
    if(kind === 'terminal') return arr || dep || '--';

    return dep || arr || '--';
  }

  function escapeTrainQueryHtml(value){
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')

  function formatTrainQueryDurationCompact(totalMinutes){
    const mins = Number(totalMinutes);
    if(!Number.isFinite(mins) || mins < 0) return '--';
    const hours = Math.floor(mins / 60);
    const remain = mins % 60;
    if(hours > 0 && remain > 0) return `${hours}時${remain}分`;
    if(hours > 0) return `${hours}時`;
    return `${remain}分`;
  }

  function buildTrainQueryProgressText(elapsedMinutes, totalMinutes, progressPercent){
    if(!Number.isFinite(totalMinutes) || totalMinutes < 0) return `${Math.round(progressPercent)}%`;
    return `${formatTrainQueryDurationCompact(elapsedMinutes)}/${formatTrainQueryDurationCompact(totalMinutes)} (${Math.round(progressPercent)}%)`;
  }

  function getThsrTrainQueryRuntime(originDateStr, depTime, arrTime){
    const todayStr = fmtDate(new Date());
    const yestStr = addDays(todayStr, -1);
    const nowAbs = getNowAbsFromOrigin(originDateStr || todayStr);
    const range = getThsrFirstLastAbs(depTime, arrTime);
    const isActiveWindow =
      (originDateStr === todayStr) ||
      (originDateStr === yestStr && range.crosses && Number.isFinite(range.lastAbs) && nowAbs <= (range.lastAbs + 360));

    let progressPercent = 0;
    if(originDateStr > todayStr){
      progressPercent = 0;
    }else if(originDateStr < todayStr && !isActiveWindow){
      progressPercent = 100;
    }else if(Number.isFinite(range.firstAbs) && Number.isFinite(range.lastAbs) && range.lastAbs > range.firstAbs){
      progressPercent = ((nowAbs - range.firstAbs) / (range.lastAbs - range.firstAbs)) * 100;
    }

    return {
      todayStr,
      nowAbs,
      firstAbs: range.firstAbs,
      lastAbs: range.lastAbs,
      isActiveWindow,
      progressPercent: Math.max(0, Math.min(100, progressPercent))
    };
  }

  function findNextTimelineIndex(rows, nowAbs, isActiveWindow){
    if(!isActiveWindow || !Array.isArray(rows) || !rows.length) return -1;
    for(let i = 0; i < rows.length; i++){
      const eventAbs = rows[i]?.eventAbs;
      if(Number.isFinite(eventAbs) && eventAbs >= nowAbs) return i;
    }
    return rows.length ? rows.length - 1 : -1;
  }

  function getNextStopIndex(rows, fromIndex){
    if(!Array.isArray(rows) || fromIndex < 0) return -1;
    if(rows[fromIndex]?.kind !== 'pass') return fromIndex;
    for(let i = fromIndex + 1; i < rows.length; i++){
      if(rows[i]?.kind !== 'pass') return i;
    }
    return -1;
  }

  function buildThsrTrainQueryV2StopRows(stops, originDateStr, trainStatus, runtime, showPassStops){
    const visibleRows = buildThsrTimelineRows(stops || [], showPassStops);
    const locationRows = buildThsrTimelineRows(stops || [], true);
    const firstStop = stops?.[0] || [];
    const lastStop = stops?.[stops.length - 1] || [];
    const nextVisibleIndex = findNextTimelineIndex(visibleRows, runtime.nowAbs, runtime.isActiveWindow);
    const nextLocationIndex = findNextTimelineIndex(locationRows, runtime.nowAbs, runtime.isActiveWindow);
    const nextVisibleStopIndex = getNextStopIndex(visibleRows, nextVisibleIndex);
    const currentLocation = getThsrDetailCurrentLocation(
      locationRows,
      runtime.nowAbs,
      originDateStr,
      runtime.todayStr,
      runtime.isActiveWindow,
      lastStop?.[0] || '--'
    );
    const nextLocationRow = nextLocationIndex >= 0 ? (locationRows[nextLocationIndex] || null) : null;
    const nextStopRow = nextVisibleStopIndex >= 0 ? (visibleRows[nextVisibleStopIndex] || null) : null;

    let nextHint = currentLocation || '--';
    if(trainStatus === '未發車'){
      const firstEventAbs = locationRows[0]?.depAbs ?? locationRows[0]?.arrAbs ?? locationRows[0]?.eventAbs ?? null;
      const soonToDepart =
        Number.isFinite(firstEventAbs) &&
        Number.isFinite(runtime.nowAbs) &&
        runtime.nowAbs >= (firstEventAbs - 10) &&
        runtime.nowAbs <= firstEventAbs;
      nextHint = `${soonToDepart ? '即將發車' : '尚未發車'} · ${firstStop?.[0] || '--'}`;
    }else if(trainStatus === '已到終點'){
      nextHint = `已抵達 ${lastStop?.[0] || '--'}`;
    }else if(nextLocationRow){
      const isDwellingAtStation =
        nextLocationRow.kind !== 'pass' &&
        Number.isFinite(nextLocationRow.arrAbs) &&
        Number.isFinite(nextLocationRow.depAbs) &&
        runtime.nowAbs >= nextLocationRow.arrAbs &&
        runtime.nowAbs <= nextLocationRow.depAbs;

      if(isDwellingAtStation){
        nextHint = `停靠中 ${nextLocationRow.station || '--'}`;
      }else if(nextLocationRow.kind === 'pass'){
        nextHint = nextStopRow?.station
          ? `即將通過 ${nextLocationRow.station} · 下一停靠 ${nextStopRow.station}`
          : `即將通過 ${nextLocationRow.station}`;
      }else{
        nextHint = `下一停靠 ${nextLocationRow.station || '--'}`;
      }
    }

    const ended = trainStatus === '已到終點' || (originDateStr < runtime.todayStr && !runtime.isActiveWindow);

    const stopRows = visibleRows.map((row, index) => {
      const isCurrent =
        !ended &&
        runtime.isActiveWindow &&
        row.kind !== 'pass' &&
        Number.isFinite(row.arrAbs) &&
        Number.isFinite(row.depAbs) &&
        runtime.nowAbs >= row.arrAbs &&
        runtime.nowAbs <= row.depAbs;
      const isPassed =
        ended ||
        (runtime.isActiveWindow && Number.isFinite(row.eventAbs) && row.eventAbs < runtime.nowAbs && !isCurrent);
      const isNext = !isPassed && !isCurrent && nextVisibleIndex === index;
      const isNextStop = !isPassed && !isCurrent && !isNext && nextVisibleStopIndex === index;

      const isPassRow = row.kind === 'pass';
      const singleTime = row.secondaryText || row.primaryText || '--';
      const arrText = isPassRow
        ? singleTime
        : (row.kind === 'stop'
            ? (row.secondaryText || row.primaryText || '--')
            : singleTime);
      const depText = isPassRow
        ? '-'
        : (row.kind === 'stop'
            ? (row.primaryText || row.secondaryText || '--')
            : singleTime);

      let stateText = row.kind === 'pass' ? '通過' : '停靠';
      if(isCurrent){
        stateText = '停靠中';
      }else if(isPassed){
        stateText = row.kind === 'pass' ? '已通過' : (row.kind === 'terminal' ? '已到終點' : '已過站');
      }else if(trainStatus === '未發車' && row.kind === 'origin'){
        const originEventAbs = row.depAbs ?? row.arrAbs ?? row.eventAbs ?? null;
        const soonToDepart =
          Number.isFinite(originEventAbs) &&
          Number.isFinite(runtime.nowAbs) &&
          runtime.nowAbs >= (originEventAbs - 10) &&
          runtime.nowAbs <= originEventAbs;
        stateText = soonToDepart ? '即將發車' : '尚未發車';
      }else if(isNext){
        stateText = row.kind === 'pass' ? '即將通過' : '下一停靠';
      }else if(isNextStop){
        stateText = '下一停靠';
      }

      return {
        seq: index + 1,
        station: row.station || '--',
        arrText,
        depText,
        stateText,
        stateTone: /已過站|已通過|^通過$/.test(stateText)
          ? 'muted'
          : (/下一停靠|即將通過|即將發車|尚未發車|停靠中/.test(stateText) ? 'success' : 'neutral'),
        isPassed,
        isCurrent,
        isNext,
        isPass: row.kind === 'pass'
      };
    });

    return { stopRows, currentLocation, nextHint };
  }

  function buildThsrTrainQueryV2Data(trainNo, options){
    const opts = options || {};
    const showPassStops = !!opts.showPassStops;
    const t = baseSchedule[trainNo];
    if(!t) return null;
    const stops = t['車站時間'] || [];
    if(!stops.length) return null;
    const firstStop = stops[0] || [];
    const lastStop = stops[stops.length - 1] || [];
    const first = splitArrDep(firstStop);
    const last = splitArrDep(lastStop);
    const depTime = first.dep || first.arr || '';
    const arrTime = last.arr || last.dep || '';
    const directionLabel = getThsrDirectionLabel(trainNo);
    const statusLabel = getStatusLabel(currentQueryDateStr, depTime, arrTime, depTime, 'train');
    const runtime = getThsrTrainQueryRuntime(currentQueryDateStr, depTime, arrTime);
    const board = buildThsrTrainQueryV2StopRows(stops, currentQueryDateStr, statusLabel, runtime, showPassStops);
    const totalRunMinutes =
      Number.isFinite(runtime.firstAbs) && Number.isFinite(runtime.lastAbs)
        ? Math.max(0, runtime.lastAbs - runtime.firstAbs)
        : null;
    const elapsedRunMinutes =
      Number.isFinite(totalRunMinutes) && Number.isFinite(runtime.nowAbs) && Number.isFinite(runtime.firstAbs)
        ? Math.max(0, Math.min(totalRunMinutes, runtime.nowAbs - runtime.firstAbs))
        : 0;

    return {

  function getScheduleMapByOrigin(originDateStr){

  function buildThsrAbsArrDep(stops){
    const absArr = [];
    const absDep = [];
    let day = 0;
    let prevMin = null;

    const toAbs = (timeStr) => {
      const minute = parseTime(timeStr);
      if(minute === null) return null;
      if(prevMin !== null && minute < prevMin) day += 1;
      prevMin = minute;
      return day * 1440 + minute;
    };

    (stops || []).forEach((stop)=>{
      const ad = splitArrDep(stop);
      let arrAbs = null;
      let depAbs = null;
      if(ad.arr && ad.dep && ad.arr === ad.dep){
        const abs = toAbs(ad.dep || ad.arr);
        arrAbs = abs;
        depAbs = abs;
      }else{
        if(ad.arr) arrAbs = toAbs(ad.arr);
        if(ad.dep) depAbs = toAbs(ad.dep);
      }
      absArr.push(arrAbs);
      absDep.push(depAbs);
    });

    return { absArr, absDep };
  }

  function formatAbsTime(absMin){
    if(absMin === null || absMin === undefined || !Number.isFinite(absMin)) return '';
    const minute = ((Math.round(absMin) % 1440) + 1440) % 1440;
    const hh = Math.floor(minute / 60);
    const mm = minute % 60;
    return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  }

  function getThsrRouteStationsBetween(startStation, endStation){
    if(!startStation || !endStation) return [startStation, endStation].filter(Boolean);
    if(startStation === endStation) return [startStation];
    const finder = window.RailNetwork?.findThsrRoutePath;
    const path = (typeof finder === 'function') ? finder(startStation, endStation) : [];
    if(Array.isArray(path) && path.length) return path.slice();
    const startIndex = thsrStationIndex(startStation);
    const endIndex = thsrStationIndex(endStation);
    if(startIndex < 0 || endIndex < 0) return [startStation, endStation];
    if(startIndex <= endIndex) return THSR_STATION_ORDER.slice(startIndex, endIndex + 1);
    return THSR_STATION_ORDER.slice(endIndex, startIndex + 1).reverse();
  }

  function buildThsrTimelineRows(stops, showPassStops){
    const rows = stops || [];
    const absAD = buildThsrAbsArrDep(rows);
    const actualEntries = [];

    for(let i=0;i<rows.length;i++){
      const row = rows[i] || [];
      const station = row[0] || '';
      if(!station) continue;

      const raw1 = row[1] || '';
      const raw2 = row[2] || '';
      const hasSingleTime = !!((raw1 || raw2) && !(raw1 && raw2));
      const isEdge = i === 0 || i === rows.length - 1;
      const isPassOnly = !isEdge && hasSingleTime;
      const ad = splitArrDep(row);
      const kind = isPassOnly ? 'pass' : (i === 0 ? 'origin' : (i === rows.length - 1 ? 'terminal' : 'stop'));

      actualEntries.push({
        station,
        kind,
        arrText: ad.arr || '',
        depText: ad.dep || '',
        arrAbs: absAD.absArr[i],
        depAbs: absAD.absDep[i],
        eventAbs: (i === rows.length - 1) ? (absAD.absArr[i] ?? absAD.absDep[i]) : (absAD.absDep[i] ?? absAD.absArr[i]),
        hasSeparateArrival: !!(raw1 && raw2),
      });
    }

    const expanded = [];
    if(showPassStops && actualEntries.length){
      expanded.push(actualEntries[0]);
      for(let i=0;i<actualEntries.length-1;i++){
        const current = actualEntries[i];
        const next = actualEntries[i+1];
        const path = getThsrRouteStationsBetween(current.station, next.station);
        if(path.length <= 1){
          expanded.push(next);
          continue;
        }

        const startAbs = current.depAbs ?? current.arrAbs ?? current.eventAbs;
        const endAbs = next.arrAbs ?? next.depAbs ?? next.eventAbs;
        const segmentCount = Math.max(1, path.length - 1);
        const duration = (Number.isFinite(startAbs) && Number.isFinite(endAbs)) ? Math.max(0, endAbs - startAbs) : null;
        const startStop = current.kind !== 'pass';
        const endStop = next.kind !== 'pass';
        const getTimedRatio = window.RailNetwork?.getThsrTimedInterpolationRatio;

        for(let step=1; step<path.length; step++){
          if(step === path.length - 1){
            expanded.push(next);
            continue;
          }
          const fallbackRatio = step / segmentCount;
          const ratio = (typeof getTimedRatio === 'function')
            ? getTimedRatio(current.station, next.station, path[step], duration, startStop, endStop, fallbackRatio)
            : fallbackRatio;
          const passAbs = (duration === null) ? null : Math.round(startAbs + (duration * ratio));
          expanded.push({
            station: path[step],
            kind: 'pass',
            arrText: '',
            depText: '',
            arrAbs: null,
            depAbs: null,
            eventAbs: passAbs,
            passText: formatAbsTime(passAbs),
            hasSeparateArrival: false,
          });
        }
      }
    }

    const visible = showPassStops ? expanded : actualEntries.filter((entry)=>entry.kind !== 'pass');
    return visible.map((entry)=>{
      const isPass = entry.kind === 'pass';
      const primaryText = isPass ? '' : ((entry.kind === 'terminal') ? (entry.arrText || entry.depText || '') : (entry.depText || entry.arrText || ''));
      const secondaryText = isPass ? (entry.passText || entry.depText || entry.arrText || '') : ((entry.hasSeparateArrival || entry.arrText !== primaryText) ? (entry.arrText || '') : '');
      const secondaryPrefix = isPass ? '通' : (secondaryText ? '到' : '');
      let descriptor = '';
      if(entry.kind === 'origin') descriptor = '起站';
      else if(entry.kind === 'terminal') descriptor = '終點';

      return {
        station: entry.station,
        kind: entry.kind,
        primaryText,
        secondaryText,
        secondaryPrefix,
        arrAbs: entry.arrAbs,
        depAbs: entry.depAbs,
        eventAbs: entry.eventAbs,
        descriptor,
      };
    });
  }

  function getThsrDetailCurrentLocation(timelineRows, nowAbs, originDateStr, todayStr, isActiveWindow, fallbackStation){
    if(originDateStr > todayStr) return '未發車';
    if(!isActiveWindow) return '已到終點';
    if(!Array.isArray(timelineRows) || !timelineRows.length) return fallbackStation || '--';
    const nextTimelineIndex = timelineRows.findIndex((row)=>{
      const eventAbs = row?.eventAbs;
      return Number.isFinite(eventAbs) && eventAbs >= nowAbs;
    });
    if(nextTimelineIndex < 0) return fallbackStation || timelineRows[timelineRows.length - 1]?.station || '--';
    const nextRow = timelineRows[nextTimelineIndex] || null;
    if(!nextRow) return fallbackStation || '--';
    if(nextTimelineIndex === 0) return nextRow.station || fallbackStation || '--';
    const isDwellingAtStation =
      nextRow.kind !== 'pass' &&
      Number.isFinite(nextRow.arrAbs) &&
      Number.isFinite(nextRow.depAbs) &&
      nowAbs >= nextRow.arrAbs &&
      nowAbs <= nextRow.depAbs;
    if(isDwellingAtStation) return nextRow.station || fallbackStation || '--';
    const prevRow = timelineRows[nextTimelineIndex - 1] || null;
    const fromStation = prevRow?.station || nextRow.station || fallbackStation || '--';
    const toStation = nextRow.station || fallbackStation || '--';
    return fromStation === toStation ? fromStation : `${fromStation} ➝ ${toStation}`;
  }

  function renderDetailedTimeline(stops, originDateStr, showPassStops){
    const todayStr = fmtDate(new Date());
    const yestStr = addDays(todayStr, -1);
    const nowAbs = getNowAbsFromOrigin(originDateStr || todayStr);
    const firstStop = stops[0] || [];
    const lastStop = stops[stops.length - 1] || [];
    const firstTimes = splitArrDep(firstStop);
    const lastTimes = splitArrDep(lastStop);
    const depTime = firstTimes.dep || firstTimes.arr || '--';
    const arrTime = lastTimes.arr || lastTimes.dep || '--';
    const absAD = buildThsrAbsArrDep(stops);
    const depAbs = absAD.absDep[0] ?? absAD.absArr[0];
    const arrAbs = absAD.absArr[stops.length - 1] ?? absAD.absDep[stops.length - 1];
    const travel = (Number.isFinite(depAbs) && Number.isFinite(arrAbs)) ? durationText(0, Math.max(0, arrAbs - depAbs)).replace('0h ', '') : '--';
    const timelineRows = buildThsrTimelineRows(stops, showPassStops);
    const locationTimelineRows = buildThsrTimelineRows(stops, true);
    const crosses = Number.isFinite(arrAbs) && arrAbs >= 1440;
    const isActiveWindow =
      (originDateStr === todayStr) ||
      (originDateStr === yestStr && crosses && Number.isFinite(arrAbs) && nowAbs <= (arrAbs + 360));

    let nextTimelineIndex = -1;
    if(isActiveWindow){
      for(let i=0;i<timelineRows.length;i++){
        const eventAbs = timelineRows[i]?.eventAbs;
        if(eventAbs !== null && eventAbs !== undefined && Number.isFinite(eventAbs) && eventAbs >= nowAbs){
          nextTimelineIndex = i;
          break;
        }
      }
    }
    const nextStopTimelineIndex =
      nextTimelineIndex >= 0 && timelineRows[nextTimelineIndex]?.kind === 'pass'
        ? timelineRows.findIndex((row, index)=>index > nextTimelineIndex && row.kind !== 'pass')
        : -1;

    const currentLocation = getThsrDetailCurrentLocation(locationTimelineRows, nowAbs, originDateStr, todayStr, isActiveWindow, lastStop[0] || '--');

    const html = timelineRows.map((row, i)=>{
      const isPassed = isActiveWindow && Number.isFinite(row.eventAbs) && row.eventAbs < nowAbs;
      const isNext = isActiveWindow && i === nextTimelineIndex;
      const secondaryHtml = row.secondaryPrefix && row.secondaryText
        ? `<span class="st-arr ${row.kind === 'pass' ? 'pass' : 'stop'}"><span class="st-arr-prefix">${row.secondaryPrefix}</span>${row.secondaryText}</span>`
        : '';
      const badge = isNext ? `<span class="badge-next">${row.kind === 'pass' ? '即將通過' : '下一站'}</span>` : '';
      const badgeFollow = nextStopTimelineIndex === i ? `<span class="badge-follow">下一停靠</span>` : '';
      const classes = ['timeline-item'];
      if(isPassed) classes.push('passed');
      if(isNext) classes.push('next');
      if(row.kind === 'pass') classes.push('pass');
      return `<div class="${classes.join(' ')}"><div class="tl-time">${row.primaryText || '<span class="tl-time-empty">--</span>'}</div><div class="tl-marker"><div class="tl-dot"></div><div class="tl-line"></div></div><div class="tl-content"><div class="tl-station"><span>${row.station}</span>${secondaryHtml}${badge}${badgeFollow}</div>${row.descriptor ? `<div class="tl-desc">${row.descriptor}</div>` : ''}</div></div>`;
    }).join('');

    document.getElementById('modalBody').innerHTML = `
      <section class="modal-hero">
        <div class="modal-route-strip">
          <span>${firstStop[0] || '--'}</span>
          <strong>${depTime}</strong>
          <div class="modal-route-line"></div>
          <strong>${arrTime}</strong>
          <span>${lastStop[0] || '--'}</span>
        </div>
        <div class="modal-stats">
          <div class="modal-stat"><span>車程</span><strong>${travel}</strong></div>
          <div class="modal-stat"><span>中途</span><strong>${Math.max(0, stops.length - 2)} 站</strong></div>
          <div class="modal-stat"><span>目前位置</span><strong>${currentLocation}</strong></div>
          <div class="modal-stat"><span>發車日</span><strong>${originDateStr}</strong></div>
        </div>
      </section>
      <section class="modal-section">
        <div class="modal-section-head">
          <div class="modal-section-title">停靠時間軸</div>
          <button type="button" class="modal-toggle-btn" id="modalPassToggle">${showPassStops ? '隱藏通過站' : '查看通過站'}</button>
        </div>
        <div class="timeline">${html}</div>
      </section>`;

    document.getElementById('modalPassToggle')?.addEventListener('click', ()=>{
      if(!modalCtx) return;
      showTrainDetails(modalCtx.trainNo, modalCtx.originDate, { showPassStops: !modalCtx.showPassStops });

  function renderTimeline(stops, originDateStr){
    const nowMin = new Date().getHours()*60 + new Date().getMinutes(); const today = isQueryToday(originDateStr);
    const firstStop = stops[0] || [];
    const lastStop = stops[stops.length - 1] || [];
    const firstTimes = splitArrDep(firstStop);
    const lastTimes = splitArrDep(lastStop);
    const depTime = firstTimes.dep || firstTimes.arr || '--';

 function openTHSRExternalBookingUrl(jumpUrl){
  const href = String(jumpUrl || '').trim();
  if(!href) return false;

  let targetWindow = window;
  try{
    if(window.top && window.top !== window) targetWindow = window.top;
  }catch(_){
    targetWindow = window;
  }

  try{
    const anchor = document.createElement('a');
    anchor.href = href;
    anchor.rel = 'noopener';
    anchor.target = targetWindow === window ? '_self' : '_top';
    anchor.style.display = 'none';
    (document.body || document.documentElement).appendChild(anchor);
    anchor.click();
    anchor.remove();
  }catch(_){}

  window.setTimeout(() => {
    if(document.visibilityState === 'hidden') return;
    try{
      if(typeof targetWindow.location.assign === 'function') targetWindow.location.assign(href);
      else targetWindow.location.href = href;
    }catch(_){
      window.location.href = href;
    }
  }, 180);

  return true;
 }

 async function openTHSRBookingDeepLink(trainNo, dateStr, timeStr, startStationName, endStationName){ 
  const isMobile = !isDesktopDevice();
  if (!isMobile) { 
    alert("限使用行動裝置並已下載高鐵T Express行動購票App使用"); 
    return; 
  }

  try {
    let st = startStationName || extractStationNameFromInput(document.getElementById('startStation').value);
    let ed = endStationName || extractStationNameFromInput(document.getElementById('endStation').value);
    if(!st || !ed){ 
      alert("請先選擇起訖站"); 
      return; 
    }

    st = st.replace(/臺/g, '台'); 
    ed = ed.replace(/臺/g, '台');

    if (typeof getAccessToken !== 'function') { 
      alert("系統錯誤：無法取得授權函式"); 
      return; 
    }

    const token = await getAccessToken(); 
    if(!token) { 
      alert("授權失敗，無法連接 TDX"); 
      return; 
    }

    const apiUrl = `https://tdx.transportdata.tw/api/maas-thsr/booking/deeplink/direct/hsr?start_station=${encodeURIComponent(st)}&end_station=${encodeURIComponent(ed)}&train_date=${dateStr}&train_time=${encodeURIComponent(timeStr)}&train_number=${trainNo}`;
    const buildBookingHeaders = (authToken) => {
      if (typeof window.buildTdxAuthHeaders === 'function') {
        return window.buildTdxAuthHeaders(authToken);
      }
      const headers = {
        'Accept': 'application/json'
      };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      if (window.TDX_CONFIG?.clientId || TDX_CONFIG?.clientId) {
        headers['x-api-key'] = window.TDX_CONFIG?.clientId || TDX_CONFIG.clientId;
      }
      return headers;
    };
    const readErrorText = async (response) => {
      try {
        const raw = await response.text();
        return String(raw || '').trim();
      } catch (_) {
        return '';
      }
    };
    const requestDeepLink = async (forceRefresh = false) => {
      const authToken = await getAccessToken(forceRefresh);
      if (!authToken) return { ok: false, reason: 'no-token' };
      const response = await fetch(apiUrl, { 
        method: 'GET', 
        headers: buildBookingHeaders(authToken)
      });
      return { ok: response.ok, response };
    };

    let { response: res } = await requestDeepLink(false);
    if ((res?.status === 401 || res?.status === 403) && typeof getAccessToken === 'function') {
      ({ response: res } = await requestDeepLink(true));
    }

    if(!res.ok) { 
      const errorText = await readErrorText(res);
      if(res.status === 401 || res.status === 403) {
        if(shouldUseTHSRWebFallbackForBookingError(res.status, errorText)){
          const fallbackUsed = maybeFallbackTHSRBookingToWeb({
            trainNo,
            dateStr,
            timeStr,
            startStation: st,
            endStation: ed,
          }, errorText);
          if(fallbackUsed) return;
        }
        alert(`TDX 訂票授權失敗（HTTP ${res.status}）。${errorText ? `\n${errorText}` : '\n請重新整理後再試；若仍失敗，再確認 MaaS API 權限與訂閱設定。'}`);
      } else alert(`訂票連結取得失敗: HTTP ${res.status}${errorText ? `\n${errorText}` : ''}`); 
      return; 
    }

    const result = await res.json();
    const jumpUrl = result.url || (result.data && result.data.deeplink) || result.DeepLinkUrl;

    if (jumpUrl) {
      openTHSRExternalBookingUrl(jumpUrl);
    } else {
      console.error("API 回傳結構異常:", result);
      alert("無法取得 App 喚醒連結");
    }

  } catch (e) {
    console.error("Deep Link Error:", e);
    alert("系統發生錯誤，請稍後再試");
  }
}


  

  const THSR_LAST_NEAREST_KEY = 'thsr_last_nearest_station';

  function normalizeThsrLinkedStation(rawStation) {
    const station = extractStationNameFromInput(rawStation);
    return station ? normTHSRStationName(station) : '';
  }

  function getThsrStationGeoItem(rawStation) {
    const station = normalizeThsrLinkedStation(rawStation);
    if (!station) return null;
    return window.stationGeoMap?.[station] || null;
  }

  function getGeoDistanceKm(lat1, lon1, lat2, lon2) {
    const toRad = (value) => (Number(value) * Math.PI) / 180;
    const R = 6371;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function interpolateGeoPoint(fromPoint, toPoint, ratio) {
    const r = Math.max(0, Math.min(1, Number(ratio) || 0));
    return {
      lat: fromPoint.lat + ((toPoint.lat - fromPoint.lat) * r),
      lon: fromPoint.lon + ((toPoint.lon - fromPoint.lon) * r)
    };
  }

  function buildGeoPathProfile(pathNames, resolveGeoItem, resolveScalar) {
    const points = [];
    let cumulative = 0;
    let previous = null;
    (Array.isArray(pathNames) ? pathNames : []).forEach((name) => {
      const geo = resolveGeoItem?.(name);
      if (!geo) return;
      const explicitScalar = resolveScalar ? Number(resolveScalar(name)) : NaN;
      if (previous) {
        if (Number.isFinite(explicitScalar) && Number.isFinite(previous.rawScalar)) {
          cumulative += Math.abs(explicitScalar - previous.rawScalar);
        } else {
          cumulative += getGeoDistanceKm(previous.lat, previous.lon, geo.lat, geo.lon);
        }
      }
      const point = { name, lat: geo.lat, lon: geo.lon, scalar: cumulative };
      if (Number.isFinite(explicitScalar)) point.rawScalar = explicitScalar;
      points.push(point);
      previous = point;
    });
    return points;
  }

  function interpolatePointOnProfile(profile, ratio) {
    const points = Array.isArray(profile) ? profile : [];
    if (!points.length) return null;
    if (points.length === 1) return { lat: points[0].lat, lon: points[0].lon, pathPoints: points };
    const firstScalar = Number(points[0].scalar);
    const lastScalar = Number(points[points.length - 1].scalar);
    const span = lastScalar - firstScalar;
    if (!Number.isFinite(span) || span <= 0) {
      const fallback = interpolateGeoPoint(points[0], points[points.length - 1], ratio);
      return { ...fallback, pathPoints: points };
    }
    const targetScalar = firstScalar + (span * Math.max(0, Math.min(1, Number(ratio) || 0)));
    for (let i = 0; i < points.length - 1; i++) {
      const from = points[i];
      const to = points[i + 1];
      const fromScalar = Number(from.scalar);
      const toScalar = Number(to.scalar);
      if (!Number.isFinite(fromScalar) || !Number.isFinite(toScalar) || toScalar < fromScalar) continue;
      if (targetScalar < fromScalar || targetScalar > toScalar) continue;
      const localRatio = toScalar === fromScalar ? 0 : ((targetScalar - fromScalar) / (toScalar - fromScalar));
      return { ...interpolateGeoPoint(from, to, localRatio), pathPoints: points };
    }
    return { lat: points[points.length - 1].lat, lon: points[points.length - 1].lon, pathPoints: points };
  }

  function locatePointOnProfileSegment(profile, ratio, makeSegmentKey, segmentMap) {
    const points = Array.isArray(profile) ? profile : [];
    if (!points.length) return null;
    if (points.length === 1) {
      return {
        lat: points[0].lat,
        lon: points[0].lon,
        pathPoints: points,
        kind: 'station',
        stationName: points[0].name
      };
    }
    const firstScalar = Number(points[0].scalar);
    const lastScalar = Number(points[points.length - 1].scalar);
    const span = lastScalar - firstScalar;
    if (!Number.isFinite(span) || span <= 0) {
      const fallback = interpolateGeoPoint(points[0], points[points.length - 1], ratio);
      const segmentKey = makeSegmentKey?.(points[0]?.name, points[points.length - 1]?.name) || '';
      return {
        ...fallback,
        pathPoints: points,
        kind: 'segment',
        segmentKey,
        segmentRatio: Math.max(0, Math.min(1, Number(ratio) || 0))
      };
    }
    const targetScalar = firstScalar + (span * Math.max(0, Math.min(1, Number(ratio) || 0)));
    for (let i = 0; i < points.length - 1; i++) {
      const from = points[i];
      const to = points[i + 1];
      const fromScalar = Number(from.scalar);
      const toScalar = Number(to.scalar);
      if (!Number.isFinite(fromScalar) || !Number.isFinite(toScalar) || toScalar < fromScalar) continue;
      if (targetScalar < fromScalar || targetScalar > toScalar) continue;
      const localRatio = toScalar === fromScalar ? 0 : ((targetScalar - fromScalar) / (toScalar - fromScalar));
      const segmentKey = makeSegmentKey?.(from.name, to.name) || '';
      const segment = segmentMap?.get(segmentKey) || null;
      const segmentRatio = !segment
        ? localRatio
        : (segment.fromName === from.name && segment.toName === to.name ? localRatio : (1 - localRatio));
      return {
        ...interpolateGeoPoint(from, to, localRatio),
        pathPoints: points,
        kind: 'segment',
        segmentKey,
        segmentRatio,
        segment
      };
    }
    return {
      lat: points[points.length - 1].lat,
      lon: points[points.length - 1].lon,
      pathPoints: points,
      kind: 'station',
      stationName: points[points.length - 1].name
    };
  }

  function projectPointToGeoSegment(lat, lon, fromPoint, toPoint) {
    if (!fromPoint || !toPoint) return null;
    const refLat = Number(fromPoint.lat);
    const meanLat = ((Number(fromPoint.lat) + Number(toPoint.lat) + Number(lat)) / 3);
    const kmPerLat = 111.32;
    const kmPerLon = 111.32 * Math.cos((meanLat * Math.PI) / 180);
    const px = (Number(lon) - Number(fromPoint.lon)) * kmPerLon;
    const py = (Number(lat) - refLat) * kmPerLat;
    const bx = (Number(toPoint.lon) - Number(fromPoint.lon)) * kmPerLon;
    const by = (Number(toPoint.lat) - refLat) * kmPerLat;
    const len2 = (bx * bx) + (by * by);
    const ratio = len2 > 0 ? Math.max(0, Math.min(1, ((px * bx) + (py * by)) / len2)) : 0;
    const projX = bx * ratio;
    const projY = by * ratio;
    return {
      ratio,
      lat: fromPoint.lat + ((toPoint.lat - fromPoint.lat) * ratio),
      lon: fromPoint.lon + ((toPoint.lon - fromPoint.lon) * ratio),
      distanceKm: Math.hypot(px - projX, py - projY)
    };
  }

  function getMedianNumber(values) {
    const list = (Array.isArray(values) ? values : []).filter((value) => Number.isFinite(value)).sort((a, b) => a - b);
    if (!list.length) return null;
    const middle = Math.floor(list.length / 2);
    return list.length % 2 ? list[middle] : ((list[middle - 1] + list[middle]) / 2);
  }

  function getPolylineMinDistanceKm(lat, lon, pathPoints) {
    const points = Array.isArray(pathPoints) ? pathPoints : [];
    if (!points.length) return Infinity;
    const refLat = Number(lat);
    const toXY = (point) => {
      const meanLat = (refLat + Number(point.lat)) / 2;
      const kmPerLat = 111.32;
      const kmPerLon = 111.32 * Math.cos((meanLat * Math.PI) / 180);
      return {
        x: (Number(point.lon) - Number(lon)) * kmPerLon,
        y: (Number(point.lat) - refLat) * kmPerLat
      };
    };
    const pointDistance = (point) => Math.hypot(toXY(point).x, toXY(point).y);
    if (points.length === 1) return pointDistance(points[0]);
    let minDistance = Infinity;
    for (let i = 0; i < points.length - 1; i++) {
      const a = toXY(points[i]);
      const b = toXY(points[i + 1]);
      const abx = b.x - a.x;
      const aby = b.y - a.y;
      const len2 = (abx * abx) + (aby * aby);
      let t = 0;
      if (len2 > 0) {
        t = Math.max(0, Math.min(1, (-(a.x * abx) - (a.y * aby)) / len2));
      }
      const projX = a.x + (abx * t);
      const projY = a.y + (aby * t);
      minDistance = Math.min(minDistance, Math.hypot(projX, projY));
    }
    return minDistance;
  }

  function getGeoLocateError(error, fallbackMessage) {
    const code = Number(error?.code);
    if (code === 1) return new Error('請允許定位權限');
    if (code === 2) return new Error('目前無法取得可用定位，請確認裝置已開啟定位服務');
    if (code === 3) return new Error('定位逾時，請到訊號較好的地方再試一次');
    const message = String(error?.message || fallbackMessage || '定位失敗，請稍後再試').trim();
    return new Error(message || '定位失敗，請稍後再試');
  }

  function getBrowserGeoPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(getGeoLocateError(null, '瀏覽器不支援定位'));
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (position) => resolve(position),
        (error) => reject(getGeoLocateError(error, '無法取得目前位置')),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    });
  }

  function collectGeoPositionSamples(options = {}) {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(getGeoLocateError(null, '瀏覽器不支援定位'));
        return;
      }
      const durationMs = Math.max(2600, Number(options.durationMs) || 3200);
      const targetCount = Math.max(2, Number(options.targetCount) || 3);
      const samples = [];
      let finished = false;
      let watchId = null;
      let timer = null;
      let lastError = null;
      const done = (error) => {
        if (finished) return;
        finished = true;
        if (timer) clearTimeout(timer);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (samples.length) {
          resolve(samples.slice(0, targetCount));
          return;
        }
        reject(getGeoLocateError(error || lastError, '無法取得目前位置'));
      };
      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const ts = Number(position?.timestamp) || Date.now();
          const lastTs = samples.length ? Number(samples[samples.length - 1]?.timestamp || 0) : 0;
          if (lastTs && (ts - lastTs) < 650) {
            samples[samples.length - 1] = position;
          } else {
            samples.push(position);
          }
          if (samples.length >= targetCount) done();
        },
        (error) => {
          lastError = error;
        },
        { enableHighAccuracy: true, timeout: durationMs, maximumAge: 0 }
      );
      timer = setTimeout(() => done(samples.length ? null : getGeoLocateError(lastError, '定位逾時，請到訊號較好的地方再試一次')), durationMs + 600);
    });
  }

      ? button.dataset.mobileLabel
