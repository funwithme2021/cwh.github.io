  async function locateNearestThsrStation(target) {
    if (!Array.isArray(window.stationGeoList) || !window.stationGeoList.length) {
      await initStationMap();
    }
    const position = await getBrowserGeoPosition();
    const lat = Number(position?.coords?.latitude);
    const lon = Number(position?.coords?.longitude);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('無法取得目前位置');
    let nearest = null;
    let minDistance = Infinity;
    (window.stationGeoList || []).forEach((station) => {
      const distanceKm = getGeoDistanceKm(lat, lon, station.lat, station.lon);
      if (distanceKm < minDistance) {
        minDistance = distanceKm;
        nearest = station;
      }
    });
    if (!nearest?.name) throw new Error('找不到最近車站');
    persistThsrNearestStation(nearest.name);
    if (target === 'start') return fillThsrStartStationFromLocation(nearest.name);
    return fillThsrStationQueryFromLocation(nearest.name);
  }

  function buildThsrAbsArrDep(stops) {
    const absArr = [];
    const absDep = [];
    let day = 0;
    let prevMinute = null;
    const pushAbs = (timeStr) => {
      const minute = parseTime(timeStr);
      if (minute === null) return null;
      if (prevMinute !== null && minute < prevMinute) day += 1;
      prevMinute = minute;
      return day * 1440 + minute;
    };
    (stops || []).forEach((stop) => {
      const ad = splitArrDep(stop);
      if (ad.arr && ad.dep && ad.arr === ad.dep) {
        const abs = pushAbs(ad.dep || ad.arr);
        absArr.push(abs);
        absDep.push(abs);
        return;
      }
      absArr.push(ad.arr ? pushAbs(ad.arr) : null);
      absDep.push(ad.dep ? pushAbs(ad.dep) : null);
    });
    return { absArr, absDep };
  }

  let thsrGeoSegmentCatalogCache = null;

  function makeThsrGeoSegmentKey(a, b) {
    const names = [normalizeThsrLinkedStation(a), normalizeThsrLinkedStation(b)].filter(Boolean);
    if (names.length !== 2 || names[0] === names[1]) return '';
    names.sort();
    return `${names[0]}|||${names[1]}`;
  }

  function getThsrGeoSegmentCatalog() {
    if (thsrGeoSegmentCatalogCache) return thsrGeoSegmentCatalogCache;
    const map = new Map();
    const stations = window.RailNetwork?.getThsrStationOrder?.() || THSR_STATION_ORDER;
    const names = (Array.isArray(stations) ? stations : []).map((name) => normalizeThsrLinkedStation(name)).filter(Boolean);
    for (let i = 0; i < names.length - 1; i++) {
      const first = names[i];
      const second = names[i + 1];
      const key = makeThsrGeoSegmentKey(first, second);
      if (!key || map.has(key)) continue;
      const ordered = [first, second].sort();
      const fromName = ordered[0];
      const toName = ordered[1];
      const fromGeo = getThsrStationGeoItem(fromName);
      const toGeo = getThsrStationGeoItem(toName);
      if (!fromGeo || !toGeo) continue;
      map.set(key, { key, fromName, toName, fromGeo, toGeo });
    }
    thsrGeoSegmentCatalogCache = {
      list: Array.from(map.values()),
      map
    };
    return thsrGeoSegmentCatalogCache;
  }

  function getNearestThsrGeoStation(lat, lon) {
    let best = null;
    (window.stationGeoList || []).forEach((station) => {
      const distanceKm = getGeoDistanceKm(lat, lon, station.lat, station.lon);
      if (!best || distanceKm < best.distanceKm) {
        best = { ...station, distanceKm };
      }
    });
    return best;
  }

  function getNearestThsrGeoSegment(lat, lon) {
    const catalog = getThsrGeoSegmentCatalog();
    let best = null;
    catalog.list.forEach((segment) => {
      const projection = projectPointToGeoSegment(lat, lon, segment.fromGeo, segment.toGeo);
      if (!projection) return;
      if (!best || projection.distanceKm < best.distanceKm) {
        best = { ...segment, ...projection };
      }
    });
    return best;
  }

  function getThsrGeoSampleSpreadKm(points) {
    const list = Array.isArray(points) ? points : [];
    let maxDistance = 0;
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        maxDistance = Math.max(
          maxDistance,
          getGeoDistanceKm(list[i].lat, list[i].lon, list[j].lat, list[j].lon)
        );
      }
    }
    return maxDistance;
  }

  function analyzeThsrGeoSamples(samples) {
    const normalizedSamples = (Array.isArray(samples) ? samples : []).map((position) => {
      const lat = Number(position?.coords?.latitude);
      const lon = Number(position?.coords?.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      const accuracyKm = Number(position?.coords?.accuracy) > 0 ? (Number(position.coords.accuracy) / 1000) : null;
      return {
        lat,
        lon,
        accuracyKm,
        timestampMs: Number(position?.timestamp) || Date.now(),
        nearestStation: getNearestThsrGeoStation(lat, lon),
        nearestSegment: getNearestThsrGeoSegment(lat, lon)
      };
    }).filter(Boolean);
    if (!normalizedSamples.length) throw new Error('無法取得目前位置');

    const spreadKm = getThsrGeoSampleSpreadKm(normalizedSamples);
    const medianAccuracyKm = getMedianNumber(normalizedSamples.map((sample) => sample.accuracyKm)) || 0.08;
    const stationThresholdKm = Math.max(0.12, Math.min(0.42, (medianAccuracyKm * 1.2) + 0.04));
    const stationSpreadThresholdKm = Math.max(0.12, Math.min(0.58, stationThresholdKm * 1.65));

    const stationGroups = new Map();
    normalizedSamples.forEach((sample) => {
      const station = sample.nearestStation;
      if (!station?.name) return;
      if (!stationGroups.has(station.name)) {
        stationGroups.set(station.name, { stationName: station.name, count: 0, distances: [] });
      }
      const group = stationGroups.get(station.name);
      group.count += 1;
      group.distances.push(station.distanceKm);
    });
    const bestStation = Array.from(stationGroups.values()).sort((a, b) => {
      if (b.count !== a.count) return b.count - a.count;
      return (getMedianNumber(a.distances) || Infinity) - (getMedianNumber(b.distances) || Infinity);
    })[0] || null;

    const stationLikely = !!bestStation && (
      (normalizedSamples.length === 1 && (getMedianNumber(bestStation.distances) || Infinity) <= stationThresholdKm) ||
      (bestStation.count >= 2 &&
        (getMedianNumber(bestStation.distances) || Infinity) <= stationThresholdKm &&
        spreadKm <= stationSpreadThresholdKm)
    );
    if (stationLikely) {
      return {
        kind: 'station',
        stationName: bestStation.stationName,
        points: normalizedSamples,
        spreadKm
      };
    }

    const segmentGroups = new Map();
    normalizedSamples.forEach((sample) => {
      const segment = sample.nearestSegment;
      if (!segment?.key) return;
      if (!segmentGroups.has(segment.key)) {
        segmentGroups.set(segment.key, { key: segment.key, count: 0, distances: [] });
      }
      const group = segmentGroups.get(segment.key);
      group.count += 1;
      group.distances.push(segment.distanceKm);
    });
    const bestSegmentGroup = Array.from(segmentGroups.values()).sort((a, b) => {
      if (b.count !== a.count) return b.count - a.count;
      return (getMedianNumber(a.distances) || Infinity) - (getMedianNumber(b.distances) || Infinity);
    })[0];
    const segmentCatalog = getThsrGeoSegmentCatalog();
    const segment = segmentCatalog.map.get(bestSegmentGroup?.key || '');
    if (!segment) throw new Error('附近沒有可判定的站間區段');

    const points = normalizedSamples.map((sample) => ({
      ...sample,
      projection: projectPointToGeoSegment(sample.lat, sample.lon, segment.fromGeo, segment.toGeo)
    }));
    return {
      kind: 'segment',
      segment,
      points,
      spreadKm,
      userRatio: getMedianNumber(points.map((sample) => sample.projection?.ratio))
    };
  }

  function getNowAbsFromOriginAt(originDateStr, timestampMs) {
    const now = Number.isFinite(Number(timestampMs)) ? new Date(Number(timestampMs)) : new Date();
    const todayStr = fmtDate(now);
    const dayDiff = originDateStr ? diffDays(originDateStr, todayStr) : 0;
    return (dayDiff * 1440) + now.getHours() * 60 + now.getMinutes() + (now.getSeconds() / 60) + (now.getMilliseconds() / 60000);
  }

  function getThsrLocatedTrainState(entry, timestampMs) {
    const stops = entry?.data?.['車站時間'] || [];
    if (!Array.isArray(stops) || stops.length < 2) return null;
    const absAD = buildThsrAbsArrDep(stops);
    const nowAbs = getNowAbsFromOriginAt(entry.originDate, timestampMs);
    const firstAbs = absAD.absDep?.[0] ?? absAD.absArr?.[0];
    const lastAbs = absAD.absArr?.[stops.length - 1] ?? absAD.absDep?.[stops.length - 1];
    if (!Number.isFinite(firstAbs) || !Number.isFinite(lastAbs)) return null;
    if (nowAbs < (firstAbs - 2) || nowAbs > (lastAbs + 5)) return null;

    for (let i = 0; i < stops.length; i++) {
      const stationGeo = getThsrStationGeoItem(stops[i]?.[0]);
      if (!stationGeo) continue;
      const arrAbs = absAD.absArr?.[i];
      const depAbs = absAD.absDep?.[i];
      const startAbs = Number.isFinite(arrAbs) ? arrAbs : depAbs;
      const endAbs = Number.isFinite(depAbs) ? depAbs : arrAbs;
      if (Number.isFinite(startAbs) && Number.isFinite(endAbs) && nowAbs >= Math.min(startAbs, endAbs) && nowAbs <= Math.max(startAbs, endAbs)) {
        return {
          kind: 'station',
          stationName: normalizeThsrLinkedStation(stops[i]?.[0]),
          lat: stationGeo.lat,
          lon: stationGeo.lon,
          pathPoints: [stationGeo]
        };
      }
    }

    const segmentMap = getThsrGeoSegmentCatalog().map;
    for (let i = 0; i < stops.length - 1; i++) {
      const depAbs = absAD.absDep?.[i] ?? absAD.absArr?.[i];
      const arrAbs = absAD.absArr?.[i + 1] ?? absAD.absDep?.[i + 1];
      if (!Number.isFinite(depAbs) || !Number.isFinite(arrAbs) || arrAbs < depAbs) continue;
      if (nowAbs < depAbs || nowAbs > arrAbs) continue;
      const span = Math.max(1, arrAbs - depAbs);
      const pathNames = window.RailNetwork?.findThsrRoutePath?.(stops[i]?.[0], stops[i + 1]?.[0]) || [stops[i]?.[0], stops[i + 1]?.[0]];
      const profile = buildGeoPathProfile(
        pathNames,
        getThsrStationGeoItem,
        (name) => window.RailNetwork?.getThsrStationMileage?.(name)
      );
      if (profile.length >= 2) {
        const located = locatePointOnProfileSegment(profile, (nowAbs - depAbs) / span, makeThsrGeoSegmentKey, segmentMap);
        if (located) return located;
      }
      const fromGeo = getThsrStationGeoItem(stops[i]?.[0]);
      const toGeo = getThsrStationGeoItem(stops[i + 1]?.[0]);
      if (!fromGeo || !toGeo) continue;
      const point = interpolateGeoPoint(fromGeo, toGeo, (nowAbs - depAbs) / span);
      const fallbackKey = makeThsrGeoSegmentKey(stops[i]?.[0], stops[i + 1]?.[0]);
      const fallbackSegment = segmentMap.get(fallbackKey) || null;
      const fallbackProjection = projectPointToGeoSegment(
        point.lat,
        point.lon,
        fallbackSegment?.fromGeo || fromGeo,
        fallbackSegment?.toGeo || toGeo
      );
      return {
        ...point,
        pathPoints: [fromGeo, toGeo],
        kind: 'segment',
        segmentKey: fallbackKey,
        segmentRatio: fallbackProjection?.ratio ?? Math.max(0, Math.min(1, (nowAbs - depAbs) / span)),
        segment: fallbackSegment
      };
    }

    return null;
  }

  async function prepareThsrLiveLocateData() {
    const todayStr = fmtDate(new Date());
    if (currentQueryDateStr !== todayStr || !Object.keys(baseSchedule || {}).length) {
      const dateInput = document.getElementById('mainQueryDate');
      if (dateInput) dateInput.value = todayStr;
      await refreshData(todayStr, { silent: true });
    }
  }

  function scoreThsrEntryForGeoContext(entry, context) {
    const segmentMap = getThsrGeoSegmentCatalog().map;
    let matched = 0;
    let totalScore = 0;
    let totalDistanceKm = 0;
    context.points.forEach((sample) => {
      const state = getThsrLocatedTrainState(entry, sample.timestampMs);
      if (!state) return;
      const pointDistanceKm = getGeoDistanceKm(sample.lat, sample.lon, state.lat, state.lon);
      if (context.kind === 'segment') {
        const userRatio = sample.projection?.ratio ?? context.userRatio ?? 0.5;
        if (state.kind === 'segment' && state.segmentKey === context.segment.key) {
          totalScore += (Math.abs((Number(state.segmentRatio) || 0) - userRatio) * 8) + (pointDistanceKm * 0.35);
          totalDistanceKm += pointDistanceKm;
          matched += 1;
          return;
        }
        if (state.kind === 'station') {
          const endpointRatio = state.stationName === context.segment.fromName ? 0 : (state.stationName === context.segment.toName ? 1 : null);
          if (endpointRatio !== null) {
            totalScore += (Math.abs(endpointRatio - userRatio) * 8) + (pointDistanceKm * 0.4) + 0.8;
            totalDistanceKm += pointDistanceKm;
            matched += 1;
          }
        }
        return;
      }

      if (state.kind === 'station' && state.stationName === context.stationName) {
        totalScore += pointDistanceKm * 0.45;
        totalDistanceKm += pointDistanceKm;
        matched += 1;
        return;
      }
      if (state.kind === 'segment') {
        const segment = segmentMap.get(state.segmentKey || '');
        if (!segment) return;
        const endpointRatio = segment.fromName === context.stationName ? 0 : (segment.toName === context.stationName ? 1 : null);
        if (endpointRatio === null) return;
        totalScore += (Math.abs((Number(state.segmentRatio) || 0) - endpointRatio) * 8) + (pointDistanceKm * 0.4) + 0.7;
        totalDistanceKm += pointDistanceKm;
        matched += 1;
      }
    });
    if (!matched) return null;
    return {
      matched,
      avgDistanceKm: totalDistanceKm / matched,
      score: (totalScore / matched) + ((context.points.length - matched) * 1.75)
    };
  }

  async function locateThsrRunningTrainByPosition(options) {
    const opts = options || {};
    if (!Array.isArray(window.stationGeoList) || !window.stationGeoList.length) {
      await initStationMap();
    }
    await prepareThsrLiveLocateData();
    const samples = await collectGeoPositionSamples({ durationMs: 3200, targetCount: 3 });
    const context = analyzeThsrGeoSamples(samples);
    let best = null;
    const sources = [
      { map: baseSchedule || {}, originDate: currentQueryDateStr },
      { map: prevSchedule || {}, originDate: addDays(currentQueryDateStr, -1) }
    ];
    sources.forEach((source) => {
      Object.keys(source.map || {}).forEach((trainNo) => {
        const entry = { trainNo, originDate: source.originDate, data: source.map[trainNo] };
        const scored = scoreThsrEntryForGeoContext(entry, context);
        if (!scored) return;
        if (!best || scored.score < best.score) {
          best = { entry, ...scored };
        }
      });
    });
    if (!best || best.avgDistanceKm > 18) {
      throw new Error('附近沒有可判定的行駛中列車');
    }
    const result = { entry: best.entry, avgDistanceKm: best.avgDistanceKm, matched: best.matched, score: best.score, context };
    if (opts.applyTrainQuery === false) return result;
    switchQueryPanel('panel-trainno');
    const trainNo = String(best.entry.trainNo || '');
    const input = document.getElementById('trainNumberInput');
    if (input) input.value = trainNo;
    if (typeof updateHeroSnapshot === 'function') updateHeroSnapshot();
    result.queryResult = await Promise.resolve(filterTrainScheduleByNumberV2(trainNo));
    return result;
  }

  window.locateThsrRunningTrainByPosition = locateThsrRunningTrainByPosition;

  function handleUrlParams() {
    const p = new URLSearchParams(window.location.search);
    const pStart = p.get('start');
    const pEnd = p.get('end');
    const pStation = p.get('station');
    const startEndPanelId = resolveStartEndPanelId('panel-startend');

    if (pStart && pEnd) {
        document.getElementById('startStation').value = pStart;
        document.getElementById('endStation').value = pEnd;
        if (startEndPanelId === 'panel-startend2') {
            startEndQuery2Controller?.setState?.({
                start: pStart,
                end: pEnd
            });
            setTimeout(()=>startEndQuery2Controller?.search?.(pStart, pEnd, { updateInput: true }), 600);
        } else {
            setTimeout(runStartEndSearch, 600);
        }
    } else if (pStation) {
        const stationValue = extractStationNameFromInput(pStation) || pStation;
        document.getElementById('startStation').value = stationValue;
        document.getElementById('stationNameInput').value = stationValue;
        document.getElementById('stationNameInput2').value = stationValue;
        switchQueryPanel('panel-station2');
        stationQuery2Controller?.setState?.({ station: stationValue });
        setTimeout(()=>stationQuery2Controller?.search?.(stationValue, { updateInput: true }), 300);
    }
  }

  function initFavButton() {
    const btn = document.getElementById('favBtn');
    const popup = document.getElementById('favPopup');
    
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        renderFavPopup();
        popup.classList.toggle('show');
    });

    document.addEventListener('click', (e) => {
        if (!popup.contains(e.target) && e.target !== btn) {
            popup.classList.remove('show');
        }
    });
  }

  function renderFavPopup() {
    const popup = document.getElementById('favPopup');
    popup.innerHTML = '';
    
    let hasFav = false;
    for(let i=1; i<=3; i++) {
        const s = localStorage.getItem(`thsr_s${i}`);
        const e = localStorage.getItem(`thsr_e${i}`);
        if(s && e) {
            hasFav = true;
            const item = document.createElement('div');
            item.className = 'fav-item';
            item.innerHTML = `<span style="color:var(--primary);">📍</span> ${s} → ${e}`;
            item.onclick = () => {
                document.getElementById('startStation').value = s;
                document.getElementById('endStation').value = e;
                popup.classList.remove('show');
                runStartEndSearch();
            };
            popup.appendChild(item);
        }
    }

    if (!hasFav) {
        const empty = document.createElement('div');
        empty.className = 'fav-empty';
        empty.innerText = '尚無常用行程，請至首頁設定';
        popup.appendChild(empty);
    }
  }

  // ===== 行動版：查詢設定收合 =====
  function isMobileUI(){ return window.matchMedia && window.matchMedia('(max-width: 720px)').matches; }

  function updateTripSummary(){
    const st = (document.getElementById('startStation')?.value||'').trim();
    const ed = (document.getElementById('endStation')?.value||'').trim();
    const onlyDirect = document.getElementById('onlyDirect')?.checked;
    const t = document.getElementById('tripSummaryText');
    if(!t) return;
    if(!st && !ed){ t.textContent = '請設定出發與到達'; return; }
    const seg = `${st||'—'} ➝ ${ed||'—'}`;
    t.textContent = onlyDirect ? `${seg} ｜直達` : seg;
  }

  function openTripSheet(){
    const b = document.getElementById('tripSheetBackdrop');
    const s = document.getElementById('tripSheet');
    if(!b || !s) return;
    b.style.display='block';
    s.style.display='block';
    document.body.style.overflow='hidden';
  }
  function closeTripSheet(){
    const b = document.getElementById('tripSheetBackdrop');
    const s = document.getElementById('tripSheet');
    if(!b || !s) return;
    b.style.display='none';
    s.style.display='none';
    document.body.style.overflow='';
  }

  function setupMobileTripSheet(){
    if(!isMobileUI()) return;
    const panel = document.getElementById('panel-startend');
    const formRow = panel?.querySelector('.form-row');
    const body = document.getElementById('tripSheetBody');
    
    // 檢查並移動元素，並在此時綁定事件，避免重複綁定
    if(formRow && body && !body.dataset.bound){
      body.dataset.bound='1';
      body.appendChild(formRow); // 移到 sheet 裡
      formRow.classList.add('in-sheet');
      formRow.style.position='relative';
      
      const swap = document.getElementById('swapBtn');
      if(swap){
        swap.style.width='';
        swap.style.height='';
        swap.style.justifySelf='center';
        swap.style.alignSelf='center';
      }
      const searchBtn = document.getElementById('searchBtn');
      if(searchBtn){
        searchBtn.style.width='100%';
        searchBtn.style.height='44px';
      }

      // ★★★ 事件綁定移動到這裡，確保只綁定一次 ★★★
      document.getElementById('tripOpenBtn')?.addEventListener('click', (e)=>{
          e.stopPropagation(); 
          openTripSheet();
      });
      document.getElementById('tripSheetClose')?.addEventListener('click', closeTripSheet);
      document.getElementById('tripSheetBackdrop')?.addEventListener('click', closeTripSheet);

      document.getElementById('tripCompactSearchBtn')?.addEventListener('click', (e)=>{
        e.stopPropagation();
        closeTripSheet();
        document.getElementById('searchBtn')?.click();
      });

      // 點擊整個條開啟設定，但排除搜尋按鈕
      document.getElementById('tripCompactBar')?.addEventListener('click', (ev)=>{
        if(ev.target && ev.target.closest && ev.target.closest('#tripCompactSearchBtn')) return;
        openTripSheet();
      });

      // 按下搜尋按鈕後收合
      document.getElementById('searchBtn')?.addEventListener('click', ()=>{ closeTripSheet(); });
    }

    // 內容更新
    ['startStation','endStation'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){ el.addEventListener('input', updateTripSummary); el.addEventListener('change', updateTripSummary); }
    });
    document.getElementById('onlyDirect')?.addEventListener('change', updateTripSummary);

    updateTripSummary();
  }

  window.addEventListener('resize', ()=>{
    // 縮放到手機寬度時再初始化
    setupMobileTripSheet();
    updateTripSummary();
    applyTHSRMobileTableLayouts();
  });

</script>
