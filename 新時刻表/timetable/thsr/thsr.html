<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台灣高鐵時刻表 (真實數據即時版)</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
  <style> 
  /* ===== 1. 核心變數與 Reset ===== */
  :root {
    --font-main: 'Inter', 'Noto Sans TC', sans-serif;
    --bg-body: #f8fafc;
    --bg-surface: #ffffff;
    --bg-header: rgba(255, 255, 255, 0.9);
    --text-main: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --border: #e2e8f0;
    --primary: #2563eb;
    --primary-bg: rgba(37, 99, 235, 0.1);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --radius: 10px;
  }
  /* 模仿台鐵狀態文字顏色 */
.status-text-未發車 { color: var(--text-muted); }
.status-text-行駛中, .status-text-準點 { color: #22c55e; font-weight: 600; }
.status-text-已過站, .status-text-已到終點 { color: var(--text-light); }

  /* 剩餘座位圖示樣式 */
.seat-icon { font-size: 1.2rem; font-weight: bold; }
.seat-o { color: #22c55e; } /* 綠色圓圈 */
.seat-l { color: #f59e0b; } /* 橘色三角形 */
.seat-x { color: #ef4444; } /* 紅色叉叉 */
.seat-none { color: var(--text-light); opacity: 0.5; }

  body.dark-mode {
    --bg-body: #0f172a;
    --bg-surface: #1e293b;
    --bg-header: rgba(30, 41, 59, 0.9);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --text-light: #64748b;
    --border: #334155;
    --primary: #60a5fa;
    --primary-bg: rgba(96, 165, 250, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: var(--font-main);
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 40px;
  }

  /* ===== 2. 導航列 ===== */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.8rem 1.5rem;
    background: var(--bg-header);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .navbar .brand { font-weight: 700; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .nav-links { display: flex; gap: 4px; align-items: center; }
  .nav-links a {
    color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500;
    padding: 6px 12px; border-radius: 6px; transition: 0.2s;
  }
  .nav-links a:hover { background: var(--bg-body); color: var(--primary); }
  .theme-btn {
    border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 5px; }
  .hamburger span { width: 24px; height: 2px; background: var(--text-main); }

  @media(max-width: 900px) {
    .nav-links {
      position: absolute; top: 100%; left: 0; width: 100%;
      background: var(--bg-surface); border-bottom: 1px solid var(--border);
      flex-direction: column; align-items: flex-start; padding: 0;
      max-height: 0; overflow: hidden; opacity: 0; transition: 0.3s;
    }
    .nav-links.open { max-height: 500px; opacity: 1; padding: 1rem; }
    .nav-links a { width: 100%; padding: 10px; }
    .hamburger { display: flex; }
  }

  /* ===== 3. 主要容器 ===== */
  .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
  .grid { display: grid; gap: 24px; }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }

  .section-title {
    font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }

  /* ===== 4. 表單與篩選 ===== */
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; position: relative; }
  
  .input-group { 
    display: flex; align-items: center; gap: 8px; 
    background: var(--bg-body); padding: 4px 8px; 
    border: 1px solid var(--border); border-radius: 8px; 
    flex: 1; min-width: 120px;
  }
  .input-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  input, select {
    border: none; background: transparent; color: var(--text-main); 
    font-size: 0.95rem; padding: 6px; outline: none; width: 100%; 
  }

  /* 互換按鈕 */
  .swap-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--primary);
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: 0.2s; font-size: 1.1rem;
  }
  .swap-btn:hover { background: var(--bg-body); transform: rotate(180deg); }

  button.btn-primary {
    background: var(--primary); color: #fff; border: none;
    padding: 8px 16px; border-radius: 8px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }

  /* 歷史紀錄 Chips */
  .history-chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .history-chip {
    font-size: 0.8rem; padding: 4px 10px; border-radius: 12px;
    background: var(--bg-body); color: var(--text-muted);
    border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .history-chip:hover { background: var(--primary-bg); color: var(--primary); border-color: var(--primary); }

  /* 標籤式 Checkbox */
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
    user-select: none; transition: 0.2s;
  }
  .chip-label:hover { background: var(--bg-body); }
  .chip-label input { display: none; }
  .chip-label:has(input:checked) {
    background: var(--primary-bg); color: var(--primary); border-color: var(--primary); font-weight: 500;
  }
  .chip-label input:checked + span { color: var(--primary); }

  /* ===== 5. 表格樣式 ===== */
  .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; white-space: nowrap; }
  
  th {
    background: var(--bg-body); color: var(--text-muted); font-weight: 600; text-align: left;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  th.sortable { cursor: pointer; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-main); }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: var(--bg-body); cursor: pointer; }

  /* 數字對齊 */
  td { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  
  /* 標籤 Badge */
  .badge-sea { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #0ea5e9; color: #fff; margin-left: 4px; }
  
  .train-route { font-size: 0.85rem; color: var(--text-muted); margin-left: 6px; }
  .progress-bar { width: 100px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e 0%, #f59e0b 55%, #ef4444 100%); border-radius: 3px; }

  /* ===== 6. Modal (彈窗) & 時間軸 ===== */
  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
    z-index: 2000; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s;
  }
  .modal[style*="display: flex"] { opacity: 1; }

  .modal-content {
    background: var(--bg-surface); width: 95%; max-width: 500px; max-height: 85vh;
    border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden; display: flex; flex-direction: column;
    transform: translateY(20px); transition: transform 0.3s;
  }
  .modal[style*="display: flex"] .modal-content { transform: translateY(0); }

  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-body);
  }
  .modal-title-main { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .modal-title-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
  .close{font-size:26px;color:var(--text-muted);background:transparent;width:auto;height:auto;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;user-select:none;flex:0 0 auto;padding:6px 10px;line-height:1;}
.close:hover{background:rgba(148,163,184,0.18);color:var(--text-main);}

  .modal-body { padding: 0; overflow-y: auto; background: var(--bg-surface); }

  /* 時間軸樣式 */
  .timeline { padding: 10px 20px; }
  .timeline-item { display: flex; position: relative; padding-bottom: 0; }
  
  /* 左側時間 */
  .tl-time {
    width: 50px; text-align: right; font-size: 0.9rem; font-weight: 600; 
    color: var(--text-main); padding-right: 15px; padding-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  
  /* 中間線條與圓點 */
  .tl-marker {
    display: flex; flex-direction: column; align-items: center; width: 20px; position: relative;
  }
  .tl-line {
    width: 2px; background: var(--border); flex-grow: 1; margin-top: 4px; margin-bottom: -4px;
  }
  .timeline-item:last-child .tl-line { display: none; }
  .tl-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--border);
    border: 2px solid var(--bg-surface); z-index: 1; flex-shrink: 0; transition: all 0.3s;
  }
  
  /* 右側站名 */
  .tl-content { padding-left: 15px; padding-bottom: 24px; flex-grow: 1; }
  .timeline-item:last-child .tl-content { padding-bottom: 10px; }
  
  .tl-station { font-size: 1rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; }
  .st-arr{ font-size:0.55em; font-weight:600; color:var(--text-muted); margin-left:8px; font-variant-numeric: tabular-nums; }
  .tl-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

  /* --- 狀態樣式 --- */
  .timeline-item.passed .tl-time, 
  .timeline-item.passed .tl-station { opacity: 0.4; filter: grayscale(1); }
  .timeline-item.passed .tl-dot { background: var(--border); }

  .timeline-item.next .tl-dot { 
    background: #22c55e; width: 14px; height: 14px; 
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2); 
    border-color: #fff; 
  }
  .timeline-item.next .tl-station { color: #15803d; font-weight: 700; }
  body.dark-mode .timeline-item.next .tl-station { color: #4ade80; }
  
  .timeline-item.transfer .tl-dot { background: #d97706; width: 12px; height: 12px; }
  .timeline-item.transfer .tl-station { color: #b45309; }

  .badge-next {
    display: inline-flex; align-items: center; gap: 4px;
    background: #22c55e; color: #fff; font-size: 0.7rem; 
    padding: 2px 8px; border-radius: 10px; margin-left: 8px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

  .transfer-banner {
    background: var(--bg-body); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 10px 20px; display: flex; align-items: center; gap: 10px; margin: 10px -20px 20px -20px;
  }

  /* ===== 轉乘詳情：摘要卡片 ===== */
  .transfer-summary{
    padding: 14px 20px 6px 20px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  .transfer-card{
    border: 1px solid var(--border);
    background: var(--bg-body);
    border-radius: 14px;
    padding: 12px 12px;
    box-shadow: var(--shadow-sm);
  }
  .transfer-card-title{
    font-size: .78rem;
    color: var(--text-muted);
    font-weight: 800;
    letter-spacing: .02em;
    margin-bottom: 6px;
  }
  .transfer-card-main{
    font-size: .95rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .kv-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
  }
  .kv{
    display:flex; flex-direction:column; gap:2px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-surface);
  }
  .kv span{ font-size:.75rem; color: var(--text-muted); font-weight:700; }
  .kv b{ font-size:.92rem; font-variant-numeric: tabular-nums; }
  .transfer-section{ padding: 0 0 6px 0; }
  .transfer-sec-title{
    padding: 10px 20px 0 20px;
    font-weight: 900;
    font-size: 1rem;
  }

  @media (max-width: 760px){
    .transfer-summary{ grid-template-columns: 1fr; }
    .kv-grid{ grid-template-columns: 1fr 1fr; }
  }
  
  /* ===== Query Tabs ===== */
  .query-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px 0}
  .query-tab{appearance:none;border:1px solid var(--border);background:var(--card-bg);color:var(--text-main);
    padding:10px 12px;border-radius:12px;font-weight:700;cursor:pointer;transition:.15s}
  .query-tab:hover{transform:translateY(-1px)}
  .query-tab.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent}
  .query-panel.hidden{display:none}


  .ticket-btn{
    border:1px solid var(--border);
    background:var(--bg-body);
    color:var(--text-main);
    border-radius:10px;
    padding:6px 10px;
    cursor:pointer;
    font-size:16px;
    line-height:1;
  }
  .ticket-btn:active{ transform:scale(.98); }
  .ticket-btn[disabled]{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
  }
  .ticket-btn[disabled]:active{ transform:none; }

.est-tip{ font-size:12px; opacity:.55; cursor:help; line-height:1; }

</style><style>
    /* loading overlay（原本就有） */
    #loading-overlay{
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35);
      display:none; align-items:center; justify-content:center; flex-direction:column;
      z-index: 9999;
      backdrop-filter: blur(6px);
    }
    .spinner{
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.35);
      border-top-color: rgba(255,255,255,0.95);
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to{ transform: rotate(360deg);} }

    /* header（原本就有） */
    .header{
      position: sticky; top:0; z-index: 120;
      background: var(--bg-header);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .header-content{
      max-width: 1200px; margin: 0 auto;
      display:flex; align-items:center; justify-content:space-between; gap: 12px;
    }
    .logo{
      font-weight: 800; letter-spacing: .5px;
      color: var(--primary);
      display:flex; align-items: baseline; gap: 6px;
    }
    .logo span{ font-weight: 600; color: var(--text-muted); font-size: .85rem; }
    .date-picker{ display:flex; align-items:center; gap: 8px; }
    .btn-ghost{
      border:1px solid var(--border);
      background: transparent;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:700;
    }
    .btn-ghost:hover{ background: rgba(148,163,184,0.14); }

    .input-field{
      border:1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      outline: none;
      font-family: var(--font-main);
    }

    /* stops 展開箭頭（原本就有） */
    .toggle-arrow{ color: var(--text-muted); margin-left: 6px; font-size: .85rem; cursor:pointer; }
    .stops-row td{ background: var(--bg-body); color: var(--text-muted); font-size: .85rem; }
  
.est-tip{ font-size:12px; opacity:.55; cursor:help; line-height:1; }

</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">正在初始化高鐵真實數據...</div>
</div>

<header class="header">
  <div class="header-content">
    <div class="logo">THSR <span>Real-time</span></div>

    <div class="date-picker">
      <label style="font-size: 0.8em; color: var(--text-muted);">選擇查詢日期：</label>
      <input type="date" id="mainQueryDate" class="input-field" style="width: auto; display: inline-block;">
      <button class="btn-primary" id="refreshBtn" style="padding: 6px 12px;">更新資料</button>
      <button class="btn-ghost" id="themeToggle" type="button" title="切換深夜模式">🌙 深夜模式</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="grid">

    <div class="query-tabs" role="tablist" aria-label="查詢模式">
      <button class="query-tab active" id="tab-startend" type="button" data-target="panel-startend">起訖站查詢</button>
      <button class="query-tab" id="tab-station" type="button" data-target="panel-station">車站時刻表</button>
      <button class="query-tab" id="tab-trainno" type="button" data-target="panel-trainno">車次查詢</button>
    </div>

    <section id="panel-startend" class="card query-panel">
      <div class="section-title">起訖站查詢</div>

      <datalist id="stationList"></datalist>

      <div id="searchHistory" class="history-chips"></div>

      <div class="form-row">
        <div class="input-group">
          <label>出發</label>
          <input list="stationList" id="startStation" placeholder="請輸入站名或站碼">
        </div>

        <button class="swap-btn" id="swapBtn" title="互換">⇄</button>

        <div class="input-group">
          <label>到達</label>
          <input list="stationList" id="endStation" placeholder="請輸入站名或站碼">
        </div>

        
        <label class="chip-label" style="flex:0 0 auto;">
          <input type="checkbox" id="onlyDirect">
          <span>只顯示直達</span>
        </label>
<button class="btn-primary" id="searchBtn">查詢</button>
      </div>

      <div class="table-wrapper">
        <table id="scheduleTableByStation">
  <thead>
    <tr>
      <th>車次</th>
      <th>區間</th>
      <th>出發 <span id="sortDepIcon">↕</span></th>
      <th>抵達 <span id="sortArrIcon">↕</span></th>
      <th>耗時 <span id="sortDurIcon">↕</span></th>
      <th>停靠</th>
      <th>狀態</th>
      <th class="seat-col-header">標準</th> <th class="seat-col-header">商務</th> <th>訂票</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
      </div>
    </section>

    <section id="panel-station" class="card query-panel hidden">
      <div class="section-title">車站時刻表</div>

      <div class="form-row">
        <div class="input-group">
          <label>車站</label>
          <input list="stationList" id="stationNameInput" placeholder="請輸入站名或站碼">
        </div>

        <div class="input-group" style="max-width: 220px;">
          <label>方向</label>
          <select id="directionSelect">
            <option value="south">南下</option>
            <option value="north">北上</option>
          </select>
        </div>

        <button class="btn-primary" id="stationSearchBtn">查詢</button>
      </div>

      <div class="table-wrapper">
        <table id="scheduleTableByStationName">
          <thead>
            <tr><th>車次</th><th>區間</th><th>時間</th><th>狀態</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="panel-trainno" class="card query-panel hidden">
      <div class="section-title">車次查詢</div>

      <datalist id="trainNumberList"></datalist>

      <div class="form-row">
        <div class="input-group">
          <label>車次</label>
          <input id="trainNumberInput" list="trainNumberList" placeholder="請輸入車次">
        </div>
        <button class="btn-primary" id="trainNumberBtn">查詢</button>
      </div>

      <div class="table-wrapper">
        <table id="scheduleTableByNumber">
          <thead>
            <tr><th>車次</th><th>區間</th><th>狀態</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

  </div>
</main>

<div id="trainModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <div class="modal-title-main" id="modalTitleMain">列車資訊</div>
        <div class="modal-title-sub" id="modalTitleSub">—</div>
      </div>
      <div class="close" id="modalClose">✕</div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="./thsr.real-schedule.js"></script>
<script>
  // ==========================================
  // 1. 全域變數定義
  // ==========================================
  let nameToId = {};
  let stationListSorted = [];
  let currentQueryDateStr = '';
  let baseSchedule = {};
  let prevSchedule = {};
  let lastStartEndQuery = null;
  let lastStationQuery  = null;
  let lastTrainQuery    = null;
  let expandedStops = new Set();
  let modalCtx = null;
  let currentSeatMap = {}; 
  let currentStartEndList = [];
  let currentStationList = [];

  // ==========================================
  // 2. 通用工具函數
  // ==========================================
  function fmtDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  
  function addDays(dateStr, delta){ 
    const [y,m,d] = dateStr.split('-').map(Number); 
    const dt = new Date(y, m-1, d); 
    dt.setDate(dt.getDate()+delta); 
    return fmtDate(dt); 
  }

  function normTW(s){ return String(s||'').trim().replace(/台/g,'臺'); }
  function sameStation(a,b){ return normTW(a) === normTW(b); }
  
  const THSR_STATION_ORDER = ['南港','臺北','板橋','桃園','新竹','苗栗','臺中','彰化','雲林','嘉義','臺南','左營'];
  function normTHSRStationName(s){ const n = normTW(s||''); if(n==='高雄' || n==='新左營') return '左營'; return n; }
  function thsrStationIndex(name){ return THSR_STATION_ORDER.indexOf(normTHSRStationName(name)); }
  
  function parseTime(t){ 
    if(!t || !/\d{1,2}:\d{2}/.test(t)) return null; 
    let [h,m]=t.split(':').map(x=>parseInt(x,10)); 
    return h*60+m; 
  }

  function durationText(depMin, arrMin){
    if(depMin===null || arrMin===null) return '--';
    let d = arrMin - depMin;
    if(d < 0) d += 1440;
    const hh = Math.floor(d/60);
    const mm = d%60;
    return `${hh}h ${String(mm).padStart(2,'0')}m`;
  }

  function isQueryToday(dateStr){
    return dateStr === fmtDate(new Date());
  }

  function splitArrDep(stopRow){
    const t1 = stopRow?.[1] || '';
    const t2 = stopRow?.[2] || '';
    if(!t2) return { arr: t1, dep: t1 };
    if(!t1) return { arr: t2, dep: t2 };
    const m1 = parseTime(t1); const m2 = parseTime(t2);
    if(m1===null || m2===null) return { arr: t1, dep: t2 };
    if(m2 <= m1) return { arr: t2, dep: t1 };
    return { arr: t1, dep: t2 };
  }

  // ==========================================
  // 3. 邏輯運算工具
  // ==========================================
  function getStopsWithAdjustedDate(trainNo, originDateStr, scheduleMap) {
    const t = scheduleMap[trainNo];
    if (!t) return [];
    const stops = t['車站時間'] || [];
    let dayOffset = 0; let prevMin = -1;
    return stops.map((stop) => {
      const ad = splitArrDep(stop);
      const timeStr = ad.dep || ad.arr || '';
      const currentMin = parseTime(timeStr);
      if (prevMin !== -1 && currentMin !== null && currentMin < prevMin) dayOffset++;
      if (currentMin !== null) prevMin = currentMin;
      return { name: stop[0], time: timeStr, actualDate: addDays(originDateStr, dayOffset), originDate: originDateStr };
    });
  }

  function stopDisplayDate(originDateStr, stops, idx){
    let dayOffset = 0; let prevMin = -1;
    for(let i=0; i<=idx; i++){
        const ad = splitArrDep(stops[i]);
        const m = parseTime(ad.dep || ad.arr || '');
        if(prevMin !== -1 && m !== null && m < prevMin) dayOffset++;
        if(m !== null) prevMin = m;
    }
    return addDays(originDateStr, dayOffset);
  }

  function getStatusLabel(originDateStr, depTimeStr, arrTimeStr, firstDepTimeStr, mode) {
    const now = new Date();
    const todayStr = fmtDate(now);
    
    if (originDateStr > todayStr) return '未發車';
    if (originDateStr < todayStr) return '已到終點';

    const nowMin = now.getHours() * 60 + now.getMinutes();
    const depMin = parseTime(depTimeStr || '');
    const arrMin = parseTime(arrTimeStr || '');
    const firstDepMin = parseTime(firstDepTimeStr || ''); 

    if (depMin === null) return '未發車';

    let adjustedArrMin = arrMin;
    if (arrMin !== null && arrMin < depMin) adjustedArrMin += 1440;

    if (nowMin < depMin) {
        if (firstDepMin !== null && nowMin >= firstDepMin) {
            return '行駛中'; 
        }
        return '未發車';
    } else if (adjustedArrMin !== null && nowMin < adjustedArrMin) {
        return (mode === 'train') ? '行駛中' : '已過站';
    } else {
        return '已到終點';
    }
  }

  function statusBadge(label){
    const s = String(label||'');
    const tip = '狀態依預定時刻與目前時間推估';
    return `<span class="status-badge est" style="background:transparent; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; padding:0;"><span class="status-text-${s}">${s}</span><span class="est-tip" title="${tip}" style="opacity:0.5; cursor:help;">ⓘ</span></span>`;
  }

  // ==========================================
  // 4. 輸入框與 Datalist 輔助函數
  // ==========================================
  function bindStationInput(inputId){
    const input = document.getElementById(inputId);
    if(!input) return;
    input.addEventListener('focus', ()=> fillStationDatalist(input.value));
    input.addEventListener('input', ()=> fillStationDatalist(input.value));
    input.addEventListener('blur', ()=>{
      const resolved = extractStationNameFromInput(input.value);
      if(resolved) input.value = resolved;
    });
  }

  function bindTrainInput(inputId){
    const input = document.getElementById(inputId);
    if(!input) return;
    input.addEventListener('focus', ()=> fillTrainDatalist(input.value));
    input.addEventListener('input', ()=> fillTrainDatalist(input.value));
    input.addEventListener('blur', ()=>{
      const no = extractTrainNoFromInput(input.value);
      if(no) input.value = no;
    });
  }

  function extractStationNameFromInput(raw){ 
    const v=String(raw||'').trim(); 
    if(!v) return ''; 
    const m=v.match(/^(\d{3,6})\s*-\s*(.+)$/); 
    if(m&&window.stationMap&&window.stationMap[m[1]]) return window.stationMap[m[1]]; 
    if(window.stationMap&&window.stationMap[v]) return window.stationMap[v]; 
    const asTai=normTW(v); 
    if(asTai==='高雄'||asTai==='新左營') return '左營'; 
    if(nameToId[asTai]) return asTai; 
    return normTW(v); 
  }

  function fillStationDatalist(k){ 
    const dl=document.getElementById('stationList'); 
    if(!dl) return; 
    dl.innerHTML=stationListSorted.filter(s=>s.name.includes(normTW(k))||String(s.id).includes(k)).slice(0,30).map(s=>`<option value="${s.id}-${s.name}"></option>`).join(''); 
  }

  // 【修正】車次查詢下拉選單：顯示「車次 - 起點➝終點」
  function fillTrainDatalist(k){ 
    const dl=document.getElementById('trainNumberList'); 
    if(!dl) return; 
    const nums = Object.keys(baseSchedule).filter(n=>n.includes(k)).sort();
    const limit = 50;
    let out = '';
    
    for(let i=0; i<nums.length; i++){
        if(i >= limit) break;
        const n = nums[i];
        const t = baseSchedule[n];
        const stops = t?.['車站時間']||[];
        // 取得起訖站
        const first = stops[0]?.[0] || '';
        const last = stops.slice(-1)[0]?.[0] || '';
        const range = (first && last) ? `${first}➝${last}` : '';
        // 組合顯示字串
        out += `<option value="${n} - ${range}"></option>`;
    }
    dl.innerHTML = out; 
  }

  // 【修正】車次輸入處理：自動切除後面的中文區間，只留數字
  function extractTrainNoFromInput(v){ 
    let no=String(v||'').trim().split('-')[0].trim(); 
    if(/^\d{3}$/.test(no)) no='0'+no; 
    return no; 
  }

  function buildStationIndex(){ 
    nameToId={}; 
    stationListSorted=[]; 
    if(!window.stationMap) return; 
    Object.entries(window.stationMap).forEach(([id,n])=>{ 
      const nn=normTW(n); 
      nameToId[nn]=id; 
      stationListSorted.push({id,name:nn}); 
    }); 
    stationListSorted.sort((a,b)=>String(a.id).localeCompare(String(b.id))); 
  }

  // ==========================================
  // 5. 核心查詢功能 (起訖站)
  // ==========================================
  async function refreshData(dateStr){
    currentQueryDateStr = dateStr || '';
    document.getElementById('loading-overlay').style.display = 'flex';
    document.getElementById('loading-text').textContent = `正在獲取 ${dateStr} 資料...`;
    
    await fetchRealData(dateStr);
    baseSchedule = (typeof structuredClone==='function') ? structuredClone(window.trainSchedule) : JSON.parse(JSON.stringify(window.trainSchedule||{}));
    
    const prevDateStr = addDays(dateStr, -1);
    await fetchRealData(prevDateStr);
    prevSchedule = (typeof structuredClone==='function') ? structuredClone(window.trainSchedule) : JSON.parse(JSON.stringify(window.trainSchedule||{}));
    
    window.trainSchedule = structuredClone(baseSchedule);
    
    buildStationIndex(); 
    fillStationDatalist(''); 
    fillTrainDatalist(''); 
    renderHistory();
    document.getElementById('loading-overlay').style.display = 'none';
    rerenderVisibleResults();
  }

  async function runStartEndSearch() {
    const dateInput = document.getElementById('mainQueryDate');
    const queryDate = dateInput ? dateInput.value : fmtDate(new Date());
    const todayStr = fmtDate(new Date());
    const stInput = document.getElementById('startStation').value;
    const edInput = document.getElementById('endStation').value;
    const st = extractStationNameFromInput(stInput);
    const ed = extractStationNameFromInput(edInput);

    if (!st || !ed || !queryDate) return;
    document.getElementById('startStation').value = st;
    document.getElementById('endStation').value = ed;

    const isPastDate = queryDate < todayStr;
    document.querySelectorAll('.seat-col-header').forEach(th => { th.style.display = isPastDate ? 'none' : ''; });

    lastStartEndQuery = { st, ed };
    buildDirectList(st, ed);
    renderStartEndTable();

    if (queryDate >= todayStr) { await refreshSeatForCurrentOD(st, ed); }
    else { currentSeatMap = {}; renderStartEndTable(); }
    
    const h = loadHistory().filter(x => !(x.s === st && x.e === ed));
    h.unshift({ s: st, e: ed });
    saveHistory(h); renderHistory();
  }

  function buildDirectList(st, ed) {
    const list = [];
    const queryDate = document.getElementById('mainQueryDate').value;
    const onlyDirect = document.getElementById('onlyDirect')?.checked;
    const sources = [{ map: baseSchedule, origin: queryDate }, { map: prevSchedule, origin: addDays(queryDate, -1) }];

    sources.forEach(src => {
      Object.keys(src.map || {}).forEach(trainNo => {
        const adjStops = getStopsWithAdjustedDate(trainNo, src.origin, src.map);
        const i1 = adjStops.findIndex(x => sameStation(x.name, st));
        const i2 = adjStops.findIndex(x => sameStation(x.name, ed));
        if (i1 < 0 || i2 < 0 || i2 <= i1) return;
        
        const start = adjStops[i1]; const end = adjStops[i2];
        
        if (src.origin !== queryDate) {
            const depMin = parseTime(start.time);
            if (depMin === null || depMin > 240) return; 
        }
        if (start.actualDate !== queryDate) return;

        const dur = (parseTime(end.time) - parseTime(start.time) + 1440) % 1440;
        if (onlyDirect && (i2 - i1 - 1) > 0) return;

        const firstDep = adjStops[0].time; 

        list.push({
          trainNo, dep: start.time, arr: end.time, durMin: dur,
          range: `${adjStops[0].name}➝${adjStops.slice(-1)[0].name}`,
          stopBetween: i2 - i1 - 1,
          status: getStatusLabel(start.originDate, start.time, end.time, firstDep, 'list'),
          originDate: start.originDate, midStops: adjStops.slice(i1 + 1, i2)
        });
      });
    });
    currentStartEndList = list.sort((a,b) => parseTime(a.dep) - parseTime(b.dep));
  }

  async function refreshSeatForCurrentOD(st, ed){
    const dateStr = document.getElementById('mainQueryDate').value;
    const todayStr = fmtDate(new Date());
    const oId = nameToId[normTW(st)]; const dId = nameToId[normTW(ed)];
    if(!dateStr || !oId || !dId) return;
    currentSeatMap = {};
    
    if (dateStr === todayStr) {
        const mToday = await window.fetchSeatStatusOD(dateStr, oId, dId).catch(()=>({}));
        Object.keys(mToday||{}).forEach(k=>{ currentSeatMap[`${String(k)}|${dateStr}`] = mToday[k]; });
    } else {
        const prevDateStr = addDays(dateStr, -1);
        const [mToday, mPrev] = await Promise.all([
          window.fetchSeatStatusOD(dateStr, oId, dId).catch(()=>({})),
          window.fetchSeatStatusOD(prevDateStr, oId, dId).catch(()=>({}))
        ]);
        Object.keys(mPrev||{}).forEach(k=>{ currentSeatMap[`${String(k)}|${prevDateStr}`] = mPrev[k]; });
        Object.keys(mToday||{}).forEach(k=>{ currentSeatMap[`${String(k)}|${dateStr}`] = mToday[k]; });
    }
    renderStartEndTable();
  }

  function getSeatIcon(trainNo, type, originDateStr) {
    const key = `${String(trainNo)}|${originDateStr}`;
    const info = currentSeatMap?.[key];
    const status = info ? info[type] : '--';
    if(status==='O') return '<span class="seat-icon seat-o">○</span>';
    if(status==='L') return '<span class="seat-icon seat-l">△</span>';
    if(status==='X') return '<span class="seat-icon seat-x">✕</span>';
    return '<span class="seat-none">--</span>';
  }

  function renderStartEndTable() {
    const tbody = document.querySelector('#scheduleTableByStation tbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    const queryDate = document.getElementById('mainQueryDate').value;
    const todayStr = fmtDate(new Date());
    const isPastDate = queryDate < todayStr;
    const colSpanNum = isPastDate ? 8 : 10;

    if (!currentStartEndList.length) { tbody.innerHTML = `<tr><td colspan="${colSpanNum}" style="text-align:center;">查無資料</td></tr>`; return; }
    
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    const maxDur = Math.max(1, ...currentStartEndList.map(x => x.durMin || 0));

    currentStartEndList.forEach(row => {
        const tr = document.createElement('tr');
        const depMin = parseTime(row.dep);
        const canBook = (row.originDate > todayStr) || (row.originDate === todayStr && depMin !== null && (depMin - nowMin) > 10);
        const ticketBtn = canBook ? `<button class="ticket-btn" onclick="event.stopPropagation(); openTHSRBooking('${row.trainNo}')">🎫</button>` : `<span style="font-size:12px;color:var(--text-light);">停止預訂</span>`;
        let seatCells = isPastDate ? '' : `<td style="text-align:center;">${getSeatIcon(row.trainNo, 'standard', row.originDate)}</td><td style="text-align:center;">${getSeatIcon(row.trainNo, 'business', row.originDate)}</td>`;

        const isExpanded = expandedStops.has(String(row.trainNo));
        const toggleIcon = isExpanded ? '▲' : '▼';
        const stopText = row.stopBetween <= 0 ? '直達' 
            : `<span class="stop-toggle" data-train="${row.trainNo}" style="cursor:pointer; color:var(--text-main); font-weight:600;">
                 ${row.stopBetween}站 <span style="font-size:0.8em; margin-left:2px;">${toggleIcon}</span>
               </span>`;

        tr.innerHTML = `<td style="font-weight:800">${row.trainNo}</td><td><span class="train-route">${row.range}</span></td><td>${row.dep}</td><td>${row.arr}</td>
        <td>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <div style="font-weight:800">${durationText(0, row.durMin).replace('0h ','')}</div>
            <div class="progress-bar" style="width:80px;"><div class="progress-fill" style="width:${Math.round((row.durMin / maxDur) * 100)}%;"></div></div>
          </div>
        </td>
        <td>${stopText}</td>
        <td>${statusBadge(row.status)}</td>${seatCells}<td style="text-align:center;">${ticketBtn}</td>`;
        
        tr.onclick = () => showTrainDetails(row.trainNo, row.originDate);
        tbody.appendChild(tr);

        if (isExpanded) {
            const tr2 = document.createElement('tr');
            tr2.innerHTML = `<td colspan="${colSpanNum}" class="stops-row">沿途停靠：${row.midStops.map(s => s.name).join('、')}</td>`;
            tbody.appendChild(tr2);
        }
    });
    tbody.querySelectorAll('.stop-toggle').forEach(el => {
        el.onclick = (e) => { e.stopPropagation(); const tn = el.dataset.train; expandedStops.has(tn)?expandedStops.delete(tn):expandedStops.add(tn); renderStartEndTable(); };
    });
  }

  // ==========================================
  // 6. 其他查詢功能 (車站、車次)
  // ==========================================
  function filterTrainScheduleByStationName(){
    const st = extractStationNameFromInput(document.getElementById('stationNameInput').value);
    document.getElementById('stationNameInput').value = st;
    const dir = document.getElementById('directionSelect').value;
    if(!st) return;

    lastStationQuery = { station: st, dir };
    const list = [];
    const sources = [{ map: baseSchedule, origin: currentQueryDateStr }, { map: prevSchedule, origin: addDays(currentQueryDateStr, -1) }];

    sources.forEach(src=>{
      const sch = src.map || {};
      const origin = src.origin;
      Object.keys(sch||{}).forEach(trainNo=>{
        const t = sch[trainNo];
        const stops = t?.['車站時間']||[];
        const idx = stops.findIndex(x=>sameStation(x[0], st));
        if(idx<0) return;
        const d = stopDisplayDate(origin, stops, idx);
        if(d !== currentQueryDateStr) return;
        const first = stops[0]?.[0] || ''; const last  = stops.slice(-1)[0]?.[0] || '';
        const fi = thsrStationIndex(first); const li = thsrStationIndex(last);
        const isSouth = (fi>=0 && li>=0) ? (fi < li) : ((first && last) ? (first.localeCompare(last,'zh-Hant') < 0) : true);
        if(dir==='south' && !isSouth) return;
        if(dir==='north' && isSouth) return;
        const ad = splitArrDep(stops[idx]);
        const time = ad.dep || ad.arr || '';
        const lastArr = (splitArrDep(stops[stops.length-1]||[]).arr || splitArrDep(stops[stops.length-1]||[]).dep || '');
        const range = `${first}➝${last}`;

        const firstDep = splitArrDep(stops[0]).dep;
        const status = getStatusLabel(origin, time, lastArr, firstDep, 'list');

        list.push({trainNo, range, time, status, originDate: origin});
      });
    });
    list.sort((a,b)=>{
      const aa = parseTime(a.time); const bb = parseTime(b.time);
      if(aa===null && bb===null) return String(a.trainNo).localeCompare(String(b.trainNo),'en');
      if(aa===null) return 1; if(bb===null) return -1; return aa-bb;
    });
    currentStationList = list;
    renderStationTable();
  }

  function renderStationTable(){
    const tbody = document.querySelector('#scheduleTableByStationName tbody');
    tbody.innerHTML = '';
    currentStationList.forEach(row=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td style="font-weight:800">${row.trainNo}</td><td><span class="train-route">${row.range}</span></td><td>${row.time || '--'}</td><td>${statusBadge(row.status)}</td>`;
      tr.addEventListener('click', ()=>showTrainDetails(row.trainNo, row.originDate || currentQueryDateStr));
      tbody.appendChild(tr);
    });
    if(!currentStationList.length){ tbody.innerHTML = `<tr style="text-align:center;"><td colspan="4" style="color:var(--text-muted)">查無資料</td></tr>`; }
  }

  function filterTrainScheduleByNumber(){
    const trainNo = extractTrainNoFromInput(document.getElementById('trainNumberInput').value);
    document.getElementById('trainNumberInput').value = trainNo;
    if(!trainNo) return;
    lastTrainQuery = {trainNo};
    const tbody = document.querySelector('#scheduleTableByNumber tbody');
    tbody.innerHTML = '';
    const t = baseSchedule[trainNo];
    if(!t){ tbody.innerHTML = `<tr style="text-align:center;"><td colspan="3" style="color:var(--text-muted)">查無此車次 (僅搜尋選定日期)</td></tr>`; return; }
    const stops = t['車站時間']||[];
    const range = (stops.length>=2)?`${stops[0][0]}➝${stops.slice(-1)[0][0]}`:'';
    const firstDep = splitArrDep(stops[0]||[]).dep || splitArrDep(stops[0]||[]).arr || '';
    const lastStop = stops[stops.length - 1] || [];
    const lastArrTime = splitArrDep(lastStop).arr || '';
    
    const status = getStatusLabel(currentQueryDateStr, firstDep, lastArrTime, firstDep, 'train');
    
    const tr=document.createElement('tr');
    tr.innerHTML = `<td style="font-weight:800">${trainNo}</td><td><span class="train-route">${range}</span></td><td>${statusBadge(status)}</td>`;
    tr.addEventListener('click', ()=>showTrainDetails(trainNo, currentQueryDateStr));
    tbody.appendChild(tr);
  }

  // ==========================================
  // 7. 歷史紀錄與其他 UI
  // ==========================================
  function loadHistory(){ try{ return JSON.parse(localStorage.getItem('thsr_search_history_v1')||'[]'); }catch{ return []; } }
  function renderHistory(){ const b=document.getElementById('searchHistory'); if(!b)return; b.innerHTML=loadHistory().map(i=>`<div class="history-chip" onclick="document.getElementById('startStation').value='${i.s}';document.getElementById('endStation').value='${i.e}';runStartEndSearch()">${i.s}→${i.e}</div>`).join(''); }
  function saveHistory(list){ localStorage.setItem('thsr_search_history_v1', JSON.stringify(list.slice(0,10))); }
  
  function initDatePickerWindow(){ const el=document.getElementById('mainQueryDate'); const t=new Date(); el.value=fmtDate(t); el.addEventListener('change',()=>refreshData(el.value)); }
  function setupThemeToggle(){ document.getElementById('themeToggle').addEventListener('click',()=>{ document.body.classList.toggle('dark-mode'); rerenderVisibleResults(); }); }
  function bindButtons(){ 
    document.getElementById('searchBtn').addEventListener('click',runStartEndSearch); 
    document.getElementById('swapBtn').addEventListener('click',()=>{ const a=document.getElementById('startStation'),b=document.getElementById('endStation'),t=a.value;a.value=b.value;b.value=t; });
    document.getElementById('stationSearchBtn').addEventListener('click', filterTrainScheduleByStationName);
    document.getElementById('trainNumberBtn').addEventListener('click', filterTrainScheduleByNumber);
    document.getElementById('refreshBtn').addEventListener('click', async ()=>{ await refreshData(document.getElementById('mainQueryDate')?.value); });
  }
  
  function bindQueryTabs(){ document.querySelectorAll('.query-tab').forEach(btn=>{ btn.addEventListener('click',()=>switchQueryPanel(btn.dataset.target)); }); }
  function switchQueryPanel(panelId){ document.querySelectorAll('.query-tab').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.query-panel').forEach(p=>p.classList.add('hidden')); const tab = document.querySelector(`.query-tab[data-target="${panelId}"]`); const panel = document.getElementById(panelId); if(tab) tab.classList.add('active'); if(panel) panel.classList.remove('hidden'); }

  // Modal 顯示
  const modal = document.getElementById('trainModal');
  document.getElementById('modalClose').addEventListener('click', ()=> modal.style.display='none');
  modal.addEventListener('click', (e)=>{ if(e.target===modal) modal.style.display='none'; });

  function getScheduleMapByOrigin(originDateStr){
    const prevDateStr = addDays(currentQueryDateStr, -1);
    if(originDateStr === currentQueryDateStr) return baseSchedule;
    if(originDateStr === prevDateStr) return prevSchedule;
    return baseSchedule;
  }

  function showTrainDetails(trainNo, originDateStr){
    const sch = getScheduleMapByOrigin(originDateStr);
    const t = sch?.[trainNo]; if(!t) return;
    const stops = t['車站時間']||[];
    const first=stops[0][0], last=stops.slice(-1)[0][0];
    const firstDep = splitArrDep(stops[0]).dep; // 始發時間
    const status = getStatusLabel(originDateStr, splitArrDep(stops[0]).dep, splitArrDep(stops.slice(-1)[0]).arr, firstDep, 'train');

    document.getElementById('modalTitleMain').innerHTML = `${trainNo} <span style="font-weight:400;color:var(--text-muted); margin:0 4px;">|</span> 高鐵`;
    const statusClass = `status-text-${status}`;
    document.getElementById('modalTitleSub').innerHTML = `
        ${first} → ${last} 
        <span style="margin:0 4px; color:var(--text-light);">|</span> 
        狀態：<span class="${statusClass}">${status}</span> 
        <span style="margin:0 4px; color:var(--text-light);">|</span> 
        <span style="color:var(--text-muted); font-weight:500;">發車日：${originDateStr}</span>
        <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">狀態依預定時刻與目前時間推估，非即時列車動態</div>
    `;

    modalCtx={trainNo,originDate:originDateStr};
    renderTimeline(stops, originDateStr);
    modal.style.display='flex';
  }

  function renderTimeline(stops, originDateStr){
    const nowMin = new Date().getHours()*60 + new Date().getMinutes();
    const today = isQueryToday(originDateStr);
    let nextIdx = -1;
    if(today){ for(let i=0;i<stops.length;i++){ const ad = splitArrDep(stops[i]); if(parseTime(ad.dep||'') >= nowMin){ nextIdx=i; break; } } }

    const html = stops.map((s,i)=>{
      const ad = splitArrDep(s);
      const tm = (i===stops.length-1)?ad.arr:ad.dep;
      let cls = '';
      let badge = '';
      if(today){
         if(i < nextIdx) cls = 'passed';
         else if(i === nextIdx) { cls = 'next'; badge = '<span class="badge-next">下一站</span>'; }
      }
      const arrInfo = (ad.arr && ad.arr !== tm) ? `<span class="st-arr">到 ${ad.arr}</span>` : '';
      return `
        <div class="timeline-item ${cls}">
          <div class="tl-time">${tm || '--'}</div>
          <div class="tl-marker"><div class="tl-dot"></div><div class="tl-line"></div></div>
          <div class="tl-content"><div class="tl-station">${s[0]} ${badge} ${arrInfo}</div></div>
        </div>`;
    }).join('');

    document.getElementById('modalBody').innerHTML = `<div class="timeline">${html}</div>`;
  }
  
  function rerenderVisibleResults(){ 
    if(lastStartEndQuery) runStartEndSearch(); 
    if(lastStationQuery) filterTrainScheduleByStationName();
    if(lastTrainQuery) filterTrainScheduleByNumber();
  }

  // 排序
  let sortState = { key:'dep', dir:1 };
  function initStartEndSorting(){
    document.getElementById('sortDepIcon').addEventListener('click', (e)=>{ e.stopPropagation(); toggleSort('dep'); });
    document.getElementById('sortArrIcon').addEventListener('click', (e)=>{ e.stopPropagation(); toggleSort('arr'); });
    document.getElementById('sortDurIcon').addEventListener('click', (e)=>{ e.stopPropagation(); toggleSort('dur'); });
  }
  function toggleSort(key){
    if(sortState.key === key) sortState.dir *= -1; else sortState = { key, dir:1 };
    currentStartEndList.sort((a,b)=>{
      const dir = sortState.dir;
      if(key==='dur'){ return ((a.durMin||0)-(b.durMin||0))*dir; }
      const ta = parseTime(key==='dep'?a.dep:a.arr);
      const tb = parseTime(key==='dep'?b.dep:b.arr);
      return (ta-tb)*dir;
    });
    renderStartEndTable();
  }

  function openTHSRBooking(trainNo){ window.open('https://irs.thsrc.com.tw/IMINT/', '_blank', 'noopener'); }

  window.addEventListener('load', async ()=>{
    bindQueryTabs();
    switchQueryPanel('panel-startend');
    initDatePickerWindow();
    setupThemeToggle();
    bindButtons();
    bindStationInput('startStation');
    bindStationInput('endStation');
    bindStationInput('stationNameInput');
    bindTrainInput('trainNumberInput');
    initStartEndSorting();
    
    document.getElementById('startStation').addEventListener('focus',()=>fillStationDatalist(''));
    document.getElementById('endStation').addEventListener('focus',()=>fillStationDatalist(''));

    await refreshData(document.getElementById('mainQueryDate').value);

    setInterval(()=>{ if(document.getElementById('mainQueryDate').value === fmtDate(new Date())) rerenderVisibleResults(); }, 60000);
  });
  
  window.fetchCollegeDiscount = async function(){ return {}; };
</script>
</body>
