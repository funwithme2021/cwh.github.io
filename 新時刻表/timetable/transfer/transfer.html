<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>雙鐵查詢</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: "Inter", "Noto Sans TC", sans-serif;
      --bg-page:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 34%),
        radial-gradient(circle at top right, rgba(249, 115, 22, 0.16), transparent 30%),
        linear-gradient(180deg, #f8fbff 0%, #eef4ff 52%, #f8fafc 100%);
      --bg-surface: rgba(255, 255, 255, 0.94);
      --bg-soft: rgba(255, 255, 255, 0.72);
      --bg-header: rgba(255, 255, 255, 0.86);
      --bg-soft-strong: rgba(255, 255, 255, 0.82);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      --border: rgba(148, 163, 184, 0.22);
      --shadow-sm: 0 18px 38px rgba(37, 99, 235, 0.08);
      --shadow-lg: 0 28px 48px rgba(15, 23, 42, 0.22);
      --radius-xl: 24px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --primary: #2563eb;
      --tra: #2563eb;
      --thsr: #f97316;
      --backdrop: rgba(15, 23, 42, 0.54);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: var(--font-main);
      color: var(--text-main);
      background: var(--bg-page);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    body.dark-mode {
      --bg-page:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(249, 115, 22, 0.16), transparent 28%),
        linear-gradient(180deg, #020617 0%, #08111f 48%, #0f172a 100%);
      --bg-surface: rgba(15, 23, 42, 0.86);
      --bg-soft: rgba(15, 23, 42, 0.72);
      --bg-soft-strong: rgba(15, 23, 42, 0.84);
      --bg-header: rgba(8, 17, 31, 0.86);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --border: rgba(148, 163, 184, 0.16);
      --shadow-sm: 0 18px 38px rgba(2, 6, 23, 0.34);
      --shadow-lg: 0 32px 56px rgba(2, 6, 23, 0.46);
      --backdrop: rgba(2, 6, 23, 0.72);
    }

    .hidden { display: none !important; }

    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 260;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(248, 250, 252, 0.9);
      color: var(--text-main);
      transition: opacity 0.22s ease, visibility 0.22s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    body.dark-mode #loading-overlay {
      background: rgba(2, 6, 23, 0.88);
    }

    #loading-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 4px solid rgba(148, 163, 184, 0.26);
      border-top-color: var(--primary);
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 120;
      padding: 14px 18px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-content {
      max-width: 1220px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo-mark {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.14), rgba(249, 115, 22, 0.14));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      font-weight: 900;
    }

    .logo-mark strong:first-child { color: var(--tra); }
    .logo-mark strong:last-child { color: var(--thsr); }

    .logo-copy {
      min-width: 0;
    }

    .logo-copy strong {
      display: block;
      font-size: 1.08rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .logo-copy span {
      display: block;
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .header-clock,
    .input-field,
    .btn-ghost,
    .btn-primary {
      min-height: 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 800;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .header-clock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 86px;
      padding: 0 14px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .input-field {
      padding: 0 14px;
      outline: none;
    }

    .btn-ghost,
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      cursor: pointer;
    }

    .btn-primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: #fff;
      box-shadow: 0 14px 24px rgba(37, 99, 235, 0.2);
    }

    .btn-ghost:hover,
    .btn-primary:hover,
    .input-field:focus {
      transform: translateY(-1px);
    }

    .container {
      max-width: 1220px;
      margin: 24px auto 0;
      padding: 0 18px;
    }

    .page-shell {
      padding: 18px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }

    .page-shell-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
      padding: 4px 2px 0;
    }

    .page-shell-head h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.4vw, 1.85rem);
      line-height: 1.12;
      letter-spacing: -0.02em;
    }

    .page-shell-head span {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .dualrail-filter-type {
      font-weight: 900;
    }

    .dualrail-train-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      line-height: 1.35;
    }

    .dualrail-mobile-trains,
    .modal-overview-trains {
      display: grid;
      gap: 6px;
      line-height: 1.35;
    }

    .dualrail-train-brand,
    .segment-train-brand {
      font-weight: 900;
      white-space: nowrap;
    }

    .dualrail-train-brand.tra,
    .segment-train-brand.tra {
      color: var(--tra);
    }

    .dualrail-train-brand.thsr,
    .segment-train-brand.thsr {
      color: var(--thsr);
    }

    .dualrail-train-no,
    .segment-train-no {
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .dualrail-train-type-text {
      font-weight: 900;
      white-space: nowrap;
    }

    .dualrail-train-type-thsr {
      color: var(--thsr);
    }

    .dualrail-train-sep {
      color: var(--text-light);
      font-weight: 800;
    }

    .dualrail-results {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .dualrail-result-card {
      display: grid;
      gap: 0;
      padding: 0;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      cursor: pointer;
    }

    .dualrail-result-card:hover {
      transform: translateY(-1px);
      transition: transform 0.16s ease;
    }

    .dualrail-result-head {
      display: grid;
      grid-template-columns: 220px minmax(0, 1.2fr) minmax(220px, 1fr) 140px 120px;
      gap: 18px;
      align-items: center;
      padding: 18px 20px;
    }

    .dualrail-result-time {
      font-size: 1rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      white-space: nowrap;
    }

    .dualrail-result-trains {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .dualrail-train-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.98rem;
      font-weight: 900;
      line-height: 1.25;
    }

    .dualrail-result-route {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .dualrail-result-path {
      font-size: 1rem;
      font-weight: 900;
      line-height: 1.3;
      word-break: break-word;
    }

    .dualrail-result-meta {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.45;
      word-break: break-word;
    }

    .dualrail-result-duration {
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    .dualrail-result-side {
      display: grid;
      justify-items: end;
      gap: 8px;
    }

    .dualrail-result-status {
      font-size: 0.92rem;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .dualrail-result-status.tone-success { color: #15803d; }
    .dualrail-result-status.tone-warning { color: #c2410c; }
    .dualrail-result-status.tone-danger { color: #b91c1c; }
    .dualrail-result-status.tone-muted { color: var(--text-light); }

    .dualrail-ticket-btn {
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: #fff;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 900;
      cursor: pointer;
    }

    .dualrail-results-empty {
      padding: 22px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text-muted);
      font-size: 0.96rem;
      font-weight: 800;
      text-align: center;
    }

    .dualrail-mobile-card {
      display: grid;
      gap: 8px;
      width: 100%;
    }

    .dualrail-mobile-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .dualrail-mobile-time {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .dualrail-mobile-time strong {
      font-size: 1rem;
      font-weight: 900;
      line-height: 1.15;
    }

    .dualrail-mobile-time span,
    .dualrail-mobile-meta {
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .dualrail-mobile-status {
      font-size: 0.82rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .dualrail-mobile-status.tone-success { color: #15803d; }
    .dualrail-mobile-status.tone-warning { color: #c2410c; }
    .dualrail-mobile-status.tone-danger { color: #b91c1c; }
    .dualrail-mobile-status.tone-muted { color: var(--text-light); }

    .dualrail-mobile-route {
      font-size: 0.9rem;
      font-weight: 900;
      line-height: 1.35;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 220;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: var(--backdrop);
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: min(980px, 100%);
      max-height: min(92vh, 940px);
      overflow: auto;
      border-radius: 28px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-surface) 98%, transparent);
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-surface) 92%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-title-main {
      font-size: 1.38rem;
      font-weight: 900;
      line-height: 1.15;
    }

    .modal-title-sub {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .close {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: transparent;
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 22px 24px 26px;
      display: grid;
      gap: 16px;
    }

    .modal-section {
      padding: 18px;
      border-radius: 22px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: var(--bg-soft-strong);
    }

    .modal-overview-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .modal-overview-route {
      font-size: 1.24rem;
      font-weight: 900;
      line-height: 1.2;
    }

    .modal-overview-meta {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.55;
    }

    .modal-overview-side {
      display: grid;
      justify-items: end;
      gap: 4px;
      text-align: right;
    }

    .modal-overview-side strong {
      font-size: 1.08rem;
      font-weight: 900;
    }

    .modal-overview-side span {
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .modal-overview-trains {
      margin-top: 14px;
    }

    .transfer-summary-grid {
      display: grid;
      gap: 12px;
    }

    .transfer-card-lite {
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(255, 255, 255, 0.72);
    }

    body.dark-mode .transfer-card-lite {
      background: rgba(8, 17, 31, 0.74);
    }

    .transfer-summary-row {
      display: grid;
      gap: 8px;
    }

    .transfer-summary-row.transfer-wait-row {
      position: relative;
      margin-left: 10px;
    }

    .transfer-summary-row.transfer-wait-row::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 12px;
      bottom: 12px;
      width: 2px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(249, 115, 22, 0.5), rgba(37, 99, 235, 0.5));
    }

    .segment-rail {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .segment-label {
      min-width: 54px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .segment-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.98rem;
      font-weight: 900;
    }

    .segment-inline-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.55;
    }

    .segment-route {
      color: var(--text-main);
      font-weight: 900;
    }

    .segment-meta-sep {
      color: var(--text-light);
    }

    .transfer-timelines {
      display: grid;
      gap: 16px;
    }

    .transfer-section {
      padding: 18px;
    }

    .transfer-sec-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      font-size: 1rem;
      font-weight: 900;
    }

    .transfer-sec-title span {
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .stop-timeline {
      display: grid;
      gap: 0;
    }

    .stop-row {
      display: grid;
      grid-template-columns: 84px 22px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 0 0 12px;
    }

    .stop-row:last-child {
      padding-bottom: 0;
    }

    .stop-time {
      font-size: 0.92rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: var(--text-main);
      white-space: nowrap;
      padding-top: 2px;
    }

    .stop-marker {
      position: relative;
      min-height: 44px;
      display: flex;
      justify-content: center;
    }

    .stop-line {
      position: absolute;
      top: 0;
      bottom: -12px;
      width: 2px;
      background: rgba(148, 163, 184, 0.32);
    }

    .stop-row:last-child .stop-line {
      display: none;
    }

    .stop-dot {
      position: relative;
      z-index: 1;
      width: 14px;
      height: 14px;
      margin-top: 4px;
      border-radius: 50%;
      border: 3px solid currentColor;
      background: rgba(255, 255, 255, 0.98);
      color: var(--tra);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
    }

    body.dark-mode .stop-dot {
      background: #0f172a;
    }

    .stop-row.thsr .stop-dot { color: var(--thsr); }

    .stop-content {
      min-width: 0;
      padding: 0 0 12px;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.18);
    }

    .stop-row:last-child .stop-content {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .stop-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 1.08rem;
      font-weight: 900;
      line-height: 1.25;
    }

    .stop-sub {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.55;
    }

    @media (max-width: 900px) {
      .header-content,
      .page-shell-head,
      .modal-overview-top,
      .dualrail-result-head {
        align-items: flex-start;
      }
    }

    @media (max-width: 720px) {
      .header {
        padding: 12px 14px;
      }

      .header-content {
        flex-direction: column;
        align-items: stretch;
      }

      .header-tools {
        justify-content: flex-start;
      }

      .container {
        margin-top: 18px;
        padding: 0 14px;
      }

      .page-shell {
        padding: 14px;
        border-radius: 20px;
      }

      .page-shell-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .modal {
        padding: 0;
      }

      .dualrail-results {
        gap: 10px;
      }

      .dualrail-result-card {
        border-radius: 18px;
      }

      .dualrail-result-head {
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
        padding: 14px;
      }

      .dualrail-result-side {
        justify-items: start;
      }

      .dualrail-result-status {
        text-align: left;
      }

      .modal-content {
        width: 100%;
        max-height: 100vh;
        height: 100vh;
        border-radius: 0;
      }

      .modal-header {
        padding: 18px 16px 14px;
      }

      .modal-body {
        padding: 16px;
      }

      .modal-section,
      .transfer-section {
        padding: 14px;
        border-radius: 18px;
      }

      .segment-inline-meta {
        gap: 6px;
      }

      .stop-row {
        grid-template-columns: 70px 18px minmax(0, 1fr);
        gap: 8px;
      }

      .stop-main {
        font-size: 1rem;
      }
    }

    @media (max-width: 520px) {
      .input-field,
      .btn-ghost,
      .btn-primary,
      .header-clock {
        min-height: 40px;
        font-size: 0.9rem;
      }

      .logo-copy strong {
        font-size: 1rem;
      }

      .logo-copy span {
        font-size: 0.8rem;
      }

      .modal-title-main {
        font-size: 1.18rem;
      }

      .modal-title-sub,
      .modal-overview-meta,
      .segment-inline-meta,
      .stop-sub {
        font-size: 0.82rem;
      }
    }
  </style>

  <style>
    .dualrail-results-shell {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .dualrail-results-head {
      display: grid;
      grid-template-columns: 220px minmax(0, 1.2fr) minmax(220px, 1fr) 140px 120px;
      gap: 18px;
      padding: 0 20px;
      color: var(--text-light);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .dualrail-result-timebox {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .dualrail-result-time-meta {
      display: none;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .dualrail-result-path,
    .dualrail-route-lines {
      display: grid;
      gap: 4px;
    }

    .dualrail-route-line {
      line-height: 1.35;
      word-break: break-word;
    }

    .dualrail-route-line.is-primary {
      color: var(--text-main);
      font-weight: 900;
    }

    .dualrail-route-line.is-secondary {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 800;
    }

    .dualrail-result-meta:empty {
      display: none;
    }

    .dualrail-summary-train {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      flex-wrap: wrap;
    }

    .dualrail-summary-sep,
    .dualrail-next-dot {
      color: var(--text-light);
      opacity: 0.7;
    }

    .dualrail-next-summary {
      display: grid;
      gap: 6px;
      width: 100%;
      text-align: left;
    }

    .dualrail-next-label {
      color: var(--text-light);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .dualrail-next-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      line-height: 1.45;
    }

    .dualrail-next-time {
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .dualrail-next-route {
      color: var(--text-muted);
      font-weight: 800;
    }

    .dualrail-next-status.tone-success {
      color: #15803d;
    }

    .dualrail-next-status.tone-warning {
      color: #c2410c;
    }

    .dualrail-next-status.tone-muted {
      color: var(--text-light);
    }

    .dualrail-next-ticket,
    .dualrail-ticket-btn {
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: #fff;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 900;
      cursor: pointer;
    }

    .modal-title-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal-title-main .dualrail-summary-train {
      font-size: inherit;
    }

    @media (max-width: 720px) {
      .dualrail-result-duration {
        display: none;
      }

      .dualrail-results-shell {
        gap: 0;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--bg-surface);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      .dualrail-results-head {
        display: grid;
        grid-template-columns: minmax(108px, 1.16fr) minmax(92px, 0.98fr) minmax(98px, 1fr) 60px;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        background: var(--bg-soft);
        border-bottom: 1px solid var(--border);
        font-size: 0.73rem;
      }

      .dualrail-results-head span:nth-child(4) {
        display: none;
      }

      .dualrail-results-head span:last-child {
        text-align: right;
      }

      .dualrail-results {
        gap: 0;
        margin-top: 0;
      }

      .dualrail-result-card {
        border: 0;
        border-top: 1px solid var(--border);
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .dualrail-result-card:first-child {
        border-top: 0;
      }

      .dualrail-result-card:hover {
        transform: none;
      }

      .dualrail-result-head {
        grid-template-columns: minmax(108px, 1.16fr) minmax(92px, 0.98fr) minmax(98px, 1fr) 60px;
        gap: 12px;
        align-items: start;
        padding: 14px;
      }

      .dualrail-result-timebox {
        gap: 4px;
      }

      .dualrail-result-time-meta {
        display: block;
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .dualrail-result-time {
        font-size: 0.94rem;
        line-height: 1.24;
        white-space: normal;
      }

      .dualrail-result-trains {
        gap: 4px;
      }

      .dualrail-train-line {
        gap: 2px;
        font-size: 0.84rem;
        line-height: 1.22;
      }

      .dualrail-result-route {
        gap: 4px;
      }

      .dualrail-result-path,
      .dualrail-route-lines {
        gap: 3px;
      }

      .dualrail-route-line {
        font-size: 0.8rem;
        line-height: 1.35;
      }

      .dualrail-route-line.is-secondary {
        font-size: 0.76rem;
      }

      .dualrail-result-meta {
        display: none;
      }

      .dualrail-result-side {
        justify-items: end;
        align-content: start;
        gap: 6px;
      }

      .dualrail-result-status {
        text-align: right;
        font-size: 0.82rem;
        line-height: 1.22;
        white-space: normal;
      }

      .dualrail-next-main {
        gap: 6px;
      }

      .dualrail-ticket-btn {
        min-height: 30px;
        padding: 0 10px;
        font-size: 0.74rem;
      }
    }

    @media (max-width: 520px) {
      .dualrail-results-head,
      .dualrail-result-head {
        grid-template-columns: minmax(100px, 1.1fr) minmax(86px, 0.96fr) minmax(90px, 0.98fr) 56px;
        gap: 10px;
      }

      .dualrail-results-head {
        padding: 10px 12px;
        font-size: 0.68rem;
      }

      .dualrail-result-head {
        padding: 12px;
      }

      .dualrail-result-time {
        font-size: 0.9rem;
      }

      .dualrail-result-time-meta,
      .dualrail-route-line,
      .dualrail-route-line.is-secondary {
        font-size: 0.74rem;
      }

      .dualrail-train-line {
        font-size: 0.8rem;
      }

      .dualrail-result-status {
        font-size: 0.78rem;
      }
    }
  </style>
</head>
